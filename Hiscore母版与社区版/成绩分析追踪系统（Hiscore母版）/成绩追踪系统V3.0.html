<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>成绩分析追踪 · 苏州 · 江苏新高考</title>
<style>
/* ============ 主题变量（浅色默认 / 深色两套入口） ============ */
:root {
  color-scheme: light;
  --page: #f9f9f7; --surface: #fcfcfb; --surface-2: #f3f3ef;
  --ink: #0b0b0b; --ink-2: #52514e; --muted: #898781;
  --grid: #e1e0d9; --axis: #c3c2b7; --border: rgba(11,11,11,0.10);
  --accent: #2a78d6; --accent-soft: #cde2fb;
  --good: #0ca30c; --good-text: #006300;
  --warn: #fab219; --serious: #ec835a; --critical: #d03b3b;
  --shadow: 0 1px 2px rgba(11,11,11,0.04);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    color-scheme: dark;
    --page: #0d0d0d; --surface: #1a1a19; --surface-2: #232322;
    --ink: #ffffff; --ink-2: #c3c2b7; --muted: #898781;
    --grid: #2c2c2a; --axis: #383835; --border: rgba(255,255,255,0.10);
    --accent: #3987e5; --accent-soft: #184f95;
    --good: #0ca30c; --good-text: #0ca30c;
    --shadow: 0 1px 2px rgba(0,0,0,0.3);
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --page: #0d0d0d; --surface: #1a1a19; --surface-2: #232322;
  --ink: #ffffff; --ink-2: #c3c2b7; --muted: #898781;
  --grid: #2c2c2a; --axis: #383835; --border: rgba(255,255,255,0.10);
  --accent: #3987e5; --accent-soft: #184f95;
  --good: #0ca30c; --good-text: #0ca30c;
  --shadow: 0 1px 2px rgba(0,0,0,0.3);
}

* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; }
body {
  background: var(--page); color: var(--ink);
  font-family: system-ui, -apple-system, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
  font-size: 14px; line-height: 1.55;
}
.wrap { max-width: 1080px; margin: 0 auto; padding: 0 16px 64px; }

/* ============ 头部与导航 ============ */
header.app {
  position: sticky; top: 0; z-index: 20;
  background: var(--page); border-bottom: 1px solid var(--border);
}
.hd-in { max-width: 1080px; margin: 0 auto; padding: 12px 16px 0; }
.hd-top { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
.hd-top h1 { font-size: 17px; font-weight: 650; margin: 0; }
.hd-sub { color: var(--muted); font-size: 12px; }
.hd-actions { margin-left: auto; display: flex; gap: 8px; }
nav.tabs { display: flex; gap: 4px; margin-top: 10px; overflow-x: auto; }
nav.tabs button {
  appearance: none; border: none; background: none; color: var(--ink-2);
  font: inherit; font-size: 14px; padding: 8px 14px 10px; cursor: pointer;
  border-bottom: 2px solid transparent; white-space: nowrap;
}
nav.tabs button.on { color: var(--ink); font-weight: 600; border-bottom-color: var(--accent); }
nav.tabs button:hover { color: var(--ink); }

/* ============ 通用组件 ============ */
.card {
  background: var(--surface); border: 1px solid var(--border);
  border-radius: 12px; padding: 16px 18px; box-shadow: var(--shadow);
  margin-top: 16px;
}
.card h2 { font-size: 15px; font-weight: 650; margin: 0 0 2px; }
.card .sub { color: var(--muted); font-size: 12px; margin: 0 0 12px; }
.row { display: flex; gap: 12px; flex-wrap: wrap; }
.grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
@media (max-width: 820px) { .grid2 { grid-template-columns: 1fr; } }
button.btn {
  appearance: none; font: inherit; font-size: 13px; cursor: pointer;
  background: var(--surface); color: var(--ink);
  border: 1px solid var(--border); border-radius: 8px; padding: 6px 12px;
}
button.btn:hover { background: var(--surface-2); }
button.btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
button.btn.danger { color: var(--critical); }
button.chip {
  appearance: none; font: inherit; font-size: 13px; cursor: pointer;
  background: var(--surface); color: var(--ink-2);
  border: 1px solid var(--border); border-radius: 999px; padding: 4px 12px;
}
button.chip.on { background: var(--accent); border-color: var(--accent); color: #fff; font-weight: 600; }
button.chip:hover { color: var(--ink); }
button.chip.on:hover { color: #fff; }
input[type=text], input[type=number], select, textarea {
  font: inherit; color: var(--ink); background: var(--surface);
  border: 1px solid var(--border); border-radius: 8px; padding: 6px 10px;
}
input:focus, select:focus, textarea:focus, button:focus-visible {
  outline: 2px solid var(--accent); outline-offset: 1px;
}
label.fld { display: flex; flex-direction: column; gap: 4px; font-size: 12px; color: var(--ink-2); }
.hint { color: var(--muted); font-size: 12px; }
.tag { display: inline-flex; align-items: center; gap: 4px; font-size: 12px; padding: 1px 8px; border-radius: 999px; border: 1px solid var(--border); color: var(--ink-2); }
.tag.good { color: var(--good-text); } .tag.crit { color: var(--critical); }
.tag.warn { color: var(--ink-2); }

/* ============ KPI / 状态瓷砖 ============ */
.kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 12px; margin-top: 16px; }
.kpi { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 12px 14px; box-shadow: var(--shadow); }
.kpi .lb { font-size: 12px; color: var(--ink-2); }
.kpi .vl { font-size: 26px; font-weight: 650; letter-spacing: -0.01em; margin-top: 2px; }
.kpi .dt { font-size: 12px; margin-top: 2px; }
.kpi .dt.up { color: var(--good-text); } .kpi .dt.down { color: var(--critical); } .kpi .dt.flat { color: var(--muted); }
.hero .vl { font-size: 48px; line-height: 1.1; }

/* 得分率 meter：同色系轨道 */
.meter { height: 6px; border-radius: 3px; background: var(--accent-soft); overflow: hidden; margin-top: 6px; }
.meter > i { display: block; height: 100%; background: var(--accent); border-radius: 3px; }

/* ============ 图表 ============ */
.chart-head { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; margin-bottom: 6px; }
.chart-head h3 { font-size: 14px; font-weight: 650; margin: 0; }
.chart-head .cs { color: var(--muted); font-size: 12px; }
.chart-head .tw { margin-left: auto; }
svg.line, svg.bar { display: block; width: 100%; height: auto; }
.legend { display: flex; flex-wrap: wrap; gap: 6px 14px; margin-top: 8px; }
.legend .li { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; color: var(--ink-2); cursor: pointer; user-select: none; }
.legend .li .key { width: 14px; height: 0; border-top: 2.5px solid; border-radius: 2px; }
.legend .li.off { opacity: 0.38; }
.legend .li:hover { color: var(--ink); }

/* tooltip */
#tt {
  position: fixed; z-index: 50; pointer-events: none; display: none;
  background: var(--surface); color: var(--ink);
  border: 1px solid var(--border); border-radius: 8px; box-shadow: 0 4px 16px rgba(0,0,0,0.12);
  padding: 8px 10px; font-size: 12px; min-width: 120px; max-width: 260px;
}
#tt .t { font-weight: 650; margin-bottom: 4px; }
#tt .r { display: flex; align-items: center; gap: 6px; margin-top: 2px; }
#tt .r .key { width: 12px; height: 0; border-top: 2.5px solid; border-radius: 2px; flex: none; }
#tt .r .v { font-weight: 650; font-variant-numeric: tabular-nums; }
#tt .r .n { color: var(--muted); }

/* ============ 表格 ============ */
table.tb { width: 100%; border-collapse: collapse; font-size: 13px; font-variant-numeric: tabular-nums; }
table.tb th, table.tb td { padding: 6px 8px; text-align: right; border-bottom: 1px solid var(--grid); white-space: nowrap; }
table.tb th { color: var(--muted); font-weight: 500; font-size: 12px; position: sticky; top: 0; background: var(--surface); }
table.tb th:first-child, table.tb td:first-child { text-align: left; }
table.tb td.up { color: var(--good-text); } table.tb td.down { color: var(--critical); } table.tb td.flat { color: var(--muted); }
.tscroll { overflow: auto; max-height: 420px; border: 1px solid var(--grid); border-radius: 8px; scrollbar-color: var(--axis) transparent; }
.tscroll table.tb th { z-index: 1; }

/* 名单 */
ul.mv { list-style: none; margin: 0; padding: 0; }
ul.mv li { display: flex; align-items: center; gap: 8px; padding: 7px 2px; border-bottom: 1px solid var(--grid); font-size: 13px; }
ul.mv li:last-child { border-bottom: none; }
ul.mv .nm { font-weight: 600; }
ul.mv .meta { color: var(--muted); font-size: 12px; }
ul.mv .val { margin-left: auto; font-variant-numeric: tabular-nums; }

/* 评估卡 */
.subj-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(230px, 1fr)); gap: 12px; }
.subj-card { border: 1px solid var(--border); border-radius: 10px; padding: 12px 14px; background: var(--surface); }
.subj-card .hd { display: flex; align-items: center; gap: 8px; }
.subj-card .dot { width: 9px; height: 9px; border-radius: 50%; flex: none; }
.subj-card .nm { font-weight: 650; }
.subj-card .bd { margin-left: auto; }
.subj-card .sc { font-size: 22px; font-weight: 650; margin-top: 6px; }
.subj-card .sc small { font-size: 12px; color: var(--muted); font-weight: 400; }
.subj-card dl { display: grid; grid-template-columns: auto 1fr; gap: 2px 10px; margin: 8px 0 0; font-size: 12px; }
.subj-card dt { color: var(--muted); } .subj-card dd { margin: 0; text-align: right; font-variant-numeric: tabular-nums; }

/* 建议 */
ul.advice { list-style: none; margin: 0; padding: 0; }
ul.advice li { padding: 10px 2px; border-bottom: 1px solid var(--grid); }
ul.advice li:last-child { border-bottom: none; }
ul.advice .ah { display: flex; align-items: center; gap: 8px; font-weight: 650; font-size: 13px; }
ul.advice .ah .dot { width: 9px; height: 9px; border-radius: 50%; }
ul.advice .ah .pr { margin-left: auto; font-size: 12px; color: var(--muted); font-weight: 400; }
ul.advice p { margin: 4px 0 0; color: var(--ink-2); font-size: 13px; }

/* 录入 */
textarea.paste { width: 100%; min-height: 140px; font-family: ui-monospace, Menlo, Consolas, monospace; font-size: 12px; }
.entry-cols { display: grid; grid-template-columns: 1fr 1fr; gap: 12px 16px; }
@media (max-width: 820px) { .entry-cols { grid-template-columns: 1fr; } }
.msg { margin-top: 8px; font-size: 13px; }
.msg.err { color: var(--critical); } .msg.ok { color: var(--good-text); }
.banner { border: 1px solid var(--border); border-left: 3px solid var(--warn); background: var(--surface); border-radius: 8px; padding: 10px 14px; margin-top: 16px; font-size: 13px; color: var(--ink-2); }
.banner.crit { border-left-color: var(--critical); }
.banner ul { margin: 6px 0 0; padding-left: 20px; line-height: 1.8; }
.set-tbl input { width: 72px; text-align: right; font-variant-numeric: tabular-nums; }

footer.app { margin-top: 40px; color: var(--muted); font-size: 12px; text-align: center; }
.empty { color: var(--muted); text-align: center; padding: 28px 0; font-size: 13px; }
</style>
</head>
<body>
<div id="tt" role="status" aria-live="polite"></div>

<header class="app">
  <div class="hd-in">
    <div class="hd-top">
      <h1>成绩分析追踪</h1>
      <span class="hd-sub">苏州 · 江苏新高考 3+1+2（物理 + 化学 + 地理）· 总分 750</span>
      <div class="hd-actions">
        <button class="btn" id="themeBtn" title="切换深浅色">🌓 主题</button>
      </div>
    </div>
    <nav class="tabs" id="tabs">
      <button data-tab="overview" class="on">总览</button>
      <button data-tab="student">学生追踪</button>
      <button data-tab="entry">成绩录入</button>
      <button data-tab="settings">设置</button>
    </nav>
  </div>
</header>

<main class="wrap" id="main"></main>
<footer class="app">数据只保存在这台电脑的浏览器里（localStorage）。换电脑或清缓存前，请先在「成绩录入」里导出备份。</footer>

<script>
"use strict";
/* ================================================================
   核心纯逻辑（无 DOM，可独立测试）
   ================================================================ */
/*__CORE_START__*/

const SUBJECTS = [
  { key: 'chinese',  name: '语文', max: 150, assigned: false, ci: 0 },
  { key: 'math',     name: '数学', max: 150, assigned: false, ci: 1 },
  { key: 'english',  name: '英语', max: 150, assigned: false, ci: 2 },
  { key: 'physics',  name: '物理', max: 100, assigned: false, ci: 3 },
  { key: 'chem',     name: '化学', max: 100, assigned: true,  ci: 4 },
  { key: 'geo',      name: '地理', max: 100, assigned: true,  ci: 5 },
];
const CORE4 = ['chinese', 'math', 'english', 'physics'];

const DEFAULT_BANDS = [
  { name: 'A', pct: 15, min: 86, max: 100 },
  { name: 'B', pct: 35, min: 71, max: 85 },
  { name: 'C', pct: 35, min: 56, max: 70 },
  { name: 'D', pct: 13, min: 41, max: 55 },
  { name: 'E', pct: 2,  min: 30, max: 40 },
];

function defaultSettings() {
  return { bands: DEFAULT_BANDS.map(b => ({ ...b })), line1: 512, line2: 448 };
}

/* --- 确定性随机（示例数据用） --- */
function mulberry32(seed) {
  let a = seed >>> 0;
  return function () {
    a |= 0; a = (a + 0x6D2B79F5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
function gauss(rnd) {
  let u = 0, v = 0;
  while (u === 0) u = rnd();
  while (v === 0) v = rnd();
  return Math.sqrt(-2 * Math.log(u)) * Math.cos(2 * Math.PI * v);
}

/* --- 示例数据：2 班 × 22 人 × 3 次考试 --- */
function generateSample() {
  const rnd = mulberry32(20261029);
  const surn = ['王', '李', '张', '刘', '陈', '杨', '赵', '黄', '周', '吴', '徐', '孙', '朱', '马', '胡', '郭', '林', '何', '高', '罗', '郑', '梁'];
  const givA = ['嘉怡', '思远', '雨桐', '宇轩', '诗涵', '子墨', '欣然', '俊杰', '佳琪', '浩然', '婉清', '梓涵'];
  const givB = ['一鸣', '若曦', '天佑', '静娴', '沐辰', '知夏', '语彤', '奕辰', '可欣', '致远', '芷若', '晨曦'];
  const names = [];
  for (let i = 0; i < 44; i++) {
    const s = surn[i % surn.length], g = (i < 22 ? givA : givB)[Math.floor(i / 22) % 12];
    names.push(s + g);
  }
  const mus = { chinese: 102, math: 97, english: 104, physics: 67, chem: 70, geo: 72 };
  const sds = { chinese: 11, math: 19, english: 14, physics: 13, chem: 12, geo: 11 };
  const maxs = { chinese: 150, math: 150, english: 150, physics: 100, chem: 100, geo: 100 };
  const students = names.map((nm, i) => {
    const h = gauss(rnd); // 个人综合水平
    const abi = {};
    for (const k of Object.keys(mus)) abi[k] = mus[k] + h * sds[k] * 0.55 + gauss(rnd) * sds[k] * 0.8;
    return { name: nm, cls: i < 22 ? '高三(1)班' : '高三(2)班', abi };
  });
  const examNames = ['月考一', '期中考', '月考二'];
  const exams = examNames.map((en, ei) => ({
    name: en,
    line1: 512, line2: 448,
    students: students.map(st => {
      const drift = gauss(rnd) * 2.5;
      const row = { name: st.name, cls: st.cls };
      for (const k of Object.keys(mus)) {
        let v = st.abi[k] + drift + gauss(rnd) * sds[k] * 0.45;
        v = Math.max(8, Math.min(maxs[k] - 2, v));
        row[k] = Math.round(v);
      }
      return row;
    }),
  }));
  // 示例数据也带上「学校官方年排」，让演示与新导入口径一致
  const st = defaultSettings();
  for (const ex of exams) {
    const comp = computeExamData(ex, st, null);
    const byName = new Map(comp.rows.map(r => [r.name, r]));
    for (const s of ex.students) {
      const r = byName.get(s.name);
      if (r && r.totalRank != null) s.yearRank = r.totalRank;
    }
  }
  return exams;
}

/* --- 等级赋分（江苏：A15/B35/C35/D13/E2，档内线性插值） --- */
function assignGrades(entries, bands) {
  // entries: [{id, raw}] → Map id → {level, score}
  const res = new Map();
  const list = entries.filter(e => e && e.raw != null && !isNaN(e.raw))
    .slice().sort((a, b) => b.raw - a.raw);
  const n = list.length;
  if (n === 0) return res;
  let prev = 0, cum = 0;
  for (let bi = 0; bi < bands.length; bi++) {
    const band = bands[bi];
    cum += band.pct / 100;
    const i0 = prev;
    let i1 = bi === bands.length - 1 ? n : Math.max(i0, Math.round(n * cum));
    // 同分同档：档位边界若切开同分考生，把边界下移让同分进同一档
    if (i1 > i0 && i1 < n) {
      const v = list[i1 - 1].raw;
      while (i1 < n && list[i1].raw === v) i1++;
    }
    prev = i1;
    if (i1 <= i0) continue;
    const hiRaw = list[i0].raw, loRaw = list[i1 - 1].raw;
    const span = hiRaw - loRaw;
    const bSpan = band.max - band.min;
    for (let i = i0; i < i1; i++) {
      const e = list[i];
      let sc;
      if (span > 0) sc = Math.round(band.min + (e.raw - loRaw) * bSpan / span);
      else sc = Math.round((band.min + band.max) / 2);
      sc = Math.max(band.min, Math.min(band.max, sc));
      res.set(e.id, { level: band.name, score: sc });
    }
  }
  return res;
}

/* --- 并列名次（1,2,2,4 式）：dir=-1 降序 --- */
function competitionRanks(items, valueOf, dir) {
  dir = dir === undefined ? -1 : dir;
  const ranks = new Map();
  const list = items.filter(x => valueOf(x) != null && !isNaN(valueOf(x)))
    .slice().sort((a, b) => dir * (valueOf(a) - valueOf(b)));
  let i = 0;
  while (i < list.length) {
    const v = valueOf(list[i]);
    let j = i;
    while (j < list.length && valueOf(list[j]) === v) j++;
    for (let k = i; k < j; k++) ranks.set(list[k], i + 1);
    i = j;
  }
  return ranks;
}

function examLine1(exam, settings) { return exam.line1 != null ? Number(exam.line1) : settings.line1; }
function examLine2(exam, settings) { return exam.line2 != null ? Number(exam.line2) : settings.line2; }

/* --- 单场考试全量计算 --- */
function computeExamData(exam, settings, prevExam) {
  const rows = exam.students.map(s => ({
    name: String(s.name), cls: s.cls ? String(s.cls) : '',
    yearRank: numOrNull(s.yearRank),
    raw: {
      chinese: numOrNull(s.chinese), math: numOrNull(s.math), english: numOrNull(s.english),
      physics: numOrNull(s.physics), chem: numOrNull(s.chem), geo: numOrNull(s.geo),
    },
    chemOv: numOrNull(s.chemScore), geoOv: numOrNull(s.geoScore),
  }));
  const chemG = assignGrades(rows.filter(r => r.raw.chem != null).map(r => ({ id: r.name, raw: r.raw.chem })), settings.bands);
  const geoG = assignGrades(rows.filter(r => r.raw.geo != null).map(r => ({ id: r.name, raw: r.raw.geo })), settings.bands);

  for (const r of rows) {
    const cg = chemG.get(r.name), gg = geoG.get(r.name);
    r.chemAssigned = r.chemOv != null ? r.chemOv : (cg ? cg.score : null);
    r.geoAssigned = r.geoOv != null ? r.geoOv : (gg ? gg.score : null);
    r.chemLevel = r.chemOv != null ? '—' : (cg ? cg.level : '—');
    r.geoLevel = r.geoOv != null ? '—' : (gg ? gg.level : '—');
    const p = CORE4.map(k => r.raw[k]);
    r.total = (p.every(v => v != null) && r.chemAssigned != null && r.geoAssigned != null)
      ? p[0] + p[1] + p[2] + p[3] + r.chemAssigned + r.geoAssigned : null;
    r.subj = {
      chinese: r.raw.chinese, math: r.raw.math, english: r.raw.english,
      physics: r.raw.physics, chem: r.chemAssigned, geo: r.geoAssigned,
    };
  }
  // 校内单科名次
  for (const s of SUBJECTS) {
    const rk = competitionRanks(rows, r => r.subj[s.key]);
    for (const r of rows) r[s.key + 'Rank'] = rk.get(r) || null;
  }
  // 总分年排 / 班排：学校给了官方年排就用官方，否则按导入名单计算
  const totalRk = competitionRanks(rows, r => r.total);
  for (const r of rows) {
    r.computedTotalRank = totalRk.get(r) || null;
    r.hasOfficialRank = r.yearRank != null && r.yearRank > 0;
    r.totalRank = r.hasOfficialRank ? r.yearRank : r.computedTotalRank;
  }
  const byCls = new Map();
  for (const r of rows) { if (!byCls.has(r.cls)) byCls.set(r.cls, []); byCls.get(r.cls).push(r); }
  for (const grp of byCls.values()) {
    const rk = competitionRanks(grp, r => r.total);
    for (const r of grp) r.classRank = rk.get(r) || null;
  }
  // 对比上一场
  const prevMap = new Map();
  if (prevExam) {
    const prevRows = computeExamData(prevExam, settings, null).rows; // 只需名次/总分，prev 已置 null 防递归
    for (const pr of prevRows) prevMap.set(pr.name, pr);
  }
  for (const r of rows) {
    const pr = prevMap.get(r.name);
    r.prevTotal = pr ? pr.total : null;
    r.prevRank = pr ? pr.totalRank : null;
    r.totalDelta = (pr && r.total != null && pr.total != null) ? r.total - pr.total : null;
    // 官方年排和按名单计算的年排不能直接相减，避免出现虚假的大幅升降

    r.toLine1 = r.total - L1; r.toLine2 = r.total - L2;

  const avg = arr => arr.length ? arr.reduce((a, b) => a + b, 0) / arr.length : null;
  const subjAvg = {};
  for (const s of SUBJECTS) subjAvg[s.key] = avg(rows.map(r => r.subj[s.key]).filter(v => v != null));

  const stats = {
    count: rows.length,
    avgTotal: avg(withTotal.map(r => r.total)),
    line1Count: withTotal.filter(r => r.total >= L1).length,
    line2Count: withTotal.filter(r => r.total >= L2).length,
    line1Rate: withTotal.length ? withTotal.filter(r => r.total >= L1).length / withTotal.length : null,
    line2Rate: withTotal.length ? withTotal.filter(r => r.total >= L2).length / withTotal.length : null,
    upCount: matched.filter(r => r.totalDelta > 0).length,
    downCount: matched.filter(r => r.totalDelta < 0).length,
    flatCount: matched.filter(r => r.totalDelta === 0).length,
    subjAvg, line1: L1, line2: L2,
  };

}

    else if (m.key === 'cls') { score += 5; if (map.cls == null) map.cls = j; }

function parseHeaderTable(lines, delim, header, opts) {

  const missing = subjectKeys.filter(k => present.indexOf(k) < 0);

  }
  if (filled) notes.push(`补全 ${filled} 行空班级（按上一行向下填充）`);
  if (skipped) notes.push(`跳过 ${skipped} 行汇总/说明行`);
  if (blankRows) notes.push(`有 ${blankRows} 行存在空分（按缺考处理）`);
  if (!students.length && !errors.length) errors.push('没有解析出学生，请检查内容和表头');
  return { students, errors, notes, meta: {
    mode: 'header', headerRow: header.index + 1, skipped, filledClass: filled, ignored: ignoredCols,
    yearRankColumn: map.yearRank != null, missingYearRank, requireYearRank: !!opts.requireYearRank,
  } };
}

function nameColumnScore(vals) {
  let like = 0, nonEmpty = 0;
  const set = new Set();
  for (const raw of vals) {
    const s = normalizeCell(raw);
    if (!s) continue;
    nonEmpty++;
    set.add(s);
    if (looksLikeName(s)) like++;
  }
  if (!nonEmpty) return -Infinity;
  const uniqRatio = set.size / nonEmpty;
  let score = like;
  if (uniqRatio > 0.8) score += nonEmpty * 0.5;
  if (uniqRatio < 0.35) score -= nonEmpty * 0.8;
  return score;
}
function subjectColumnScore(vals, max) {
  let nonEmpty = 0, num = 0, inRange = 0, meaningful = 0;
  for (const raw of vals) {
    const s = normalizeCell(raw);
    if (!s) continue;
    nonEmpty++;
    const p = parseImportScore(raw);
    if (p.error || p.value == null) continue;
    num++;
    if (p.value >= 0 && p.value <= max) inRange++;
    if (p.value > max * 0.12) meaningful++;
  }
  if (!nonEmpty) return 0;
  if (num / nonEmpty < 0.5) return -2;
  if (inRange / num < 0.8) return -1;
  if (meaningful / num < 0.5) return 0.8;
  return 2;
}
function classColumnScore(vals) {
  const ne = [];
  for (const raw of vals) { const s = normalizeCell(raw); if (s) ne.push(s); }
  if (!ne.length) return 0;
  const textVals = ne.filter(v => isNaN(Number(v)));
  const nums = ne.filter(v => !isNaN(Number(v))).map(Number);
  const uniq = new Set(ne).size;
  if (textVals.length / ne.length >= 0.6) {
    if (ne.some(v => /班|级|部|系/.test(v)) || uniq <= 20) return 3;
    return -4;
  }
  if (nums.length && uniq <= Math.max(3, Math.ceil(ne.length * 0.4)) && nums.every(v => v >= 0 && v <= 100)) return 2;
  return -4;
}
function extraColumnKind(vals) {
  let nums = [], nonEmpty = 0;
  for (const raw of vals) {
    const s = normalizeCell(raw);
    if (!s) continue;
    nonEmpty++;
    const p = parseImportScore(raw);
    if (p.error || p.value == null) continue;
    nums.push(p.value);
  }
  if (!nonEmpty) return 'empty';
  if (nums.length / nonEmpty < 0.6) return 'other';
  if (nums.some(v => v > 150)) return 'total';
  if (nums.some(v => v < 20)) return 'rank';
  if (nums.every(v => v >= 0 && v <= 150)) return 'assigned';
  return 'other';
}

function parseNoHeaderTable(lines, delim, opts) {
  opts = opts || {};
  const rawRows = [];
  for (let i = 0; i < lines.length; i++) {
    const cells = splitImportLine(lines[i], delim);
    if (cells.some(c => c !== '')) rawRows.push({ line: i + 1, cells });
  }
  if (!rawRows.length) return { students: [], errors: ['没有内容'], notes: [], meta: null };

  const maxLen = Math.max.apply(null, rawRows.map(r => r.cells.length));
  // 1. 找姓名列（唯一性高的中文姓名列）
  let nameIdx = 0, bestNameScore = -Infinity;
  for (let j = 0; j < Math.min(6, maxLen); j++) {
    const sc = nameColumnScore(rawRows.map(r => r.cells[j] == null ? '' : r.cells[j]));
    if (sc > bestNameScore) { bestNameScore = sc; nameIdx = j; }
  }
  if (!isFinite(bestNameScore) || bestNameScore <= 0) nameIdx = 0;

  // 2. 找六科起始列（允许姓名与成绩之间夹班级/序号列）
  const start = nameIdx + 1;
  let bestStart = -1, bestScore = -Infinity;
  for (let s = start; s <= Math.min(start + 3, maxLen - 1); s++) {
    let sc = 0, valid = 0;
    for (let k = 0; k < 6; k++) {
      const one = subjectColumnScore(rawRows.map(r => r.cells[s + k] == null ? '' : r.cells[s + k]), SUBJECTS[k].max);
      if (one > 0) valid++;
      sc += one;
    }
    if (valid < 2) continue;
    if (s === start) sc += 0.5;
    if (sc > bestScore) { bestScore = sc; bestStart = s; }
  }
  if (bestStart < 0) {
    return {
      students: [], errors: ['没识别到表头，也无法按列位置识别成绩。建议先点「下载空白模板」按模板填写，或确认每行包含姓名和 6 科成绩。'],
      notes: [], meta: null,
    };
  }

  // 3. 班级列：姓名与成绩之间，或姓名之前
  let clsIdx = -1;
  for (let j = start; j < bestStart; j++) {
    if (classColumnScore(rawRows.map(r => r.cells[j] == null ? '' : r.cells[j])) > 0) { clsIdx = j; break; }
  }
  if (clsIdx < 0 && nameIdx > 0) {
    if (classColumnScore(rawRows.map(r => r.cells[nameIdx - 1] == null ? '' : r.cells[nameIdx - 1])) > 0) clsIdx = nameIdx - 1;
  }
  // 常见老格式：姓名 + 班级 + 六科（正好 8 列）直接认定，
  // 避免把某一科里的错字（如 "abc"）当成"额外列"跳过去。
  if (bestStart > start && clsIdx === start && maxLen === nameIdx + 8) bestStart = start + 1;

  // 4. 多出来的列：赋分 / 总分 / 名次 / 备注
  const extraStart = bestStart + 6;
  let chemScoreIdx = null, geoScoreIdx = null, yearRankIdx = null, ignoredExtras = 0;
  for (let j = extraStart; j < maxLen; j++) {
    const kind = extraColumnKind(rawRows.map(r => r.cells[j] == null ? '' : r.cells[j]));
    if (kind === 'assigned') {
      if (chemScoreIdx == null) chemScoreIdx = j;
      else if (geoScoreIdx == null) geoScoreIdx = j;
      else ignoredExtras++;
    } else if (kind === 'rank') {
      if (yearRankIdx == null) yearRankIdx = j;
      else ignoredExtras++;
    } else if (kind !== 'empty') {
      ignoredExtras++;
    }
  }
  // 有些表把年排放在姓名和成绩之间
  if (yearRankIdx == null) {
    for (let j = start; j < bestStart; j++) {
      if (j === clsIdx) continue;
      if (extraColumnKind(rawRows.map(r => r.cells[j] == null ? '' : r.cells[j])) === 'rank') { yearRankIdx = j; break; }
    }
  }
  const ignoredBefore = Math.max(0, bestStart - start - (clsIdx >= start ? 1 : 0) -
    (yearRankIdx != null && yearRankIdx >= start && yearRankIdx < bestStart ? 1 : 0));

  // 5. 解析
  const students = [], errors = [], notes = [];
  const seen = new Set();
  let lastCls = '', filled = 0, skipped = 0, blankRows = 0;
  for (const r of rawRows) {
    const cells = r.cells;
    if (isAggregateRow(cells)) { skipped++; continue; }
    const name = normalizeCell(cells[nameIdx] || '');
    if (!name) {
      if (cells.some(c => normalizeCell(c) !== '')) errors.push(`第 ${r.line} 行：姓名为空，已跳过`);
      continue;
    }
    if (/^(姓名|学生姓名|名字|备注|说明|注)[:：]?/.test(name)) { skipped++; continue; }
    if (!looksLikeName(name) && cells.filter(c => normalizeCell(c) !== '').length <= 2) { skipped++; continue; }
    let cls = clsIdx >= 0 ? normalizeCell(cells[clsIdx] || '') : '';
    if (!cls && lastCls) { cls = lastCls; filled++; }
    if (cls) lastCls = cls;
    const row = { name, cls };
    let blanks = 0;
    for (let k = 0; k < 6; k++) {
      const f = IMPORT_SCORE_FIELDS[k];
      const v = parseImportScoreField(row, cells, bestStart + k, f.key, f.label, f.max, r.line, errors);
      if (v == null) blanks++;
    }
    row.chemScore = null; row.geoScore = null;
    parseImportScoreField(row, cells, chemScoreIdx, 'chemScore', '化学赋分', 100, r.line, errors);
    parseImportScoreField(row, cells, geoScoreIdx, 'geoScore', '地理赋分', 100, r.line, errors);
    const allSubjectBlank = IMPORT_SCORE_FIELDS.slice(0, 6).every(f => row[f.key] == null);
    if (allSubjectBlank && row.chemScore == null && row.geoScore == null) { skipped++; continue; }
    applyYearRank(row, yearRankIdx != null ? cells[yearRankIdx] : '', r.line, errors);
    if (blanks) blankRows++;
    if (seen.has(name)) errors.push(`第 ${r.line} 行：姓名「${name}」重复出现（前后对比按姓名匹配，重名请加后缀）`);
    seen.add(name);
    students.push(row);
  }

  notes.push('未识别到表头，已按列位置自动整理（建议下次用「下载空白模板」）');
  notes.push(`识别为：姓名${clsIdx >= 0 ? ' + 班级' : ''} + 六科`);
  if (yearRankIdx != null) notes.push('识别到年级排名列（无表头时按名次列处理）');
  else if (opts.requireYearRank) notes.push('未识别到年级排名列（必填）');
  if (chemScoreIdx != null || geoScoreIdx != null) notes.push('识别到赋分列（无表头时按出现顺序作为化学赋分、地理赋分）');
  if (ignoredExtras) notes.push(`忽略 ${ignoredExtras} 列（疑似总分/名次/备注）`);
  if (ignoredBefore) notes.push(`忽略姓名与成绩之间的 ${ignoredBefore} 列（疑似序号/学号）`);
  if (filled) notes.push(`补全 ${filled} 行空班级（按上一行向下填充）`);
  if (skipped) notes.push(`跳过 ${skipped} 行标题/汇总/说明行`);
  if (blankRows) notes.push(`有 ${blankRows} 行存在空分（按缺考处理）`);
  const missingYearRank = students.filter(s => s.yearRank == null).length;
  if (opts.requireYearRank && missingYearRank) {
    errors.push(yearRankIdx == null
      ? `年级排名为必填：没有识别到名次列（缺 ${missingYearRank} 人）`
      : `年级排名为必填：有 ${missingYearRank} 人未填写或填写无效`);
  }
  if (!students.length && !errors.length) errors.push('没有解析出学生，请检查内容和列顺序');
  return { students, errors, notes, meta: {
    mode: 'position', nameIdx, subjStart: bestStart, clsIdx, skipped, filledClass: filled,
    yearRankColumn: yearRankIdx != null, missingYearRank, requireYearRank: !!opts.requireYearRank,
  } };
}

function parseImport(text, opts) {
  opts = opts || {};
  const lines = splitImportLines(text);
  if (!lines.length) return { students: [], errors: ['没有内容'], notes: [], meta: null };
  let delim = detectDelimiter(lines);
  let header = findHeader(lines, delim);
  if (!header) {
    for (const d of ['\t', ',', ';']) {
      if (d === delim) continue;
      const h = findHeader(lines, d);
      if (h && (!header || h.score > header.score)) { header = h; delim = d; }
    }
  }
  if (header) {
    // 两行表头：科目行 + 原始分/赋分行
    const mainCells = header.cells || splitImportLine(lines[header.index], delim);
    const nextIdx = header.index + 1;
    if (nextIdx < lines.length) {
      const subCells = splitImportLine(lines[nextIdx], delim);
      if (isSubHeaderCells(subCells)) {
        const mergedCells = mergeHeaderCells(mainCells, subCells);
        const merged = buildHeaderCandidate(mergedCells, header.index);
        if (merged.hasName && merged.subjCount >= header.subjCount) {
          merged.subRows = 1;
          header = merged;
        }
      }
    }
    return parseHeaderTable(lines, delim, header, opts);
  }
  return parseNoHeaderTable(lines, delim, opts);
}

/* --- 各科评估 --- */
function subjectEval(row, subj, schoolAvg, classAvg, classCount, history, examIdx) {
  const score = row.subj[subj.key];
  if (score == null) return null;
  const rate = score / subj.max;
  let level, levelCls;
  if (rate >= 0.85) { level = '优秀'; levelCls = 'good'; }
  else if (rate >= 0.70) { level = '良好'; levelCls = 'ok'; }
  else if (rate >= 0.60) { level = '中等'; levelCls = 'warn'; }
  else { level = '待提高'; levelCls = 'crit'; }
  // 近几场趋势（该科）
  const vals = [];
  for (let i = Math.max(0, examIdx - 2); i <= examIdx; i++) {
    const r = history[i];
    if (r && r.subj[subj.key] != null) vals.push(r.subj[subj.key]);
  }
  let trend = null, trendDelta = null;
  if (vals.length >= 2) { trendDelta = vals[vals.length - 1] - vals[vals.length - 2]; trend = trendDelta > 0 ? 'up' : (trendDelta < 0 ? 'down' : 'flat'); }
  const nRanked = row[subj.key + 'Rank'] != null ? null : null;
  return {
    score, rate, level, levelCls,
    rank: row[subj.key + 'Rank'],
    vsSchool: schoolAvg != null ? score - schoolAvg : null,
    vsClass: classAvg != null ? score - classAvg : null,
    trend, trendDelta, spark: vals,
  };
}

/* --- 复习建议（按得分率 + 趋势生成） --- */
function buildAdvice(subj, ctx) {
  // ctx: {rate, trend, trendDelta, vsSchool, score, schoolAvg, subjectName}
  const weak = ctx.rate < 0.65, mid = ctx.rate >= 0.65 && ctx.rate < 0.80;
  const down = ctx.trend === 'down';
  const gap = ctx.vsSchool != null ? Math.round(Math.abs(ctx.vsSchool)) : null;
  let core = '';
  switch (subj.key) {
    case 'chinese':
      core = weak
        ? '优先抓「性价比」：默写 64 篇篇目轮背（每天 15 分钟）、文言实词虚词过一遍课内清单，这两块最接近「背了就得分」。现代文阅读先固化答题模板（概括题、作用题、探究题各一套话术），作文准备 3 个可迁移素材。'
        : mid
          ? '阅读题的失分多半在「答题不全点」：对答案时数一数自己踩到几个得分点，补齐漏掉的角度。作文升格练「一材多用」，把现有素材写出层次。'
          : '基础已稳，重点放在作文和阅读的「精准度」：研究近几次大考的评分细则，把丢掉的步骤分、要点分找回来。';
      break;
    case 'math':
      core = weak
        ? '先把选填的正确率打上来：每天 1 组限时选填（40 分钟内），目标正确率 80%。大题保住前 2 问的过程分——三角、数列、概率统计这三个板块相对好拿，优先练熟。'
        : mid
          ? '主攻两个「拉分大户」：解析几何与导数的第 2 问。每天 1 题大题精做（写出完整过程再对答案），同时保持选填手感不掉。'
          : '目标是压轴题的步骤分与全卷零失误：每周 2 次全卷限时模拟，重点复盘「会做但做错」的题，这类分丢得最冤。';
      break;
    case 'english':
      core = weak
        ? '词汇是地基：3500 词按考频过，每天 30 词 + 当日复盘。语法填空专练高频考点（非谓语、定语从句、时态语态），每周 3 篇。'
        : mid
          ? '读后续写和应用文是主要增量：每周 2 篇限时写作，写完对照范文积累「动作链 + 情绪描写」语料。阅读理解注意定位原文，杜绝凭感觉选。'
          : '保持手感的同时抠细节：完形的逻辑衔接词、语法填空的词形变化。作文冲高分靠高级句式和卷面，整理 10 个万能句式备用。';
      break;
    case 'physics':
      core = weak
        ? '力学和电学的「模型」先过关：受力分析、能量观点、带电粒子运动各画一张思维导图。大题写公式就有步骤分，别空着。实验题把课本原型实验的原理和误差分析吃透。'
        : mid
          ? '重点练「多过程分析」题：拆阶段、选规律、列方程三步走。电磁感应与带电粒子在复合场中的运动各总结一套切入套路。'
          : '冲高分靠小题正确率和大题的严密表达：注意矢量方向、正负号、单位；每周一套限时训练保持状态。';
      break;
    case 'chem':
      core = weak
        ? '先背该背的：方程式（尤其课本实验相关）、元素化合物转化关系图。选择题的化学与生活、实验基础是快速提分点。'
        : mid
          ? '主攻工艺流程题：练「箭头式读流程」，标出每步目的；原理大题按「平衡—速率—图像」三件套答题，术语要准。'
          : '实验综合与原理大题的规范表述是突破点：对照标准答案学「怎么答才给分」，注意控制变量、现象结论一一对应。';
      break;
    case 'geo':
      core = weak
        ? '区域定位和地图判读先过关：每张图问自己「在哪、什么特征、为什么」。自然地理的气候、地形成因背熟答题模板。'
        : mid
          ? '综合题失分多在「术语不专业、要点不全」：背熟常用答题术语（如「昼夜温差大—有利于养分积累」），对照答案补角度。'
          : '冲击高分靠材料信息的提取和「地理过程」的逻辑链：练从材料里抠隐藏条件，答题按「因果链」展开。';
      break;
  }
  if (down && ctx.trendDelta != null) {
    core += `近两次下滑了 ${Math.abs(Math.round(ctx.trendDelta))} 分，先回看上次考试的丢分题，确认是知识点漏洞还是失误，再对症练。`;
  } else if (ctx.trend === 'up' && ctx.trendDelta) {
    core += `近两次在回升（+${Math.round(ctx.trendDelta)} 分），保持当前节奏。`;
  }
  if (gap != null && ctx.vsSchool != null && ctx.vsSchool < 0) {
    core += `目前比校均分低 ${gap} 分，先把这一截追平。`;
  }
  const priority = Math.round((1 - ctx.rate) * 100) + (down ? 25 : 0) + (ctx.vsSchool != null && ctx.vsSchool < 0 ? 10 : 0);
  return { text: core, priority };
}

/* --- 学生简报 markdown（导出 / 发给 AI 的数据包） --- */
function studentBriefMd(ctx) {
  // ctx: {name, cls, examNames, rows, line1, line2, profile, subjEvals, ruleAdvice}
  const L = [];
  L.push('# 学生学业数据简报');
  L.push('');
  L.push(`- 学生：${ctx.name}${ctx.cls ? '（' + ctx.cls + '）' : ''}`);
  if (ctx.profile && ctx.profile.goal) L.push(`- 目标：${ctx.profile.goal}`);
  if (ctx.profile && ctx.profile.notes) L.push(`- 背景备注：${ctx.profile.notes}`);
  L.push(`- 数据范围：${ctx.examNames.join('、')}（共 ${ctx.examNames.length} 次考试）`);
  L.push(`- 分数线：本一线 ${ctx.line1} / 本二线 ${ctx.line2}`);
  L.push(`- 总分口径：语数外（各 150）+ 物理（100）+ 化学、地理赋分（各 100），满分 750`);
  L.push('- 年级排名：优先采用学校官方年排；没有年排的旧数据按导入名单计算');
  L.push('');
  L.push('## 历次成绩');
  L.push('');
  L.push('| 考试 | 语文 | 数学 | 英语 | 物理 | 化学(赋分) | 地理(赋分) | 总分 | 年级排名 | 班内排名 | 较上场 | 上线 |');
  L.push('|---|---|---|---|---|---|---|---|---|---|---|---|');
  ctx.rows.forEach((r, i) => {
    if (!r) { L.push(`| ${ctx.examNames[i]} | — | — | — | — | — | — | — | — | — | 无记录 | — |`); return; }
    const s = k => r.subj[k] == null ? '—' : r.subj[k];
    const d = r.totalDelta == null ? '—' : (r.totalDelta > 0 ? '+' + r.totalDelta : String(r.totalDelta));
    L.push(`| ${ctx.examNames[i]} | ${s('chinese')} | ${s('math')} | ${s('english')} | ${s('physics')} | ${s('chem')} | ${s('geo')} | ${r.total == null ? '—' : r.total} | ${r.totalRank == null ? '—' : r.totalRank} | ${r.classRank == null ? '—' : r.classRank} | ${d} | ${r.lineStatus || '—'} |`);
  });
  L.push('');
  if (ctx.subjEvals && ctx.subjEvals.length) {
    L.push('## 最近一次各科与校均对比');
    L.push('');
    L.push('| 科目 | 得分 | 满分 | 得分率 | 年级名次 | 校均 | 与校均差 | 近三次走势 |');
    L.push('|---|---|---|---|---|---|---|---|');
    for (const e of ctx.subjEvals) {
      const trend = e.trendDelta == null ? '—' : (e.trendDelta > 0 ? '+' + e.trendDelta : String(e.trendDelta));
      L.push(`| ${e.name} | ${e.score} | ${e.max} | ${Math.round(e.rate * 100)}% | ${e.rank == null ? '—' : e.rank} | ${e.schoolAvg == null ? '—' : Math.round(e.schoolAvg * 10) / 10} | ${e.vsSchool == null ? '—' : (e.vsSchool > 0 ? '+' : '') + Math.round(e.vsSchool * 10) / 10} | ${trend} |`);
    }
    L.push('');
  }
  if (ctx.ruleAdvice && ctx.ruleAdvice.length) {
    L.push('## 规则版复习建议（供参考，可修正）');
    L.push('');
    for (const a of ctx.ruleAdvice) L.push(`- **${a.name}**：${a.text}`);
    L.push('');
  }
  return L.join('\n');
}

const PALETTES = {
  light: {
    series: ['#2a78d6', '#eb6834', '#1baf7a', '#eda100', '#e87ba4', '#008300'],
    surface: '#fcfcfb', ink: '#0b0b0b', ink2: '#52514e', muted: '#898781',
    grid: '#e1e0d9', axis: '#c3c2b7', accent: '#2a78d6', accentSoft: '#cde2fb',
    good: '#0ca30c', critical: '#d03b3b', warn: '#fab219', demph: '#c3c2b7',
  },
  dark: {
    series: ['#3987e5', '#d95926', '#199e70', '#c98500', '#d55181', '#008300'],
    surface: '#1a1a19', ink: '#ffffff', ink2: '#c3c2b7', muted: '#898781',
    grid: '#2c2c2a', axis: '#383835', accent: '#3987e5', accentSoft: '#184f95',
    good: '#0ca30c', critical: '#d03b3b', warn: '#fab219', demph: '#383835',
  },
};
function isDark() {
  const t = document.documentElement.getAttribute('data-theme');
  if (t === 'dark') return true;
  if (t === 'light') return false;
  return window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
}
function P() { return isDark() ? PALETTES.dark : PALETTES.light; }
function subjColor(key) { const s = SUBJECTS.find(x => x.key === key); return P().series[s ? s.ci : 0]; }

function esc(s) {
  return String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
}
function h(tag, attrs) {
  const e = document.createElement(tag);
  if (attrs) for (const k in attrs) {
    const v = attrs[k];
    if (v == null) continue;
    if (k === 'class') e.className = v;
    else if (k === 'text') e.textContent = v;
    else if (k === 'html') e.innerHTML = v;
    else if (k.slice(0, 2) === 'on') e.addEventListener(k.slice(2), v);
    else e.setAttribute(k, v);
  }
  for (let i = 2; i < arguments.length; i++) {
    const c = arguments[i];
    if (c == null) continue;
    if (Array.isArray(c)) c.forEach(x => x != null && e.append(x));
    else e.append(c.nodeType ? c : document.createTextNode(String(c)));
  }
  return e;
}
function fmt(v, d) { return v == null || isNaN(v) ? '—' : (d ? Number(v).toFixed(d) : String(Math.round(v * 10) / 10)); }
function fmtSigned(v) { return v == null || isNaN(v) ? '—' : (v > 0 ? '+' + fmt(v) : fmt(v)); }
function pct(v) { return v == null ? '—' : (v * 100).toFixed(1) + '%'; }

async function copyText(t) {
  try { await navigator.clipboard.writeText(t); return true; } catch (e) {
    const ta = document.createElement('textarea');
    ta.value = t; ta.style.position = 'fixed'; ta.style.opacity = '0';
    document.body.append(ta); ta.select();
    let ok = false;
    try { ok = document.execCommand('copy'); } catch (e2) { /* ignore */ }
    ta.remove();
    return ok;
  }
}

function safeFileName(s) {
  return String(s == null ? '' : s).replace(/[\\/:*?"<>|\r\n]+/g, '-').trim() || '成绩';
}
function downloadTextFile(filename, text, mime) {
  const blob = new Blob([text], { type: mime || 'text/csv;charset=utf-8' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = filename;
  document.body.append(a);
  a.click();
  a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 1000);
}

/* ---------- tooltip ---------- */
const tt = document.getElementById('tt');
function showTT(x, y, title, rows) {
  tt.innerHTML = '';
  tt.append(h('div', { class: 't', text: title }));
  for (const r of rows) {
    const row = h('div', { class: 'r' },
      h('span', { class: 'key', style: 'border-top-color:' + r.color }),
      h('span', { class: 'v', text: r.value }),
      h('span', { class: 'n', text: r.name }));
    tt.append(row);
  }
  tt.style.display = 'block';
  const pad = 14, vw = window.innerWidth;
  let left = x + pad, top = y + pad;
  const rect = tt.getBoundingClientRect();
  if (left + rect.width > vw - 8) left = x - rect.width - pad;
  if (top + rect.height > window.innerHeight - 8) top = y - rect.height - pad;
  tt.style.left = left + 'px'; tt.style.top = top + 'px';
}
function hideTT() { tt.style.display = 'none'; }

/* ---------- 折线图 ---------- */
function niceTicks(min, max, count) {
  if (min === max) { min -= 1; max += 1; }
  const span = max - min;
  const step0 = span / Math.max(1, count - 1);
  const mag = Math.pow(10, Math.floor(Math.log10(step0)));
  const norm = step0 / mag;
  const step = (norm <= 1 ? 1 : norm <= 2 ? 2 : norm <= 2.5 ? 2.5 : norm <= 5 ? 5 : 10) * mag;
  const lo = Math.floor(min / step) * step, hi = Math.ceil(max / step) * step;
  const ticks = [];
  for (let v = lo; v <= hi + step * 0.5; v += step) ticks.push(Math.round(v * 1e6) / 1e6);
  return { lo, hi, ticks };
}

/**
 * lineChartCard: 单卡折线图（含图例 + 表格视图切换 + 十字线 tooltip）
 * opts: {title, sub, xLabels:[], series:[{key,name,color,values:[]}], refs:[{y,label,color}],
 *        invertY, yUnit, height, labelLast}
 */
function lineChartCard(opts) {
  const pal = P();
  const off = new Set();
  const W = 720, H = opts.height || 240;
  const padL = 48, padR = (opts.refs && opts.refs.length) ? 92 : 56, padT = 14, padB = 30;
  const plotW = W - padL - padR, plotH = H - padT - padB;

  function visSeries() { return opts.series.filter(s => !off.has(s.key)); }

  function domain() {
    let vals = [];
    for (const s of visSeries()) for (const v of s.values) if (v != null && !isNaN(v)) vals.push(v);
    for (const r of (opts.refs || [])) if (r.y != null) vals.push(r.y);
    if (!vals.length) return { lo: 0, hi: 1, ticks: [0, 1] };
    let min = Math.min.apply(null, vals), max = Math.max.apply(null, vals);
    const pad = Math.max(1, (max - min) * 0.12);
    return niceTicks(min - pad, max + pad, 5);
  }

  function build(onlyTable) {
    const d = domain();
    const n = opts.xLabels.length;
    const X = i => n <= 1 ? padL + plotW / 2 : padL + plotW * i / (n - 1);
    const Yraw = v => padT + plotH * (1 - (v - d.lo) / (d.hi - d.lo));
    const Y = v => opts.invertY ? padT + plotH * (v - d.lo) / (d.hi - d.lo) : Yraw(v);
    const wrap = h('div');
    wrap.append(h('div', { class: 'chart-head' },
      h('h3', { text: opts.title }),
      opts.sub ? h('span', { class: 'cs', text: opts.sub }) : null,
      h('span', { class: 'tw' },
        h('button', { class: 'btn', onclick: () => { tblHidden = !tblHidden; rerender(); }, text: tblHidden ? '表格视图' : '返回图表' }))));

    if (tblHidden) {
      const tbl = h('table', { class: 'tb' });
      const thead = h('thead', {}, h('tr', {}, h('th', { text: '考试' }),
        visSeries().map(s => h('th', { text: s.name })),
        (opts.refs || []).map(r => h('th', { text: r.label }))));
      const tbody = h('tbody', {}, opts.xLabels.map((lb, i) => h('tr', {},
        h('td', { text: lb }),
        visSeries().map(s => h('td', { text: s.values[i] == null ? '—' : fmt(s.values[i]) })),
        (opts.refs || []).map(() => h('td', { text: '—' })))));
      tbl.append(thead, tbody);
      wrap.append(h('div', { class: 'tscroll' }, tbl));
      return wrap;
    }
    if (!visSeries().length || !n) { wrap.append(h('div', { class: 'empty', text: '暂无数据' })); return wrap; }

    // SVG 字符串（静态颜色/数字，动态文本已转义）
    let g = '';
    for (const t of d.ticks) {
      const y = Y(t);
      g += `<line x1="${padL}" y1="${y}" x2="${W - padR}" y2="${y}" stroke="${pal.grid}" stroke-width="1"/>`;
      g += `<text x="${padL - 8}" y="${y + 4}" text-anchor="end" font-size="11" fill="${pal.muted}" style="font-variant-numeric:tabular-nums">${t}</text>`;
    }
    g += `<line x1="${padL}" y1="${padT + plotH}" x2="${W - padR}" y2="${padT + plotH}" stroke="${pal.axis}" stroke-width="1"/>`;
    for (let i = 0; i < n; i++) {
      g += `<text x="${X(i)}" y="${H - 8}" text-anchor="middle" font-size="11" fill="${pal.muted}">${esc(opts.xLabels[i])}</text>`;
    }
    // 参考线
    for (const r of (opts.refs || [])) {
      if (r.y == null) continue;
      const y = Y(r.y);
      if (y < padT - 2 || y > padT + plotH + 2) continue;
      g += `<line x1="${padL}" y1="${y}" x2="${W - padR}" y2="${y}" stroke="${r.color}" stroke-width="1.5" stroke-opacity="0.75"/>`;
      g += `<text x="${W - padR + 6}" y="${y + 4}" font-size="11" fill="${pal.ink2}">${esc(r.label)}</text>`;
    }
    // 折线（缺值断开）
    for (const s of visSeries()) {
      let dstr = '', pen = false;
      for (let i = 0; i < n; i++) {
        const v = s.values[i];
        if (v == null || isNaN(v)) { pen = false; continue; }
        dstr += (pen ? 'L' : 'M') + X(i).toFixed(1) + ' ' + Y(v).toFixed(1) + ' ';
        pen = true;
      }
      g += `<path d="${dstr}" fill="none" stroke="${s.color}" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>`;
      // 端点直标（仅单系列时）
      if (opts.labelLast && visSeries().length === 1) {
        for (let i = n - 1; i >= 0; i--) if (s.values[i] != null) {
          g += `<circle cx="${X(i)}" cy="${Y(s.values[i])}" r="4.5" fill="${s.color}" stroke="${pal.surface}" stroke-width="2"/>`;
          g += `<text x="${X(i) + 8}" y="${Y(s.values[i]) + 4}" font-size="12" font-weight="600" fill="${pal.ink}">${fmt(s.values[i])}</text>`;
          break;
        }
      } else {
        for (let i = 0; i < n; i++) if (s.values[i] != null)
          g += `<circle cx="${X(i)}" cy="${Y(s.values[i])}" r="3.5" fill="${s.color}" stroke="${pal.surface}" stroke-width="2"/>`;
      }
    }
    const svg =
      `<svg class="line" viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(opts.title)}">` +
      g +
      `<line class="xh" x1="0" y1="${padT}" x2="0" y2="${padT + plotH}" stroke="${pal.axis}" stroke-width="1" opacity="0"/>` +
      `<rect x="0" y="0" width="${W}" height="${H}" fill="transparent" style="cursor:crosshair"/>` +
      `</svg>`;
    const holder = h('div', { html: svg });
    const svgEl = holder.firstChild;
    // 十字线 + tooltip
    const xh = svgEl.querySelector('.xh');
    svgEl.addEventListener('pointermove', ev => {
      const box = svgEl.getBoundingClientRect();
      const px = (ev.clientX - box.left) * W / box.width;
      let idx = n <= 1 ? 0 : Math.round((px - padL) / plotW * (n - 1));
      idx = Math.max(0, Math.min(n - 1, idx));
      xh.setAttribute('x1', X(idx)); xh.setAttribute('x2', X(idx)); xh.setAttribute('opacity', '0.8');
      const rows = visSeries().map(s => ({
        color: s.color, name: s.name, value: s.values[idx] == null ? '—' : fmt(s.values[idx]) + (opts.yUnit || ''),
      }));
      for (const r of (opts.refs || [])) rows.push({ color: r.color, name: r.label, value: fmt(r.y) + (opts.yUnit || '') });
      showTT(ev.clientX, ev.clientY, opts.xLabels[idx], rows);
    });
    svgEl.addEventListener('pointerleave', () => { xh.setAttribute('opacity', '0'); hideTT(); });
    wrap.append(holder);

    // 图例（≥2 系列；点击可隐藏/显示）
    if (opts.series.length >= 2) {
      const lg = h('div', { class: 'legend' }, opts.series.map(s =>
        h('span', {
          class: 'li' + (off.has(s.key) ? ' off' : ''), role: 'button', tabindex: '0',
          title: '点击显示/隐藏',
          onclick: () => { off.has(s.key) ? off.delete(s.key) : off.add(s.key); rerender(); },
          onkeydown: ev => { if (ev.key === 'Enter' || ev.key === ' ') { ev.preventDefault(); off.has(s.key) ? off.delete(s.key) : off.add(s.key); rerender(); } },
        },
          h('span', { class: 'key', style: 'border-top-color:' + s.color }),
          s.name)));
      wrap.append(lg);
    }
    return wrap;
  }

  let tblHidden = false;
  let cur = null;
  function rerender() {
    const next = build();
    if (cur && cur.parentNode) cur.parentNode.replaceChild(next, cur);
    cur = next;
  }
  cur = build();
  const host = h('div', { class: 'card' }, cur);
  return host;
}

/* ---------- 柱状图（单系列，名义类别 → 统一 slot1 色） ---------- */
function barChartCard(opts) {
  // opts: {title, sub, items:[{label, value, ref?}], yMax, unit, height}
  const pal = P();
  const W = 720, H = opts.height || 220;
  const padL = 44, padR = 16, padT = 18, padB = 30;
  const plotW = W - padL - padR, plotH = H - padT - padB;
  const vals = opts.items.map(i => i.value).filter(v => v != null);
  const maxV = opts.yMax != null ? opts.yMax : (vals.length ? Math.max.apply(null, vals) : 1);
  const d = niceTicks(0, Math.max(maxV, 1), 5);
  const n = opts.items.length;
  const band = plotW / Math.max(1, n);
  const barW = Math.min(24, band * 0.55);
  const Y = v => padT + plotH * (1 - (v - d.lo) / (d.hi - d.lo));
  let g = '';
  for (const t of d.ticks) {
    const y = Y(t);
    g += `<line x1="${padL}" y1="${y}" x2="${W - padR}" y2="${y}" stroke="${pal.grid}" stroke-width="1"/>`;
    g += `<text x="${padL - 8}" y="${y + 4}" text-anchor="end" font-size="11" fill="${pal.muted}">${t}</text>`;
  }
  g += `<line x1="${padL}" y1="${padT + plotH}" x2="${W - padR}" y2="${padT + plotH}" stroke="${pal.axis}" stroke-width="1"/>`;
  const base = Y(d.lo);
  opts.items.forEach((it, i) => {
    const cx = padL + band * (i + 0.5);
    if (it.value != null) {
      const y = Y(it.value), hgt = Math.max(2, base - y);
      const r = Math.min(4, barW / 2, hgt);
      g += `<path d="M${cx - barW / 2} ${base} L${cx - barW / 2} ${y + r} Q${cx - barW / 2} ${y} ${cx - barW / 2 + r} ${y} L${cx + barW / 2 - r} ${y} Q${cx + barW / 2} ${y} ${cx + barW / 2} ${y + r} L${cx + barW / 2} ${base} Z" fill="${pal.accent}"/>`;
      g += `<text x="${cx}" y="${y - 6}" text-anchor="middle" font-size="11" font-weight="600" fill="${pal.ink}">${fmt(it.value)}</text>`;
    }
    g += `<text x="${cx}" y="${H - 8}" text-anchor="middle" font-size="11" fill="${pal.muted}">${esc(it.label)}</text>`;
    g += `<rect x="${cx - band / 2}" y="${padT}" width="${band}" height="${plotH}" fill="transparent" data-i="${i}" style="cursor:default"/>`;
  });
  const holder = h('div', { html: `<svg class="bar" viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(opts.title)}">${g}</svg>` });
  const svgEl = holder.firstChild;
  svgEl.querySelectorAll('rect[data-i]').forEach(rc => {
    rc.addEventListener('pointermove', ev => {
      const it = opts.items[+rc.getAttribute('data-i')];
      showTT(ev.clientX, ev.clientY, it.label, [{ color: pal.accent, name: opts.unit || '', value: it.value == null ? '—' : fmt(it.value) + (opts.valueSuffix || '') }]);
    });
    rc.addEventListener('pointerleave', hideTT);
  });
  // 表格孪生
  let asTable = false, curEl = null;
  const head = h('div', { class: 'chart-head' },
    h('h3', { text: opts.title }),
    opts.sub ? h('span', { class: 'cs', text: opts.sub }) : null,
    h('span', { class: 'tw' }, h('button', {
      class: 'btn', text: asTable ? '返回图表' : '表格视图',
      onclick: () => { asTable = !asTable; rerenderBar(); },
    })));
  function rerenderBar() {
    head.querySelector('.tw button').textContent = asTable ? '返回图表' : '表格视图';
    const next = asTable
      ? h('div', { class: 'tscroll' }, h('table', { class: 'tb' },
        h('thead', {}, h('tr', {}, h('th', { text: '科目' }), h('th', { text: opts.unit || '均分' }))),
        h('tbody', {}, opts.items.map(it => h('tr', {}, h('td', { text: it.label }), h('td', { text: it.value == null ? '—' : fmt(it.value) })))))
      )
      : holder;
    if (curEl && curEl.parentNode) curEl.parentNode.replaceChild(next, curEl);
    else if (curEl) head.parentNode.insertBefore(next, head.nextSibling);
    curEl = next;
  }
  return h('div', { class: 'card' }, head, holder);
}

/* ---------- sparkline ---------- */
function sparkline(values, color, invert) {
  const pal = P();
  const w = 84, hgt = 26, pad = 3;
  const pts = values.filter(v => v != null);
  if (pts.length < 2) return h('span', { class: 'hint', text: pts.length ? String(fmt(pts[0])) : '—' });
  const min = Math.min.apply(null, pts), max = Math.max.apply(null, pts);
  const span = max - min || 1;
  const X = i => pad + (w - pad * 2) * i / (values.length - 1);
  const Y = v => {
    const t = (v - min) / span;
    return invert ? pad + (hgt - pad * 2) * t : pad + (hgt - pad * 2) * (1 - t);
  };
  let dstr = '', pen = false, last = null;
  values.forEach((v, i) => {
    if (v == null) { pen = false; return; }
    dstr += (pen ? 'L' : 'M') + X(i).toFixed(1) + ' ' + Y(v).toFixed(1) + ' ';
    pen = true; last = { x: X(i), y: Y(v) };
  });
  const svg = `<svg width="${w}" height="${hgt}" viewBox="0 0 ${w} ${hgt}" aria-hidden="true">
    <path d="${dstr}" fill="none" stroke="${pal.demph}" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round"/>
    ${last ? `<circle cx="${last.x}" cy="${last.y}" r="2.6" fill="${color}" stroke="${pal.surface}" stroke-width="1.5"/>` : ''}
  </svg>`;
  return h('span', { html: svg });
}

/* --- 调用 OpenAI 兼容 API（流式） --- */
async function callAI(cfg, messages, onDelta) {
  const url = cfg.base.replace(/\/+$/, '') + '/chat/completions';
  const res = await fetch(url, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + cfg.key },
    body: JSON.stringify({ model: cfg.model, messages, stream: true, temperature: 0.6 }),
  });
  if (!res.ok || !res.body) {
    let detail = '';
    try { detail = (await res.text()).slice(0, 300); } catch (e) { /* ignore */ }
    const map = { 401: 'API Key 无效或已过期', 402: '账户余额不足', 403: '没有权限（模型名写错了？）', 429: '请求太频繁或欠费限流' };
    throw new Error(`HTTP ${res.status}${map[res.status] ? '：' + map[res.status] : ''}${detail ? '｜' + detail : ''}`);
  }
  const reader = res.body.getReader();
  const dec = new TextDecoder();
  let buf = '';
  for (;;) {
    const { done, value } = await reader.read();
    if (done) break;
    buf += dec.decode(value, { stream: true });
    const lines = buf.split('\n');
    buf = lines.pop();
    for (const ln of lines) {
      const m = ln.match(/^data:\s*(.+)$/);
      if (!m) continue;
      if (m[1].trim() === '[DONE]') return;
      try {
        const j = JSON.parse(m[1]);
        const d = j.choices && j.choices[0] && j.choices[0].delta && j.choices[0].delta.content;
        if (d) onDelta(d);
      } catch (e) { /* 非 JSON 行忽略 */ }
    }
  }
}
async function testAiCfg(cfg) {
  const url = cfg.base.replace(/\/+$/, '') + '/chat/completions';
  const res = await fetch(url, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + cfg.key },
    body: JSON.stringify({ model: cfg.model, messages: [{ role: 'user', content: '回复"ok"两个字母即可' }], max_tokens: 8, stream: false }),
  });
  if (!res.ok) {
    const map = { 401: 'API Key 无效或已过期', 402: '账户余额不足', 404: '接口地址或模型名不对', 429: '请求太频繁或欠费限流' };
    throw new Error(`HTTP ${res.status}${map[res.status] ? '：' + map[res.status] : ''}`);
  }
  const j = await res.json();
  return j.choices && j.choices[0] && j.choices[0].message ? j.choices[0].message.content : '';
}

function loadData() {

  const prof = data.profiles[ui.student] || (data.profiles[ui.student] = { goal: '', notes: '' });
  main.append(h('div', { class: 'card' },
    h('h2', { text: '背景档案' }),
    h('p', { class: 'sub', text: '选填。写上目标和老师掌握的情况，AI 分析会结合这些信息，规则版建议不受影响。' }),
    h('div', { class: 'entry-cols' },
      h('label', { class: 'fld' }, '目标（如：冲一本 / 苏州大学 / 保二本）',
        h('input', { type: 'text', value: prof.goal, placeholder: '选填', oninput: ev => { prof.goal = ev.target.value; saveData(); } })),

        h('textarea', { style: 'min-height:64px', placeholder: '选填', oninput: ev => { prof.notes = ev.target.value; saveData(); } }, prof.notes)))));

  const briefCtx = {
    name: ui.student, cls: row.cls, examNames, rows: hist,
    line1: computed[latestIdx].stats.line1, line2: computed[latestIdx].stats.line2,
    profile: prof,
    subjEvals: adviceItems.map(it => ({
      name: it.s.name, score: it.ev.score, max: it.s.max, rate: it.ev.rate, rank: it.ev.rank,
      schoolAvg: computed[latestIdx].stats.subjAvg[it.s.key], vsSchool: it.ev.vsSchool, trendDelta: it.ev.trendDelta,
    })),
    ruleAdvice: adviceItems.map(it => ({ name: it.s.name, text: it.a.text })),
  };
  const briefMd = studentBriefMd(briefCtx);
  const aiMsg = h('div', { class: 'msg' });
  const aiText = h('div', {
    style: 'white-space:pre-wrap;margin-top:10px;font-size:13px;line-height:1.75;color:var(--ink-2);' +
      'max-height:520px;overflow:auto;border:1px solid var(--grid);border-radius:8px;padding:12px 14px;display:none',
  });
  if (aiOut.name === ui.student && aiOut.text) { aiText.style.display = 'block'; aiText.textContent = aiOut.text; }
  const genBtn = h('button', {
    class: 'btn primary', text: '生成 AI 深度分析',
    onclick: async () => {
      if (!aiCfg.key) { aiMsg.className = 'msg err'; aiMsg.textContent = '还没配置 API：请先到「设置」页选择服务商并填入 API Key。'; return; }
      if (aiOut.running) return;
      aiOut = { name: ui.student, text: '', running: true };
      genBtn.disabled = true; genBtn.textContent = '分析中…';
      aiMsg.className = 'msg'; aiMsg.textContent = '正在获取分析（流式输出，可能要几十秒）…';
      aiText.style.display = 'block'; aiText.textContent = '';
      try {
        const msgs = buildAnalysisPrompt(briefMd);
        await callAI(aiCfg, [{ role: 'system', content: msgs.system }, { role: 'user', content: msgs.user }], d => {
          aiOut.text += d;
          aiText.textContent = aiOut.text;
          aiText.scrollTop = aiText.scrollHeight;
        });
        aiMsg.className = 'msg ok';
        aiMsg.textContent = '完成。内容由 AI 生成，请老师把关后再用于谈话。';
      } catch (e) {
        aiMsg.className = 'msg err';
        aiMsg.textContent = '生成失败：' + e.message + '。若是跨域/网络问题，可换一家服务商，或点「复制简报」自己贴给任意 AI。';
      } finally {
        aiOut.running = false; genBtn.disabled = false; genBtn.textContent = '生成 AI 深度分析';
      }
    },
  });
  main.append(h('div', { class: 'card' },
    h('h2', { text: 'AI 深度分析' }),
    h('p', { class: 'sub', text: '把该生全部数据 + 背景档案发给你在「设置」里配置的 AI，流式生成逐生定制的分析。费用由你的 API 账户承担，单次约几分钱。' }),
    h('div', { class: 'row', style: 'gap:8px' },
      genBtn,
      h('button', {
        class: 'btn', text: '复制简报',
        onclick: async ev => { ev.target.textContent = (await copyText(briefMd)) ? '已复制 ✓' : '复制失败'; setTimeout(() => { ev.target.textContent = '复制简报'; }, 1500); },
      }),
      h('button', {
        class: 'btn', text: '复制分析结果',
        onclick: async ev => { ev.target.textContent = (await copyText(aiOut.text)) ? '已复制 ✓' : '先生成再复制'; setTimeout(() => { ev.target.textContent = '复制分析结果'; }, 1500); },
      })),
    aiMsg, aiText));

  // 历次明细表
  const tbl = h('table', { class: 'tb' });
  tbl.append(h('thead', {}, h('tr', {}, ['考试', ...SUBJECTS.map(s => s.name), '总分', '年级', '班内', '较上场', '上线'].map(t => h('th', { text: t })))));
  tbl.append(h('tbody', {}, hist.map((r, i) => {
    if (!r) return h('tr', {}, h('td', { text: examNames[i] }), h('td', { colspan: 10, style: 'text-align:center;color:var(--muted)', text: '本场无记录' }));
    return h('tr', {},
      h('td', { text: examNames[i] }),
      SUBJECTS.map(s => h('td', { text: r.subj[s.key] == null ? '—' : fmt(r.subj[s.key]) })),
      h('td', { text: fmt(r.total) }), h('td', { text: fmt(r.totalRank) }), h('td', { text: fmt(r.classRank) }),
      h('td', { class: r.trend || '', text: r.totalDelta == null ? '—' : (r.totalDelta > 0 ? '↑ +' + r.totalDelta : r.totalDelta < 0 ? '↓ ' + r.totalDelta : '持平') }),
      h('td', { text: r.lineStatus || '—' }));
  })));
  main.append(h('div', { class: 'card' }, h('h2', { text: '历次明细' }), h('div', { class: 'tscroll' }, tbl)));
}

function renderImportPreview(exam) {
  const pv = entryPreview;
  if (!pv || pv.examIdx !== ui.examIdx) return null;
  const blockedByYearRank = !!(pv.meta && pv.meta.requireYearRank && pv.meta.missingYearRank > 0);
  const wrap = h('div', { class: 'banner', id: 'importPreview', style: 'border-left-color:var(--accent);margin-top:14px' });

  wrap.append(h('div', { style: 'display:flex;align-items:center;gap:8px;flex-wrap:wrap' },
    h('strong', { text: '整理结果预览' }),
    h('span', { class: 'tag good', text: `识别 ${pv.students.length} 人` }),
    pv.meta && pv.meta.skipped ? h('span', { class: 'tag', text: `跳过 ${pv.meta.skipped} 行` }) : null,
    pv.meta && pv.meta.filledClass ? h('span', { class: 'tag', text: `补班级 ${pv.meta.filledClass} 行` }) : null,
    pv.meta && pv.meta.missingYearRank ? h('span', { class: 'tag crit', text: `缺年排 ${pv.meta.missingYearRank} 人` })
      : (pv.meta && pv.meta.yearRankColumn ? h('span', { class: 'tag good', text: '官方年排已就绪' }) : null),
    pv.errors.length ? h('span', { class: 'tag crit', text: `${pv.errors.length} 个待确认` }) : h('span', { class: 'tag good', text: '无异常' })));

  if (pv.notes.length) {
    wrap.append(h('ul', { style: 'margin:8px 0 0;padding-left:20px;color:var(--ink-2);font-size:12px;line-height:1.8' },
      pv.notes.map(t => h('li', { text: t }))));
  }

  if (pv.errors.length) {
    wrap.append(h('div', { class: 'banner crit', style: 'margin-top:10px' },
      h('div', { style: 'font-weight:600', text: `需要核对（显示前 ${Math.min(10, pv.errors.length)} 条）：` }),
      h('ul', {}, pv.errors.slice(0, 10).map(t => h('li', { text: t }))),
      pv.errors.length > 10 ? h('div', { class: 'hint', text: `还有 ${pv.errors.length - 10} 条，建议先修正源表再导入。` }) : null));
  }

  const cols = [
    ['姓名', 'name'], ['班级', 'cls'], ['年排', 'yearRank'], ['语文', 'chinese'], ['数学', 'math'], ['英语', 'english'],
    ['物理', 'physics'], ['化学', 'chem'], ['地理', 'geo'], ['化赋', 'chemScore'], ['地赋', 'geoScore'],
  ];
  const tbl = h('table', { class: 'tb' });
  tbl.append(h('thead', {}, h('tr', {}, cols.map(c => h('th', { text: c[0] })))));
  tbl.append(h('tbody', {}, pv.students.slice(0, 200).map(s => h('tr', {},
    cols.map(([, key]) => h('td', { text: s[key] == null || s[key] === '' ? '—' : s[key] }))))));
  wrap.append(h('div', { class: 'tscroll', style: 'margin-top:10px;max-height:320px' }, tbl));
  if (pv.students.length > 200) wrap.append(h('p', { class: 'hint', text: `预览仅显示前 200 人，实际会导入全部 ${pv.students.length} 人。` }));

  wrap.append(h('div', { class: 'row', style: 'margin-top:12px;gap:8px;align-items:center' },
    h('button', {
      class: 'btn primary',
      text: blockedByYearRank ? '补齐年级排名后才能导入'
        : (pv.students.length ? `确认导入 ${pv.students.length} 人` : '没有可导入的学生'),
      disabled: pv.students.length && !blockedByYearRank ? null : '',
      onclick: () => {
        if (!pv.students.length || blockedByYearRank) return;
        const parts = [];
        if (exam.students.length) parts.push(`覆盖原有 ${exam.students.length} 人`);
        if (pv.errors.length) parts.push(`${pv.errors.length} 个待确认问题`);
        if (parts.length && !confirm(`确认导入 ${pv.students.length} 人（${parts.join('，')}）？`)) return;
        exam.students = pv.students.map(s => ({
          name: s.name, cls: s.cls || '', yearRank: s.yearRank,
          chinese: s.chinese, math: s.math, english: s.english,
          physics: s.physics, chem: s.chem, geo: s.geo,
          chemScore: s.chemScore, geoScore: s.geoScore,
        }));
        data.isSample = false;
        entryNotice = `已导入 ${pv.students.length} 名学生到「${exam.name}」（年级排名采用学校官方年排）。`;
        entryPreview = null;
        entryText = '';
        saveData();
        render();
      },
    }),
    h('button', { class: 'btn', text: '取消', onclick: () => { entryPreview = null; render(); } }),
    blockedByYearRank
      ? h('span', { class: 'hint', style: 'color:var(--critical)', text: '年级排名为必填：补齐后才会启用导入。' })
      : h('span', { class: 'hint', text: '重名会提示；前后对比按姓名匹配。' })));
  return wrap;
}

function lineTag(r) {
  if (!r.lineStatus) return null;
  const cls = r.lineStatus === '一本线上' ? 'good' : r.lineStatus === '未上线' ? 'crit' : '';
  return h('span', { class: 'tag ' + cls, text: (r.lineStatus === '一本线上' ? '✓ ' : r.lineStatus === '未上线' ? '⚠ ' : '') + r.lineStatus });
}

/* ---------- 录入 ---------- */
function renderEntry() {
  if (entryPreview && entryPreview.examIdx !== ui.examIdx) { entryPreview = null; entryText = ''; }
  if (data.isSample) {
    main.append(h('div', { class: 'banner' },
      h('div', { text: '当前显示的是示例数据（44 名虚拟学生 × 3 次考试），用来演示功能。' }),
      h('div', { class: 'row', style: 'margin-top:8px' },
        h('button', {
          class: 'btn primary', text: '清空示例，开始录入',
          onclick: () => { if (confirm('清空全部示例数据，创建一场空考试？')) { data = { settings: data.settings, exams: [{ name: '考试1', line1: data.settings.line1, line2: data.settings.line2, students: [] }], isSample: false, profiles: {} }; saveData(); ui.examIdx = 0; render(); } },

    h('div', { class: 'row', style: 'gap:8px;align-items:center' },
      data.exams.map((ex, i) => h('button', {
        class: 'chip' + (i === ui.examIdx ? ' on' : ''), text: ex.name,
        onclick: () => { ui.examIdx = i; entryText = ''; entryPreview = null; entryNotice = ''; render(); },
      })),
      h('button', {
        class: 'btn', text: '＋ 新建考试',
        onclick: () => { data.exams.push({ name: '考试' + (data.exams.length + 1), line1: data.settings.line1, line2: data.settings.line2, students: [] }); data.isSample = false; ui.examIdx = data.exams.length - 1; entryText = ''; entryPreview = null; entryNotice = ''; saveData(); render(); },
      }))));

  const exam = data.exams[ui.examIdx];
  if (!exam) return;

  // 基本信息
  main.append(h('div', { class: 'card' },
    h('h2', { text: '本场设置' }),
    h('div', { class: 'entry-cols', style: 'margin-top:10px' },
      h('label', { class: 'fld' }, '考试名称',
        h('input', { type: 'text', value: exam.name, oninput: ev => { exam.name = ev.target.value; data.isSample = false; saveData(); } })),
      h('label', { class: 'fld' }, '本一线',
        h('input', { type: 'number', value: exam.line1 == null ? data.settings.line1 : exam.line1, oninput: ev => { exam.line1 = ev.target.value === '' ? null : Number(ev.target.value); saveData(); } })),
      h('label', { class: 'fld' }, '本二线',
        h('input', { type: 'number', value: exam.line2 == null ? data.settings.line2 : exam.line2, oninput: ev => { exam.line2 = ev.target.value === '' ? null : Number(ev.target.value); saveData(); } })),
      h('div', { class: 'row', style: 'align-items:flex-end;gap:8px' },
        h('button', {
          class: 'btn danger', text: '删除本场',
          onclick: () => {
            if (!confirm(`删除「${exam.name}」及其 ${exam.students.length} 条成绩？`)) return;
            data.exams.splice(ui.examIdx, 1); ui.examIdx = Math.max(0, ui.examIdx - 1);
            entryText = ''; entryPreview = null; entryNotice = '';
            saveData(); render();
          },
        })))));

  // 粘贴导入
  const previewHost = h('div');
  const msg = h('div', { class: 'msg' });
  const ta = h('textarea', {
    class: 'paste',
    placeholder: '从 Excel / WPS 直接复制粘贴，格式不用统一。\n支持：标题行、有/无表头、序号/学号/总分等多余列、汇总行、空班级、全角数字、缺考。\n标准列：姓名 班级 年级排名（必填） 语文 数学 英语 物理 化学 地理 [化学赋分 地理赋分]\n整理完会先显示预览，确认后再覆盖本场。',
  }, entryText);
  ta.addEventListener('input', () => {
    entryText = ta.value;
    entryNotice = '';
    msg.className = 'msg';
    msg.textContent = '';
    if (entryPreview) { entryPreview = null; previewHost.innerHTML = ''; }
  });

  function rosterForTemplate() {
    const take = ex => ex.students.map(s => ({ name: s.name, cls: s.cls || '' }));
    if (exam.students.length) return take(exam);
    for (let i = ui.examIdx - 1; i >= 0; i--) if (data.exams[i].students.length) return take(data.exams[i]);
    for (let i = ui.examIdx + 1; i < data.exams.length; i++) if (data.exams[i].students.length) return take(data.exams[i]);
    return [];
  }
  function downloadTemplate(withRoster) {
    const roster = withRoster ? rosterForTemplate() : [];
    const csv = buildTemplateCsv(roster);
    const tag = withRoster && roster.length ? '-名单' : '-空白';
    downloadTextFile(`成绩导入模板-${safeFileName(exam.name)}${tag}.csv`, csv);
    if (withRoster && !roster.length) {
      msg.className = 'msg err';
      msg.textContent = '还没有可用名单，已改为下载空白模板。';
    } else {
      msg.className = 'msg ok';
      msg.textContent = withRoster

      h('div', { class: 'tscroll' }, tbl)));

  // 备份
  main.append(h('div', { class: 'card' },
    h('h2', { text: '数据备份' }),

      h('button', {
        class: 'btn', text: '导出本场成绩 CSV',

      h('button', {
        class: 'btn', text: '重载示例数据',
        onclick: () => { if (confirm('用示例数据覆盖当前全部内容？')) { data = { settings: defaultSettings(), exams: generateSample(), isSample: true, profiles: {} }; saveData(); ui.examIdx = 0; ui.student = ''; render(); } },
      }))));
}

/* ---------- 设置 ---------- */
function renderSettings() {
  const b = data.settings.bands;
  main.append(h('div', { class: 'card' },
    h('h2', { text: '等级赋分规则' }),
    h('p', { class: 'sub', text: '默认为辽宁 / 八省联考式 5 档（A15% B35% C35% D13% E2%）。江苏 3+1+2 同比例；如学校口径不同，改这里后全表自动重算。档内按线性插值，赋分取整。' }),
    (() => {
      const tbl = h('table', { class: 'tb set-tbl' });
      tbl.append(h('thead', {}, h('tr', {}, ['等级', '比例 %', '赋分下限', '赋分上限'].map(t => h('th', { text: t })))));
      tbl.append(h('tbody', {}, b.map((band, i) => h('tr', {},
        h('td', { text: band.name }),
        h('td', {}, h('input', { type: 'number', value: band.pct, min: '0', max: '100', oninput: ev => { band.pct = Number(ev.target.value) || 0; saveData(); } })),
        h('td', {}, h('input', { type: 'number', value: band.min, min: '30', max: '100', oninput: ev => { band.min = Number(ev.target.value); saveData(); } })),
        h('td', {}, h('input', { type: 'number', value: band.max, min: '30', max: '100', oninput: ev => { band.max = Number(ev.target.value); saveData(); } }))))));
      const sum = b.reduce((a, x) => a + (Number(x.pct) || 0), 0);
      return h('div', {}, h('div', { class: 'tscroll' }, tbl),
        h('p', { class: 'hint', style: 'margin:8px 0 0', text: '比例合计：' + sum + '%' + (Math.abs(sum - 100) > 0.01 ? '（建议调到 100%）' : ' ✓') }));
    })()));

  main.append(h('div', { class: 'card' },
    h('h2', { text: '默认分数线' }),
    h('p', { class: 'sub', text: '新建考试时自动带入；每场考试可在「成绩录入」里单独改。' }),
    h('div', { class: 'entry-cols' },
      h('label', { class: 'fld' }, '本一线', h('input', { type: 'number', value: data.settings.line1, oninput: ev => { data.settings.line1 = Number(ev.target.value) || 0; saveData(); } })),
      h('label', { class: 'fld' }, '本二线', h('input', { type: 'number', value: data.settings.line2, oninput: ev => { data.settings.line2 = Number(ev.target.value) || 0; saveData(); } })))));

  // AI 深度分析配置
  const aiMsg = h('div', { class: 'msg' });
  const baseIn = h('input', { type: 'text', value: aiCfg.base, placeholder: 'https://…/v1', oninput: ev => { aiCfg.base = ev.target.value.trim(); saveAiCfg(); } });
  const modelIn = h('input', { type: 'text', value: aiCfg.model, placeholder: '模型名', oninput: ev => { aiCfg.model = ev.target.value.trim(); saveAiCfg(); } });
  main.append(h('div', { class: 'card' },
    h('h2', { text: 'AI 深度分析（学生页使用）' }),
    h('p', { class: 'sub', text: 'API Key 由老师自己填写，只保存在这台电脑的浏览器里，不会出现在导出的 JSON 备份中。建议在服务商后台建一个设了消费限额的子 key。' }),
    h('div', { class: 'entry-cols', style: 'margin-top:10px' },
      h('label', { class: 'fld' }, '服务商',
        h('select', {
          onchange: ev => {
            aiCfg.provider = ev.target.value;
            const p = AI_PROVIDERS[aiCfg.provider];
            if (p && aiCfg.provider !== 'custom') { aiCfg.base = p.base; aiCfg.model = p.model; }
            saveAiCfg(); render();
          },
        }, Object.keys(AI_PROVIDERS).map(k =>
          h('option', { value: k, selected: aiCfg.provider === k ? '' : null }, AI_PROVIDERS[k].name)))),
      h('label', { class: 'fld' }, 'API Key（只存在本机）',
        h('input', { type: 'password', value: aiCfg.key, placeholder: 'sk-…', autocomplete: 'off', oninput: ev => { aiCfg.key = ev.target.value.trim(); saveAiCfg(); } }))),
    h('div', { class: 'entry-cols', style: 'margin-top:10px' },
      h('label', { class: 'fld' }, '接口地址', baseIn),
      h('label', { class: 'fld' }, '模型名', modelIn)),
    h('div', { class: 'row', style: 'margin-top:12px;gap:8px' },
      h('button', {
        class: 'btn', text: '测试连接',
        onclick: async ev => {
          if (!aiCfg.key || !aiCfg.base || !aiCfg.model) { aiMsg.className = 'msg err'; aiMsg.textContent = '服务商、接口地址、模型名、Key 都要填。'; return; }
          ev.target.disabled = true; aiMsg.className = 'msg'; aiMsg.textContent = '测试中…';
          try {
            const r = await testAiCfg(aiCfg);
            aiMsg.className = 'msg ok';
            aiMsg.textContent = '连接成功' + (r ? '，模型回复：' + String(r).slice(0, 40) : ' ✓');
          } catch (e) {
            aiMsg.className = 'msg err';
            aiMsg.textContent = '连接失败：' + e.message;
          } finally { ev.target.disabled = false; }
        },
      }),
      h('button', {
        class: 'btn danger', text: '清除本机 Key',
        onclick: () => { aiCfg.key = ''; saveAiCfg(); render(); },
      })),
    aiMsg,
    h('p', { class: 'hint', style: 'margin:12px 0 0' },
      '已实测支持浏览器直连：DeepSeek、通义、Kimi。智谱、OpenAI 不支持直连（会被浏览器拦截），' +
      '如一定要用，请在「自定义」里填支持 CORS 的中转地址。')));

  main.append(h('div', { class: 'card' },
    h('h2', { text: '口径说明' }),
    h('ul', { style: 'margin:8px 0 0;padding-left:20px;color:var(--ink-2);font-size:13px;line-height:1.9' },
      h('li', { text: '总分 = 语文 + 数学 + 英语 + 物理 + 化学赋分 + 地理赋分，满分 750。' }),
      h('li', { text: '「年级排名」为导入必填项，直接采用学校官方年排；未填写会阻止导入。' }),
      h('li', { text: '单科名次、班内排名按录入名单计算；年级排名采用学校官方年排。' }),
      h('li', { text: '赋分按本场考试中该科有成绩的学生排位；要算准，需要录全年级选考该科的学生。' }),
      h('li', { text: '学校已给赋分时，在导入表里加「化学赋分 地理赋分」两列覆盖即可；没有则按设置里的等级规则自动赋分。' }),
      h('li', { text: '边界同分若被分进不同档，以学校赋分为准（用覆盖列）。重名学生请在姓名后加后缀区分。' }))));
}

/* ================================================================
   启动
   ================================================================ */
document.getElementById('tabs').addEventListener('click', ev => {
  const b = ev.target.closest('button[data-tab]');
  if (!b) return;
  ui.tab = b.dataset.tab;
  render();
});
document.getElementById('themeBtn').addEventListener('click', () => {
  const next = isDark() ? 'light' : 'dark';
  document.documentElement.setAttribute('data-theme', next);
  try { localStorage.setItem(LS_THEME, next); } catch (e) { /* ignore */ }
  render();
});
(function initTheme() {
  try {
    const t = localStorage.getItem(LS_THEME);
    if (t === 'light' || t === 'dark') document.documentElement.setAttribute('data-theme', t);
  } catch (e) { /* ignore */ }
})();
data = loadData();
aiCfg = loadAiCfg();
(function initRoute() {
  const hm = location.hash.slice(1).split('|');
  if (hm[0] && ['overview', 'student', 'entry', 'settings'].includes(hm[0])) ui.tab = hm[0];
  if (ui.tab === 'student' && hm[1]) { try { ui.student = decodeURIComponent(hm[1]); } catch (e) { /* ignore */ } }
})();
render();
</script>
</body>
</html>
