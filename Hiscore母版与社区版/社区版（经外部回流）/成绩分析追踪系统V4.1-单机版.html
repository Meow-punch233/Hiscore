  /* ---------- 启动异步部分 ---------- */
  async init() {
    this._booted = true;
    if (!this.READ_ONLY) {
      await this.openDB();
      await this.listSnaps();
      if (ui.tab === 'settings') render();
      return;
    }
    // 手机只读版：自包含内嵌数据优先（file:// 离线可用，无需联网、不依赖服务器）
    if (window.__V41_DATA__) {
      try { this.SNAP_TS = (window.__V41_DATA__.ts || '') || this.SNAP_TS || ''; } catch (e) {}
      document.body.classList.remove('v41-ro-stale');
      render();
      return;
    }
    // 固定网址 + 快照文件模式：拉取最新快照（只更新 snapshot.json 即可）
    try {
      const url = this.SNAP_URL + (this.SNAP_URL.indexOf('?') >= 0 ? '&' : '?') + 't=' + Date.now();
      const res = await fetch(url, { cache: 'no-store' });
      if (!res.ok) throw new Error('HTTP ' + res.status);
      const j = await res.json();
      if (!j || !j.data || !Array.isArray(j.data.exams)) throw new Error('快照格式不对');
      data = this.normalize(j.data);
      this.SNAP_TS = j.ts || '';
      try { sessionStorage.setItem('aki-v41-ro-cache', JSON.stringify(j)); } catch (e) {}
      document.body.classList.remove('v41-ro-stale');
      render();
      myAlert('已获取最新数据' + (this.SNAP_TS ? '（' + this.SNAP_TS + '）' : ''));
    } catch (e) {
      let ok = false;
      try {
        const c = JSON.parse(sessionStorage.getItem('aki-v41-ro-cache') || 'null');

      const staleText = ok ? '离线 · 显示上次缓存，非最新' : '离线 · 暂无缓存数据';
      if (stale) stale.textContent = staleText;

/* --- 自绘确认框：手机 WebView 不弹原生 confirm 的兜底 --- */
function myConfirm(msg, okText) {
  if (typeof V41 !== 'undefined' && V41.READ_ONLY) return Promise.resolve(false);
  return new Promise(resolve => {
    const mask = h('div', { class: 'v41-mask' });
    const box = h('div', { class: 'v41-dialog', role: 'dialog', 'aria-modal': 'true' });
    box.append(h('div', { class: 'v41-dlg-title', text: '请确认' }),
      h('div', { class: 'v41-dlg-msg', text: msg }));
    let done = false;
    const finish = v => { if (done) return; done = true; mask.remove(); document.removeEventListener('keydown', onKey); resolve(v); };
    const onKey = e => { if (e.key === 'Escape') finish(false); else if (e.key === 'Enter') finish(true); };
    const ok = h('button', { class: 'btn primary', text: okText || '确认', onclick: () => finish(true) });
    box.append(h('div', { class: 'v41-dlg-bar' },
      h('button', { class: 'btn', text: '取消', onclick: () => finish(false) }), ok));
    mask.append(box);
    mask.addEventListener('click', e => { if (e.target === mask) finish(false); });
    document.body.append(mask);
    document.addEventListener('keydown', onKey);
    setTimeout(() => { try { ok.focus(); } catch (e) {} }, 30);
  });
}
function myAlert(msg) {
  const old = document.querySelector('.v41-toast');
  if (old) old.remove();
  const t = h('div', { class: 'v41-toast', text: String(msg) });
  document.body.append(t);
  clearTimeout(V41.toastTimer);
  V41.toastTimer = setTimeout(() => t.remove(), 3200);
}


/* ================================================================
   V4.1 扩展模块 ②：考试日期 / 目标总分 / 跨场跨度
   ================================================================ */
Object.assign(V41, {
  examLabel(ex, i) { return (ex.name || ('第' + (i + 1) + '场')) + (ex.date ? '（' + ex.date + '）' : ''); },
  chipLabel(ex, i) { return (ex.name || ('第' + (i + 1) + '场')) + (ex.date ? ' · ' + String(ex.date).slice(5) : ''); },
  axisLabel(ex, i) { return ex.date ? String(ex.date).slice(5) : (ex.name || ('第' + (i + 1) + '场')); },
  spanText(exams, ei) {
    const cur = exams[ei];
    if (!cur) return '';
    if (!cur.date) return '';
    let t = ' · ' + cur.date;
    if (ei > 0 && exams[ei - 1] && exams[ei - 1].date) {
      const a = new Date(cur.date + 'T00:00:00'), b = new Date(exams[ei - 1].date + 'T00:00:00');
      const days = Math.round((a - b) / 86400000);
      if (isFinite(days)) t += '（距上场 ' + days + ' 天）';
    }
    return t;
  },
  /* 目标线：数值目标优先，否则本一线兜底 */
  goalFor(prof, line1) {
    const v = prof && prof.goalScore;
    return (typeof v === 'number' && isFinite(v) && v > 0) ? v : line1;
  },
  profileKey(row, studentUiKey) { return row && row.studentId ? 'id:' + row.studentId : studentUiKey; },
  /* 跨场目标跟踪：每场距目标线差、是否达标、趋势 */
  goalTrack(computed, key, line1) {
    const hist = studentHistory(computed, key);
    const out = [];
    let lastGap = null;
    for (let i = 0; i < hist.length; i++) {
      const r = hist[i];
      if (!r) { out.push(null); continue; }
      const st = computed[i] && computed[i].stats ? computed[i].stats : { line1 };
      const prof = (data.profiles || {})[this.profileKey(r, key)] || null;
      const target = this.goalFor(prof, st.line1 != null ? st.line1 : line1);
      const gap = r.total == null ? null : Math.round((r.total - target) * 10) / 10;
      out.push({ examIdx: i, name: (data.exams[i] || {}).name || ('第' + (i + 1) + '场'),
        date: (data.exams[i] || {}).date || '', total: r.total, target, gap,
        reached: gap == null ? null : gap >= 0,
        delta: (gap == null || lastGap == null) ? null : Math.round((gap - lastGap) * 10) / 10 });
      if (gap != null) lastGap = gap;
    }
    const valid = out.filter(Boolean);
    const last = valid.length ? valid[valid.length - 1] : null;
    return { points: out, last, reached: last ? last.reached : null,
      improving: valid.length >= 2 && valid[valid.length - 1].delta != null ? valid[valid.length - 1].delta > 0 : null };
  },
});

  /* ---------- 班级横向对比（1~N 班自适应） ---------- */
  classCompareCard(computed, ei) {
    const cur = computed[ei], st = cur.stats, prev = ei > 0 ? computed[ei - 1] : null;
    const byCls = new Map();
    for (const r of (cur.rows || [])) {
      const k = r.cls || '未分班';
      if (!byCls.has(k)) byCls.set(k, []);
      byCls.get(k).push(r);
    }
    const names = Array.from(byCls.keys()).sort((a, b) => a.localeCompare(b, 'zh'));
    const prevById = new Map(prev ? (prev.rows || []).map(r => [r.id, r]) : []);
    const subjKeys = [];
    const seen = new Set();
    for (const r of (cur.rows || [])) for (const k of (r.subjectKeys || [])) if (!seen.has(k)) { seen.add(k); subjKeys.push(k); }
    subjKeys.sort((a, b) => SUBJECT_ORDER.indexOf(a) - SUBJECT_ORDER.indexOf(b));
    const items = names.map(name => {
      const g = byCls.get(name).filter(r => r.total != null);
      const avgT = g.length ? g.reduce((a, r) => a + r.total, 0) / g.length : null;
      let up = 0, down = 0;
      for (const r of g) {
        const p = prevById.get(r.id);
        if (p && p.total != null && r.totalDelta != null) { if (r.totalDelta > 0) up++; else if (r.totalDelta < 0) down++; }
      }
      const subj = {};
      for (const k of subjKeys) {
        const vs = byCls.get(name).map(r => r.subj[k]).filter(v => v != null);
        subj[k] = vs.length ? vs.reduce((a, b) => a + b, 0) / vs.length : null;
      }
      return { name, n: g.length, total: byCls.get(name).length, avgT,
        l1: g.length ? g.filter(r => r.total >= st.line1).length / g.length : null,
        l2: g.length ? g.filter(r => r.total >= st.line2).length / g.length : null, up, down, subj };

      h('div', { class: 'v41-bar' },
        h('button', { class: 'btn v41-write', text: '⬇ 导出跟踪名单 CSV', onclick: doExport })));
  },

  /* ---------- 手机：学科卡默认只展开最弱 3 科 ---------- */
  enhanceSubjectCards() {
    if (!window.innerWidth || window.innerWidth > 820) return;
    const card = this.findCard('各科评估');
    if (!card) return;
    const grid = this.kids(card).find(c => this.cls(c).indexOf('subj-grid') >= 0);
    if (!grid) return;
    const cards = this.kids(grid);
    if (cards.length <= 3) return;
    const rate = c => {
      const m = /width:\s*([\d.]+)%/.exec(String(this.findTag(c, 'DIV') && this.findTag(c, 'DIV').innerHTML || ''));
      return m ? parseFloat(m[1]) : 100;
    };
    const sorted = cards.slice().sort((a, b) => rate(a) - rate(b));
    const weak = sorted.slice(0, 3);
    let open = false;
    const apply = () => cards.forEach(c => { c.style.display = (open || weak.indexOf(c) >= 0) ? '' : 'none'; });
    apply();
    const btn = h('button', { class: 'btn', text: '展开全部 ' + cards.length + ' 科', onclick: () => {
      open = !open; btn.textContent = open ? '只看最弱 3 科' : '展开全部 ' + cards.length + ' 科'; apply();
    } });
    card.append(h('div', { class: 'v41-bar' }, btn,
      h('span', { class: 'hint', text: '小屏默认只显示得分率最低的 3 科' })));
  },

  /* ---------- 设置页：口径说明折叠 ---------- */
  enhanceSettings() {
    const card = this.findCard('口径说明');
    if (!card) return;
    const ul = this.findTag(card, 'UL');
    if (!ul) return;
    ul.classList.add('v41-collapsed');
    const btn = h('button', { class: 'btn', text: '展开全部说明', onclick: () => {
      const on = ul.classList.toggle('v41-collapsed') === false;
      btn.textContent = on ? '收起说明' : '展开全部说明';
    } });
    card.append(h('div', { class: 'v41-bar' }, btn));
  },

  /* ---------- 渲染后统一入口 ---------- */
  enhance() {
    if (this.PRINT) return;
    const acts = document.querySelector('.hd-actions');
    if (acts && !document.getElementById('v41FsBtn')) {
      acts.append(h('button', { class: 'btn v41-fs-btn', id: 'v41FsBtn', text: 'A+ 字号',
        title: '切换标准 / 大 / 特大字号', onclick: () => this.cycleFs() }));
    }
    if (ui.tab === 'overview' && data.exams.length) {
      const computed = computeAll(data), ei = ui.examIdx;
      this.scopeBar();
      this.enhanceTable();
      main.append(this.classCompareCard(computed, ei));
      main.append(this.goalTrackCard(computed, ei));
    } else if (ui.tab === 'student') {
      this.enhanceSubjectCards();
    } else if (ui.tab === 'settings') {

/* 包装 afterRender：模块① 的只读徽标 / 设置卡片照常执行，再跑增强 */
const V41_afterRender_base = V41.afterRender;
V41.afterRender = function () {

/* ================================================================
   V4.1 扩展模块 ④：家长版报告 / 手机只读快照 / 打印路由
   ================================================================ */
Object.assign(V41, {
  printRange: 'filter',
  pickedKeys: [],

  optLabel(o) { return this.READ_ONLY ? o.name : studentOptionLabel(o); },
  allTags(el, tag) {
    const out = [], q = [el];
    while (q.length) { const x = q.shift(); for (const c of this.kids(x)) { if (c.tagName === tag) out.push(c); q.push(c); } }
    return out;
  },
  jsonSafe(o) { return JSON.stringify(o).replace(/</g, '\\u003c'); },

  /* ---------- 只读版：数据层不动，显示层隐藏学号 ---------- */
  maskDisplayIds() {
    if (!this.READ_ONLY) return;
    for (const tbl of this.allTags(main, 'TABLE')) {
      const thead = this.kids(tbl).find(c => c.tagName === 'THEAD');
      const tbody = this.kids(tbl).find(c => c.tagName === 'TBODY');
      const headTrs = thead ? this.kids(thead).filter(c => c.tagName === 'TR') : [];
      let idx = -1;
      for (const tr of headTrs) {
        const i = this.kids(tr).findIndex(th => String(th.textContent || '').trim() === '学号');
        if (i >= 0) { idx = i; break; }
      }
      if (idx < 0) continue;
      const rows = headTrs.concat(tbody ? this.kids(tbody) : []);
      for (const r of rows) { const c = this.kids(r)[idx]; if (c) c.classList.add('v41-idcol'); }
    }
    const re = /(学号)\s*[A-Za-z0-9\-]+/g;
    const walk = el => {
      for (const c of this.kids(el)) {
        if (!this.kids(c).length) {
          const t = String(c.textContent || '');
          if (/学号\s*[A-Za-z0-9\-]+/.test(t)) c.textContent = t.replace(re, '$1 已隐藏');
        } else walk(c);
      }
    };
    walk(main);
  },

  /* ---------- 手机只读快照（剥内部备注 / API Key；保留姓名与学号用于跨场追踪） ---------- */
  snapshotData() {
    const clean = JSON.parse(JSON.stringify(data));
    const np = {};
    for (const k in (clean.profiles || {})) {
      const p = clean.profiles[k] || {};
      np[k] = { goal: p.goal || '', goalScore: p.goalScore == null ? null : p.goalScore };  // 不带 notes
    }
    clean.profiles = np;
    return clean;
  },
  exportSnapshot() {
    try {
      const H = this.health();
      const d = new Date(), p2 = x => String(x).padStart(2, '0');
      const ts = d.getFullYear() + '-' + p2(d.getMonth() + 1) + '-' + p2(d.getDate()) + ' ' + p2(d.getHours()) + ':' + p2(d.getMinutes());
      const payload = { ver: this.VER, ts, exams: H.exams, students: H.students,
        hideStudentId: true, note: '手机只读快照：不含 API Key 与老师内部备注；学号只在显示层隐藏', data: this.snapshotData() };
      downloadTextFile('snapshot.json', JSON.stringify(payload), 'application/json;charset=utf-8');
      myAlert('已导出 snapshot.json（' + H.exams + ' 场 / ' + H.students + ' 条）。用它替换手机查看版目录里的同名文件并重新发布，手机刷新即最新。');
    } catch (e) { myAlert('导出快照失败：' + e.message); }
  },

  /* ---------- 家长版：批量范围 ---------- */
  printKeys(range, picked) {
    const computed = computeAll(data), ei = ui.examIdx;
    const cur = computed[ei];
    if (!cur) return [];
    let rows = cur.rows || [];
    if (range === 'filter') {
      rows = rows.filter(r => (!ui.classFilter || r.cls === ui.classFilter) && (!ui.comboFilter || r.comboId === ui.comboFilter));
    } else if (range === 'pick') {
      const set = new Set(picked || []);
      rows = rows.filter(r => set.has(r.id));
    } else if (range === 'near') {
      rows = rows.filter(r => r.total != null && Math.abs(r.total - cur.stats.line1) <= 25);
    } else if (range === 'risk') {
      const dec = new Set(rows.filter(r => continuousDecline(studentHistory(computed, r.id), 2)).map(r => r.id));
      rows = rows.filter(r => dec.has(r.id) || (() => {
        const mm = mismatchEval(r, ei, cur.stats.subjAvg);
        return mm && mm.level !== 'ok';
      })());
    }
    return rows.map(r => r.id);
  },

  /* ---------- 家长版：单生一页（A4、黑白、家长口吻、不含排名与签字栏） ---------- */
  parentText(t) {
    return String(t || '')
      .replace(/本次名单均分/g, '本次考试该科平均水平')
      .replace(/名单均分/g, '本次考试该科平均水平')
      .replace(/名单/g, '本次考试')
      .replace(/建议谈话/g, '建议多沟通鼓励')
      .replace(/预警|关注|临界生|后\s*\d+%/g, '需要留心的部分');
  },
  parentPage(key) {
    const computed = computeAll(data);
    const hist = studentHistory(computed, key);
    let li = -1;
    for (let i = hist.length - 1; i >= 0; i--) if (hist[i]) { li = i; break; }
    if (li < 0) return null;
    const row = hist[li], st = computed[li].stats, exam = data.exams[li] || {};
    const prof = (data.profiles || {})[this.profileKey(row, key)] || {};
    const myKeys = sortSubjectKeys(row.subjectKeys && row.subjectKeys.length
      ? row.subjectKeys : SUBJECT_DEFS.map(s => s.key).filter(k => row.subj[k] != null));
    const evals = [];
    for (const k of myKeys) {
      const sdef = SUBJECT_MAP[k];
      if (!sdef) continue;
      const ev = subjectEval(row, sdef, st.subjAvg ? st.subjAvg[k] : null, null, 0, hist, li);
      if (!ev) continue;
      const a = buildAdvice(sdef, { rate: ev.rate, trend: ev.trend, trendDelta: ev.trendDelta,
        vsSchool: ev.vsSchool, score: ev.score, schoolAvg: st.subjAvg ? st.subjAvg[k] : null, subjectName: sdef.name });
      evals.push({ k, sdef, ev, a });
    }
    const advice = evals.slice().sort((x, y) => (x.ev.rate - y.ev.rate) || (y.a.priority - x.a.priority)).slice(0, 3);
    const weaker = evals.slice().sort((x, y) => x.ev.rate - y.ev.rate).slice(0, 1);
    const trend = hist.map((r, i) => ({ r, i })).filter(x => x.r && x.r.total != null).slice(-4);
    const lineWord = row.lineStatus === '一本线上' ? '达到本一线'
      : row.lineStatus === '二本线上' ? '达到本二线'
        : (row.lineStatus === '未上线' ? '暂未达到本一线' : (row.lineStatus || '—'));
    const goalTxt = prof.goal ? String(prof.goal)
      : (prof.goalScore ? '目标总分 ' + prof.goalScore + ' 分' : '以本一线为阶段目标');

    const page = h('div', { class: 'v41-parent-page' });
    page.append(h('div', { class: 'ph-hd' },
      h('div', { class: 'ph-title', text: '学生学业情况反馈' }),
      h('div', { class: 'ph-sub', text: (exam.name || '本次考试') + (exam.date ? '（' + exam.date + '）' : '') + ' · 由班主任提供 · 仅供家庭沟通参考' }),
      h('div', { class: 'ph-name', text: (row.name || '') + '　' + (row.cls || '') + (row.comboName ? ' · ' + row.comboName : '') })));

    page.append(h('div', { class: 'ph-kpi' },
      h('div', {}, '本次总分', h('b', { text: fmt(row.total) })),
      h('div', {}, '较上次', h('b', { text: row.totalDelta == null ? '—' : fmtSigned(row.totalDelta) + ' 分' })),
      h('div', {}, '阶段目标线', h('b', { text: fmt(this.goalFor(prof, st.line1)) })),
      h('div', {}, '上线情况', h('b', { style: 'font-size:13px', text: lineWord }))));

    page.append(h('h3', { text: '一、成绩与近期走势' }));
    const tt = h('table');
    tt.append(h('thead', {}, h('tr', {}, ['考试', '总分', '较上次', '得分率'].map(t => h('th', { text: t })))));
    tt.append(h('tbody', {}, trend.map(({ r, i }) => h('tr', {},
      h('td', { text: (data.exams[i] || {}).name || ('第' + (i + 1) + '场') }),
      h('td', { text: fmt(r.total) }),
      h('td', { text: r.totalDelta == null ? '—' : fmtSigned(r.totalDelta) + ' 分' }),
      h('td', { text: r.total == null ? '—' : (r.total / 750 * 100).toFixed(1) + '%' })))));
    page.append(tt);
    page.append(h('div', { class: 'ph-trend', text: '满分 750；得分率＝总分 ÷ 750。单科平均分与得分率以本次参考学生为范围，不含排名。' }));

    page.append(h('h3', { text: '二、各科明细与学科均衡' }));
    const radarItems = evals.map(e => ({
      name: e.sdef.name,
      rate: e.ev.rate == null ? null : e.ev.rate * 100,
      avgRate: (st.subjAvg && st.subjAvg[e.k] != null && e.sdef.max) ? st.subjAvg[e.k] / e.sdef.max * 100 : null,
    }));
    const radarEl = radarChartSVG(radarItems);
    const st2 = h('table');
    st2.append(h('thead', {}, h('tr', {}, ['科目', '得分 / 满分', '得分率', '与该科平均比'].map(t => h('th', { text: t })))));
    st2.append(h('tbody', {}, evals.map(({ sdef, ev }) => h('tr', {},
      h('td', { text: sdef.name + (isAssignedSubject(sdef.key) ? '（赋分）' : '') }),
      h('td', { text: fmt(ev.score) + ' / ' + sdef.max }),
      h('td', { text: pct(ev.rate) }),
      h('td', { text: ev.vsSchool == null ? '—' : fmtSigned(Math.round(ev.vsSchool * 10) / 10) + ' 分' })))));
    const noteGroup = h('div', { class: 'v41-eval-note' },
      h('div', { class: 'ph-trend', text: '「得分率」＝得分 ÷ 满分，可直接比较不同满分科目。' }));
    if (weaker.length) noteGroup.append(h('ul', { class: 'v41-weaker' }, weaker.map(({ sdef, ev }) =>
      h('li', { text: sdef.name + '目前得分率 ' + pct(ev.rate) + '，相对其他学科还有提升空间，建议优先安排这部分的复习时间。' }))));
    const evalLeft = h('div', { class: 'v41-eval-left' }, st2, noteGroup);
    if (radarEl) {
      page.append(h('div', { class: 'v41-eval-split' },
        evalLeft,
        h('div', { class: 'v41-eval-right' },
          h('div', { class: 'ph-chart-cap', text: '各科得分率雷达图（实线斜纹＝该生，虚线＝班级平均；轴数为本次实际选考科目）' }),
          radarEl)));
    } else {
      page.append(evalLeft);
    }

    page.append(h('h3', { text: '三、下阶段复习建议（按优先级）' }));
    page.append(h('ul', {}, advice.length
      ? advice.map(({ sdef, a }) => h('li', {}, h('strong', { text: sdef.name + '：' }), this.parentText(a.text)))
      : [h('li', { text: '本次各科数据完整度不足，建议先与任课老师沟通后再定重点。' })]));
    page.append(h('h3', { text: '四、阶段目标' }));
    page.append(h('div', { class: 'ph-trend', text: this.parentText(goalTxt) + '。建议结合孩子实际情况，与任课老师沟通后安排每周复习节奏。' }));
    return page;
  },

  /* ---------- 打印路由 ---------- */
  renderPrint() {
    document.body.classList.add('v41-printing-parent');
    const one = window.__V41_PRINT_ONE__;
    const parts = this.PRINT || [];
    let keys = [];
    if (one) keys = [one];
    else if (parts[0] === 'all' || parts[0] === 'filter') keys = this.printKeys(parts[1] || 'filter', this.pickedKeys);
    else if (parts[0] === 'pick') keys = this.pickedKeys || [];
    else keys = [parts[0] || ''].filter(Boolean);   // key 本身已 encodeURIComponent，不能再解码
    main.innerHTML = '';
    const host = h('div', { class: 'v41-print-host' });
    for (const k of keys) { const pg = this.parentPage(k); if (pg) host.append(pg); }
    if (!this.kids(host).length) host.append(h('div', { class: 'empty', text: '没有可导出的学生，请检查筛选范围。' }));
    const tools = h('div', { class: 'v41-screen-only v41-bar v41-parent-tools v41-sticky-top' },
      h('button', { class: 'btn primary', text: '🖨 打印 / 另存为 PDF', onclick: () => window.print() }),
      h('button', { class: 'btn', text: '返回系统', onclick: () => {
        this.PRINT = null; window.__V41_PRINT_ONE__ = null;
        document.body.classList.remove('v41-printing-parent');
        try { location.hash = ''; } catch (e) {}
        render();
      } }),
      h('span', { class: 'hint', text: '共 ' + this.kids(host).length + ' 份 · 每生一页 A4 · 黑白可读 · 只在本机生成' }));
    main.append(tools, host);
  },
  openPrint(range) {
    this.printRange = range;
    const keys = this.printKeys(range, this.pickedKeys);
    if (!keys.length) { myAlert('当前范围没有学生，请先调整筛选或勾选名单。'); return; }
    this.PRINT = ['all', range];
    try { location.hash = '#print|all|' + range; } catch (e) {}
    render();
    myAlert('已生成 ' + keys.length + ' 份家长版报告，点「打印 / 另存为 PDF」即可。');
  },

  /* ---------- 手动勾选 ---------- */
  pickStudents() {
    return new Promise(resolve => {
      const mask = h('div', { class: 'v41-mask' });
      const box = h('div', { class: 'v41-dialog', style: 'width:min(520px,100%)' });
      box.append(h('div', { class: 'v41-dlg-title', text: '选择要导出的学生' }),
        h('div', { class: 'v41-dlg-msg', text: '勾选后点「确定」；可搜索姓名或班级。' }));
      const search = h('input', { type: 'search', placeholder: '搜索姓名 / 班级 / 学号', style: 'width:100%;margin:10px 0 6px' });
      const list = h('div', { class: 'v41-pick-list', style: 'max-height:300px;overflow:auto' });
      const opts = studentOptions(data.exams);
      const chosen = new Set(this.pickedKeys || []);
      const rebuild = () => {
        list.innerHTML = '';
        const q = String(search.value || '').trim().toLowerCase();
        const shown = opts.filter(o => !q || [o.name, o.cls, o.studentId].some(v => String(v || '').toLowerCase().indexOf(q) >= 0));
        for (const o of shown) {
          const cb = h('input', { type: 'checkbox', checked: chosen.has(o.key) ? '' : null,
            onchange: ev => { if (ev.target.checked) chosen.add(o.key); else chosen.delete(o.key); } });
          list.append(h('label', {}, cb, this.optLabel(o),
            h('span', { class: 'hint', style: 'margin-left:auto', text: o.cls || '' })));
        }
        if (!shown.length) list.append(h('div', { class: 'hint', text: '没有匹配的学生' }));
      };
      search.addEventListener('input', rebuild);
      rebuild();
      let done = false;
      const finish = v => { if (done) return; done = true; mask.remove(); resolve(v); };
      const bar = h('div', { class: 'v41-dlg-bar' });
      bar.append(
        h('button', { class: 'btn', text: '全选当前结果', onclick: () => { opts.forEach(o => chosen.add(o.key)); rebuild(); } }),
        h('button', { class: 'btn', text: '清空', onclick: () => { chosen.clear(); rebuild(); } }),
        h('button', { class: 'btn', text: '取消', onclick: () => finish(null) }),
        h('button', { class: 'btn primary', text: '确定', onclick: () => finish(Array.from(chosen)) }));
      box.append(search, list, bar);
      mask.append(box);
      mask.addEventListener('click', e => { if (e.target === mask) finish(null); });
      document.body.append(mask);
    });
  },

  /* ---------- 导出批量打印包（自包含 HTML，供本机脚本逐生打印） ---------- */
  exportPrintPack() {
    const keys = this.printKeys(this.printRange, this.pickedKeys);
    if (!keys.length) { myAlert('当前范围没有学生。'); return; }
    try {
      const computed = computeAll(data), ei = ui.examIdx;
      const names = {};
      for (const k of keys) {
        const r = (computed[ei].rows || []).find(x => x.id === k);
        if (r) names[k] = [r.cls || '未分班', r.studentId || '无学号', r.name, (data.exams[ei] || {}).name || '考试']
          .map(x => safeFileName(String(x))).join('-');
      }
      const clone = document.documentElement.cloneNode(true);
      const mn = clone.querySelector('#main');
      if (mn) mn.innerHTML = '';
      const rm = clone.querySelectorAll('.v41-toast, .v41-mask, .v41-ro-badge, #v41FsBtn, .v41-print-host');
      for (const e of Array.from(rm || [])) e.remove();
      const inj = clone.ownerDocument.createElement('script');
      inj.textContent = 'window.__V41_DATA__=' + this.jsonSafe({ data: this.snapshotData() }) + ';\n' +
        'window.__V41_KEYS__=' + this.jsonSafe(keys) + ';\n' +
        'window.__V41_NAMES__=' + this.jsonSafe(names) + ';\n' +
        'window.__V41_PRINT_ONE__=null;';
      (clone.querySelector('head') || clone).appendChild(inj);
      downloadTextFile('家长版打印包.html', '<!DOCTYPE html>\n' + clone.outerHTML, 'text/html;charset=utf-8');
      myAlert('已导出「家长版打印包.html」。用「批量生成家长版PDF」脚本可一次生成每生一份 PDF。');
    } catch (e) { myAlert('导出打印包失败：' + e.message); }
  },

  /* ---------- 总览：家长版工具条（紧凑横向） ---------- */
  parentToolsCard() {
    const box = h('div', { class: 'card v41-card v41-write', style: 'padding:10px 14px;' });
    box.append(h('div', { style: 'display:flex;align-items:baseline;gap:12px;flex-wrap:wrap;margin-bottom:8px;' },
      h('span', { style: 'font-size:14px;font-weight:600;color:#1f3d2b;', text: '家长版报告 · 批量导出' }),
      h('span', { class: 'v41-hint', style: 'font-size:13px;', text: '每生一页 A4：成绩走势 · 各科明细 · 复习建议；不含排名、签字栏与老师内部备注。' })));
    const sel = h('select', { onchange: ev => { this.printRange = ev.target.value; } },
      [['filter', '当前筛选结果'], ['pick', '手动勾选学生'], ['near', '临界生 / 目标跟踪名单'], ['risk', '偏科与连续退步名单']]
        .map(([v, t]) => h('option', { value: v, selected: v === this.printRange ? '' : null, text: t })));
    const pickBtn = h('button', { class: 'btn', text: '选择学生（' + (this.pickedKeys || []).length + '）',
      onclick: async () => {
        const ks = await this.pickStudents();
        if (ks) { this.pickedKeys = ks; pickBtn.textContent = '选择学生（' + ks.length + '）'; }
      } });
    box.append(h('div', { class: 'v41-bar', style: 'margin-top:0;' }, h('span', { class: 'hint', text: '导出范围' }), sel, pickBtn,
      h('button', { class: 'btn primary', text: '🖨 打印合订（另存 PDF）', onclick: () => this.openPrint(this.printRange) }),
      h('button', { class: 'btn', text: '⬇ 导出批量打印包 HTML', onclick: () => this.exportPrintPack() })),
      h('p', { class: 'v41-hint', style: 'margin-top:8px', text: '提示：合订 PDF 适合打印后裁开发给学生；要给家长单独转发，请用打印包 + 本机脚本生成「每生一份」的 PDF。' }));
    return box;
  },
});

/* 设置页备份卡片追加「导出手机快照」 */
const V41_settings_base = V41.settingsCard;
V41.settingsCard = function () {
  const card = V41_settings_base.call(this);
  const bars = this.allTags(card, 'DIV').filter(c => this.cls(c).indexOf('v41-bar') >= 0);
  const bar = bars.find(c => this.cls(c).indexOf('v41-bar-ro') >= 0) || bars[0];
  if (bar) bar.append(h('button', { class: 'btn', text: '📱 导出手机快照 (snapshot.json)', onclick: () => this.exportSnapshot() }));
  card.append(h('p', { class: 'v41-hint', style: 'margin-top:8px',
    text: '手机只读版：点上面「导出手机快照」下载 snapshot.json，放到「准备手机查看版」脚本旁边双击运行，会生成一个单文件「手机查看版.html」（数据已内嵌、无需联网）。把它发到自己手机用浏览器打开即可查看，不能修改数据；改完成绩后重新导出并覆盖旧文件再发一次。快照不含 API Key 和老师内部备注，学号在页面上隐藏。' }));
  return card;
};

/* enhance 再包一层：家长版工具条 + 只读脱敏 */
const V41_enhance_p3 = V41.enhance;
V41.enhance = function () {
  V41_enhance_p3.call(this);
  if (this.PRINT) return;
  if (this.READ_ONLY) this.maskDisplayIds();
  if (ui.tab === 'overview' && data.exams.length && !this.READ_ONLY) main.insertBefore(this.parentToolsCard(), main.firstChild);
};

/* afterRender 再包一层：打印路由 */
const V41_afterRender_p3 = V41.afterRender;
V41.afterRender = function () {
  V41_afterRender_p3.call(this);
  if (this.PRINT) this.renderPrint();
};

/* 打印包模式不走快照拉取 */
const V41_init_p3 = V41.init;
V41.init = async function () {
  if (this.PRINT || window.__V41_PRINT_ONE__) { document.body.classList.add('v41-printing-parent'); return; }
  return V41_init_p3.call(this);
};

/*__V41_MODULES__*/
/* ================================================================
   V4.1 启动（放在扩展模块之后，避免 TDZ）
   ================================================================ */
(function boot() {
  try {
    const t = localStorage.getItem(LS_THEME);
    if (t === 'light' || t === 'dark') document.documentElement.setAttribute('data-theme', t);
  } catch (e) { /* ignore */ }
  V41.applyPref();
  data = V41.bootData();
  aiCfg = V41.READ_ONLY ? { provider: 'deepseek', base: '', model: '', key: '' } : loadAiCfg();
  const hm = location.hash.slice(1).split('|');
  if (hm[0] && ['overview', 'student', 'entry', 'settings'].includes(hm[0])) ui.tab = hm[0];
  if (ui.tab === 'student' && hm[1]) {
    try { ui.student = decodeURIComponent(hm[1]); } catch (e) { /* 兼容旧版链接 */ }
  }
  if (hm[0] === 'print') { V41.PRINT = hm.slice(1); ui.tab = 'overview'; }
  if (V41.READ_ONLY && (ui.tab === 'entry' || ui.tab === 'settings')) ui.tab = 'overview';
  render();
  V41.init();
})();
</script>
