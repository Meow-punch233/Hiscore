/* ---------- 家长版雷达图：各科得分率（黑白可辨） ----------
   items: [{name, rate(0-100), avgRate(0-100|null)}]
   轴数 = 有效科目数（即该生实际选考科目）；<3 科返回 null 由调用方降级。
   区分线索不依赖颜色：该生=实线+斜纹填充+实心点；班级平均=虚线+无填充+空心圈。 */
let _radarSeq = 0;
function radarChartSVG(items) {
  const valid = (items || []).filter(it => it && Number.isFinite(it.rate));
  if (valid.length < 3) return null;
  const n = valid.length;
  const W = 680, H = 480, cx = 340, cy = 236, R = 168;
  const ang = i => -Math.PI / 2 + i * 2 * Math.PI / n;
  const pt = (i, val) => {
    const v = Math.max(0, Math.min(100, val));
    return [cx + R * v / 100 * Math.cos(ang(i)), cy + R * v / 100 * Math.sin(ang(i))];
  };
  const id = 'radarHatch' + (++_radarSeq);
  let rings = '';
  [25, 50, 75, 100].forEach(lv => {
    const p = [];
    for (let i = 0; i < n; i++) { const x = pt(i, lv); p.push(x[0].toFixed(1) + ',' + x[1].toFixed(1)); }
    rings += '<polygon points="' + p.join(' ') + '" fill="none" stroke="#d7e3dc" stroke-width="1"/>';
  });
  let refs = '';
  [60, 85].forEach(lv => {
    const p = [];
    for (let i = 0; i < n; i++) { const x = pt(i, lv); p.push(x[0].toFixed(1) + ',' + x[1].toFixed(1)); }
    refs += '<polygon points="' + p.join(' ') + '" fill="none" stroke="#bcd0c4" stroke-width="1" stroke-dasharray="4 4"/>';
    const y = cy - R * lv / 100;
    refs += '<text x="' + (cx + 4) + '" y="' + y.toFixed(1) + '" font-size="10" fill="#9bb3a6">' + lv + '%' + (lv === 60 ? '(及格)' : '(优秀)') + '</text>';
  });
  let axes = '';
  for (let i = 0; i < n; i++) {
    const end = pt(i, 100), lab = pt(i, 120);
    axes += '<line x1="' + cx + '" y1="' + cy + '" x2="' + end[0].toFixed(1) + '" y2="' + end[1].toFixed(1) + '" stroke="#e3ebe6" stroke-width="1"/>';
    const c = Math.cos(ang(i)), s = Math.sin(ang(i));
    let anc = 'middle';
    if (c > 0.3) anc = 'start'; else if (c < -0.3) anc = 'end';
    const dy = s > 0.5 ? 8 : (s < -0.5 ? -6 : 4);
    axes += '<text x="' + lab[0].toFixed(1) + '" y="' + (lab[1] + dy).toFixed(1) + '" text-anchor="' + anc + '" font-size="13" font-weight="500" fill="#2b3a30">' + (valid[i].name || '') + '</text>';
  }
  const stuPts = valid.map((it, i) => pt(i, it.rate)).map(p => p[0].toFixed(1) + ',' + p[1].toFixed(1)).join(' ');
  const stuPoly = '<polygon points="' + stuPts + '" fill="url(#' + id + ')" stroke="#1f3d2b" stroke-width="2.5" stroke-linejoin="round"/>';
  let stuDots = '';
  valid.forEach((it, i) => { const p = pt(i, it.rate); stuDots += '<circle cx="' + p[0].toFixed(1) + '" cy="' + p[1].toFixed(1) + '" r="3.6" fill="#1f3d2b"/>'; });
  const hasAvg = valid.some(it => it.avgRate != null && Number.isFinite(it.avgRate));
  let avgPoly = '', avgDots = '';
  if (hasAvg) {
    const aPts = valid.map((it, i) => pt(i, it.avgRate != null && Number.isFinite(it.avgRate) ? it.avgRate : it.rate)).map(p => p[0].toFixed(1) + ',' + p[1].toFixed(1)).join(' ');
    avgPoly = '<polygon points="' + aPts + '" fill="none" stroke="#7a8a80" stroke-width="2" stroke-dasharray="7 5" stroke-linejoin="round"/>';
    valid.forEach((it, i) => { const v = it.avgRate != null && Number.isFinite(it.avgRate) ? it.avgRate : it.rate; const p = pt(i, v); avgDots += '<circle cx="' + p[0].toFixed(1) + '" cy="' + p[1].toFixed(1) + '" r="3.2" fill="#ffffff" stroke="#7a8a80" stroke-width="1.6"/>'; });
  }
  const legend = '<g transform="translate(200,452)">' +
    '<rect x="0" y="-11" width="14" height="14" rx="3" fill="url(#' + id + ')" stroke="#1f3d2b" stroke-width="2"/>' +
    '<text x="20" y="1" font-size="13" fill="#2b3a30">该生（实线+斜纹）</text>' +
    (hasAvg ? '<line x1="165" y1="-1" x2="183" y2="-1" stroke="#7a8a80" stroke-width="2" stroke-dasharray="7 5"/>' +
             '<text x="190" y="1" font-size="13" fill="#2b3a30">班级平均（虚线）</text>' : '') +
    '</g>';
  const svg = '<svg viewBox="0 0 ' + W + ' ' + H + '" width="100%" xmlns="http://www.w3.org/2000/svg" role="img">' +
    '<title>各科得分率雷达图</title>' +
    '<desc>以各选考科目为轴，实线斜纹填充多边形为该生各科得分率，虚线多边形为班级平均；轴数为本次实际选考科目，未选考科目不列入。</desc>' +
    '<defs><pattern id="' + id + '" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">' +
    '<line x1="0" y1="0" x2="0" y2="7" stroke="#1f3d2b" stroke-width="1.3"/></pattern></defs>' +
    rings + refs + axes + avgPoly + stuPoly + stuDots + avgDots + legend + '</svg>';
  const box = h('div', { class: 'v41-radar' });
  box.innerHTML = svg;
  return box;
}
function pct(v) { return v == null ? '—' : (v * 100).toFixed(1) + '%'; }

async function copyText(t) {
  try { await navigator.clipboard.writeText(t); return true; } catch (e) {
    const ta = document.createElement('textarea');
    ta.value = t; ta.style.position = 'fixed'; ta.style.opacity = '0';
    document.body.append(ta); ta.select();
    let ok = false;
    try { ok = document.execCommand('copy'); } catch (e2) { /* ignore */ }
    ta.remove();
    return ok;
  }
}

function safeFileName(s) {
  return String(s == null ? '' : s).replace(/[\\/:*?"<>|\r\n]+/g, '-').trim() || '成绩';
}
function downloadTextFile(filename, text, mime) {
  const blob = new Blob([text], { type: mime || 'text/csv;charset=utf-8' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = filename;

/* ---------- tooltip ---------- */
const tt = document.getElementById('tt');
function showTT(x, y, title, rows) {
  tt.innerHTML = '';
  tt.append(h('div', { class: 't', text: title }));
  for (const r of rows) {
    const row = h('div', { class: 'r' },
      h('span', { class: 'key', style: 'border-top-color:' + r.color }),
      h('span', { class: 'v', text: r.value }),
      h('span', { class: 'n', text: r.name }));
    tt.append(row);
  }
  tt.style.display = 'block';
  const pad = 14, vw = window.innerWidth;
  let left = x + pad, top = y + pad;
  const rect = tt.getBoundingClientRect();
  if (left + rect.width > vw - 8) left = x - rect.width - pad;
  if (top + rect.height > window.innerHeight - 8) top = y - rect.height - pad;
  tt.style.left = left + 'px'; tt.style.top = top + 'px';
}
function hideTT() { tt.style.display = 'none'; }

/* ---------- 折线图 ---------- */
function niceTicks(min, max, count) {
  if (min === max) { min -= 1; max += 1; }
  const span = max - min;
  const step0 = span / Math.max(1, count - 1);
  const mag = Math.pow(10, Math.floor(Math.log10(step0)));
  const norm = step0 / mag;
  const step = (norm <= 1 ? 1 : norm <= 2 ? 2 : norm <= 2.5 ? 2.5 : norm <= 5 ? 5 : 10) * mag;
  const lo = Math.floor(min / step) * step, hi = Math.ceil(max / step) * step;
  const ticks = [];
  for (let v = lo; v <= hi + step * 0.5; v += step) ticks.push(Math.round(v * 1e6) / 1e6);
  return { lo, hi, ticks };
}

/**
 * lineChartCard: 单卡折线图（含图例 + 表格视图切换 + 十字线 tooltip）
 * opts: {title, sub, xLabels:[], series:[{key,name,color,values:[]}], refs:[{y,label,color}],
 *        invertY, yUnit, height, labelLast}
 */
function lineChartCard(opts) {
  const pal = P();
  const off = new Set();
  const W = 720, H = opts.height || 240;
  const padL = 48, padR = (opts.refs && opts.refs.length) ? 92 : 56, padT = 14, padB = 30;
  const plotW = W - padL - padR, plotH = H - padT - padB;

  function visSeries() { return opts.series.filter(s => !off.has(s.key)); }

  // 图例（≥2 系列；点击可隐藏/显示；全隐藏时仍保留以便恢复，并给出「全部显示」）
  function renderLegend() {
    if (opts.series.length < 2) return null;
    const lg = h('div', { class: 'legend' }, opts.series.map(s =>
      h('span', {
        class: 'li' + (off.has(s.key) ? ' off' : ''), role: 'button', tabindex: '0',
        title: '点击显示/隐藏',
        onclick: () => { off.has(s.key) ? off.delete(s.key) : off.add(s.key); rerender(); },
        onkeydown: ev => { if (ev.key === 'Enter' || ev.key === ' ') { ev.preventDefault(); off.has(s.key) ? off.delete(s.key) : off.add(s.key); rerender(); } },
      },
        h('span', { class: 'key', style: 'border-top-color:' + s.color }),
        s.name)));
    if (off.size > 0) lg.append(h('span', {
      class: 'li v41-reset', role: 'button', tabindex: '0', title: '显示全部科目',
      onclick: () => { off.clear(); rerender(); },
      onkeydown: ev => { if (ev.key === 'Enter' || ev.key === ' ') { ev.preventDefault(); off.clear(); rerender(); } },
    }, '全部显示'));
    return lg;
  }

  function domain() {
    let vals = [];
    for (const s of visSeries()) for (const v of s.values) if (v != null && !isNaN(v)) vals.push(v);
    for (const r of (opts.refs || [])) {
      if (r.values) { for (const v of r.values) if (v != null && !isNaN(v)) vals.push(v); }
      else if (r.y != null) vals.push(r.y);
    }
    if (!vals.length) return { lo: 0, hi: 1, ticks: [0, 1] };
    let min = Math.min.apply(null, vals), max = Math.max.apply(null, vals);
    const pad = Math.max(1, (max - min) * 0.12);
    return niceTicks(min - pad, max + pad, 5);
  }

  function build(onlyTable) {
    const d = domain();
    const n = opts.xLabels.length;
    const X = i => n <= 1 ? padL + plotW / 2 : padL + plotW * i / (n - 1);
    const Yraw = v => padT + plotH * (1 - (v - d.lo) / (d.hi - d.lo));
    const Y = v => opts.invertY ? padT + plotH * (v - d.lo) / (d.hi - d.lo) : Yraw(v);
    const wrap = h('div');
    wrap.append(h('div', { class: 'chart-head' },
      h('h3', { text: opts.title }),
      opts.sub ? h('span', { class: 'cs', text: opts.sub }) : null,
      h('span', { class: 'tw' },
        h('button', { class: 'btn', onclick: () => { tblHidden = !tblHidden; rerender(); }, text: tblHidden ? '返回图表' : '表格视图' }))));

    if (tblHidden) {
      const tbl = h('table', { class: 'tb' });
      const thead = h('thead', {}, h('tr', {}, h('th', { text: '考试' }),
        visSeries().map(s => h('th', { text: s.name })),
        (opts.refs || []).map(r => h('th', { text: r.label }))));
      const tbody = h('tbody', {}, opts.xLabels.map((lb, i) => h('tr', {},
        h('td', { text: lb }),
        visSeries().map(s => h('td', { text: s.values[i] == null ? '—' : fmt(s.values[i]) })),
        (opts.refs || []).map(r => {
          const v = r.values ? r.values[i] : r.y;
          return h('td', { text: v == null ? '—' : fmt(v) });
        }))));
      tbl.append(thead, tbody);
      wrap.append(h('div', { class: 'tscroll' }, tbl));
      return wrap;
    }
    const hasChart = visSeries().length && n;
    if (!hasChart) { wrap.append(h('div', { class: 'empty', text: '已隐藏全部科目，点击下方图例可逐个恢复' })); wrap.append(renderLegend()); return wrap; }

    // SVG 字符串（静态颜色/数字，动态文本已转义）
    let g = '';
    for (const t of d.ticks) {
      const y = Y(t);
      g += `<line x1="${padL}" y1="${y}" x2="${W - padR}" y2="${y}" stroke="${pal.grid}" stroke-width="1"/>`;
      g += `<text x="${padL - 8}" y="${y + 4}" text-anchor="end" font-size="11" fill="${pal.muted}" style="font-variant-numeric:tabular-nums">${t}</text>`;
    }
    g += `<line x1="${padL}" y1="${padT + plotH}" x2="${W - padR}" y2="${padT + plotH}" stroke="${pal.axis}" stroke-width="1"/>`;
    for (let i = 0; i < n; i++) {
      g += `<text x="${X(i)}" y="${H - 8}" text-anchor="middle" font-size="11" fill="${pal.muted}">${esc(opts.xLabels[i])}</text>`;
    }
    // 参考线：V4.1 支持按场取值（每场分数线可不同），无 values 时回落水平线
    for (const r of (opts.refs || [])) {
      if (r.values) {
        let dstr = '', pen = false, lastY = null, lastX = padL;
        for (let i = 0; i < n; i++) {
          const v = r.values[i];
          if (v == null || isNaN(v)) { pen = false; continue; }
          const yy = Y(v);
          if (yy < padT - 2 || yy > padT + plotH + 2) { pen = false; continue; }
          dstr += (pen ? 'L' : 'M') + X(i).toFixed(1) + ' ' + yy.toFixed(1) + ' ';
          pen = true; lastY = yy; lastX = X(i);
        }
        if (dstr) g += `<path d="${dstr}" fill="none" stroke="${r.color}" stroke-width="1.5" stroke-opacity="0.8" stroke-dasharray="5 3"/>`;
        if (lastY != null) g += `<text x="${Math.min(W - padR + 6, lastX + 8)}" y="${lastY + 4}" font-size="11" fill="${pal.ink2}">${esc(r.label)}</text>`;
      } else {
        if (r.y == null) continue;
        const y = Y(r.y);
        if (y < padT - 2 || y > padT + plotH + 2) continue;
        g += `<line x1="${padL}" y1="${y}" x2="${W - padR}" y2="${y}" stroke="${r.color}" stroke-width="1.5" stroke-opacity="0.75"/>`;
        g += `<text x="${W - padR + 6}" y="${y + 4}" font-size="11" fill="${pal.ink2}">${esc(r.label)}</text>`;
      }
    }
    // 折线（缺值断开）
    for (const s of visSeries()) {
      let dstr = '', pen = false;
      for (let i = 0; i < n; i++) {
        const v = s.values[i];
        if (v == null || isNaN(v)) { pen = false; continue; }
        dstr += (pen ? 'L' : 'M') + X(i).toFixed(1) + ' ' + Y(v).toFixed(1) + ' ';
        pen = true;
      }
      g += `<path d="${dstr}" fill="none" stroke="${s.color}" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>`;
      // 端点直标（仅单系列、且打印态；屏幕端保持干净，悬停 tooltip 可看数值）
      if (opts.labelLast && visSeries().length === 1 && V41_PRINTING()) {
        for (let i = n - 1; i >= 0; i--) if (s.values[i] != null) {
          g += `<circle cx="${X(i)}" cy="${Y(s.values[i])}" r="4.5" fill="${s.color}" stroke="${pal.surface}" stroke-width="2"/>`;
          g += `<text x="${X(i) + 8}" y="${Y(s.values[i]) + 4}" font-size="12" font-weight="600" fill="${pal.ink}">${fmt(s.values[i])}</text>`;
          break;
        }
      } else {
        for (let i = 0; i < n; i++) if (s.values[i] != null)
          g += `<circle cx="${X(i)}" cy="${Y(s.values[i])}" r="3.5" fill="${s.color}" stroke="${pal.surface}" stroke-width="2"/>`;
      }
    }
    // V4.1: 多系列时标出最强 / 最弱两科的末点数值（仅打印态；屏幕端保持干净）
    if (opts.labelEnds && visSeries().length >= 2 && V41_PRINTING()) {
      const ends = [];
      for (const s of visSeries()) {
        let v = null;
        for (let i = n - 1; i >= 0; i--) if (s.values[i] != null) { v = s.values[i]; break; }
        if (v != null) ends.push({ s, v });
      }
      if (ends.length >= 2) {
        ends.sort((a, b) => b.v - a.v);
        for (const p of [ends[0], ends[ends.length - 1]]) {
          let i = -1;
          for (let j = n - 1; j >= 0; j--) if (p.s.values[j] != null) { i = j; break; }
          if (i < 0) continue;
          g += `<circle cx="${X(i)}" cy="${Y(p.v)}" r="3.5" fill="${p.s.color}" stroke="${pal.surface}" stroke-width="1.5"/>`;
          g += `<text x="${X(i) + 7}" y="${Y(p.v) + 4}" font-size="11" font-weight="600" fill="${p.s.color}">${fmt(p.v)}${opts.yUnit || ''}</text>`;
        }
      }
    }
    const svg =
      `<svg class="line" viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(opts.title)}">` +
      g +
      `<line class="xh" x1="0" y1="${padT}" x2="0" y2="${padT + plotH}" stroke="${pal.axis}" stroke-width="1" opacity="0"/>` +
      `<rect x="0" y="0" width="${W}" height="${H}" fill="transparent" style="cursor:crosshair"/>` +
      `</svg>`;
    const holder = h('div', { class: 'chart-view', html: svg });
    const svgEl = holder.firstChild;
    // 十字线 + tooltip
    const xh = svgEl.querySelector('.xh');
    svgEl.addEventListener('pointermove', ev => {
      const box = svgEl.getBoundingClientRect();
      const px = (ev.clientX - box.left) * W / box.width;
      let idx = n <= 1 ? 0 : Math.round((px - padL) / plotW * (n - 1));
      idx = Math.max(0, Math.min(n - 1, idx));
      xh.setAttribute('x1', X(idx)); xh.setAttribute('x2', X(idx)); xh.setAttribute('opacity', '0.8');
      const rows = visSeries().map(s => ({
        color: s.color, name: s.name, value: s.values[idx] == null ? '—' : fmt(s.values[idx]) + (opts.yUnit || ''),
      }));
      for (const r of (opts.refs || [])) { const v = r.values ? r.values[idx] : r.y; rows.push({ color: r.color, name: r.label, value: (v == null ? '—' : fmt(v)) + (opts.yUnit || '') }); }
      showTT(ev.clientX, ev.clientY, opts.xLabels[idx], rows);
    });
    svgEl.addEventListener('pointerleave', () => { xh.setAttribute('opacity', '0'); hideTT(); });
    wrap.append(holder);

    // 图例（≥2 系列；点击可隐藏/显示；全隐藏时仍保留以便恢复）
    wrap.append(renderLegend());
    return wrap;
  }

  let tblHidden = false;
  let cur = null;
  function rerender() {
    const next = build();
    if (cur && cur.parentNode) cur.parentNode.replaceChild(next, cur);
    cur = next;
  }
  cur = build();
  const host = h('div', { class: 'card' }, cur);
  return host;
}

/* ---------- 柱状图（单系列，名义类别 → 统一 slot1 色） ---------- */
function barChartCard(opts) {
  // opts: {title, sub, items:[{label, value, ref?}], yMax, unit, height}
  const pal = P();
  const W = 720, H = opts.height || 220;
  const padL = 44, padR = 16, padT = 18, padB = 30;
  const plotW = W - padL - padR, plotH = H - padT - padB;
  const vals = opts.items.map(i => i.value).filter(v => v != null);
  const maxV = opts.yMax != null ? opts.yMax : (vals.length ? Math.max.apply(null, vals) : 1);
  const d = niceTicks(0, Math.max(maxV, 1), 5);
  const n = opts.items.length;
  const band = plotW / Math.max(1, n);
  const barW = Math.min(24, band * 0.55);
  const Y = v => padT + plotH * (1 - (v - d.lo) / (d.hi - d.lo));
  let g = '';
  for (const t of d.ticks) {
    const y = Y(t);
    g += `<line x1="${padL}" y1="${y}" x2="${W - padR}" y2="${y}" stroke="${pal.grid}" stroke-width="1"/>`;
    g += `<text x="${padL - 8}" y="${y + 4}" text-anchor="end" font-size="11" fill="${pal.muted}">${t}</text>`;
  }
  g += `<line x1="${padL}" y1="${padT + plotH}" x2="${W - padR}" y2="${padT + plotH}" stroke="${pal.axis}" stroke-width="1"/>`;
  const mean = vals.length ? vals.reduce((a, b) => a + b, 0) / vals.length : null;
  if (opts.showMean && mean != null) {
    const my = Y(mean);
    g += `<line x1="${padL}" y1="${my}" x2="${W - padR}" y2="${my}" stroke="${pal.critical}" stroke-width="1.2" stroke-dasharray="5 3" stroke-opacity="0.8"/>`;
    g += `<text x="${W - padR - 2}" y="${my - 5}" text-anchor="end" font-size="10" fill="${pal.critical}">均值 ${fmt(mean, 1)}</text>`;
  }
  const base = Y(d.lo);
  opts.items.forEach((it, i) => {
    const cx = padL + band * (i + 0.5);
    if (it.value != null) {
      const y = Y(it.value), hgt = Math.max(2, base - y);
      const r = Math.min(4, barW / 2, hgt);
      // V4.1: 按与均值的差距着色，一眼看出高于 / 低于整体
      const barColor = (mean == null || !opts.showMean) ? pal.accent
        : (it.value >= mean * 1.03 ? pal.good : it.value <= mean * 0.97 ? pal.critical : pal.accent);
      g += `<path d="M${cx - barW / 2} ${base} L${cx - barW / 2} ${y + r} Q${cx - barW / 2} ${y} ${cx - barW / 2 + r} ${y} L${cx + barW / 2 - r} ${y} Q${cx + barW / 2} ${y} ${cx + barW / 2} ${y + r} L${cx + barW / 2} ${base} Z" fill="${barColor}"/>`;
      g += `<text x="${cx}" y="${y - 6}" text-anchor="middle" font-size="11" font-weight="600" fill="${pal.ink}">${fmt(it.value)}</text>`;
    }
    g += `<text x="${cx}" y="${H - 8}" text-anchor="middle" font-size="11" fill="${pal.muted}">${esc(it.label)}</text>`;
    g += `<rect x="${cx - band / 2}" y="${padT}" width="${band}" height="${plotH}" fill="transparent" data-i="${i}" style="cursor:default"/>`;
  });
  const holder = h('div', { class: 'chart-view', html: `<svg class="bar" viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(opts.title)}">${g}</svg>` });
  const svgEl = holder.firstChild;
  svgEl.querySelectorAll('rect[data-i]').forEach(rc => {
    rc.addEventListener('pointermove', ev => {
      const it = opts.items[+rc.getAttribute('data-i')];
      showTT(ev.clientX, ev.clientY, it.label, [{ color: mean != null && it.value != null && it.value < mean ? pal.critical : pal.accent, name: opts.unit || '', value: it.value == null ? '—' : fmt(it.value) + (opts.valueSuffix || '') }]);
    });
    rc.addEventListener('pointerleave', hideTT);
  });
  // 表格孪生
  let asTable = false, curEl = null;
  const head = h('div', { class: 'chart-head' },
    h('h3', { text: opts.title }),
    opts.sub ? h('span', { class: 'cs', text: opts.sub }) : null,
    h('span', { class: 'tw' }, h('button', {
      class: 'btn', text: asTable ? '返回图表' : '表格视图',
      onclick: () => { asTable = !asTable; rerenderBar(); },
    })));
  function rerenderBar() {
    head.querySelector('.tw button').textContent = asTable ? '返回图表' : '表格视图';
    const next = asTable
      ? h('div', { class: 'tscroll' }, h('table', { class: 'tb' },
        h('thead', {}, h('tr', {}, h('th', { text: '科目' }), h('th', { text: opts.unit || '均分' }))),
        h('tbody', {}, opts.items.map(it => h('tr', {}, h('td', { text: it.label }), h('td', { text: it.value == null ? '—' : fmt(it.value) })))))
      )
      : holder;
    if (curEl && curEl.parentNode) curEl.parentNode.replaceChild(next, curEl);
    else if (curEl) head.parentNode.insertBefore(next, head.nextSibling);
    curEl = next;
  }
  curEl = holder;   // V4.1 必修：初始化当前视图，否则首次点「表格视图」无反应
  return h('div', { class: 'card' }, head, holder);
}

/* ---------- sparkline ---------- */
function sparkline(values, color, invert) {
  const pal = P();
  const w = 84, hgt = 26, pad = 3;
  const pts = values.filter(v => v != null);
  if (pts.length < 2) return h('span', { class: 'hint', text: pts.length ? String(fmt(pts[0])) : '—' });
  const min = Math.min.apply(null, pts), max = Math.max.apply(null, pts);
  const span = max - min || 1;
  const X = i => pad + (w - pad * 2) * i / (values.length - 1);
  const Y = v => {
    const t = (v - min) / span;
    return invert ? pad + (hgt - pad * 2) * t : pad + (hgt - pad * 2) * (1 - t);
  };
  let dstr = '', pen = false, last = null;
  values.forEach((v, i) => {
    if (v == null) { pen = false; return; }
    dstr += (pen ? 'L' : 'M') + X(i).toFixed(1) + ' ' + Y(v).toFixed(1) + ' ';
    pen = true; last = { x: X(i), y: Y(v) };
  });
  // V4.1: 整条线按升降着色（原来恒为灰色），并标末点数值
  const up = pts[pts.length - 1] >= pts[0];
  const stroke = color || (up ? pal.good : pal.critical);
  const lastV = pts[pts.length - 1];
  const svg = `<svg width="${w}" height="${hgt}" viewBox="0 0 ${w} ${hgt}" aria-hidden="true">
    <path d="${dstr}" fill="none" stroke="${stroke}" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round"/>
    ${last ? `<circle cx="${last.x}" cy="${last.y}" r="2.6" fill="${stroke}" stroke="${pal.surface}" stroke-width="1.5"/>` : ''}
  </svg>`;
  return h('span', { html: svg });
}

/* --- 调用 OpenAI 兼容 API（流式） --- */
async function callAI(cfg, messages, onDelta) {
  const url = cfg.base.replace(/\/+$/, '') + '/chat/completions';
  const res = await fetch(url, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + cfg.key },
    body: JSON.stringify({ model: cfg.model, messages, stream: true, temperature: 0.6 }),
  });
  if (!res.ok || !res.body) {
    let detail = '';
    try { detail = (await res.text()).slice(0, 300); } catch (e) { /* ignore */ }
    const map = { 401: 'API Key 无效或已过期', 402: '账户余额不足', 403: '没有权限（模型名写错了？）', 429: '请求太频繁或欠费限流' };
    throw new Error(`HTTP ${res.status}${map[res.status] ? '：' + map[res.status] : ''}${detail ? '｜' + detail : ''}`);
  }
  const reader = res.body.getReader();
  const dec = new TextDecoder();
  let buf = '';
  for (;;) {
    const { done, value } = await reader.read();
    if (done) break;
    buf += dec.decode(value, { stream: true });
    const lines = buf.split('\n');
    buf = lines.pop();
    for (const ln of lines) {
      const m = ln.match(/^data:\s*(.+)$/);
      if (!m) continue;
      if (m[1].trim() === '[DONE]') return;
      try {
        const j = JSON.parse(m[1]);
        const d = j.choices && j.choices[0] && j.choices[0].delta && j.choices[0].delta.content;
        if (d) onDelta(d);
      } catch (e) { /* 非 JSON 行忽略 */ }
    }
  }
}

      h('span', { style: 'color:' + (kind === 'up' ? 'var(--good-text)' : 'var(--critical)'), text: (kind === 'up' ? '↑ +' : '↓ ') + Math.abs(r.totalDelta) }),
      h('span', { class: 'meta', text: ` 总分 ${fmt(r.total)}（年级 ${fmt(r.totalRank)}）` })));

  const grid = h('div', { class: 'grid2' });
  grid.append(mvList('进步最快', '总分较上场涨幅前 5', topUp, r => rowMv(r, 'up'), ei === 0 ? '首场考试，从下一场开始对比' : '暂无'));
  grid.append(mvList('退步最多', '总分较上场跌幅前 5', topDown, r => rowMv(r, 'down'), ei === 0 ? '首场考试，从下一场开始对比' : '暂无'));
  main.append(grid);

  const grid2 = h('div', { class: 'grid2' });
  grid2.append(mvList('一本临界生', `距本一线 ±25 分（线 ${st.line1}），适合重点谈话`, nearLine, r => h('li', {},
    h('span', { class: 'nm', text: r.name }),
    r.cls ? h('span', { class: 'meta', text: r.cls }) : null,
    r.comboName ? h('span', { class: 'meta', text: r.comboName }) : null,
    h('span', { class: 'val' },
      h('span', { style: 'color:' + (r.toLine1 >= 0 ? 'var(--good-text)' : 'var(--critical)'), text: (r.toLine1 >= 0 ? '线上 +' : '线下 ') + fmt(Math.abs(r.toLine1)) + ' 分' }),
      h('span', { class: 'meta', text: ` 总分 ${fmt(r.total)}` })))));
  grid2.append(mvList('连续退步', '最近 3 场均有成绩且总分连降（缺考不判定），建议面谈', dec3, r => h('li', {},
    h('span', { class: 'nm', text: r.name }),
    r.cls ? h('span', { class: 'meta', text: r.cls }) : null,
    r.comboName ? h('span', { class: 'meta', text: r.comboName }) : null,
    h('span', { class: 'val' },
      h('span', { style: 'color:var(--critical)', text: V41.declineText(computed, r.id, ei) }),
      h('span', { class: 'meta', text: ` 当前总分 ${fmt(r.total)}（年级 ${fmt(r.totalRank)}）` })))));
  main.append(grid2);

  // 偏科 / 不匹配名单（点击姓名跳到该生追踪页）
  const mmList = mvList('偏科 / 不匹配名单', '按失衡幅度排序；色块长度＝失衡百分点，● 预警优先介入，⚠ 关注建议谈话；点击整行看详情', mmAll, ({ r, mm }) => h('li', {},
    h('span', { class: 'nm', text: r.name, style: 'text-decoration:underline dotted' }),
    r.cls ? h('span', { class: 'meta', text: r.cls }) : null,
    r.comboName ? h('span', { class: 'meta', text: r.comboName }) : null,
    h('span', { class: 'val' },
      h('span', { style: 'color:' + (mm.level === 'severe' ? 'var(--critical)' : '#d98a00'), text: mm.level === 'severe' ? '● 预警' : '⚠ 关注' }),
      ...V41.mmBadges(mm))), '本名单暂无偏科/不匹配学生');
  main.append(mmList);

  // 完整成绩表（表格视图兜底）
  const tbl = h('table', { class: 'tb' });
  const headCells = ['学号', '姓名', '班级', '选科组合', ...subjKeys.map(k => {
    const def = SUBJECT_MAP[k];
    return (def ? def.name : k) + (isAssignedSubject(k) ? '(赋)' : '');
  }), '总分', '总榜', '物理类', '历史类', '班内', '组合内', '较上场', '上线'];
  tbl.append(h('thead', {}, h('tr', {}, headCells.map(t => h('th', { text: t })))));
  const sorted = rows.slice().sort((a, b) => (a.totalRank || 9999) - (b.totalRank || 9999));
  tbl.append(h('tbody', {}, sorted.map(r => h('tr', {},
    h('td', { text: r.studentId || '—' }), h('td', { text: r.name }), h('td', { text: r.cls || '—' }),
    h('td', { text: r.comboName || '—' }),
    subjKeys.map(k => h('td', { text: r.subj[k] == null ? '—' : fmt(r.subj[k]) })),
    h('td', { text: fmt(r.total) }),
    h('td', { text: fmt(r.totalRank) }),
    h('td', { text: fmt(r.physRank) }),
    h('td', { text: fmt(r.histRank) }),
    h('td', { text: fmt(r.classRank) }),
    h('td', { text: fmt(r.comboRank) }),
    h('td', { class: r.trend || '', text: r.totalDelta == null ? '—' : (r.totalDelta > 0 ? '↑ +' + r.totalDelta : r.totalDelta < 0 ? '↓ ' + r.totalDelta : '持平') }),
    h('td', { text: r.lineStatus || '—' })))));
  main.append(h('div', { class: 'card' },
    h('h2', { text: '成绩明细' }),
    h('p', { class: 'sub', text: '选考科目按赋分计入总分；上线率分母为有有效总分的人数。总榜 = 全年级混合排名；物理类 / 历史类分别排名；班内排名按行政班（拼班混排），组合内排名按选科组合。' }),
    h('div', { class: 'tscroll' }, tbl)));
}

/* ---------- 学生追踪 ---------- */
function renderStudent() {
  const options = studentOptions(data.exams);
  if (!options.length) { main.append(h('div', { class: 'card' }, h('div', { class: 'empty', text: '还没有学生数据。' }))); return; }
  let curOpt = options.find(o => o.key === ui.student);
  if (!curOpt) {
    curOpt = options.find(o => o.name === ui.student) || options[0];
    ui.student = curOpt.key;
  }
  const computed = computeAll(data);
  const hist = studentHistory(computed, ui.student);
  const latestIdx = (() => { for (let i = hist.length - 1; i >= 0; i--) if (hist[i]) return i; return -1; })();
  const row = latestIdx >= 0 ? hist[latestIdx] : null;
  const examNames = data.exams.map(e => e.name);
  const axisLabels = data.exams.map((e, i) => V41.axisLabel(e, i));
  const hasDates = data.exams.some(e => !!e.date);

  // V4.1: 搜索 + 按班级分组 + 最近查看；保持 ui.student 与 #student|<key> 路由不变
  main.append(h('div', { class: 'card', style: 'margin-top:16px' },
    V41.buildStudentPicker(options, ui.student),
    h('div', { class: 'row', style: 'align-items:flex-end;gap:16px;margin-top:10px' },
      row ? h('span', { class: 'tag', text: row.cls || '未分班' }) : null,
      row && row.comboName ? h('span', { class: 'tag', text: row.comboName + '（' + row.trackName + '）' }) : null,
      row ? h('span', { class: 'tag', text: row.studentId ? '学号 ' + row.studentId : '无学号（按班级姓名对齐）' }) : null,
      row && latestIdx >= 0 ? h('span', { class: 'tag', text: V41.examLabel(data.exams[latestIdx], latestIdx) }) : null,
      row ? lineTag(row) : null)));

  if (!row) { main.append(h('div', { class: 'card' }, h('div', { class: 'empty', text: '没有找到该学生的成绩。' }))); return; }

  // KPI（一个 hero + 若干 stat）
  const kpis = h('div', { class: 'kpis' });
  kpis.append(h('div', { class: 'kpi hero' },
    h('div', { class: 'lb', text: '最近总分' }),
    h('div', { class: 'vl', text: fmt(row.total) }),
    h('div', { class: 'dt ' + (row.trend === 'up' ? 'up' : row.trend === 'down' ? 'down' : 'flat'),
      text: row.totalDelta == null ? '首次考试' : (row.totalDelta > 0 ? '↑ 较上场 +' + row.totalDelta : row.totalDelta < 0 ? '↓ 较上场 ' + row.totalDelta : '与上场持平') })));
  kpis.append(h('div', { class: 'kpi' }, h('div', { class: 'lb', text: '年级排名（总榜）' }), h('div', { class: 'vl', text: fmt(row.totalRank) }),
    h('div', { class: 'dt ' + (row.rankDelta > 0 ? 'up' : row.rankDelta < 0 ? 'down' : 'flat'),
      text: row.rankDelta == null ? (row.totalRank ? '学校官方年排' : '—') : (row.rankDelta > 0 ? '↑ 升 ' + row.rankDelta + ' 名' : row.rankDelta < 0 ? '↓ 降 ' + Math.abs(row.rankDelta) + ' 名' : '名次不变') })));
  // 物理类 / 历史类排名
  if (row.track1 === 'physics') {
    kpis.append(h('div', { class: 'kpi' }, h('div', { class: 'lb', text: '物理类排名' }), h('div', { class: 'vl', text: fmt(row.physRank) }),
      h('div', { class: 'dt flat', text: '物理类单独排名' })));
  } else {
    kpis.append(h('div', { class: 'kpi' }, h('div', { class: 'lb', text: '历史类排名' }), h('div', { class: 'vl', text: fmt(row.histRank) }),
      h('div', { class: 'dt flat', text: '历史类单独排名' })));
  }
  kpis.append(h('div', { class: 'kpi' }, h('div', { class: 'lb', text: '班内排名' }), h('div', { class: 'vl', text: fmt(row.classRank) }),
    h('div', { class: 'dt flat', text: (row.cls || '—') + (row.comboName ? ' · ' + row.comboName : '') })));
  kpis.append(h('div', { class: 'kpi' }, h('div', { class: 'lb', text: '上线情况' }),
    h('div', { class: 'vl', style: 'font-size:18px;' + (row.lineStatus === '一本线上' ? 'color:var(--good-text)' : row.lineStatus === '未上线' ? 'color:var(--critical)' : ''), text: row.lineStatus || '—' }),
    h('div', { class: 'dt flat', text: `距一本 ${fmtSigned(row.toLine1)} · 距二本 ${fmtSigned(row.toLine2)}` })));
  main.append(kpis);

  // 总分趋势（含两条线）
  const stLast = computed[latestIdx].stats;
  main.append(lineChartCard({
    title: '总分趋势', sub: '满分 750；虚线为各场本一线 / 本二线（按场取线）' + (hasDates ? '；横轴为考试日期' : ''),
    xLabels: axisLabels,
    series: [{ key: 'total', name: '总分', color: P().accent, values: hist.map(r => r ? r.total : null) }],
    refs: [
      { y: stLast.line1, values: computed.map(c => c && c.stats ? c.stats.line1 : null), label: '本一线', color: P().good },
      { y: stLast.line2, values: computed.map(c => c && c.stats ? c.stats.line2 : null), label: '本二线', color: P().warn },
    ],
    labelLast: true, height: 230,
  }));

  // 年级排名趋势（名次越小越好 → 反转轴）
  main.append(lineChartCard({
    title: '年级排名趋势', sub: '名次越靠上越好 · 优先使用学校官方年排',
    xLabels: axisLabels,
    series: [{ key: 'rank', name: '年级排名', color: P().accent, values: hist.map(r => r ? r.totalRank : null) }],
    invertY: true, labelLast: true, height: 210, yUnit: ' 名',
  }));

  // 分类排名趋势（物理类 / 历史类）
  const trackKey = row.track1 === 'history' ? 'histRank' : 'physRank';
  if (hist.some(r => r && r[trackKey] != null)) {
    main.append(lineChartCard({
      title: row.track1 === 'history' ? '历史类排名趋势' : '物理类排名趋势',
      sub: '同一类别内的排名（不含另一类）',
      xLabels: axisLabels,
      series: [{ key: trackKey, name: row.track1 === 'history' ? '历史类排名' : '物理类排名', color: P().series[3], values: hist.map(r => r ? r[trackKey] : null) }],
      invertY: true, labelLast: true, height: 210, yUnit: ' 名',
    }));
  }

  // 该生本场的科目列表（动态）
  const myKeys = sortSubjectKeys(row.subjectKeys && row.subjectKeys.length
    ? row.subjectKeys
    : SUBJECT_DEFS.map(s => s.key).filter(k => row.subj[k] != null));

  // V4.1: 语数外 150 分制与选考 100 分制共轴会误导，默认提供「得分率」口径
  const rateOn = !!ui.chartRate;
  main.append(h('div', { class: 'v41-chart-tools' },
    h('span', { class: 'hint', text: '各科口径：' }),
    h('button', { class: 'chip' + (!rateOn ? ' on' : ''), text: '原始分', onclick: () => { ui.chartRate = false; render(); } }),
    h('button', { class: 'chip' + (rateOn ? ' on' : ''), text: '得分率 %', onclick: () => { ui.chartRate = true; render(); } }),
    h('span', { class: 'hint', text: rateOn
      ? '不同满分科目换算成得分率后才可直接比高低；末点标出最强 / 最弱两科'
      : '注意：150 分制与 100 分制画在同一根轴上，分数高低不能直接代表强弱' })));
  const subjSeries = myKeys.map(k => {
    const def = SUBJECT_MAP[k];
    const max = def ? def.max : 100;
    return { key: k, name: def ? def.name : k, color: subjColor(k),
      values: hist.map(r => r ? (r.subj[k] == null ? null : (rateOn ? r.subj[k] / max * 100 : r.subj[k])) : null) };
  });
  main.append(lineChartCard({
    title: '各科成绩趋势', sub: rateOn ? '得分率口径 · 各科满分不同也可直接比较；点击图例可隐藏科目' : '原始分口径 · 点击图例可隐藏科目',
    xLabels: axisLabels, series: subjSeries,
    yUnit: rateOn ? '%' : ' 分', height: 260, labelEnds: true,
  }));

  // 各科评估
  const evals = [];
  const grid = h('div', { class: 'subj-grid' });
  for (const k of myKeys) {
    const s = SUBJECT_MAP[k];
    if (!s) continue;
    const cExam = computed[latestIdx];
    const listAvg = cExam.stats.subjAvg[k];
    const clsRows = row.cls ? cExam.rows.filter(r => r.cls === row.cls && r.subj[k] != null) : [];
    const classAvg = clsRows.length ? clsRows.reduce((a, r) => a + r.subj[k], 0) / clsRows.length : null;
    const ev = subjectEval(row, s, listAvg, classAvg, clsRows.length, hist, latestIdx);
    if (!ev) { grid.append(h('div', { class: 'subj-card' }, h('div', { class: 'hd' }, h('span', { class: 'dot', style: 'background:' + subjColor(k) }), h('span', { class: 'nm', text: s.name })), h('div', { class: 'hint', text: '本场缺考/未录入' }))); continue; }
    evals.push({ s, ev });
    const bdCls = ev.levelCls === 'good' ? 'good' : ev.levelCls === 'crit' ? 'crit' : 'warn';
    grid.append(h('div', { class: 'subj-card' },
      h('div', { class: 'hd' },
        h('span', { class: 'dot', style: 'background:' + subjColor(k) }),
        h('span', { class: 'nm', text: s.name }),
        h('span', { class: 'bd tag ' + bdCls, text: (ev.levelCls === 'good' ? '✓ ' : ev.levelCls === 'crit' ? '⚠ ' : '') + ev.level })),
      h('div', { class: 'sc' }, fmt(ev.score), h('small', { text: ' / ' + s.max + (isAssignedSubject(k) ? '（赋分）' : '') })),
      h('div', { class: 'meter' }, h('i', { style: 'width:' + Math.round(ev.rate * 100) + '%;background:' + subjColor(k) })),
      h('dl', {},
        h('dt', { text: '得分率' }), h('dd', { text: pct(ev.rate) }),
        h('dt', { text: '名单单科名次' }), h('dd', { text: fmt(ev.rank) }),
        h('dt', { text: '与名单均分比' }), h('dd', { style: ev.vsSchool != null && ev.vsSchool < 0 ? 'color:var(--critical)' : 'color:var(--good-text)', text: ev.vsSchool == null ? '—' : fmtSigned(Math.round(ev.vsSchool * 10) / 10) + ' 分' }),
        h('dt', { text: '与班均比' }), h('dd', { text: ev.vsClass == null ? '—' : fmtSigned(Math.round(ev.vsClass * 10) / 10) }),
        h('dt', { text: '近三次' }), h('dd', {}, ev.trendDelta == null ? h('span', { class: 'hint', text: '数据不连续' }) : sparkline(ev.spark, subjColor(k))))));
  }
  main.append(h('div', { class: 'card' }, h('h2', { text: '各科评估' }),
    h('p', { class: 'sub', text: '均分与单科名次仅覆盖本次导入名单；缺考/间隔场次不做走势判断。按得分率分档：≥85% 优秀 · ≥70% 良好 · ≥60% 中等 · 其余待提高' }), grid));

  // ---- 偏科 / 不匹配评估 ----
  const subjAvgs = computed[latestIdx].stats.subjAvg;
  const mm = mismatchEval(row, latestIdx, subjAvgs);
  if (mm) {
    const cfg = mismatchSettings();
    const totalRanked = mm.listTotal || mm.subjects.filter(x => x.ranked).length;
    const sub = `双口径判定：自身失衡决定档位——某科得分率比自身各科平均低 ≥${Math.round(cfg.selfGap * 100)}% 标「关注」，≥${Math.round(cfg.severeGap * 100)}% 标「预警」；名单口径（比该科均分低 ≥${Math.round(cfg.vsAvgGap * 100)}% 或排名落入后 ${Math.round(cfg.rankTail * 100)}%）作佐证并用于排序，不单独触发（名单不足 ${cfg.minRanked} 人不看排名）`;
    let headTag = null;
    if (mm.level === 'severe') headTag = h('span', { class: 'tag crit', text: '● 预警 · 严重不匹配，优先介入' });
    else if (mm.level === 'watch') headTag = h('span', { class: 'tag warn', text: '⚠ 关注 · 明显偏科，建议谈话' });
    else headTag = h('span', { class: 'tag good', text: '✓ 各科均衡' });
    // 各科得分率横向条形（按与自身平均/名单均分差距着色）
    const wrap = h('div', { style: 'display:flex;flex-direction:column;gap:6px;margin-top:10px' });
    for (const x of mm.subjects.slice().sort((a, b) => b.rate - a.rate)) {
      const bad = x.level === 'severe' ? 'var(--critical)' : x.level === 'watch' ? '#d98a00' : 'var(--good-text)';
      const barColor = x.level === 'ok' ? subjColor(x.key) : bad;
      const marks = [];
      // 只有该科已被标记时才列佐证，避免「均衡」的学生满屏红字造成误读
      if (x.level !== 'ok') {
        if (x.selfHit) marks.push(`自身 -${Math.round(x.selfGap * 100)}%`);
        if (x.avgHit) marks.push(x.vsAvgGap != null ? `均分 -${Math.round(x.vsAvgGap * 100)}%` : '低于均分');
        if (x.rankHit) marks.push(`名单后 ${Math.round(x.tail * 100)}%`);
      }
      wrap.append(h('div', { style: 'display:flex;align-items:center;gap:10px' },
        h('span', { style: 'width:36px;font-size:12px;color:var(--ink-2)', text: x.name }),
        h('div', { class: 'meter', style: 'flex:1;margin:0' },
          h('i', { style: 'width:' + Math.round(x.rate * 100) + '%;background:' + barColor })),
        h('span', { style: 'width:44px;text-align:right;font-variant-numeric:tabular-nums;font-size:12px', text: pct(x.rate) }),
        h('span', { style: 'width:64px;text-align:right;font-size:12px;color:var(--muted)', text: x.ranked ? `第 ${x.rank} / ${totalRanked}` : '无排名' }),
        marks.length ? h('span', { style: 'font-size:12px;color:' + bad, text: marks.join(' · ') }) : null));
    }
    let noteHtml = null;
    if (mm.level !== 'ok') {
      const tips = [];
      for (const x of mm.flagged) {
        const parts = [`得分率 ${pct(x.rate)}`];
        if (x.selfHit) parts.push(`比自身各科平均（${pct(mm.selfAvg)}）低 ${Math.round(x.selfGap * 100)}%`);
        if (x.avgHit && x.vsAvgGap != null) parts.push(`比该科名单均分（${pct(x.avgRate)}）低 ${Math.round(x.vsAvgGap * 100)}%`);
        if (x.rankHit) parts.push(`本次名单单科排名第 ${x.rank}（共 ${totalRanked} 人），落入后 ${Math.round(x.tail * 100)}%`);
        tips.push(h('li', {}, h('strong', { text: x.name + '：' }), parts.join('；') + '。'));
      }
      noteHtml = h('div', { style: 'margin-top:10px' },
        h('div', { style: 'font-size:13px;font-weight:650;margin-bottom:2px', text: mm.level === 'severe' ? '不匹配科目（优先介入）' : '不匹配科目（建议关注）' }),
        h('ul', { style: 'margin:4px 0 0;padding-left:20px;color:var(--ink-2);font-size:13px;line-height:1.8' }, tips));
    }
    main.append(h('div', { class: 'card' },
      h('h2', { text: '偏科 / 不匹配' }),
      h('p', { class: 'sub', text: sub }),
      h('div', { style: 'margin-bottom:6px' }, headTag),
      wrap, noteHtml));
  }

  // 复习建议
  const adviceItems = evals.map(({ s, ev }) => {
    const a = buildAdvice(s, {
      rate: ev.rate, trend: ev.trend, trendDelta: ev.trendDelta, vsSchool: ev.vsSchool,
      score: ev.score, schoolAvg: computed[latestIdx].stats.subjAvg[s.key], subjectName: s.name,
    });
    return { s, ev, a };
  }).sort((x, y) => y.a.priority - x.a.priority);
  const ul = h('ul', { class: 'advice' });
  for (const it of adviceItems) {
    ul.append(h('li', {},
      h('div', { class: 'ah' },
        h('span', { class: 'dot', style: 'background:' + subjColor(it.s.key) }),
        it.s.name,
        h('span', { class: 'pr', text: `优先级：${it.ev.rate < 0.65 ? '高' : it.ev.rate < 0.80 ? '中' : '巩固'} · 得分率 ${pct(it.ev.rate)}` })),
      h('p', { text: it.a.text })));
  }

  const briefCtx = {

    subjectKeys: myKeys, examNames, rows: hist,
    line1: computed[latestIdx].stats.line1, line2: computed[latestIdx].stats.line2,

  const briefMd = studentBriefMd(briefCtx);
  const aiMsg = h('div', { class: 'msg' });

      'max-height:520px;overflow:auto;border:1px solid var(--grid);border-radius:8px;padding:12px 14px;display:none',
  });
  if (aiOut.name === ui.student && aiOut.text) { aiText.style.display = 'block'; aiText.textContent = aiOut.text; }
  const genBtn = h('button', {
    class: 'btn primary', text: '生成 AI 深度分析',
    onclick: async () => {
      if (!aiCfg.key) { aiMsg.className = 'msg err'; aiMsg.textContent = '还没配置 API：请先到「设置」页选择服务商并填入 API Key。'; return; }
      if (aiOut.running) return;

function renderImportPreview(exam) {
  const pv = entryPreview;
  if (!pv || pv.examIdx !== ui.examIdx) return null;
  const blocked = !!pv.errors.length;
  const wrap = h('div', { class: 'banner', id: 'importPreview', style: 'border-left-color:var(--accent);margin-top:14px' });

  wrap.append(h('div', { style: 'display:flex;align-items:center;gap:8px;flex-wrap:wrap' },
    h('strong', { text: '整理结果预览' }),
    h('span', { class: 'tag good', text: `识别 ${pv.students.length} 人` }),
    pv.meta && pv.meta.skipped ? h('span', { class: 'tag', text: `跳过 ${pv.meta.skipped} 行` }) : null,
    pv.meta && pv.meta.filledClass ? h('span', { class: 'tag', text: `补班级 ${pv.meta.filledClass} 行` }) : null,
    pv.meta && pv.meta.missingYearRank ? h('span', { class: 'tag', text: `无年排 ${pv.meta.missingYearRank} 人（排名留空）` })
      : (pv.meta && pv.meta.yearRankColumn ? h('span', { class: 'tag good', text: '官方年排已就绪' }) : null),
    pv.errors.length ? h('span', { class: 'tag crit', text: `${pv.errors.length} 个必须修正` }) : h('span', { class: 'tag good', text: '校验通过' })));

  if (pv.notes.length) {
    wrap.append(h('ul', { style: 'margin:8px 0 0;padding-left:20px;color:var(--ink-2);font-size:12px;line-height:1.8' },
      pv.notes.map(t => h('li', { text: t }))));
  }

  // 无表头表：科目列是按位置推测的，让用户核对（改完点「按此对照重新整理」）
  if (pv.meta && pv.meta.mode === 'position' && pv.meta.guessedSubjects) {
    const cur = data.settings.combos || DEFAULT_COMBOS;
    const pool = SUBJECT_DEFS.map(s => s.key).filter(k => cur.some(c => comboSubjectKeys(c).includes(k)));
    const guessed = pv.meta.guessedSubjects;
    const assignCols = pv.meta.assignedIdx || [];
    const rowFor = (label, idx, isAssign) => {
      // 当前值：用户手动指定过的优先，否则用系统推测的
      const curVal = (isAssign ? (entryAssignedMap || {})[idx] : (entrySubjectMap || {})[idx])
        || (isAssign ? '' : (guessed[idx] || ''));
      const sel = h('select', {
        onchange: ev => {
          const target = isAssign ? (entryAssignedMap || (entryAssignedMap = {})) : (entrySubjectMap || (entrySubjectMap = {}));
          target[idx] = ev.target.value || '';
          if (!isAssign) entrySubjectMap = target;
          else entryAssignedMap = target;
        },
      },
        h('option', { value: '', text: isAssign ? '（不作为赋分列）' : '（忽略此列）' }),
        (isAssign ? pool.filter(k => isAssignedSubject(k)) : pool).map(k => h('option', {
          value: k, selected: curVal === k ? '' : null,
        }, (SUBJECT_MAP[k] ? SUBJECT_MAP[k].name : k) + (isAssignedSubject(k) ? '（赋分）' : ''))));
      return h('div', { style: 'display:flex;align-items:center;gap:8px;margin-bottom:6px' },
        h('span', { style: 'min-width:80px;font-size:12px;color:var(--ink-2)', text: label }),
        h('span', { style: 'min-width:52px;font-size:12px;color:var(--muted)', text: `第 ${idx + 1} 列` }),
        sel);
    };
    const box = h('div', { style: 'margin-top:10px;padding:12px 14px;border:1px solid var(--border);border-radius:10px;background:var(--surface-2)' },
      h('div', { style: 'font-size:13px;font-weight:650;margin-bottom:8px', text: '科目列对照（请核对）' }),
      h('p', { class: 'hint', style: 'margin:0 0 10px', text: '没有表头时系统只能按位置推测科目，认错了请在这里改，然后点「按此对照重新整理」。' }),
      h('div', { style: 'display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:0 24px' },
        h('div', {}, guessed.map((k, i) => rowFor('第 ' + (i + 1) + ' 个科目列', i, false))),
        assignCols.length ? h('div', {}, assignCols.map((idx, i) => rowFor('赋分列 ' + (i + 1), i, true))) : null),
      h('div', { style: 'margin-top:10px' },
        h('button', {
          class: 'btn primary', id: 'reparseBtn', text: '按此对照重新整理',
          onclick: () => {
            const opts = {
              combos: data.settings.combos || DEFAULT_COMBOS,
              classes: data.settings.classes || DEFAULT_CLASSES,
            };
            if (entrySubjectMap) opts.subjectMap = entrySubjectMap;
            if (entryAssignedMap) opts.assignedMap = entryAssignedMap;
            const res = parseImport(entryText, opts);
            entryPreview = Object.assign({ examIdx: ui.examIdx }, res);
            render();
          },
        })));
    wrap.append(box);
  }

  if (pv.errors.length) {
    wrap.append(h('div', { class: 'banner crit', style: 'margin-top:10px' },
      h('div', { style: 'font-weight:600', text: `必须修正（显示前 ${Math.min(10, pv.errors.length)} 条；导入已暂停）：` }),
      h('ul', {}, pv.errors.slice(0, 10).map(t => h('li', { text: t }))),
      pv.errors.length > 10 ? h('div', { class: 'hint', text: `还有 ${pv.errors.length - 10} 条，请修正源表后重新选择 Excel 文件。` }) : null));
  }

  // 预览表：动态科目
  const combosNow = data.settings.combos || DEFAULT_COMBOS;
  const previewFields = scoreFieldsForCombos(combosNow);
  const cols = [
    ['学号', 'studentId'], ['姓名', 'name'], ['班级', 'cls'], ['组合', 'comboId'], ['年排', 'yearRank'],
    ...previewFields.map(f => [f.label, f.key]),
  ];
  const tbl = h('table', { class: 'tb' });
  tbl.append(h('thead', {}, h('tr', {}, cols.map(c => h('th', { text: c[0] })))));
  tbl.append(h('tbody', {}, pv.students.slice(0, 200).map(s => h('tr', {},
    cols.map(([, key]) => h('td', {
      text: key === 'comboId'

  wrap.append(h('div', { class: 'tscroll', style: 'margin-top:10px;max-height:320px' }, tbl));

  wrap.append(h('div', { class: 'row', style: 'margin-top:12px;gap:8px;align-items:center' },
    h('button', {
      class: 'btn primary',
      text: blocked ? '修正错误后才能导入' : (pv.students.length ? `确认导入 ${pv.students.length} 人` : '没有可导入的学生'),

      onclick: async () => {
        if (!pv.students.length || blocked) return;
        if (exam.students.length && !(await myConfirm(`确认导入 ${pv.students.length} 人，覆盖原有 ${exam.students.length} 人？`))) return;
        exam.students = pv.students.map(s => {
          const out = {
            studentId: s.studentId || '', name: s.name, cls: s.cls || '',
            comboId: s.comboId || '', yearRank: s.yearRank,
          };
          for (const f of previewFields) out[f.key] = s[f.key];
          return out;
        });
        data.isSample = false;
        entryNotice = `已导入 ${pv.students.length} 名学生到「${exam.name}」（年级排名采用学校官方年排）。`;
        entryPreview = null;
        entryText = '';
        saveData('导入成绩');
        render();
      },
    }),
    h('button', { class: 'btn', text: '取消', onclick: () => { entryPreview = null; render(); } }),
    blocked
      ? h('span', { class: 'hint', style: 'color:var(--critical)', text: '错误已拦截：修正源表后重新选择 Excel 文件并预览。' })
      : h('span', { class: 'hint', text: '跨场追踪优先按学号；无学号时按「班级 + 姓名」对齐。' })));
  return wrap;
}

function lineTag(r) {
  if (!r.lineStatus) return null;
  const cls = r.lineStatus === '一本线上' ? 'good' : r.lineStatus === '未上线' ? 'crit' : '';
  return h('span', { class: 'tag ' + cls, text: (r.lineStatus === '一本线上' ? '✓ ' : r.lineStatus === '未上线' ? '⚠ ' : '') + r.lineStatus });
}

      h('li', { text: '「偏科 / 不匹配」以自身失衡定档：某科得分率比该生各科平均低达到阈值标「关注」，失衡特别严重标「预警」；名单口径（低于该科均分 / 排名后段）只作佐证与排序，不单独触发，避免各科里总有一科靠后造成误报。阈值可在「设置」里调整。' }))));
}

/* ================================================================
   V4.1 扩展模块 ①：交互底座 / 快照 / Excel / 体检 / 手机只读引导
   ================================================================ */
const V41 = {
  VER: '4.1',
  READ_ONLY: /[?&]readonly=1/.test(location.search) || !!window.__V41_READONLY__,
  PRINT: null,
  SNAP_URL: /[?&]src=([^&]+)/.test(location.search) ? decodeURIComponent(location.search.match(/[?&]src=([^&]+)/)[1]) : 'snapshot.json',
  SNAP_TS: null,
  DB: null, DB_NAME: 'aki-grade-tracker-v41', STORE: 'snaps', MAX: 3,
  snaps: [], lastSnapAt: 0, lastSig: '',
  pref: { fs: 'std', recent: [] },
  _booted: false,

  /* ---------- 展示偏好（与业务数据隔离，不进备份） ---------- */
  loadPref() {
    try { const p = JSON.parse(localStorage.getItem('aki-v41-pref') || '{}');
      if (p && typeof p === 'object') this.pref = Object.assign(this.pref, p); } catch (e) {}
  },
  savePref() { try { localStorage.setItem('aki-v41-pref', JSON.stringify(this.pref)); } catch (e) {} },
  applyPref() {
    this.loadPref();
    const fs = this.pref.fs || (this.READ_ONLY ? 'lg' : 'std');
    document.documentElement.setAttribute('data-fs', fs);
  },
  cycleFs() {
    const order = ['std', 'lg', 'xl'];
    const i = order.indexOf(this.pref.fs || 'std');
    this.pref.fs = order[(i + 1) % order.length];
    this.savePref(); this.applyPref();
  },
  markRecent(key) {
    if (!key) return;
    const a = (this.pref.recent || []).filter(x => x !== key);
    a.unshift(key); this.pref.recent = a.slice(0, 8); this.savePref();
  },

  /* ---------- 数据结构兼容（旧 JSON 备份照常可开） ---------- */
  normalize(d) {
    if (!d || !Array.isArray(d.exams) || !d.settings) {
      return { settings: defaultSettings(), exams: generateSample(), isSample: true, profiles: {} };
    }
    d.isSample = !!d.isSample;
    if (!d.profiles || typeof d.profiles !== 'object') d.profiles = {};
    const def = defaultSettings();
    if (!Array.isArray(d.settings.combos) || !d.settings.combos.length) d.settings.combos = def.combos;
    if (!Array.isArray(d.settings.classes)) d.settings.classes = def.classes;
    if (!d.settings.mismatch || typeof d.settings.mismatch !== 'object') d.settings.mismatch = def.mismatch;
    if (d.settings.line1 == null) d.settings.line1 = def.line1;
    if (d.settings.line2 == null) d.settings.line2 = def.line2;
    for (const ex of d.exams) {
      if (ex.date == null) ex.date = '';            // V4.1 新增：可选考试日期
      if (!Array.isArray(ex.students)) ex.students = [];
    }
    for (const k in d.profiles) {
      const p = d.profiles[k];
      if (p && p.goalScore == null) p.goalScore = null; // V4.1 新增：数值型目标总分
    }
    return d;
  },

  bootData() {
    if (window.__V41_DATA__) {
      this.READ_ONLY = true;
      try {
        const raw = typeof window.__V41_DATA__ === 'string' ? JSON.parse(window.__V41_DATA__) : window.__V41_DATA__;
        return this.normalize(raw.data || raw);
      } catch (e) { myAlert('内嵌快照读取失败：' + e.message); }
    }
    if (this.READ_ONLY) return this.normalize(loadData());
    return loadData();
  },

  /* ---------- 自绘确认框 / 轻提示 ---------- */
  /* ---------- IndexedDB 快照 ---------- */
  openDB() {
    return new Promise(res => {
      if (!window.indexedDB) return res(null);
      try {
        const rq = indexedDB.open(this.DB_NAME, 1);
        rq.onupgradeneeded = () => {
          const db = rq.result;
          if (!db.objectStoreNames.contains(this.STORE)) db.createObjectStore(this.STORE, { keyPath: 'id', autoIncrement: true });
        };
        rq.onsuccess = () => { this.DB = rq.result; res(this.DB); };
        rq.onerror = () => res(null);
      } catch (e) { res(null); }
    });
  },
  tx(mode, fn) {
    return new Promise(async res => {
      const db = this.DB || await this.openDB();
      if (!db) return res(null);
      try {
        const t = db.transaction(this.STORE, mode);
        const st = t.objectStore(this.STORE);
        const rq = fn(st);
        rq.onsuccess = () => res(rq.result);
        rq.onerror = () => res(null);
      } catch (e) { res(null); }
    });
  },
  async listSnaps() {
    const all = await this.tx('readonly', st => st.getAll());
    this.snaps = (all || []).slice().sort((a, b) => b.ts - a.ts);
    // 打开设置页时立即裁到最近 3 份（已确认：更早的本机快照不再保留）
    if (this.snaps.length > this.MAX && !this.READ_ONLY) {
      for (const old of this.snaps.slice(this.MAX)) await this.tx('readwrite', st => st.delete(old.id));
      this.snaps = this.snaps.slice(0, this.MAX);
    }
    return this.snaps;
  },
  async putSnap(rec) {
    const id = await this.tx('readwrite', st => st.add(rec));
    // 只保留最近 3 份
    const all = await this.listSnaps();
    if (all.length > this.MAX) {
      for (const old of all.slice(this.MAX)) await this.tx('readwrite', st => st.delete(old.id));
    }
    return id;
  },
  async delSnap(id) {
    await this.tx('readwrite', st => st.delete(id));
    await this.listSnaps();
  },
  /* saveData 调用：prevRaw = 改动前的 localStorage 内容，即「可回滚的旧版」 */
  autoSnapshot(prevRaw, reason) {
    if (this.READ_ONLY || !prevRaw) return;
    try {
      const d = JSON.parse(prevRaw);
      const exams = (d.exams || []).length;
      const students = (d.exams || []).reduce((n, x) => n + ((x.students || []).length), 0);
      const sig = exams + '/' + students;
      const now = Date.now();
      const force = !!reason;
      if (!force && now - this.lastSnapAt < 10 * 60 * 1000 && sig === this.lastSig) return;
      this.lastSnapAt = now; this.lastSig = sig;
      this.putSnap({ ts: now, reason: reason || '自动快照', exams, students,
        bytes: prevRaw.length, payload: prevRaw });
    } catch (e) { /* 快照失败不影响主流程 */ }
  },
  async snapshotNow(label) {
    const raw = localStorage.getItem(LS_KEY);
    if (!raw) return;
    const d = JSON.parse(raw);
    await this.putSnap({ ts: Date.now(), reason: label || '手动存档',
      exams: (d.exams || []).length,
      students: (d.exams || []).reduce((n, x) => n + ((x.students || []).length), 0),
      bytes: raw.length, payload: raw });
    await this.listSnaps();
  },
  async rollback(id) {
    const snap = (await this.listSnaps()).find(x => x.id === id);
    if (!snap) { myAlert('找不到这份快照。'); return; }
    if (!(await myConfirm(`回滚到 ${this.fmtTime(snap.ts)}（${snap.reason}）？\n当前数据会先自动留一份快照，再被这份覆盖。`, '确认回滚'))) return;
    await this.snapshotNow('回滚前自动留档');
    try {
      const d = JSON.parse(snap.payload);
      data = this.normalize(d);
      localStorage.setItem(LS_KEY, snap.payload);
      ui.examIdx = 0; ui.student = '';
      render();
      myAlert('已回滚。');
    } catch (e) { myAlert('回滚失败：' + e.message); }
  },
  fmtTime(ts) {
    const d = new Date(ts), p = n => String(n).padStart(2, '0');
    return d.getFullYear() + '-' + p(d.getMonth() + 1) + '-' + p(d.getDate()) + ' ' + p(d.getHours()) + ':' + p(d.getMinutes()) + ':' + p(d.getSeconds());
  },

  /* ---------- 数据体检 ---------- */
  health() {
    let bytes = 0;
    try { bytes = (localStorage.getItem(LS_KEY) || '').length * 2; } catch (e) {}
    const exams = (data.exams || []).length;
    const students = (data.exams || []).reduce((n, x) => n + ((x.students || []).length), 0);
    return { bytes, exams, students, snaps: this.snaps.length, pct: Math.min(100, bytes / (5 * 1024 * 1024) * 100) };
  },

  /* ---------- 零依赖 XLSX 导出 ---------- */
  crc32(buf) {
    let c, crc = 0xFFFFFFFF;
    for (let i = 0; i < buf.length; i++) {
      c = (crc ^ buf[i]) & 0xff;
      for (let k = 0; k < 8; k++) c = (c & 1) ? (0xEDB88320 ^ (c >>> 1)) : (c >>> 1);
      crc = (crc >>> 8) ^ c;
    }
    return (crc ^ 0xFFFFFFFF) >>> 0;
  },
  zip(files) {
    const enc = new TextEncoder();
    const locals = [], centrals = [];
    let offset = 0;
    for (const f of files) {
      const name = enc.encode(f.name);
      const dat = typeof f.data === 'string' ? enc.encode(f.data) : f.data;
      const crc = this.crc32(dat);
      const lh = new Uint8Array(30 + name.length), dv = new DataView(lh.buffer);
      dv.setUint32(0, 0x04034b50, true); dv.setUint16(4, 20, true); dv.setUint16(6, 0x0800, true);
      dv.setUint16(8, 0, true); dv.setUint16(10, 0, true); dv.setUint16(12, 0, true);
      dv.setUint32(14, crc, true); dv.setUint32(18, dat.length, true); dv.setUint32(22, dat.length, true);
      dv.setUint16(26, name.length, true); dv.setUint16(28, 0, true);
      lh.set(name, 30);
      locals.push(lh, dat);
      const ch = new Uint8Array(46 + name.length), cv = new DataView(ch.buffer);
      cv.setUint32(0, 0x02014b50, true); cv.setUint16(4, 20, true); cv.setUint16(6, 20, true);
      cv.setUint16(8, 0x0800, true); cv.setUint16(10, 0, true); cv.setUint16(12, 0, true);
      cv.setUint16(14, 0, true); cv.setUint32(16, crc, true);
      cv.setUint32(20, dat.length, true); cv.setUint32(24, dat.length, true);
      cv.setUint16(28, name.length, true); cv.setUint16(30, 0, true); cv.setUint16(32, 0, true);
      cv.setUint16(34, 0, true); cv.setUint16(36, 0, true); cv.setUint32(38, 0, true);
      cv.setUint32(42, offset, true);
      ch.set(name, 46);
      centrals.push(ch);
      offset += lh.length + dat.length;
    }
    const cSize = centrals.reduce((a, b) => a + b.length, 0);
    const end = new Uint8Array(22), ev = new DataView(end.buffer);
    ev.setUint32(0, 0x06054b50, true); ev.setUint16(4, 0, true); ev.setUint16(6, 0, true);
    ev.setUint16(8, files.length, true); ev.setUint16(10, files.length, true);
    ev.setUint32(12, cSize, true); ev.setUint32(16, offset, true); ev.setUint16(20, 0, true);
    return new Blob([...locals, ...centrals, end],
      { type: 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet' });
  },
  xe(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&apos;' }[c])); },
  colName(n) { let s = ''; n++; while (n > 0) { const m = (n - 1) % 26; s = String.fromCharCode(65 + m) + s; n = Math.floor((n - 1) / 26); } return s; },
  sheetXml(rows) {
    let x = '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>' +
      '<worksheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main"><sheetData>';
    rows.forEach((row, ri) => {
      x += '<row r="' + (ri + 1) + '">';
      row.forEach((v, ci) => {
        const ref = this.colName(ci) + (ri + 1);
        if (typeof v === 'number' && isFinite(v)) x += '<c r="' + ref + '"><v>' + v + '</v></c>';
        else x += '<c r="' + ref + '" t="inlineStr"><is><t xml:space="preserve">' + this.xe(v) + '</t></is></c>';
      });
      x += '</row>';
    });
    return x + '</sheetData></worksheet>';
  },
  safeSheet(s) { return String(s || '表').replace(/[\\\/\?\*\[\]:]/g, '-').slice(0, 30) || '表'; },
  buildXlsx() {
    const sheets = [];
    const all = computeAll(data);
    data.exams.forEach((ex, i) => {
      const c = all[i];
      const keys = [];
      const seen = new Set();
      for (const r of (c.rows || [])) for (const k of (r.subjectKeys || [])) if (!seen.has(k)) { seen.add(k); keys.push(k); }
      keys.sort((a, b) => SUBJECT_ORDER.indexOf(a) - SUBJECT_ORDER.indexOf(b));
      const head = ['学号', '姓名', '班级', '选科组合', '年级排名(官方)'];
      const cols = [];
      for (const k of keys) {
        const def = SUBJECT_MAP[k] || { name: k, assigned: false };
        if (def.assigned) {
          head.push(def.name + '(原始分)', def.name + '(赋分)');
          cols.push({ k: k, from: 'raw' }, { k: k, from: 'subj' });
        } else {
          head.push(def.name);
          cols.push({ k: k, from: 'subj' });
        }
      }
      const rows = [head.concat(['总分', '总榜', '物理类', '历史类', '班内', '组合内', '较上场', '上线情况'])];
      for (const r of (c.rows || [])) rows.push([
        r.studentId || '', r.name || '', r.cls || '', r.comboName || '',
        r.yearRank == null ? '' : r.yearRank,
        ...cols.map(col => {
          const v = col.from === 'raw' ? (r.raw ? r.raw[col.k] : null) : r.subj[col.k];
          return v == null ? '' : v;
        }),
        r.total == null ? '' : r.total, r.totalRank == null ? '' : r.totalRank,
        r.physRank == null ? '' : r.physRank, r.histRank == null ? '' : r.histRank,
        r.classRank == null ? '' : r.classRank, r.comboRank == null ? '' : r.comboRank,
        r.totalDelta == null ? '' : r.totalDelta, r.lineStatus || '',
      ]);
      sheets.push({ name: this.safeSheet(ex.name || ('考试' + (i + 1))), rows });
    });
    const st = [['项目', '值'], ['版本', 'V4.1'], ['格式版本', 'V4.2'], ['导出时间', this.fmtTime(Date.now())],
      ['默认本一线', data.settings.line1], ['默认本二线', data.settings.line2], ['', ''],
      ['考试名称', '考试日期', '本一线', '本二线', '人数']];
    data.exams.forEach(ex => st.push([ex.name || '', ex.date || '', ex.line1 == null ? '' : ex.line1,
      ex.line2 == null ? '' : ex.line2, (ex.students || []).length]));
    st.push([''], ['选科组合', '首选', '再选']);
    (data.settings.combos || []).forEach(c => st.push([comboLabel(c),
      SUBJECT_MAP[c.track1] ? SUBJECT_MAP[c.track1].name : c.track1,
      (c.track2 || []).map(k => SUBJECT_MAP[k] ? SUBJECT_MAP[k].name : k).join('+')]));
    st.push([''], ['等级赋分档位', '比例%', '最低分', '最高分']);
    (data.settings.bands || []).forEach(b => st.push([b.name, b.pct, b.min, b.max]));
    st.push([''], ['偏科阈值参数', '值']);
    const mm = data.settings.mismatch || {};
    for (const mk in mm) st.push([mk, typeof mm[mk] === 'object' ? JSON.stringify(mm[mk]) : mm[mk]]);
    sheets.push({ name: '设置与说明', rows: st });

    const clsRows = [['班级ID', '班级名称', '选科组合']];
    (data.settings.classes || []).forEach(c => clsRows.push([
      c.id || '', c.name || '',
      (c.comboIds || []).map(id => {
        const cb = (data.settings.combos || []).find(x => x.id === id);
        return cb ? comboLabel(cb) : id;
      }).join('、')
    ]));
    sheets.push({ name: '班级配置', rows: clsRows });

    const profRows = [['档案键', '目标', '目标总分', '背景备注']];
    for (const pk in (data.profiles || {})) {
      const pf = data.profiles[pk] || {};
      profRows.push([pk, pf.goal || '', pf.goalScore == null ? '' : pf.goalScore, pf.notes || '']);
    }
    sheets.push({ name: '学生档案', rows: profRows });

    sheets.push({ name: '完整设置(JSON)', rows: [
      ['说明', '程序「导入 Excel」用此表精确还原设置与学生档案，请勿修改'],
      ['内容', JSON.stringify({ settings: data.settings, profiles: data.profiles || {} })]
    ] });

    const files = [];
    files.push({ name: '[Content_Types].xml', data: '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>' +
      '<Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types">' +
      '<Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/>' +
      '<Default Extension="xml" ContentType="application/xml"/>' +
      '<Override PartName="/xl/workbook.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.sheet.main+xml"/>' +
      sheets.map((sh, i) => '<Override PartName="/xl/worksheets/sheet' + (i + 1) + '.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.worksheet+xml"/>').join('') +
      '</Types>' });
    files.push({ name: '_rels/.rels', data: '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>' +
      '<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships">' +
      '<Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/officeDocument" Target="xl/workbook.xml"/>' +
      '</Relationships>' });
    files.push({ name: 'xl/workbook.xml', data: '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>' +
      '<workbook xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main" xmlns:r="http://schemas.openxmlformats.org/officeDocument/2006/relationships"><sheets>' +
      sheets.map((sh, i) => '<sheet name="' + this.xe(sh.name) + '" sheetId="' + (i + 1) + '" r:id="rId' + (i + 1) + '"/>').join('') +
      '</sheets></workbook>' });
    files.push({ name: 'xl/_rels/workbook.xml.rels', data: '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>' +
      '<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships">' +
      sheets.map((sh, i) => '<Relationship Id="rId' + (i + 1) + '" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/worksheet" Target="worksheets/sheet' + (i + 1) + '.xml"/>').join('') +
      '</Relationships>' });
    sheets.forEach((sh, i) => files.push({ name: 'xl/worksheets/sheet' + (i + 1) + '.xml', data: this.sheetXml(sh.rows) }));
    return this.zip(files);
  },
  exportXlsx() {
    try {
      const blob = this.buildXlsx();
      const a = document.createElement('a');
      const h = this.health();
      const d = new Date(), p = n => String(n).padStart(2, '0');
      a.href = URL.createObjectURL(blob);
      a.download = `成绩数据备份-${d.getFullYear()}${p(d.getMonth() + 1)}${p(d.getDate())}-${p(d.getHours())}${p(d.getMinutes())}-${h.exams}场-${h.students}人.xlsx`;
      document.body.append(a); a.click(); a.remove();
      setTimeout(() => URL.revokeObjectURL(a.href), 2000);
      myAlert('Excel 数据备份已生成（含原始分、赋分、计算结果、设置与学生档案），可直接再导入。');
    } catch (e) { myAlert('导出 Excel 失败：' + e.message); }
  },

  /* ---------- 文件备份：JSON（完整恢复通道） ---------- */
  exportJsonBackup() {
    try {
      const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = '成绩数据备份.json';
      document.body.append(a); a.click(); a.remove();
      setTimeout(() => URL.revokeObjectURL(a.href), 2000);
      myAlert('已导出 JSON 完整备份。换电脑、清缓存后用「导入 JSON」恢复。');
    } catch (e) { myAlert('导出 JSON 失败：' + e.message); }
  },
  jsonImportControl() {
    const fi = h('input', { type: 'file', accept: '.json', style: 'display:none', onchange: ev => {
      const f = ev.target.files[0]; if (!f) return;
      const rd = new FileReader();
      rd.onload = async () => {
        try {
          const d = JSON.parse(rd.result);
          if (!d || !Array.isArray(d.exams) || !d.settings) throw new Error('格式不对，请选择本系统导出的 JSON 备份');
          const n = d.exams.reduce((s, x) => s + ((x.students || []).length), 0);
          if (!(await myConfirm(`导入 JSON 完整备份（${d.exams.length} 场考试 / ${n} 条成绩）？\n当前全部数据将被覆盖，覆盖前会自动留一份快照。`))) return;
          d.isSample = false; data = V41.normalize(d);
          saveData('导入 JSON 备份'); ui.examIdx = 0; ui.student = ''; render();
          myAlert('已恢复 JSON 完整备份。');
        } catch (e) { myAlert('导入失败：' + e.message); }
        finally { fi.value = ''; }
      };
      rd.readAsText(f);
    } });
    return h('span', {}, h('button', { class: 'btn primary', text: '⬆ 导入 JSON（完整恢复）', onclick: () => fi.click() }), fi);
  },

  /* ---------- 通用：多选项弹窗 ---------- */
  askChoice(title, msg, opts) {
    return new Promise(resolve => {
      const mask = h('div', { class: 'v41-mask' });
      const box = h('div', { class: 'v41-dialog', role: 'dialog', 'aria-modal': 'true' });
      box.append(h('div', { class: 'v41-dlg-title', text: title }),
        h('div', { class: 'v41-dlg-msg', text: msg }));
      let done = false;
      const finish = v => { if (done) return; done = true; mask.remove(); document.removeEventListener('keydown', onKey); resolve(v); };
      const onKey = e => { if (e.key === 'Escape') finish(null); };
      const bar = h('div', { class: 'v41-dlg-bar', style: 'flex-wrap:wrap' });
      for (const o of opts) {
        if (o.hidden) continue;
        const attrs = { class: 'btn' + (o.primary ? ' primary' : ''), text: o.label, onclick: () => finish(o.value) };
        if (o.disabled) attrs.disabled = 'disabled';
        bar.append(h('button', attrs));
      }
      bar.append(h('button', { class: 'btn', text: '取消', onclick: () => finish(null) }));
      box.append(bar); mask.append(box);
      mask.addEventListener('click', e => { if (e.target === mask) finish(null); });
      document.body.append(mask);
      document.addEventListener('keydown', onKey);
    });
  },

  /* ---------- Excel 读取：零依赖 xlsx(zip) 解析 ---------- */
  async unzipXlsx(buf) {
    const dv = new DataView(buf), u8 = new Uint8Array(buf), dec = new TextDecoder();
    let eocd = -1;
    for (let i = buf.byteLength - 22; i >= Math.max(0, buf.byteLength - 65558); i--) {
      if (dv.getUint32(i, true) === 0x06054b50) { eocd = i; break; }
    }
    if (eocd < 0) throw new Error('不是有效的 .xlsx 文件');
    const count = dv.getUint16(eocd + 10, true);
    let off = dv.getUint32(eocd + 16, true);
    const out = {};
    for (let n = 0; n < count; n++) {
      if (off + 46 > buf.byteLength || dv.getUint32(off, true) !== 0x02014b50) break;
      const method = dv.getUint16(off + 10, true);
      const csize = dv.getUint32(off + 20, true);
      const nlen = dv.getUint16(off + 28, true);
      const elen = dv.getUint16(off + 30, true);
      const clen = dv.getUint16(off + 32, true);
      const name = dec.decode(u8.subarray(off + 46, off + 46 + nlen));
      const lho = dv.getUint32(off + 42, true);
      const lnlen = dv.getUint16(lho + 26, true), lelen = dv.getUint16(lho + 28, true);
      const start = lho + 30 + lnlen + lelen;
      let bytes = u8.subarray(start, start + csize);
      if (method === 8) {
        if (typeof DecompressionStream === 'undefined') throw new Error('该 Excel 经过压缩，请用 Excel/WPS 另存为 .xlsx 后再试');
        const ds = new DecompressionStream('deflate-raw');
        bytes = new Uint8Array(await new Response(new Blob([bytes]).stream().pipeThrough(ds)).arrayBuffer());
      } else if (method !== 0) throw new Error('不支持的 Excel 压缩方式：' + method);
      out[name] = bytes;
      off += 46 + nlen + elen + clen;
    }
    return out;
  },
  async readXlsxSheets(file) {
    const files = await this.unzipXlsx(await file.arrayBuffer());
    const dec = new TextDecoder();
    const xml = n => files[n] ? dec.decode(files[n]) : '';
    const PX = s => new DOMParser().parseFromString(s, 'application/xml');
    const shared = [];
    if (files['xl/sharedStrings.xml']) {
      const sis = PX(xml('xl/sharedStrings.xml')).getElementsByTagName('si');
      for (let i = 0; i < sis.length; i++) {
        const ts = sis[i].getElementsByTagName('t');
        let s = ''; for (let j = 0; j < ts.length; j++) s += ts[j].textContent;
        shared.push(s);
      }
    }
    const rels = PX(xml('xl/_rels/workbook.xml.rels')).getElementsByTagName('Relationship');
    const relMap = {};
    for (let i = 0; i < rels.length; i++) relMap[rels[i].getAttribute('Id')] = rels[i].getAttribute('Target');
    const shs = PX(xml('xl/workbook.xml')).getElementsByTagName('sheet');
    const out = [];
    for (let i = 0; i < shs.length; i++) {
      let target = relMap[shs[i].getAttribute('r:id')] || ('worksheets/sheet' + (i + 1) + '.xml');
      if (target.charAt(0) === '/') target = target.slice(1);
      else if (target.indexOf('xl/') !== 0) target = 'xl/' + target;
      const rowEls = PX(xml(target)).getElementsByTagName('row');
      const rows = [];
      for (let ri = 0; ri < rowEls.length; ri++) {
        const cs = rowEls[ri].getElementsByTagName('c');
        const cells = [];
        for (let ci = 0; ci < cs.length; ci++) {
          const c = cs[ci];
          const m = /^([A-Z]+)/.exec(c.getAttribute('r') || '');
          let idx = 0;
          if (m) { for (const ch of m[1]) idx = idx * 26 + (ch.charCodeAt(0) - 64); idx--; }
          const t = c.getAttribute('t');
          const vEl = c.getElementsByTagName('v')[0];
          const isEl = c.getElementsByTagName('is')[0];
          let val = '';
          if (t === 's' && vEl) val = shared[Number(vEl.textContent)] || '';
          else if (t === 'inlineStr' && isEl) {
            const ts = isEl.getElementsByTagName('t');
            for (let j = 0; j < ts.length; j++) val += ts[j].textContent;
          } else if (vEl) val = vEl.textContent;
          cells[idx] = val;
        }
        for (let j = 0; j < cells.length; j++) if (cells[j] === undefined) cells[j] = '';
        rows.push(cells);
      }
      out.push({ name: shs[i].getAttribute('name') || ('表' + (i + 1)), rows: rows });
    }
    return out;
  },
  XLSX_AUX: ['设置与说明', '班级配置', '学生档案', '完整设置(JSON)'],
  /* 只保留输入列，剔除结果列，避免「物理类 / 组合内」被误认成科目列 */
  xlsxSheetToTsv(rows) {
    if (!rows || !rows.length) return '';
    const hdr = rows[0].map(x => String(x == null ? '' : x));
    const RESULT = /^(总分|合计|总榜|总排名|总分排名|物理类|物理类排名|历史类|历史类排名|文科排名|理科排名|文理类排名|班内|班级排名|班内排名|组合内|组合内排名|较上场|上线情况|上线|档次|人数|均分|平均分)$/;
    const keep = [];
    hdr.forEach((c, i) => { if (!RESULT.test(normalizeHeader(c))) keep.push(i); });
    const esc = v => {
      const s = String(v == null ? '' : v);
      return /[\t\r\n"]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s;
    };
    const out = [keep.map(i => esc(hdr[i])).join('\t')];
    for (let r = 1; r < rows.length; r++) {
      const cells = rows[r] || [];
      if (!cells.some(c => String(c == null ? '' : c).trim())) continue;
      out.push(keep.map(i => esc(cells[i])).join('\t'));
    }
    return out.join('\r\n');
  },
  xlsxEmbedded(sheets) {
    const full = sheets.find(s => s.name === '完整设置(JSON)');
    if (!full) return null;
    try {
      for (const row of (full.rows || [])) if (row[0] === '内容' && row[1]) return JSON.parse(row[1]);
    } catch (e) { return null; }
    return null;
  },
  xlsxExamMeta(sheets) {
    const info = sheets.find(s => s.name === '设置与说明');
    const out = {};
    if (!info) return out;
    const rows = info.rows || [];
    for (let i = 0; i < rows.length; i++) {
      if (rows[i][0] === '考试名称' && rows[i][1] === '考试日期') {
        for (let j = i + 1; j < rows.length; j++) {
          const r = rows[j];
          if (!r[0]) break;
          out[r[0]] = {
            date: r[1] || '',
            line1: (r[2] === '' || r[2] == null) ? null : Number(r[2]),
            line2: (r[3] === '' || r[3] == null) ? null : Number(r[3]),
          };
        }
        break;
      }
    }
    return out;
  },
  parseXlsxSheets(gradeSheets, opts) {
    const out = [];
    for (const sh of gradeSheets) {
      const tsv = this.xlsxSheetToTsv(sh.rows);
      if (!tsv) continue;
      const res = parseImport(tsv, opts);
      if (!res.students || !res.students.length) continue;
      out.push({ name: sh.name, students: res.students, errors: res.errors || [] });
    }
    return out;
  },
  xlsxImportControl(mode) {
    const fi = h('input', { type: 'file', accept: '.xlsx', style: 'display:none', onchange: async ev => {
      const f = ev.target.files[0]; if (!f) return;
      try {
        const sheets = await this.readXlsxSheets(f);
        const gradeSheets = sheets.filter(s => this.XLSX_AUX.indexOf(s.name) < 0);
        if (!gradeSheets.length) { myAlert('这个文件里没找到成绩表。'); return; }
        const opts = {
          combos: data.settings.combos || DEFAULT_COMBOS,
          classes: data.settings.classes || DEFAULT_CLASSES,
        };
        if (mode === 'single') {
          let picked = gradeSheets[0];
          if (gradeSheets.length > 1) {
            const choice = await this.askChoice('选择要导入的成绩表',
              '文件里有 ' + gradeSheets.length + ' 张成绩表，请选一张导入到当前场次「' + ((data.exams[ui.examIdx] || {}).name || '') + '」。',
              gradeSheets.map((s, i) => ({ label: s.name + '（约 ' + Math.max(0, s.rows.length - 1) + ' 人）', value: String(i), primary: i === 0 })));
            if (choice == null) return;
            picked = gradeSheets[Number(choice)];
          }
          const res = parseImport(this.xlsxSheetToTsv(picked.rows), opts);
          if (res.students.length && res.students.every(s => s.yearRank == null)) {
            const fix = await this.askChoice('这张表没有年级排名',
              '本表没有任何有效的年级排名。年级排名是选填项，但留空后本场的年级排名、较上场升降、排名趋势都会显示「—」。建议回源表补上「年级排名」列后重新选择文件。',
              [
                { label: '仍然导入（排名留空）', value: 'keep', primary: true },
                { label: '重新选择文件（去补录年排）', value: 'reselect' },
              ]);
            if (fix == null || fix === 'reselect') return;
          }
          entryPreview = Object.assign({ examIdx: ui.examIdx }, res);
          entryText = '';
          render();
          setTimeout(() => { const el = document.getElementById('importPreview'); if (el) el.scrollIntoView({ behavior: 'smooth', block: 'start' }); }, 60);
          return;
        }
        const embedded = this.xlsxEmbedded(sheets);
        const hasFull = !!(embedded && embedded.settings);
        const modeChoice = await this.askChoice('设置与学生档案从哪里取？',
          'Excel 里有 ' + gradeSheets.length + ' 张成绩表。' + (hasFull ? '文件内含完整设置与学生档案。' : '这是旧格式 Excel，不含完整设置与学生档案。'),
          [
            { label: hasFull ? '用 Excel 里的（推荐）' : '保留当前设置与档案（推荐）', value: hasFull ? 'excel' : 'keep', primary: true },
            { label: hasFull ? '保留当前设置与档案' : '用系统默认值', value: hasFull ? 'keep' : 'default' },
            { label: '用系统默认值', value: 'default', hidden: !hasFull },
          ]);
        if (modeChoice == null) return;
        let settings = data.settings, profiles = data.profiles;
        if (modeChoice === 'excel' && hasFull) { settings = embedded.settings; profiles = embedded.profiles || {}; }
        else if (modeChoice === 'default') { settings = defaultSettings(); profiles = {}; }
        const opts2 = { combos: settings.combos || DEFAULT_COMBOS, classes: settings.classes || DEFAULT_CLASSES };
        const parsed = this.parseXlsxSheets(gradeSheets, opts2);
        if (!parsed.length) { myAlert('没解析出任何学生，请检查表头是否有「姓名」和各科成绩列。'); return; }
        const errs = [];
        parsed.forEach(p => p.errors.forEach(e => errs.push('[' + p.name + '] ' + e)));
        const total = parsed.reduce((n, p) => n + p.students.length, 0);
        const noRank = parsed.filter(p => p.students.length && p.students.every(s => s.yearRank == null)).map(p => p.name);
        const summary = '导入 Excel 备份：' + parsed.length + ' 场考试 / ' + total + ' 条成绩。\n' +
          (errs.length ? '校验提示 ' + errs.length + ' 条（前 3 条）：\n' + errs.slice(0, 3).join('\n') + '\n' : '') +
          (noRank.length ? '注意：有 ' + noRank.length + ' 场没有年级排名（' + noRank.slice(0, 3).join('、') + (noRank.length > 3 ? ' 等' : '') + '）。这些场次的年级排名将留空，建议补录年排后重新导出再恢复。\n' : '') +
          '当前全部数据将被覆盖，覆盖前会自动留一份快照。';
        if (!(await myConfirm(summary))) return;
        const meta = this.xlsxExamMeta(sheets);
        const d = {
          settings: settings, profiles: profiles, isSample: false,
          exams: parsed.map(p => {
            const m = meta[p.name] || {};
            return { name: p.name, date: m.date || '', line1: m.line1 == null ? null : m.line1,
              line2: m.line2 == null ? null : m.line2, students: p.students };
          }),
        };
        data = V41.normalize(d);
        saveData('导入 Excel 备份'); ui.examIdx = 0; ui.student = ''; render();
        myAlert('已从 Excel 恢复 ' + parsed.length + ' 场考试。');
      } catch (e) { myAlert('导入 Excel 失败：' + e.message); }
      finally { fi.value = ''; }
    } });
    return h('span', {}, h('button', {
      class: mode === 'single' ? 'btn primary' : 'btn',
      text: mode === 'single' ? '⬆ 选择 Excel 文件（导入到本场）' : '⬆ 恢复 Excel 备份（全部场次）',
      onclick: () => fi.click()
    }), fi);
  },
