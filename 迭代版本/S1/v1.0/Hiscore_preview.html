    if (!cells.some(c => normalizeCell(c) !== '')) continue;
    if (isAggregateRow(cells)) { skipped++; continue; }
    if (cells.slice(0, 2).some(c => /^(注|说明|备注)[:：]?/.test(normalizeCell(c)))) { skipped++; continue; }
    if (map.studentId != null && /^(学号|考号|考生号|学籍号)/.test(normalizeHeader(cells[map.studentId] || ''))) { skipped++; continue; }
    const name = normalizeCell(cells[map.name] || '');
    if (!name) {
      const nonEmpty = cells.map(normalizeCell).filter(Boolean);
      const subWords = nonEmpty.filter(c => SUB_HEADER_RE.test(normalizeHeader(c))).length;
      if (subWords && subWords >= Math.ceil(nonEmpty.length * 0.6)) { skipped++; continue; }
      if (nonEmpty.length) errors.push(`第 ${li + 1} 行：姓名为空，已跳过`);
      continue;
    }
    if (/^(姓名|学生姓名|名字)[:：]?$/.test(name)) { skipped++; continue; }
    let cls = map.cls != null ? normalizeCell(cells[map.cls] || '') : '';
    if (!cls && lastCls) { cls = lastCls; filled++; }
    if (cls) lastCls = cls;
    const studentId = map.studentId != null ? normalizeStudentId(cells[map.studentId]) : '';
    // 选科组合
    let comboId = '';
    if (map.combo != null) {
      const cval = normalizeCell(cells[map.combo] || '');
      if (cval) {
        const cm = matchComboByName(cval, combos);
        if (cm) comboId = cm.id;
        else errors.push(`第 ${li + 1} 行：选科组合「${cval}」不在已配置的组合里，已按班级默认组合处理；请到「设置」里新增该组合或改表`);
      }
    }
    // 表里没写组合 → 按班级配置推断（拼班取该班第一个组合）
    if (!comboId && cls) {
      const byCls = comboForClass(cls, opts.classes, combos);
      if (byCls) comboId = byCls.id;
    }
    const row = { studentId, name, cls, comboId };
    let blanks = 0;
    for (const f of fields) {
      if (map[f.key] == null) { row[f.key] = null; continue; }
      const v = parseImportScoreField(row, cells, map[f.key], f.key, f.label, f.max, li + 1, errors);
      if (v == null) blanks++;
    }
    // 首选科目位：源表里物理/历史总共只有一列（或表头写「首选」「物理/历史」）时，
    // 这一列对两类学生是同一个位置 → 按该生组合分流到物理或历史。
    // 两列都有时按具名列处理，不分流。
    {
      const hasPhysCol = map.physics != null, hasHistCol = map.history != null;
      const t1Col = map.track1 != null ? map.track1
        : (hasPhysCol !== hasHistCol ? (hasPhysCol ? map.physics : map.history) : null);
      if (t1Col != null) {
        const combo = comboMapFor(comboId, combos);
        const t1key = combo && combo.track1 ? combo.track1 : 'physics';
        const hasNamed = map[t1key] != null;
        if (!hasNamed) {
          // 该列是泛指首选位：清掉刚才按具名列误装的另一个首选科目分数
          const other = t1key === 'physics' ? 'history' : 'physics';
          if (row[other] != null) { row[other] = null; }
          const v = parseImportScoreField(row, cells, t1Col, t1key, SUBJECT_MAP[t1key].name, 100, li + 1, errors);
          if (v == null) blanks++;
        }
      }
    }
    if (blanks) blankRows++;
    applyYearRank(row, map.yearRank != null ? cells[map.yearRank] : '', li + 1, errors);
    const key = studentKey(row);
    if (seen.has(key)) {
      duplicateKeys++;
      errors.push(`第 ${li + 1} 行：学生「${name}」与前面重复（${studentId || '班级 + 姓名'}），已拦截导入；请补唯一学号或改名后缀`);
    }
    seen.add(key);
    if (!studentId && seenNames.has(name) && seenNames.get(name) !== cls) {
      errors.push(`第 ${li + 1} 行：不同班级出现同名「${name}」，且没有学号，已拦截导入`);
    }
    if (!studentId) seenNames.set(name, cls);
    students.push(row);
  }
  if (map.studentId == null && students.length) notes.push(`${students.length} 人未带学号：按「班级 + 姓名」临时对齐，建议改用新模板`);
  // 组合科目 vs 源表列：组合要求的科目在表里完全没有对应列 → 提示
  // （若只是个别学生缺考，那是缺考而非列的问题，不在此提示）
  if (students.length && combos.length) {
    const colHas = new Set();
    for (const k of Object.keys(map)) {
      if (k === 'studentId' || k === 'name' || k === 'cls' || k === 'combo' || k === 'yearRank') continue;
      colHas.add(k);
    }
    // 泛指的首选科目位（表头写「首选」「物理/历史」）能装物理或历史
    if (map.track1 != null) { colHas.add('physics'); colHas.add('history'); }
    // 源表只有一列（物理 或 历史）时，通常是「首选科目」列混装两类学生，
    // 不能据此断定缺科；但两列都没有才是真缺
    const hasT1Col = colHas.has('physics') || colHas.has('history');
    const missByCombo = new Map();
    for (const s of students) {
      const combo = comboMapFor(s.comboId, combos);
      if (!combo) continue;
      const need = comboSubjectKeys(combo);
      const miss = need.filter(k => {
        if (colHas.has(k) || colHas.has(k + 'Score')) return false;
        // 首选科目位：源表有物理/历史任一列时视为已覆盖
        if (TRACK1_KEYS.includes(k) && hasT1Col) return false;
        return true;
      });
      if (!miss.length) continue;
      const key = comboLabel(combo) + '|' + miss.join(',');
      if (!missByCombo.has(key)) missByCombo.set(key, { combo: comboLabel(combo), miss, n: 0 });
      missByCombo.get(key).n++;
    }
    for (const v of missByCombo.values()) {
      errors.push(`组合「${v.combo}」的 ${v.n} 名学生缺 ${v.miss.map(k => SUBJECT_MAP[k] ? SUBJECT_MAP[k].name : k).join('、')} —— 源表里没有对应科目列；请确认表的科目与「设置」里的选科组合是否一致`);
    }
  }
  if (map.studentId != null) {
    const blankIds = students.filter(s => !s.studentId).length;
    if (blankIds) errors.push(`有 ${blankIds} 人学号为空，已拦截导入；请补齐唯一学号`);
  }
  const missingYearRank = students.filter(s => s.yearRank == null).length;
  if (opts.requireYearRank && missingYearRank) {
    errors.push(map.yearRank == null
      ? `年级排名为必填：没有识别到「年级排名 / 年排 / 排名」列（缺 ${missingYearRank} 人）`
      : `年级排名为必填：有 ${missingYearRank} 人未填写或填写无效`);
  }
  if (filled) notes.push(`补全 ${filled} 行空班级（按上一行向下填充）`);
  if (skipped) notes.push(`跳过 ${skipped} 行汇总/说明行`);
  if (blankRows) notes.push(`有 ${blankRows} 行存在空分（按缺考处理）`);
  if (!students.length && !errors.length) errors.push('没有解析出学生，请检查内容和表头');
  return { students, errors, notes, meta: {
    mode: 'header', headerRow: header.index + 1, skipped, filledClass: filled, ignored: ignoredCols,
    yearRankColumn: map.yearRank != null, missingYearRank, requireYearRank: !!opts.requireYearRank,
  } };
}

function nameColumnScore(vals) {
  let like = 0, nonEmpty = 0;
  const set = new Set();
  for (const raw of vals) {
    const s = normalizeCell(raw);
    if (!s) continue;
    nonEmpty++;
    set.add(s);
    if (looksLikeName(s)) like++;
  }
  if (!nonEmpty) return -Infinity;
  const uniqRatio = set.size / nonEmpty;
  let score = like;
  if (uniqRatio > 0.8) score += nonEmpty * 0.5;
  if (uniqRatio < 0.35) score -= nonEmpty * 0.8;
  return score;
}
function subjectColumnScore(vals, max) {
  let nonEmpty = 0, num = 0, inRange = 0, meaningful = 0;
  for (const raw of vals) {
    const s = normalizeCell(raw);
    if (!s) continue;
    nonEmpty++;
    const p = parseImportScore(raw);
    if (p.error || p.value == null) continue;
    num++;
    if (p.value >= 0 && p.value <= max) inRange++;
    if (p.value > max * 0.12) meaningful++;
  }
  if (!nonEmpty) return 0;
  if (num / nonEmpty < 0.5) return -2;
  if (inRange / num < 0.8) return -1;
  if (meaningful / num < 0.5) return 0.8;
  return 2;
}
function classColumnScore(vals) {
  const ne = [];
  for (const raw of vals) { const s = normalizeCell(raw); if (s) ne.push(s); }
  if (!ne.length) return 0;
  const textVals = ne.filter(v => isNaN(Number(v)));
  const nums = ne.filter(v => !isNaN(Number(v))).map(Number);
  const uniq = new Set(ne).size;
  if (textVals.length / ne.length >= 0.6) {
    if (ne.some(v => /班|级|部|系/.test(v)) || uniq <= 20) return 3;
    return -4;
  }
  if (nums.length && uniq <= Math.max(3, Math.ceil(ne.length * 0.4)) && nums.every(v => v >= 0 && v <= 100)) return 2;
  return -4;
}
function studentIdColumnScore(vals) {
  const ne = vals.map(normalizeCell).filter(Boolean);
  if (ne.length < 2) return 0;
  const uniq = new Set(ne).size / ne.length;
  const sequential = ne.every(v => /^\d{1,3}$/.test(v)) &&
    ne.map(Number).sort((a, b) => a - b).every((v, i) => v === i + 1);
  const idLike = ne.filter(v => /^[A-Za-z0-9_-]{4,32}$/.test(v) && /\d/.test(v) && !/^\d{1,3}$/.test(v)).length;
  return uniq > 0.8 && !sequential && idLike / ne.length >= 0.8 ? 2 : 0;
}
function extraColumnKind(vals) {
  let nums = [], nonEmpty = 0;
  for (const raw of vals) {
    const s = normalizeCell(raw);
    if (!s) continue;
    nonEmpty++;
    const p = parseImportScore(raw);
    if (p.error || p.value == null) continue;
    nums.push(p.value);
  }
  if (!nonEmpty) return 'empty';
  if (nums.length / nonEmpty < 0.6) return 'other';
  if (nums.some(v => v > 150)) return 'total';
  if (nums.some(v => v < 20)) return 'rank';
  if (nums.every(v => v >= 0 && v <= 150)) return 'assigned';
  return 'other';
}

function parseNoHeaderTable(lines, delim, opts) {
  opts = opts || {};
  const rawRows = [];
  for (let i = 0; i < lines.length; i++) {
    const cells = splitImportLine(lines[i], delim);
    if (cells.some(c => c !== '')) rawRows.push({ line: i + 1, cells });
  }
  if (!rawRows.length) return { students: [], errors: ['没有内容'], notes: [], meta: null };

  const maxLen = Math.max.apply(null, rawRows.map(r => r.cells.length));
  // 1. 找姓名列（唯一性高的中文姓名列）
  let nameIdx = 0, bestNameScore = -Infinity;
  for (let j = 0; j < Math.min(6, maxLen); j++) {
    const sc = nameColumnScore(rawRows.map(r => r.cells[j] == null ? '' : r.cells[j]));
    if (sc > bestNameScore) { bestNameScore = sc; nameIdx = j; }
  }
  if (!isFinite(bestNameScore) || bestNameScore <= 0) nameIdx = 0;

  // 2. 找成绩列起点（允许姓名与成绩之间夹班级/序号列）
  //    科目数不固定：从 6 到 9 逐个尝试，取评分最高的起点
  const start = nameIdx + 1;
  let bestStart = -1, bestScore = -Infinity, bestCount = 0;
  for (let s = start; s <= Math.min(start + 3, maxLen - 1); s++) {
    for (let cnt = 6; cnt <= 9; cnt++) {
      if (s + cnt > maxLen) continue;
      let sc = 0, valid = 0;
      for (let k = 0; k < cnt; k++) {
        const def = SUBJECT_DEFS[k];
        const one = subjectColumnScore(rawRows.map(r => r.cells[s + k] == null ? '' : r.cells[s + k]), def.max);
        if (one > 0) valid++;
        sc += one;
      }
      if (valid < 3) continue;
      if (s === start) sc += 0.5;
      if (sc > bestScore) { bestScore = sc; bestStart = s; bestCount = cnt; }
    }
  }
  if (bestStart < 0) {
    return {
      students: [], errors: ['没识别到表头，也无法按列位置识别成绩。建议先点「下载空白模板」按模板填写，或确认每行包含姓名和各科成绩。'],
      notes: [], meta: null,
    };
  }
  const subjCount = bestCount;

  // 3. 学号 / 班级列：姓名与成绩之间，或姓名之前
  let clsIdx = -1, studentIdIdx = -1;
  const colVals = j => rawRows.map(r => r.cells[j] == null ? '' : r.cells[j]);
  for (let j = start; j < bestStart; j++) {
    if (studentIdIdx < 0 && studentIdColumnScore(colVals(j)) > 0) { studentIdIdx = j; continue; }
    if (clsIdx < 0 && classColumnScore(colVals(j)) > 0) clsIdx = j;
  }
  if (nameIdx > 0) {
    if (studentIdIdx < 0 && studentIdColumnScore(colVals(nameIdx - 1)) > 0) studentIdIdx = nameIdx - 1;
    if (clsIdx < 0 && classColumnScore(colVals(nameIdx - 1)) > 0) clsIdx = nameIdx - 1;
  }
  if (studentIdIdx === clsIdx) studentIdIdx = -1;
  // 常见老格式：姓名 + 班级 + 六科（正好 8 列）直接认定，
  // 避免把某一科里的错字（如 "abc"）当成"额外列"跳过去。
  if (bestStart > start && clsIdx === start && maxLen === nameIdx + 8) { bestStart = start + 1; }

  // 4. 多出来的列：赋分 / 总分 / 名次 / 备注
  const extraStart = bestStart + subjCount;
  let yearRankIdx = null, ignoredExtras = 0;
  const assignedIdx = [];
  for (let j = extraStart; j < maxLen; j++) {
    const kind = extraColumnKind(rawRows.map(r => r.cells[j] == null ? '' : r.cells[j]));
    if (kind === 'assigned') {
      assignedIdx.push(j);
    } else if (kind === 'rank') {
      if (yearRankIdx == null) yearRankIdx = j;
      else ignoredExtras++;
    } else if (kind !== 'empty') {
      ignoredExtras++;
    }
  }
  // 有些表把年排放在姓名和成绩之间
  if (yearRankIdx == null) {
    for (let j = start; j < bestStart; j++) {
      if (j === clsIdx) continue;
      if (extraColumnKind(rawRows.map(r => r.cells[j] == null ? '' : r.cells[j])) === 'rank') { yearRankIdx = j; break; }
    }
  }
  const ignoredBefore = Math.max(0, bestStart - start
    - (clsIdx >= start && clsIdx < bestStart ? 1 : 0)
    - (studentIdIdx >= start && studentIdIdx < bestStart ? 1 : 0)
    - (yearRankIdx != null && yearRankIdx >= start && yearRankIdx < bestStart && yearRankIdx !== clsIdx && yearRankIdx !== studentIdIdx ? 1 : 0));

  // 5. 解析
  const students = [], errors = [], notes = [];
  const seen = new Set(), seenNames = new Map();
  let duplicateKeys = 0;
  let lastCls = '', filled = 0, skipped = 0, blankRows = 0;
  // 无表头时按位置猜科目：语数外固定在前三列，其余按「已配置组合里最常见的排列」推断。
  // 排列候选：把每个组合的科目顺序按出现频次排序，频次相同则用标准顺序（语数外→物理→历史→化生政地）。
  const combos = (opts.combos) || DEFAULT_COMBOS;
  const comboKeyOrder = [];
  for (const c of combos) {
    for (const k of comboSubjectKeys(c)) if (!comboKeyOrder.includes(k)) comboKeyOrder.push(k);
  }
  // 统计每个科目出现在第几位（按组合）的频次，取最常见的位置
  const posCount = {};
  for (const c of combos) {
    comboSubjectKeys(c).forEach((k, idx) => {
      if (!posCount[k]) posCount[k] = {};
      posCount[k][idx] = (posCount[k][idx] || 0) + 1;
    });
  }
  const guessKeys = comboKeyOrder.slice().sort((a, b) => {
    // 该科目在所有组合里出现在第 0/1/2 位的累计次数（越靠前越优先）
    const score = k => {
      const m = posCount[k] || {};
      return (m[0] || 0) * 100 + (m[1] || 0) * 10 + (m[2] || 0);
    };
    const d = score(b) - score(a);
    if (d !== 0) return d;
    return SUBJECT_ORDER.indexOf(a) - SUBJECT_ORDER.indexOf(b);
  });
  // 用户指定的科目列映射（列序号 → 科目 key）；没指定时按位置猜
  const userMap = opts.subjectMap || null;
  const guessed = [];
  for (let k = 0; k < subjCount; k++) {
    guessed.push(userMap && userMap[k] ? userMap[k] : (guessKeys[k] || ''));
  }
  for (const r of rawRows) {
    const cells = r.cells;
    if (isAggregateRow(cells)) { skipped++; continue; }
    if (studentIdIdx >= 0 && /^(学号|考号|考生号|学籍号)/.test(normalizeHeader(cells[studentIdIdx] || ''))) { skipped++; continue; }
    const name = normalizeCell(cells[nameIdx] || '');
    if (!name) {
      if (cells.some(c => normalizeCell(c) !== '')) errors.push(`第 ${r.line} 行：姓名为空，已跳过`);
      continue;
    }
    if (/^(姓名|学生姓名|名字|备注|说明|注)[:：]?/.test(name)) { skipped++; continue; }
    if (!looksLikeName(name) && cells.filter(c => normalizeCell(c) !== '').length <= 2) { skipped++; continue; }
    let cls = clsIdx >= 0 ? normalizeCell(cells[clsIdx] || '') : '';
    if (!cls && lastCls) { cls = lastCls; filled++; }
    if (cls) lastCls = cls;
    const studentId = studentIdIdx >= 0 ? normalizeStudentId(cells[studentIdIdx]) : '';
    // 组合：无表头时按班级配置推断
    let comboId = '';
    if (cls) {
      const byCls = comboForClass(cls, opts.classes, combos);
      if (byCls) comboId = byCls.id;
    }
    const row = { studentId, name, cls, comboId };
    let blanks = 0;
    for (let k = 0; k < subjCount; k++) {
      const key = guessed[k];
      if (!key) { blanks++; continue; }
      const def = SUBJECT_MAP[key];
      const v = parseImportScoreField(row, cells, bestStart + k, key, def ? def.name : key, def ? def.max : 100, r.line, errors);
      if (v == null) blanks++;
    }
    // 额外列里的赋分：按已配置的组合顺序，把前 N 个赋分列对应到该生的赋分科目
    const assignKeyPool = TRACK2_KEYS.filter(k => comboKeyOrder.includes(k));
    for (let i = 0; i < assignedIdx.length; i++) {
      const key = (opts.assignedMap && opts.assignedMap[i]) || assignKeyPool[i];
      if (!key) break;
      parseImportScoreField(row, cells, assignedIdx[i], key + 'Score', (SUBJECT_MAP[key] ? SUBJECT_MAP[key].name : key) + '赋分', 100, r.line, errors);
    }
    const allSubjectBlank = guessed.every(k => row[k] == null);
    if (allSubjectBlank && assignedIdx.length === 0) { skipped++; continue; }
    applyYearRank(row, yearRankIdx != null ? cells[yearRankIdx] : '', r.line, errors);
    if (blanks) blankRows++;
    const key = studentKey(row);
    if (seen.has(key)) {
      duplicateKeys++;
      errors.push(`第 ${r.line} 行：学生「${name}」与前面重复（${studentId || '班级 + 姓名'}），已拦截导入；请补唯一学号或改名后缀`);
    }
    seen.add(key);
    if (!studentId && seenNames.has(name) && seenNames.get(name) !== cls) {
      errors.push(`第 ${r.line} 行：不同班级出现同名「${name}」，且没有学号，已拦截导入`);
    }
    if (!studentId) seenNames.set(name, cls);
    students.push(row);
  }

  notes.push('未识别到表头，已按列位置自动整理（建议下次用「下载空白模板」）');
  notes.push(`识别为：${studentIdIdx >= 0 ? '学号 + ' : ''}姓名${clsIdx >= 0 ? ' + 班级' : ''} + ${subjCount} 科（${guessed.map(k => SUBJECT_MAP[k] ? SUBJECT_MAP[k].name : (k || '未识别')).join('、')}）`);
  if (!userMap) notes.push('科目列是按位置推测的，请在下方「科目列对照」里核对；有表头的表不会走到这里。');
  if (studentIdIdx < 0 && students.length) notes.push(`${students.length} 人未带学号：按「班级 + 姓名」临时对齐，建议改用新模板`);
  if (studentIdIdx >= 0 && students.some(s => !s.studentId)) errors.push('有学生学号为空，已拦截导入；请补齐唯一学号');
  if (yearRankIdx != null) notes.push('识别到年级排名列（无表头时按名次列处理）');
  else if (opts.requireYearRank) notes.push('未识别到年级排名列（必填）');
  if (assignedIdx.length) notes.push(`识别到 ${assignedIdx.length} 个赋分列（无表头时按已配置组合的赋分科目顺序对应）`);
  if (ignoredExtras) notes.push(`忽略 ${ignoredExtras} 列（疑似总分/名次/备注）`);
  if (ignoredBefore) notes.push(`忽略姓名与成绩之间的 ${ignoredBefore} 列（疑似序号/学号）`);
  if (filled) notes.push(`补全 ${filled} 行空班级（按上一行向下填充）`);
  if (skipped) notes.push(`跳过 ${skipped} 行标题/汇总/说明行`);
  if (blankRows) notes.push(`有 ${blankRows} 行存在空分（按缺考处理）`);
  const missingYearRank = students.filter(s => s.yearRank == null).length;
  if (opts.requireYearRank && missingYearRank) {
    errors.push(yearRankIdx == null
      ? `年级排名为必填：没有识别到名次列（缺 ${missingYearRank} 人）`
      : `年级排名为必填：有 ${missingYearRank} 人未填写或填写无效`);
  }
  if (!students.length && !errors.length) errors.push('没有解析出学生，请检查内容和列顺序');
  return { students, errors, notes, meta: {
    mode: 'position', nameIdx, subjStart: bestStart, subjCount, clsIdx, skipped, filledClass: filled,
    yearRankColumn: yearRankIdx != null, missingYearRank, requireYearRank: !!opts.requireYearRank,
    guessedSubjects: guessed, assignedIdx, assignedMap: opts.assignedMap || null,
    subjectStart: bestStart,
  } };
}

function parseImport(text, opts) {
  opts = opts || {};
  const lines = splitImportLines(text);
  if (!lines.length) return { students: [], errors: ['没有内容'], notes: [], meta: null };
  let delim = detectDelimiter(lines);
  let header = findHeader(lines, delim);
  if (!header) {
    for (const d of ['\t', ',', ';']) {
      if (d === delim) continue;
      const h = findHeader(lines, d);
      if (h && (!header || h.score > header.score)) { header = h; delim = d; }
    }
  }  if (header) {
    // 两行表头：科目行 + 原始分/赋分行
    const mainCells = header.cells || splitImportLine(lines[header.index], delim);
    const nextIdx = header.index + 1;
    if (nextIdx < lines.length) {
      const subCells = splitImportLine(lines[nextIdx], delim);
      if (isSubHeaderCells(subCells)) {
        const mergedCells = mergeHeaderCells(mainCells, subCells);
        const merged = buildHeaderCandidate(mergedCells, header.index);
        if (merged.hasName && merged.subjCount >= header.subjCount) {
          merged.subRows = 1;
          header = merged;
        }
      }
    }
    return parseHeaderTable(lines, delim, header, opts);
  }
  return parseNoHeaderTable(lines, delim, opts);
}

/* --- 各科评估 --- */
function subjectEval(row, subj, schoolAvg, classAvg, classCount, history, examIdx) {
  const score = row.subj[subj.key];
  if (score == null) return null;
  const rate = score / subj.max;
  let level, levelCls;
  if (rate >= 0.85) { level = '优秀'; levelCls = 'good'; }
  else if (rate >= 0.70) { level = '良好'; levelCls = 'ok'; }
  else if (rate >= 0.60) { level = '中等'; levelCls = 'warn'; }
  else { level = '待提高'; levelCls = 'crit'; }
  // 近三场趋势：保留缺考场次为空，只有最近两场连续有成绩才判断升降
  const window = history.slice(Math.max(0, examIdx - 2), examIdx + 1);
  while (window.length < 3) window.unshift(null);
  const vals = window.map(r => r && r.subj ? r.subj[subj.key] : null);
  let trend = null, trendDelta = null;
  if (vals[1] != null && vals[2] != null) {
    trendDelta = vals[2] - vals[1];
    trend = trendDelta > 0 ? 'up' : (trendDelta < 0 ? 'down' : 'flat');
  }
  return {
    score, rate, level, levelCls,
    rank: row[subj.key + 'Rank'],
    vsSchool: schoolAvg != null ? score - schoolAvg : null,
    vsClass: classAvg != null ? score - classAvg : null,
    trend, trendDelta, spark: vals,
  };
}

/* --- 偏科 / 不匹配判定（双口径，两档：关注 / 预警） ---
   口径说明（「不匹配」= 该科相对应有水平明显落后）：
   1. 自身失衡【定档】：某科得分率 比 该生各科平均得分率 低多少。
   2. 名单落后【佐证 / 排序】：该科 比名单均分低 / 排名落入后段。
   为什么定档只看自身失衡：各科里「总有一科排在后段」是数学必然，
   单独用排名会几乎人人误报；名单口径用来说明「落后是否也被榜单印证」，
   并据此排优先级，不改变档位。
   两档：
   - 关注：自身失衡达 selfGap。
   - 预警：自身失衡达 severeGap。
   参数可在设置页调整。 */
function mismatchSettings() {
  const s = (data && data.settings && data.settings.mismatch) || {};
  const d = DEFAULT_MISMATCH;
  return {
    selfGap: Number.isFinite(s.selfGap) ? s.selfGap : d.selfGap,
    vsAvgGap: Number.isFinite(s.vsAvgGap) ? s.vsAvgGap : d.vsAvgGap,
    rankTail: Number.isFinite(s.rankTail) ? s.rankTail : d.rankTail,
    severeGap: Number.isFinite(s.severeGap) ? s.severeGap : d.severeGap,
    minRanked: Number.isFinite(s.minRanked) ? s.minRanked : d.minRanked,
  };
}
/* examIdx 取最近一场有成绩的考试；从 row.subj 取该生自己选考科目的得分率。
   subjAvgs: {chinese: 均分, ...}（本场名单该科均分），缺省时名单口径只按排名。
   subjectKeys: 该生本场的科目列表（由 row.subjectKeys 提供） */
function mismatchEval(row, examIdx, subjAvgs) {
  if (!row || !row.subj) return null;
  const cfg = mismatchSettings();
  const keys = row.subjectKeys && row.subjectKeys.length
    ? row.subjectKeys
    : SUBJECT_DEFS.map(s => s.key).filter(k => row.subj[k] != null);
  const ranks = [];
  const rates = [];
  for (const k of keys) {
    const def = SUBJECT_MAP[k];
    if (!def) continue;
    const v = row.subj[k];
    if (v == null) continue;
    const rank = row[k + 'Rank'];
    const ranked = rank != null && Number.isFinite(rank);
    if (ranked) ranks.push(rank);
    const avg = subjAvgs && Number.isFinite(subjAvgs[k]) ? subjAvgs[k] : null;
    rates.push({ key: k, name: def.name, score: v, max: def.max, rate: v / def.max, rank, ranked,
      avgRate: avg != null ? avg / def.max : null });
  }
  if (rates.length < 2) return null;
  const selfAvg = rates.reduce((a, x) => a + x.rate, 0) / rates.length;
  const listTotal = ranks.length ? Math.max.apply(null, ranks) : null;
  const useRank = listTotal != null && listTotal >= cfg.minRanked;
  const subjects = rates.map(x => {
    const selfGap = selfAvg - x.rate;                    // 正 = 低于自身平均
    const vsAvgGap = x.avgRate != null ? x.avgRate - x.rate : null; // 正 = 低于名单均分
    const tail = (useRank && x.ranked && x.rank <= listTotal) ? x.rank / listTotal : null;
    const selfHit = selfGap >= cfg.selfGap;
    const avgHit = vsAvgGap != null && vsAvgGap >= cfg.vsAvgGap;
    const rankHit = tail != null && tail > (1 - cfg.rankTail);
    // 名单口径 = 低于均分 或 排名后段；只作佐证与排序，不单独触发、不改档位
    const listHit = avgHit || rankHit;
    let level = 'ok';
    if (selfHit) level = selfGap >= cfg.severeGap ? 'severe' : 'watch';
    return { ...x, selfGap, vsAvgGap, tail, selfHit, avgHit, rankHit, listHit, level };
  });
  const flagged = subjects.filter(x => x.level !== 'ok').sort((a, b) => (b.selfGap + (b.vsAvgGap || 0)) - (a.selfGap + (a.vsAvgGap || 0)));
  if (!flagged.length) return { level: 'ok', subjects, weakest: null, strongest: null, listTotal, selfAvg };
  const worst = flagged[0];
  const level = flagged.some(x => x.level === 'severe') ? 'severe' : 'watch';
  const strongest = subjects.slice().sort((a, b) => b.rate - a.rate)[0];
  return { level, subjects, weakest: worst, strongest, flagged, listTotal, selfAvg };
}

/* --- 复习建议（按得分率 + 趋势生成） --- */
function buildAdvice(subj, ctx) {
  // ctx: {rate, trend, trendDelta, vsSchool, score, schoolAvg, subjectName}
  const weak = ctx.rate < 0.65, mid = ctx.rate >= 0.65 && ctx.rate < 0.80;
  const down = ctx.trend === 'down';
  const gap = ctx.vsSchool != null ? Math.round(Math.abs(ctx.vsSchool)) : null;
  let core = '';
  switch (subj.key) {
    case 'chinese':
      core = weak
        ? '优先抓「性价比」：默写 64 篇篇目轮背（每天 15 分钟）、文言实词虚词过一遍课内清单，这两块最接近「背了就得分」。现代文阅读先固化答题模板（概括题、作用题、探究题各一套话术），作文准备 3 个可迁移素材。'
        : mid
          ? '阅读题的失分多半在「答题不全点」：对答案时数一数自己踩到几个得分点，补齐漏掉的角度。作文升格练「一材多用」，把现有素材写出层次。'
          : '基础已稳，重点放在作文和阅读的「精准度」：研究近几次大考的评分细则，把丢掉的步骤分、要点分找回来。';
      break;
    case 'math':
      core = weak
        ? '先把选填的正确率打上来：每天 1 组限时选填（40 分钟内），目标正确率 80%。大题保住前 2 问的过程分——三角、数列、概率统计这三个板块相对好拿，优先练熟。'
        : mid
          ? '主攻两个「拉分大户」：解析几何与导数的第 2 问。每天 1 题大题精做（写出完整过程再对答案），同时保持选填手感不掉。'
          : '目标是压轴题的步骤分与全卷零失误：每周 2 次全卷限时模拟，重点复盘「会做但做错」的题，这类分丢得最冤。';
      break;
    case 'english':
      core = weak
        ? '词汇是地基：3500 词按考频过，每天 30 词 + 当日复盘。语法填空专练高频考点（非谓语、定语从句、时态语态），每周 3 篇。'
        : mid
          ? '读后续写和应用文是主要增量：每周 2 篇限时写作，写完对照范文积累「动作链 + 情绪描写」语料。阅读理解注意定位原文，杜绝凭感觉选。'
          : '保持手感的同时抠细节：完形的逻辑衔接词、语法填空的词形变化。作文冲高分靠高级句式和卷面，整理 10 个万能句式备用。';
      break;
    case 'physics':
      core = weak
        ? '力学和电学的「模型」先过关：受力分析、能量观点、带电粒子运动各画一张思维导图。大题写公式就有步骤分，别空着。实验题把课本原型实验的原理和误差分析吃透。'
        : mid
          ? '重点练「多过程分析」题：拆阶段、选规律、列方程三步走。电磁感应与带电粒子在复合场中的运动各总结一套切入套路。'
          : '冲高分靠小题正确率和大题的严密表达：注意矢量方向、正负号、单位；每周一套限时训练保持状态。';
      break;
    case 'chem':
      core = weak
        ? '先背该背的：方程式（尤其课本实验相关）、元素化合物转化关系图。选择题的化学与生活、实验基础是快速提分点。'
        : mid
          ? '主攻工艺流程题：练「箭头式读流程」，标出每步目的；原理大题按「平衡—速率—图像」三件套答题，术语要准。'
          : '实验综合与原理大题的规范表述是突破点：对照标准答案学「怎么答才给分」，注意控制变量、现象结论一一对应。';
      break;
    case 'history':
      core = weak
        ? '先补「时间线 + 阶段特征」这两块硬骨头：每个朝代按政治、经济、思想文化三条线各写一张卡片，串成一条大时间轴。材料题从「设问词」入手（概括/评价/说明），先圈关键词再组织答案。'
        : mid
          ? '材料题失分在要点不全和术语不准：每道大题练到能默写答题模板（背景—措施—影响—评价）。论述题练观点分层，先亮明判断再展开两到三层依据。'
          : '冲击高分靠观点的深度和史料的厚度：练从不同立场评价同一事件（如对历史人物的评价），每题至少给出两种视角并说明理由。';
      break;
    case 'bio':
      core = weak
        ? '先把主干知识网络搭起来：按章节画概念图（细胞—代谢—遗传—生命活动调节），每个概念能一句话说清。计算题（遗传、代谢）是失分大头，每天 2 道大题限时练。'
        : mid
          ? '重点突破遗传计算与实验设计：遗传题按「写遗传图解 → 算比例 → 表述」三步走；实验题对照标准答案学「变量控制 + 现象 + 结论」的完整表述。'
          : '目标是稳定压轴题的高分表达：注意题干中的限定词（如「一定」「主要」），答题时把条件、过程、结论都写全，避免踩「表述不完整」的扣分。';
      break;
    case 'politics':
      core = weak
        ? '这门科背得多、忘得快也答不全：主干知识按「概念—内涵—外延—关键表述」整理成问答卡片，每天 15 分钟过一遍。主观题先背材料分析的四步框架（是什么—为什么—怎么办—意义）。'
        : mid
          ? '主观题是最值分的增量：练「设问拆解」，把「如何做」「为什么」翻译成答题要点，每题写满要点再对照答案补漏。选择题重点练组合型、时政型易错项。'
          : '冲高分要靠术语的精准和逻辑的层次：把同一话题的答题角度分类整理（主体、层面、领域），遇到新题直接套框架；关注时政热点的固定表述。';
      break;
    case 'geo':
      core = weak
        ? '区域定位和地图判读先过关：每张图问自己「在哪、什么特征、为什么」。自然地理的气候、地形成因背熟答题模板。'
        : mid
          ? '综合题失分多在「术语不专业、要点不全」：背熟常用答题术语（如「昼夜温差大—有利于养分积累」），对照答案补角度。'
          : '冲击高分靠材料信息的提取和「地理过程」的逻辑链：练从材料里抠隐藏条件，答题按「因果链」展开。';
      break;
  }
  if (down && ctx.trendDelta != null) {
    core += `近两次下滑了 ${Math.abs(Math.round(ctx.trendDelta))} 分，先回看上次考试的丢分题，确认是知识点漏洞还是失误，再对症练。`;
  } else if (ctx.trend === 'up' && ctx.trendDelta) {
    core += `近两次在回升（+${Math.round(ctx.trendDelta)} 分），保持当前节奏。`;
  }
  if (gap != null && ctx.vsSchool != null && ctx.vsSchool < 0) {
    core += `目前比本次名单均分低 ${gap} 分，先把这一截追平。`;
  }
  const priority = Math.round((1 - ctx.rate) * 100) + (down ? 25 : 0) + (ctx.vsSchool != null && ctx.vsSchool < 0 ? 10 : 0);
  return { text: core, priority };
}

/* --- 学生简报 markdown（导出 / 发给 AI 的数据包） --- */
function studentBriefMd(ctx) {
  // ctx: {name, cls, comboName, trackName, examNames, rows, line1, line2, profile, subjEvals, ruleAdvice}
  const L = [];
  const keys = (ctx.subjectKeys && ctx.subjectKeys.length)
    ? ctx.subjectKeys
    : ['chinese', 'math', 'english', 'physics', 'chem', 'geo'];
  const subjName = k => SUBJECT_MAP[k] ? SUBJECT_MAP[k].name : k;
  const head = ['考试', ...keys.map(k => subjName(k) + (isAssignedSubject(k) ? '(赋分)' : '')), '总分', '年级排名', '物理类', '历史类', '班内排名', '组合内排名', '较上场', '上线'];
  L.push('# 学生学业数据简报');
  L.push('');
  L.push(`- 学生：${ctx.name}${ctx.cls ? '（' + ctx.cls + '）' : ''}`);
  if (ctx.comboName) L.push(`- 选科组合：${ctx.comboName}（${ctx.trackName || ''}）`);
  if (ctx.profile && ctx.profile.goal) L.push(`- 目标：${ctx.profile.goal}`);
  if (ctx.profile && ctx.profile.notes) L.push(`- 背景备注：${ctx.profile.notes}`);
  L.push(`- 数据范围：${ctx.examNames.join('、')}（共 ${ctx.examNames.length} 次考试）`);
  L.push(`- 分数线：本一线 ${ctx.line1} / 本二线 ${ctx.line2}`);
  L.push('- 总分口径：语数外（各 150）+ 物理或历史（100）+ 两门选考赋分（各 100），满分 750');
  L.push('- 年级排名：优先采用学校官方年排；没有年排的旧数据按导入名单计算');
  L.push('- 单科名次、各科均分均以本次导入名单为范围，不代表全校');
  L.push('');
  L.push('## 历次成绩');
  L.push('');
  L.push('| ' + head.join(' | ') + ' |');
  L.push('|' + head.map(() => '---').join('|') + '|');
  ctx.rows.forEach((r, i) => {
    if (!r) { L.push(`| ${ctx.examNames[i]} | ` + head.slice(1).map(() => '—').join(' | ') + ' | 无记录 |'); return; }
    const s = k => r.subj[k] == null ? '—' : r.subj[k];
    const d = r.totalDelta == null ? '—' : (r.totalDelta > 0 ? '+' + r.totalDelta : String(r.totalDelta));
    const cells = [
      ctx.examNames[i], ...keys.map(s),
      r.total == null ? '—' : r.total,
      r.totalRank == null ? '—' : r.totalRank,
      r.physRank == null ? '—' : r.physRank,
      r.histRank == null ? '—' : r.histRank,
      r.classRank == null ? '—' : r.classRank,
      r.comboRank == null ? '—' : r.comboRank,
      d, r.lineStatus || '—',
    ];
    L.push('| ' + cells.join(' | ') + ' |');
  });
  L.push('');
  if (ctx.subjEvals && ctx.subjEvals.length) {
    L.push('## 最近一次各科与本次名单均分对比');
    L.push('');
    L.push('| 科目 | 得分 | 满分 | 得分率 | 本次名单单科名次 | 名单均分 | 与名单均分差 | 近三次走势 |');
    L.push('|---|---|---|---|---|---|---|---|');
    for (const e of ctx.subjEvals) {
      const trend = e.trendDelta == null ? '数据不连续' : (e.trendDelta > 0 ? '+' + e.trendDelta : String(e.trendDelta));
      L.push(`| ${e.name} | ${e.score} | ${e.max} | ${Math.round(e.rate * 100)}% | ${e.rank == null ? '—' : e.rank} | ${e.schoolAvg == null ? '—' : Math.round(e.schoolAvg * 10) / 10} | ${e.vsSchool == null ? '—' : (e.vsSchool > 0 ? '+' : '') + Math.round(e.vsSchool * 10) / 10} | ${trend} |`);
    }
    L.push('');
  }
  if (ctx.mismatch && ctx.mismatch.level !== 'ok') {
    const mm = ctx.mismatch;
    L.push('## 偏科 / 不匹配（系统判定，供参考）');
    L.push('');
    L.push(`- 判定：${mm.level === 'severe' ? '● 预警（严重不匹配，建议优先介入）' : '⚠ 关注（明显偏科，建议谈话）'}`);
    for (const x of mm.flagged) {
      const parts = [`得分率 ${Math.round(x.rate * 100)}%`];
      if (x.selfHit) parts.push(`比自身各科平均（${Math.round(mm.selfAvg * 100)}%）低 ${Math.round(x.selfGap * 100)}%`);
      if (x.avgHit && x.vsAvgGap != null) parts.push(`比该科名单均分低 ${Math.round(x.vsAvgGap * 100)}%`);
      if (x.rankHit) parts.push(`本次名单单科排名第 ${x.rank}，落入后 ${Math.round(x.tail * 100)}%`);
      L.push(`- **${x.name}**：${parts.join('；')}`);
    }
    L.push('');
  }
  if (ctx.ruleAdvice && ctx.ruleAdvice.length) {
    L.push('## 规则版复习建议（供参考，可修正）');
    L.push('');
    for (const a of ctx.ruleAdvice) L.push(`- **${a.name}**：${a.text}`);
    L.push('');
  }
  return L.join('\n');
}

function buildAnalysisPrompt(briefMd) {
  const system = '你是一位资深的高中学业分析师（熟悉江苏新高考 3+1+2、赋分制和备考策略）。' +
    '你会收到一名学生的多次考试数据简报，要求基于简报里的真实数据做深度分析，' +
    '禁止编造简报中不存在的信息（如具体题目、课堂表现等），不确定处明确说"需要老师补充观察"。' +

};
function isDark() {
  const t = document.documentElement.getAttribute('data-theme');
  if (t === 'dark') return true;
  if (t === 'light') return false;
  return window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
}
function P() { return isDark() ? PALETTES.dark : PALETTES.light; }
function subjColor(key) { const s = SUBJECT_MAP[key]; return P().series[s ? s.ci % P().series.length : 0]; }

function esc(s) {
  return String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
}
function h(tag, attrs) {
  const e = document.createElement(tag);
  if (attrs) for (const k in attrs) {
    const v = attrs[k];
    if (v == null) continue;
    if (k === 'class') e.className = v;
    else if (k === 'text') e.textContent = v;
    else if (k === 'html') e.innerHTML = v;
    else if (k.slice(0, 2) === 'on') e.addEventListener(k.slice(2), v);
    else e.setAttribute(k, v);
  }
  for (let i = 2; i < arguments.length; i++) {
    const c = arguments[i];
    if (c == null) continue;
    if (Array.isArray(c)) c.forEach(x => x != null && e.append(x));
    else e.append(c.nodeType ? c : document.createTextNode(String(c)));
  }
  return e;
}
function fmt(v, d) { return v == null || isNaN(v) ? '—' : (d ? Number(v).toFixed(d) : String(Math.round(v * 10) / 10)); }
function fmtSigned(v) { return v == null || isNaN(v) ? '—' : (v > 0 ? '+' + fmt(v) : fmt(v)); }
function pct(v) { return v == null ? '—' : (v * 100).toFixed(1) + '%'; }

async function copyText(t) {
  try { await navigator.clipboard.writeText(t); return true; } catch (e) {
    const ta = document.createElement('textarea');
    ta.value = t; ta.style.position = 'fixed'; ta.style.opacity = '0';
    document.body.append(ta); ta.select();
    let ok = false;
    try { ok = document.execCommand('copy'); } catch (e2) { /* ignore */ }
    ta.remove();
    return ok;
  }
}

function safeFileName(s) {
  return String(s == null ? '' : s).replace(/[\\/:*?"<>|\r\n]+/g, '-').trim() || '成绩';
}
function downloadTextFile(filename, text, mime) {
  const blob = new Blob([text], { type: mime || 'text/csv;charset=utf-8' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = filename;
  document.body.append(a);
  a.click();
  a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 1000);
}

const tt = document.getElementById('tt');
function showTT(x, y, title, rows) {
  tt.innerHTML = '';
  tt.append(h('div', { class: 't', text: title }));
  for (const r of rows) {
    const row = h('div', { class: 'r' },

  }

  if (left + rect.width > vw - 8) left = x - rect.width - pad;
  if (top + rect.height > window.innerHeight - 8) top = y - rect.height - pad;
  tt.style.left = left + 'px'; tt.style.top = top + 'px';
}
function hideTT() { tt.style.display = 'none'; }

/* ---------- 折线图 ---------- */
function niceTicks(min, max, count) {
  if (min === max) { min -= 1; max += 1; }
  const span = max - min;
  const step0 = span / Math.max(1, count - 1);
  const mag = Math.pow(10, Math.floor(Math.log10(step0)));
  const norm = step0 / mag;
  const step = (norm <= 1 ? 1 : norm <= 2 ? 2 : norm <= 2.5 ? 2.5 : norm <= 5 ? 5 : 10) * mag;
  const lo = Math.floor(min / step) * step, hi = Math.ceil(max / step) * step;
  const ticks = [];
  for (let v = lo; v <= hi + step * 0.5; v += step) ticks.push(Math.round(v * 1e6) / 1e6);
  return { lo, hi, ticks };
}

/**
 * lineChartCard: 单卡折线图（含图例 + 表格视图切换 + 十字线 tooltip）
 * opts: {title, sub, xLabels:[], series:[{key,name,color,values:[]}], refs:[{y,label,color}],
 *        invertY, yUnit, height, labelLast}
 */
function lineChartCard(opts) {
  const pal = P();
  const off = new Set();
  const W = 720, H = opts.height || 240;
  const padL = 48, padR = (opts.refs && opts.refs.length) ? 92 : 56, padT = 14, padB = 30;
  const plotW = W - padL - padR, plotH = H - padT - padB;

  function visSeries() { return opts.series.filter(s => !off.has(s.key)); }

  function domain() {
    let vals = [];
    for (const s of visSeries()) for (const v of s.values) if (v != null && !isNaN(v)) vals.push(v);
    for (const r of (opts.refs || [])) if (r.y != null) vals.push(r.y);
    if (!vals.length) return { lo: 0, hi: 1, ticks: [0, 1] };
    let min = Math.min.apply(null, vals), max = Math.max.apply(null, vals);
    const pad = Math.max(1, (max - min) * 0.12);
    return niceTicks(min - pad, max + pad, 5);
  }

  function build(onlyTable) {
    const d = domain();
    const n = opts.xLabels.length;
    const X = i => n <= 1 ? padL + plotW / 2 : padL + plotW * i / (n - 1);
    const Yraw = v => padT + plotH * (1 - (v - d.lo) / (d.hi - d.lo));
    const Y = v => opts.invertY ? padT + plotH * (v - d.lo) / (d.hi - d.lo) : Yraw(v);
    const wrap = h('div');
    wrap.append(h('div', { class: 'chart-head' },
      h('h3', { text: opts.title }),
      opts.sub ? h('span', { class: 'cs', text: opts.sub }) : null,
      h('span', { class: 'tw' },
        h('button', { class: 'btn', onclick: () => { tblHidden = !tblHidden; rerender(); }, text: tblHidden ? '表格视图' : '返回图表' }))));

    if (tblHidden) {
      const tbl = h('table', { class: 'tb' });
      const thead = h('thead', {}, h('tr', {}, h('th', { text: '考试' }),
        visSeries().map(s => h('th', { text: s.name })),
        (opts.refs || []).map(r => h('th', { text: r.label }))));
      const tbody = h('tbody', {}, opts.xLabels.map((lb, i) => h('tr', {},
        h('td', { text: lb }),
        visSeries().map(s => h('td', { text: s.values[i] == null ? '—' : fmt(s.values[i]) })),
        (opts.refs || []).map(() => h('td', { text: '—' })))));
      tbl.append(thead, tbody);
      wrap.append(h('div', { class: 'tscroll' }, tbl));
      return wrap;
    }
    if (!visSeries().length || !n) { wrap.append(h('div', { class: 'empty', text: '暂无数据' })); return wrap; }

    // SVG 字符串（静态颜色/数字，动态文本已转义）
    let g = '';
    for (const t of d.ticks) {
      const y = Y(t);
      g += `<line x1="${padL}" y1="${y}" x2="${W - padR}" y2="${y}" stroke="${pal.grid}" stroke-width="1"/>`;
      g += `<text x="${padL - 8}" y="${y + 4}" text-anchor="end" font-size="11" fill="${pal.muted}" style="font-variant-numeric:tabular-nums">${t}</text>`;
    }
    g += `<line x1="${padL}" y1="${padT + plotH}" x2="${W - padR}" y2="${padT + plotH}" stroke="${pal.axis}" stroke-width="1"/>`;
    for (let i = 0; i < n; i++) {
      g += `<text x="${X(i)}" y="${H - 8}" text-anchor="middle" font-size="11" fill="${pal.muted}">${esc(opts.xLabels[i])}</text>`;
    }
    // 参考线
    for (const r of (opts.refs || [])) {
      if (r.y == null) continue;
      const y = Y(r.y);
      if (y < padT - 2 || y > padT + plotH + 2) continue;
      g += `<line x1="${padL}" y1="${y}" x2="${W - padR}" y2="${y}" stroke="${r.color}" stroke-width="1.5" stroke-opacity="0.75"/>`;
      g += `<text x="${W - padR + 6}" y="${y + 4}" font-size="11" fill="${pal.ink2}">${esc(r.label)}</text>`;
    }
    // 折线（缺值断开）
    for (const s of visSeries()) {
      let dstr = '', pen = false;
      for (let i = 0; i < n; i++) {
        const v = s.values[i];
        if (v == null || isNaN(v)) { pen = false; continue; }
        dstr += (pen ? 'L' : 'M') + X(i).toFixed(1) + ' ' + Y(v).toFixed(1) + ' ';
        pen = true;
      }
      g += `<path d="${dstr}" fill="none" stroke="${s.color}" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>`;
      // 端点直标（仅单系列时）
      if (opts.labelLast && visSeries().length === 1) {
        for (let i = n - 1; i >= 0; i--) if (s.values[i] != null) {
          g += `<circle cx="${X(i)}" cy="${Y(s.values[i])}" r="4.5" fill="${s.color}" stroke="${pal.surface}" stroke-width="2"/>`;
          g += `<text x="${X(i) + 8}" y="${Y(s.values[i]) + 4}" font-size="12" font-weight="600" fill="${pal.ink}">${fmt(s.values[i])}</text>`;
          break;
        }
      } else {
        for (let i = 0; i < n; i++) if (s.values[i] != null)
          g += `<circle cx="${X(i)}" cy="${Y(s.values[i])}" r="3.5" fill="${s.color}" stroke="${pal.surface}" stroke-width="2"/>`;
      }
    }
    const svg =
      `<svg class="line" viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(opts.title)}">` +
      g +
      `<line class="xh" x1="0" y1="${padT}" x2="0" y2="${padT + plotH}" stroke="${pal.axis}" stroke-width="1" opacity="0"/>` +
      `<rect x="0" y="0" width="${W}" height="${H}" fill="transparent" style="cursor:crosshair"/>` +
      `</svg>`;
    const holder = h('div', { class: 'chart-view', html: svg });
    const svgEl = holder.firstChild;
    // 十字线 + tooltip
    const xh = svgEl.querySelector('.xh');
    svgEl.addEventListener('pointermove', ev => {
      const box = svgEl.getBoundingClientRect();
      const px = (ev.clientX - box.left) * W / box.width;
      let idx = n <= 1 ? 0 : Math.round((px - padL) / plotW * (n - 1));
      idx = Math.max(0, Math.min(n - 1, idx));
      xh.setAttribute('x1', X(idx)); xh.setAttribute('x2', X(idx)); xh.setAttribute('opacity', '0.8');
      const rows = visSeries().map(s => ({
        color: s.color, name: s.name, value: s.values[idx] == null ? '—' : fmt(s.values[idx]) + (opts.yUnit || ''),
      }));
      for (const r of (opts.refs || [])) rows.push({ color: r.color, name: r.label, value: fmt(r.y) + (opts.yUnit || '') });
      showTT(ev.clientX, ev.clientY, opts.xLabels[idx], rows);
    });
    svgEl.addEventListener('pointerleave', () => { xh.setAttribute('opacity', '0'); hideTT(); });
    wrap.append(holder);

    // 图例（≥2 系列；点击可隐藏/显示）
    if (opts.series.length >= 2) {
      const lg = h('div', { class: 'legend' }, opts.series.map(s =>
        h('span', {
          class: 'li' + (off.has(s.key) ? ' off' : ''), role: 'button', tabindex: '0',
          title: '点击显示/隐藏',
          onclick: () => { off.has(s.key) ? off.delete(s.key) : off.add(s.key); rerender(); },
          onkeydown: ev => { if (ev.key === 'Enter' || ev.key === ' ') { ev.preventDefault(); off.has(s.key) ? off.delete(s.key) : off.add(s.key); rerender(); } },
        },
          h('span', { class: 'key', style: 'border-top-color:' + s.color }),
          s.name)));
      wrap.append(lg);
    }
    return wrap;
  }

  let tblHidden = false;
  let cur = null;
  function rerender() {
    const next = build();
    if (cur && cur.parentNode) cur.parentNode.replaceChild(next, cur);
    cur = next;
  }
  cur = build();
  const host = h('div', { class: 'card' }, cur);
  return host;
}

/* ---------- 柱状图（单系列，名义类别 → 统一 slot1 色） ---------- */
function barChartCard(opts) {
  // opts: {title, sub, items:[{label, value, ref?}], yMax, unit, height}
  const pal = P();
  const W = 720, H = opts.height || 220;
  const padL = 44, padR = 16, padT = 18, padB = 30;
  const plotW = W - padL - padR, plotH = H - padT - padB;
  const vals = opts.items.map(i => i.value).filter(v => v != null);
  const maxV = opts.yMax != null ? opts.yMax : (vals.length ? Math.max.apply(null, vals) : 1);
  const d = niceTicks(0, Math.max(maxV, 1), 5);
  const n = opts.items.length;
  const band = plotW / Math.max(1, n);
  const barW = Math.min(24, band * 0.55);
  const Y = v => padT + plotH * (1 - (v - d.lo) / (d.hi - d.lo));
  let g = '';
  for (const t of d.ticks) {
    const y = Y(t);
    g += `<line x1="${padL}" y1="${y}" x2="${W - padR}" y2="${y}" stroke="${pal.grid}" stroke-width="1"/>`;
    g += `<text x="${padL - 8}" y="${y + 4}" text-anchor="end" font-size="11" fill="${pal.muted}">${t}</text>`;
  }
  g += `<line x1="${padL}" y1="${padT + plotH}" x2="${W - padR}" y2="${padT + plotH}" stroke="${pal.axis}" stroke-width="1"/>`;
  const base = Y(d.lo);
  opts.items.forEach((it, i) => {
    const cx = padL + band * (i + 0.5);
    if (it.value != null) {
      const y = Y(it.value), hgt = Math.max(2, base - y);
      const r = Math.min(4, barW / 2, hgt);
      g += `<path d="M${cx - barW / 2} ${base} L${cx - barW / 2} ${y + r} Q${cx - barW / 2} ${y} ${cx - barW / 2 + r} ${y} L${cx + barW / 2 - r} ${y} Q${cx + barW / 2} ${y} ${cx + barW / 2} ${y + r} L${cx + barW / 2} ${base} Z" fill="${pal.accent}"/>`;
      g += `<text x="${cx}" y="${y - 6}" text-anchor="middle" font-size="11" font-weight="600" fill="${pal.ink}">${fmt(it.value)}</text>`;
    }
    g += `<text x="${cx}" y="${H - 8}" text-anchor="middle" font-size="11" fill="${pal.muted}">${esc(it.label)}</text>`;
    g += `<rect x="${cx - band / 2}" y="${padT}" width="${band}" height="${plotH}" fill="transparent" data-i="${i}" style="cursor:default"/>`;
  });
  const holder = h('div', { class: 'chart-view', html: `<svg class="bar" viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(opts.title)}">${g}</svg>` });
  const svgEl = holder.firstChild;
  svgEl.querySelectorAll('rect[data-i]').forEach(rc => {
    rc.addEventListener('pointermove', ev => {
      const it = opts.items[+rc.getAttribute('data-i')];
      showTT(ev.clientX, ev.clientY, it.label, [{ color: pal.accent, name: opts.unit || '', value: it.value == null ? '—' : fmt(it.value) + (opts.valueSuffix || '') }]);
    });
    rc.addEventListener('pointerleave', hideTT);
  });
  // 表格孪生
  let asTable = false, curEl = null;
  const head = h('div', { class: 'chart-head' },
    h('h3', { text: opts.title }),
    opts.sub ? h('span', { class: 'cs', text: opts.sub }) : null,
    h('span', { class: 'tw' }, h('button', {
      class: 'btn', text: asTable ? '返回图表' : '表格视图',
      onclick: () => { asTable = !asTable; rerenderBar(); },
    })));
  function rerenderBar() {
    head.querySelector('.tw button').textContent = asTable ? '返回图表' : '表格视图';
    const next = asTable
      ? h('div', { class: 'tscroll' }, h('table', { class: 'tb' },
        h('thead', {}, h('tr', {}, h('th', { text: '科目' }), h('th', { text: opts.unit || '均分' }))),
        h('tbody', {}, opts.items.map(it => h('tr', {}, h('td', { text: it.label }), h('td', { text: it.value == null ? '—' : fmt(it.value) })))))
      )
      : holder;
    if (curEl && curEl.parentNode) curEl.parentNode.replaceChild(next, curEl);
    else if (curEl) head.parentNode.insertBefore(next, head.nextSibling);
    curEl = next;
  }
  return h('div', { class: 'card' }, head, holder);
}

/* ---------- sparkline ---------- */
function sparkline(values, color, invert) {
  const pal = P();
  const w = 84, hgt = 26, pad = 3;
  const pts = values.filter(v => v != null);
  if (pts.length < 2) return h('span', { class: 'hint', text: pts.length ? String(fmt(pts[0])) : '—' });
  const min = Math.min.apply(null, pts), max = Math.max.apply(null, pts);
  const span = max - min || 1;
  const X = i => pad + (w - pad * 2) * i / (values.length - 1);
  const Y = v => {
    const t = (v - min) / span;
    return invert ? pad + (hgt - pad * 2) * t : pad + (hgt - pad * 2) * (1 - t);
  };
  let dstr = '', pen = false, last = null;
  values.forEach((v, i) => {
    if (v == null) { pen = false; return; }
    dstr += (pen ? 'L' : 'M') + X(i).toFixed(1) + ' ' + Y(v).toFixed(1) + ' ';
    pen = true; last = { x: X(i), y: Y(v) };
  });
  const svg = `<svg width="${w}" height="${hgt}" viewBox="0 0 ${w} ${hgt}" aria-hidden="true">
    <path d="${dstr}" fill="none" stroke="${pal.demph}" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round"/>
    ${last ? `<circle cx="${last.x}" cy="${last.y}" r="2.6" fill="${color}" stroke="${pal.surface}" stroke-width="1.5"/>` : ''}
  </svg>`;
  return h('span', { html: svg });
}

    body: JSON.stringify({ model: cfg.model, messages, stream: true, temperature: 0.6 }),
  });
  if (!res.ok || !res.body) {
    let detail = '';
    try { detail = (await res.text()).slice(0, 300); } catch (e) { /* ignore */ }
    const map = { 401: 'API Key 无效或已过期', 402: '账户余额不足', 403: '没有权限（模型名写错了？）', 429: '请求太频繁或欠费限流' };
    throw new Error(`HTTP ${res.status}${map[res.status] ? '：' + map[res.status] : ''}${detail ? '｜' + detail : ''}`);
  }
  const reader = res.body.getReader();
  const dec = new TextDecoder();
  let buf = '';
  for (;;) {
    const { done, value } = await reader.read();
    if (done) break;
    buf += dec.decode(value, { stream: true });
    const lines = buf.split('\n');
    buf = lines.pop();
    for (const ln of lines) {
      const m = ln.match(/^data:\s*(.+)$/);
      if (!m) continue;
      if (m[1].trim() === '[DONE]') return;
      try {
        const j = JSON.parse(m[1]);
        const d = j.choices && j.choices[0] && j.choices[0].delta && j.choices[0].delta.content;
        if (d) onDelta(d);
      } catch (e) { /* 非 JSON 行忽略 */ }
    }
  }
}

/* ---------- 学生追踪 ---------- */

      row ? lineTag(row) : null)));

  if (!row) { main.append(h('div', { class: 'card' }, h('div', { class: 'empty', text: '没有找到该学生的成绩。' }))); return; }

  // KPI（一个 hero + 若干 stat）

    h('div', { class: 'dt ' + (row.trend === 'up' ? 'up' : row.trend === 'down' ? 'down' : 'flat'),

  kpis.append(h('div', { class: 'kpi' }, h('div', { class: 'lb', text: '年级排名（总榜）' }), h('div', { class: 'vl', text: fmt(row.totalRank) }),
    h('div', { class: 'dt ' + (row.rankDelta > 0 ? 'up' : row.rankDelta < 0 ? 'down' : 'flat'),

  kpis.append(h('div', { class: 'kpi' }, h('div', { class: 'lb', text: '班内排名' }), h('div', { class: 'vl', text: fmt(row.classRank) }),

  kpis.append(h('div', { class: 'kpi' }, h('div', { class: 'lb', text: '上线情况' }),
    h('div', { class: 'vl', style: 'font-size:18px;' + (row.lineStatus === '一本线上' ? 'color:var(--good-text)' : row.lineStatus === '未上线' ? 'color:var(--critical)' : ''), text: row.lineStatus || '—' }),

  main.append(kpis);

  // 总分趋势（含两条线）
  const stLast = computed[latestIdx].stats;
  main.append(lineChartCard({
    title: '总分趋势', sub: '满分 750，横线为本一线 / 本二线',
    xLabels: examNames,
    series: [{ key: 'total', name: '总分', color: P().accent, values: hist.map(r => r ? r.total : null) }],
    refs: [
      { y: stLast.line1, label: '本一线 ' + stLast.line1, color: P().good },
      { y: stLast.line2, label: '本二线 ' + stLast.line2, color: P().warn },
    ],
    labelLast: true, height: 230,
  }));

  // 年级排名趋势（名次越小越好 → 反转轴）
  main.append(lineChartCard({
    title: '年级排名趋势', sub: '名次越靠上越好 · 优先使用学校官方年排',
    xLabels: examNames,
    series: [{ key: 'rank', name: '年级排名', color: P().accent, values: hist.map(r => r ? r.totalRank : null) }],
    invertY: true, labelLast: true, height: 210, yUnit: ' 名',

  // 分类排名趋势（物理类 / 历史类）
  const trackKey = row.track1 === 'history' ? 'histRank' : 'physRank';

      title: row.track1 === 'history' ? '历史类排名趋势' : '物理类排名趋势',

      xLabels: examNames,
      series: [{ key: trackKey, name: row.track1 === 'history' ? '历史类排名' : '物理类排名', color: P().series[3], values: hist.map(r => r ? r[trackKey] : null) }],

    }));
  }

  // 该生本场的科目列表（动态）
  const myKeys = sortSubjectKeys(row.subjectKeys && row.subjectKeys.length

  // 各科趋势（动态系列 + 图例开关）
  main.append(lineChartCard({

    const cExam = computed[latestIdx];
    const listAvg = cExam.stats.subjAvg[k];
    const clsRows = row.cls ? cExam.rows.filter(r => r.cls === row.cls && r.subj[k] != null) : [];
    const classAvg = clsRows.length ? clsRows.reduce((a, r) => a + r.subj[k], 0) / clsRows.length : null;
    const ev = subjectEval(row, s, listAvg, classAvg, clsRows.length, hist, latestIdx);
    if (!ev) { grid.append(h('div', { class: 'subj-card' }, h('div', { class: 'hd' }, h('span', { class: 'dot', style: 'background:' + subjColor(k) }), h('span', { class: 'nm', text: s.name })), h('div', { class: 'hint', text: '本场缺考/未录入' }))); continue; }
    evals.push({ s, ev });
    const bdCls = ev.levelCls === 'good' ? 'good' : ev.levelCls === 'crit' ? 'crit' : 'warn';
    grid.append(h('div', { class: 'subj-card' },
      h('div', { class: 'hd' },
        h('span', { class: 'dot', style: 'background:' + subjColor(k) }),
        h('span', { class: 'nm', text: s.name }),
        h('span', { class: 'bd tag ' + bdCls, text: (ev.levelCls === 'good' ? '✓ ' : ev.levelCls === 'crit' ? '⚠ ' : '') + ev.level })),
      h('div', { class: 'sc' }, fmt(ev.score), h('small', { text: ' / ' + s.max + (isAssignedSubject(k) ? '（赋分）' : '') })),
      h('div', { class: 'meter' }, h('i', { style: 'width:' + Math.round(ev.rate * 100) + '%;background:' + subjColor(k) })),
      h('dl', {},
        h('dt', { text: '得分率' }), h('dd', { text: pct(ev.rate) }),
        h('dt', { text: '名单单科名次' }), h('dd', { text: fmt(ev.rank) }),
        h('dt', { text: '与名单均分比' }), h('dd', { style: ev.vsSchool != null && ev.vsSchool < 0 ? 'color:var(--critical)' : 'color:var(--good-text)', text: ev.vsSchool == null ? '—' : fmtSigned(Math.round(ev.vsSchool * 10) / 10) + ' 分' }),
        h('dt', { text: '与班均比' }), h('dd', { text: ev.vsClass == null ? '—' : fmtSigned(Math.round(ev.vsClass * 10) / 10) }),
        h('dt', { text: '近三次' }), h('dd', {}, ev.trendDelta == null ? h('span', { class: 'hint', text: '数据不连续' }) : sparkline(ev.spark, subjColor(k))))));
  }
  main.append(h('div', { class: 'card' }, h('h2', { text: '各科评估' }),
    h('p', { class: 'sub', text: '均分与单科名次仅覆盖本次导入名单；缺考/间隔场次不做走势判断。按得分率分档：≥85% 优秀 · ≥70% 良好 · ≥60% 中等 · 其余待提高' }), grid));

  // ---- 偏科 / 不匹配评估 ----
  const subjAvgs = computed[latestIdx].stats.subjAvg;
  const mm = mismatchEval(row, latestIdx, subjAvgs);
  if (mm) {
    const cfg = mismatchSettings();
    const totalRanked = mm.listTotal || mm.subjects.filter(x => x.ranked).length;
    const sub = `双口径判定：自身失衡决定档位——某科得分率比自身各科平均低 ≥${Math.round(cfg.selfGap * 100)}% 标「关注」，≥${Math.round(cfg.severeGap * 100)}% 标「预警」；名单口径（比该科均分低 ≥${Math.round(cfg.vsAvgGap * 100)}% 或排名落入后 ${Math.round(cfg.rankTail * 100)}%）作佐证并用于排序，不单独触发（名单不足 ${cfg.minRanked} 人不看排名）`;
    let headTag = null;
    if (mm.level === 'severe') headTag = h('span', { class: 'tag crit', text: '● 预警 · 严重不匹配，优先介入' });
    else if (mm.level === 'watch') headTag = h('span', { class: 'tag warn', text: '⚠ 关注 · 明显偏科，建议谈话' });
    else headTag = h('span', { class: 'tag good', text: '✓ 各科均衡' });
    // 各科得分率横向条形（按与自身平均/名单均分差距着色）
    const wrap = h('div', { style: 'display:flex;flex-direction:column;gap:6px;margin-top:10px' });
    for (const x of mm.subjects.slice().sort((a, b) => b.rate - a.rate)) {

      const barColor = x.level === 'ok' ? subjColor(x.key) : bad;
      const marks = [];
      // 只有该科已被标记时才列佐证，避免「均衡」的学生满屏红字造成误读
      if (x.level !== 'ok') {
        if (x.selfHit) marks.push(`自身 -${Math.round(x.selfGap * 100)}%`);
        if (x.avgHit) marks.push(x.vsAvgGap != null ? `均分 -${Math.round(x.vsAvgGap * 100)}%` : '低于均分');
        if (x.rankHit) marks.push(`名单后 ${Math.round(x.tail * 100)}%`);
      }
      wrap.append(h('div', { style: 'display:flex;align-items:center;gap:10px' },
        h('span', { style: 'width:36px;font-size:12px;color:var(--ink-2)', text: x.name }),
        h('div', { class: 'meter', style: 'flex:1;margin:0' },

        h('span', { style: 'width:44px;text-align:right;font-variant-numeric:tabular-nums;font-size:12px', text: pct(x.rate) }),
        h('span', { style: 'width:64px;text-align:right;font-size:12px;color:var(--muted)', text: x.ranked ? `第 ${x.rank} / ${totalRanked}` : '无排名' }),
        marks.length ? h('span', { style: 'font-size:12px;color:' + bad, text: marks.join(' · ') }) : null));
    }
    let noteHtml = null;
    if (mm.level !== 'ok') {
      const tips = [];
      for (const x of mm.flagged) {
        const parts = [`得分率 ${pct(x.rate)}`];
        if (x.selfHit) parts.push(`比自身各科平均（${pct(mm.selfAvg)}）低 ${Math.round(x.selfGap * 100)}%`);
        if (x.avgHit && x.vsAvgGap != null) parts.push(`比该科名单均分（${pct(x.avgRate)}）低 ${Math.round(x.vsAvgGap * 100)}%`);
        if (x.rankHit) parts.push(`本次名单单科排名第 ${x.rank}（共 ${totalRanked} 人），落入后 ${Math.round(x.tail * 100)}%`);
        tips.push(h('li', {}, h('strong', { text: x.name + '：' }), parts.join('；') + '。'));
      }

        h('div', { style: 'font-size:13px;font-weight:650;margin-bottom:2px', text: mm.level === 'severe' ? '不匹配科目（优先介入）' : '不匹配科目（建议关注）' }),
        h('ul', { style: 'margin:4px 0 0;padding-left:20px;color:var(--ink-2);font-size:13px;line-height:1.8' }, tips));

      h('h2', { text: '偏科 / 不匹配' }),
      h('p', { class: 'sub', text: sub }),
      h('div', { style: 'margin-bottom:6px' }, headTag),

  // 复习建议
  const adviceItems = evals.map(({ s, ev }) => {
    const a = buildAdvice(s, {
      rate: ev.rate, trend: ev.trend, trendDelta: ev.trendDelta, vsSchool: ev.vsSchool,
      score: ev.score, schoolAvg: computed[latestIdx].stats.subjAvg[s.key], subjectName: s.name,

    return { s, ev, a };
  }).sort((x, y) => y.a.priority - x.a.priority);
  const ul = h('ul', { class: 'advice' });
  for (const it of adviceItems) {
    ul.append(h('li', {},
      h('div', { class: 'ah' },
        h('span', { class: 'dot', style: 'background:' + subjColor(it.s.key) }),
        it.s.name,
        h('span', { class: 'pr', text: `优先级：${it.ev.rate < 0.65 ? '高' : it.ev.rate < 0.80 ? '中' : '巩固'} · 得分率 ${pct(it.ev.rate)}` })),
      h('p', { text: it.a.text })));
  }
  main.append(h('div', { class: 'card' }, h('h2', { text: '复习建议' }), h('p', { class: 'sub', text: '按提分空间自动排序，供谈话和作业布置参考' }), ul));

  // ---- 背景档案 + AI 深度分析 ----
  if (!data.profiles) data.profiles = {};
  const profKey = row.studentId ? 'id:' + row.studentId : ui.student;
  if (!data.profiles[profKey] && data.profiles[row.name]) data.profiles[profKey] = data.profiles[row.name];
  const prof = data.profiles[profKey] || (data.profiles[profKey] = { goal: '', notes: '' });
  main.append(h('div', { class: 'card' },
    h('h2', { text: '背景档案' }),
    h('p', { class: 'sub', text: '选填。写上目标和老师掌握的情况，AI 分析会结合这些信息，规则版建议不受影响。' }),
    h('div', { class: 'entry-cols' },
      h('label', { class: 'fld' }, '目标（如：冲一本 / 苏州大学 / 保二本）',

        h('textarea', { style: 'min-height:64px', placeholder: '选填', oninput: ev => { prof.notes = ev.target.value; saveData(); } }, prof.notes)))));

  const briefCtx = {
    name: row.name, cls: row.cls, comboName: row.comboName, trackName: row.trackName,

      aiText.style.display = 'block'; aiText.textContent = '';
      try {

          aiText.scrollTop = aiText.scrollHeight;

      } finally {

  main.append(h('div', { class: 'card' },
    h('h2', { text: 'AI 深度分析' }),
    h('p', { class: 'sub', text: '把该生全部数据 + 背景档案发给你在「设置」里配置的 AI，流式生成逐生定制的分析。费用由你的 API 账户承担，单次约几分钱。' }),
    h('div', { class: 'row', style: 'gap:8px' },
      genBtn,
      h('button', {
        class: 'btn', text: '复制简报',
        onclick: async ev => { ev.target.textContent = (await copyText(briefMd)) ? '已复制 ✓' : '复制失败'; setTimeout(() => { ev.target.textContent = '复制简报'; }, 1500); },

  // 历次明细表
  const tbl = h('table', { class: 'tb' });

      myKeys.map(k => h('td', { text: r.subj[k] == null ? '—' : fmt(r.subj[k]) })),
      h('td', { text: fmt(r.total) }), h('td', { text: fmt(r.totalRank) }),
      h('td', { text: fmt(r.physRank) }), h('td', { text: fmt(r.histRank) }),
      h('td', { text: fmt(r.classRank) }), h('td', { text: fmt(r.comboRank) }),
      h('td', { class: r.trend || '', text: r.totalDelta == null ? '—' : (r.totalDelta > 0 ? '↑ +' + r.totalDelta : r.totalDelta < 0 ? '↓ ' + r.totalDelta : '持平') }),
      h('td', { text: r.lineStatus || '—' }));
  })));
  main.append(h('div', { class: 'card' }, h('h2', { text: '历次明细' }), h('div', { class: 'tscroll' }, tbl)));
}

function renderImportPreview(exam) {
  const pv = entryPreview;
  if (!pv || pv.examIdx !== ui.examIdx) return null;
  const blocked = !!pv.errors.length;
  const wrap = h('div', { class: 'banner', id: 'importPreview', style: 'border-left-color:var(--accent);margin-top:14px' });

  wrap.append(h('div', { style: 'display:flex;align-items:center;gap:8px;flex-wrap:wrap' },
    h('strong', { text: '整理结果预览' }),
    h('span', { class: 'tag good', text: `识别 ${pv.students.length} 人` }),
    pv.meta && pv.meta.skipped ? h('span', { class: 'tag', text: `跳过 ${pv.meta.skipped} 行` }) : null,
    pv.meta && pv.meta.filledClass ? h('span', { class: 'tag', text: `补班级 ${pv.meta.filledClass} 行` }) : null,
    pv.meta && pv.meta.missingYearRank ? h('span', { class: 'tag crit', text: `缺年排 ${pv.meta.missingYearRank} 人` })
      : (pv.meta && pv.meta.yearRankColumn ? h('span', { class: 'tag good', text: '官方年排已就绪' }) : null),
    pv.errors.length ? h('span', { class: 'tag crit', text: `${pv.errors.length} 个必须修正` }) : h('span', { class: 'tag good', text: '校验通过' })));

  if (pv.notes.length) {
    wrap.append(h('ul', { style: 'margin:8px 0 0;padding-left:20px;color:var(--ink-2);font-size:12px;line-height:1.8' },
      pv.notes.map(t => h('li', { text: t }))));
  }

  // 无表头表：科目列是按位置推测的，让用户核对（改完点「按此对照重新整理」）
  if (pv.meta && pv.meta.mode === 'position' && pv.meta.guessedSubjects) {
    const cur = data.settings.combos || DEFAULT_COMBOS;
    const pool = SUBJECT_DEFS.map(s => s.key).filter(k => cur.some(c => comboSubjectKeys(c).includes(k)));
    const guessed = pv.meta.guessedSubjects;
    const assignCols = pv.meta.assignedIdx || [];
    const rowFor = (label, idx, isAssign) => {
      // 当前值：用户手动指定过的优先，否则用系统推测的
      const curVal = (isAssign ? (entryAssignedMap || {})[idx] : (entrySubjectMap || {})[idx])
        || (isAssign ? '' : (guessed[idx] || ''));
      const sel = h('select', {
        onchange: ev => {
          const target = isAssign ? (entryAssignedMap || (entryAssignedMap = {})) : (entrySubjectMap || (entrySubjectMap = {}));
          target[idx] = ev.target.value || '';
          if (!isAssign) entrySubjectMap = target;
          else entryAssignedMap = target;
        },
      },
        h('option', { value: '', text: isAssign ? '（不作为赋分列）' : '（忽略此列）' }),
        (isAssign ? pool.filter(k => isAssignedSubject(k)) : pool).map(k => h('option', {
          value: k, selected: curVal === k ? '' : null,
        }, (SUBJECT_MAP[k] ? SUBJECT_MAP[k].name : k) + (isAssignedSubject(k) ? '（赋分）' : ''))));
      return h('div', { style: 'display:flex;align-items:center;gap:8px;margin-bottom:6px' },
        h('span', { style: 'min-width:80px;font-size:12px;color:var(--ink-2)', text: label }),
        h('span', { style: 'min-width:52px;font-size:12px;color:var(--muted)', text: `第 ${idx + 1} 列` }),
        sel);
    };
    const box = h('div', { style: 'margin-top:10px;padding:12px 14px;border:1px solid var(--border);border-radius:10px;background:var(--surface-2)' },
      h('div', { style: 'font-size:13px;font-weight:650;margin-bottom:8px', text: '科目列对照（请核对）' }),
      h('p', { class: 'hint', style: 'margin:0 0 10px', text: '没有表头时系统只能按位置推测科目，认错了请在这里改，然后点「按此对照重新整理」。' }),
      h('div', { style: 'display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:0 24px' },
        h('div', {}, guessed.map((k, i) => rowFor('第 ' + (i + 1) + ' 个科目列', i, false))),
        assignCols.length ? h('div', {}, assignCols.map((idx, i) => rowFor('赋分列 ' + (i + 1), i, true))) : null),
      h('div', { style: 'margin-top:10px' },
        h('button', {
          class: 'btn primary', id: 'reparseBtn', text: '按此对照重新整理',
          onclick: () => {
            const opts = {
              requireYearRank: true,
              combos: data.settings.combos || DEFAULT_COMBOS,
              classes: data.settings.classes || DEFAULT_CLASSES,
            };
            if (entrySubjectMap) opts.subjectMap = entrySubjectMap;
            if (entryAssignedMap) opts.assignedMap = entryAssignedMap;
            const res = parseImport(entryText, opts);
            entryPreview = Object.assign({ examIdx: ui.examIdx }, res);
            render();
          },
        })));
    wrap.append(box);
  }

  if (pv.errors.length) {
    wrap.append(h('div', { class: 'banner crit', style: 'margin-top:10px' },
      h('div', { style: 'font-weight:600', text: `必须修正（显示前 ${Math.min(10, pv.errors.length)} 条；导入已暂停）：` }),
      h('ul', {}, pv.errors.slice(0, 10).map(t => h('li', { text: t }))),
      pv.errors.length > 10 ? h('div', { class: 'hint', text: `还有 ${pv.errors.length - 10} 条，请修正源表后重新粘贴。` }) : null));
  }

  // 预览表：动态科目
  const combosNow = data.settings.combos || DEFAULT_COMBOS;
  const previewFields = scoreFieldsForCombos(combosNow);
  const cols = [
    ['学号', 'studentId'], ['姓名', 'name'], ['班级', 'cls'], ['组合', 'comboId'], ['年排', 'yearRank'],
    ...previewFields.map(f => [f.label, f.key]),
  ];
  const tbl = h('table', { class: 'tb' });
  tbl.append(h('thead', {}, h('tr', {}, cols.map(c => h('th', { text: c[0] })))));
  tbl.append(h('tbody', {}, pv.students.slice(0, 200).map(s => h('tr', {},
    cols.map(([, key]) => h('td', {
      text: key === 'comboId'
        ? (combosNow.find(c => c.id === s.comboId) ? comboLabel(combosNow.find(c => c.id === s.comboId)) : '—')
        : (s[key] == null || s[key] === '' ? '—' : s[key]),
    }))))));
  wrap.append(h('div', { class: 'tscroll', style: 'margin-top:10px;max-height:320px' }, tbl));
  if (pv.students.length > 200) wrap.append(h('p', { class: 'hint', text: `预览仅显示前 200 人，实际会导入全部 ${pv.students.length} 人。` }));

  wrap.append(h('div', { class: 'row', style: 'margin-top:12px;gap:8px;align-items:center' },
    h('button', {
      class: 'btn primary',
      text: blocked ? '修正错误后才能导入' : (pv.students.length ? `确认导入 ${pv.students.length} 人` : '没有可导入的学生'),
      disabled: pv.students.length && !blocked ? null : '',
      onclick: () => {
        if (!pv.students.length || blocked) return;
        if (exam.students.length && !confirm(`确认导入 ${pv.students.length} 人，覆盖原有 ${exam.students.length} 人？`)) return;
        exam.students = pv.students.map(s => {
          const out = {
            studentId: s.studentId || '', name: s.name, cls: s.cls || '',
            comboId: s.comboId || '', yearRank: s.yearRank,
          };
          for (const f of previewFields) out[f.key] = s[f.key];
          return out;
        });
        data.isSample = false;
        entryNotice = `已导入 ${pv.students.length} 名学生到「${exam.name}」（年级排名采用学校官方年排）。`;
        entryPreview = null;
        entryText = '';
        saveData();
        render();
      },
    }),
    h('button', { class: 'btn', text: '取消', onclick: () => { entryPreview = null; render(); } }),
    blocked
      ? h('span', { class: 'hint', style: 'color:var(--critical)', text: '错误已拦截：修正源表后重新粘贴并预览。' })
      : h('span', { class: 'hint', text: '跨场追踪优先按学号；无学号时按「班级 + 姓名」对齐。' })));
  return wrap;
}

function lineTag(r) {
  if (!r.lineStatus) return null;
  const cls = r.lineStatus === '一本线上' ? 'good' : r.lineStatus === '未上线' ? 'crit' : '';
  return h('span', { class: 'tag ' + cls, text: (r.lineStatus === '一本线上' ? '✓ ' : r.lineStatus === '未上线' ? '⚠ ' : '') + r.lineStatus });
}

/* ---------- 录入 ---------- */
function renderEntry() {
  if (entryPreview && entryPreview.examIdx !== ui.examIdx) { entryPreview = null; entryText = ''; entrySubjectMap = null; entryAssignedMap = null; }
  if (data.isSample) {
    main.append(h('div', { class: 'banner' },

    h('div', { class: 'row', style: 'gap:8px;align-items:center' },

  const exam = data.exams[ui.examIdx];

      h('label', { class: 'fld' }, '本一线（0–750）',

      h('label', { class: 'fld' }, '本二线（0–750）',
        h('input', { type: 'number', min: '0', max: '750', value: exam.line2 == null ? data.settings.line2 : exam.line2, oninput: ev => { exam.line2 = ev.target.value === '' ? null : Number(ev.target.value); saveData(); } })),
      h('div', { class: 'row', style: 'align-items:flex-end;gap:8px' },
        h('button', {
          class: 'btn danger', text: '删除本场',
          onclick: () => {
            if (!confirm(`删除「${exam.name}」及其 ${exam.students.length} 条成绩？`)) return;
            data.exams.splice(ui.examIdx, 1); ui.examIdx = Math.max(0, ui.examIdx - 1);
            entryText = ''; entryPreview = null; entryNotice = '';
            saveData(); render();
          },
        })))));

  // 粘贴导入
  const previewHost = h('div');
  const msg = h('div', { class: 'msg' });

    class: 'paste',
    placeholder: '从 Excel / WPS 直接复制粘贴，格式不用统一。\n支持：标题行、有/无表头、序号/学号/总分等多余列、汇总行、空班级、全角数字、缺考、拼班（不同选科组合）。\n推荐列：学号（重名时必填） 姓名 班级 选科组合 年级排名（必填） 语文 数学 英语 首选科目 再选科目1 再选科目2 [赋分列]\n选科组合可写「物化地」这样的简称；不写则按班级在「设置」里配置的组合推断。\n越界分数、重复身份、缺年排会拦截导入；整理完先显示预览，确认后再覆盖本场。',
  }, entryText);
  ta.addEventListener('input', () => {
    entryText = ta.value;
    entryNotice = '';
    msg.className = 'msg';
    msg.textContent = '';

  });

  function rosterForTemplate() {

      studentId: s.studentId || '', name: s.name, cls: s.cls || '',
      comboId: s.comboId || '', comboName: s.comboId ? (combosNow.find(c => c.id === s.comboId) ? comboLabel(combosNow.find(c => c.id === s.comboId)) : '') : '',
      yearRank: s.yearRank,
    }));
    if (exam.students.length) return take(exam);
    for (let i = ui.examIdx - 1; i >= 0; i--) if (data.exams[i].students.length) return take(data.exams[i]);
    for (let i = ui.examIdx + 1; i < data.exams.length; i++) if (data.exams[i].students.length) return take(data.exams[i]);
    return [];
  }
  function downloadTemplate(withRoster) {
    const roster = withRoster ? rosterForTemplate() : [];
    const csv = buildTemplateCsv(roster, data.settings);

        onclick: () => { if (confirm('清空本场全部学生？')) { exam.students = []; data.isSample = false; entryPreview = null; entryNotice = ''; saveData(); render(); } },
