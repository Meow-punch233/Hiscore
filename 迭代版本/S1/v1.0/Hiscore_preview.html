      h('h2', { text: '导出前请核对' }),
      h('p', { class: 'sub', text: '下列问题会影响分数、赋分或跨场追踪口径，建议修正后再备份：' }),
      h('ul', { style: 'margin:8px 0 0;padding-left:20px;color:var(--ink-2);font-size:13px;line-height:1.8' },
        backupWarnings.slice(0, 12).map(t => h('li', { text: t })))));
  }
}

/* ---------- 设置 ---------- */
function renderSettings() {
  const b = data.settings.bands;
  const settingErrors = validateSettings(data.settings);
  const cfgWarn = settingErrors.length
    ? h('div', { class: 'cfg-warn', style: 'margin-top:12px' },
      h('strong', { text: '当前设置不合规，计算已临时使用安全默认值：' }),
      h('ul', {}, settingErrors.map(t => h('li', { text: t }))))
    : null;

  // ===== 选科组合管理 =====
  if (!Array.isArray(data.settings.combos) || !data.settings.combos.length) {
    data.settings.combos = DEFAULT_COMBOS.map(c => ({ ...c, track2: [...(c.track2 || [])] }));
  }
  if (!Array.isArray(data.settings.classes) || !data.settings.classes.length) {
    data.settings.classes = DEFAULT_CLASSES.map(c => ({ ...c, comboIds: [...(c.comboIds || [])] }));
  }
  const combos = data.settings.combos;
  const classes = data.settings.classes;
  const ensureCombos = () => {
    if (!Array.isArray(data.settings.combos) || !data.settings.combos.length) {
      data.settings.combos = DEFAULT_COMBOS.map(c => ({ ...c, track2: [...(c.track2 || [])] }));
    }
    if (!Array.isArray(data.settings.classes)) data.settings.classes = [];
    return data.settings.combos;
  };

  const comboRows = [];
  for (const c of combos) {
    const t2 = c.track2 || [];
    const track1Sel = h('select', {
      onchange: ev => { c.track1 = ev.target.value; saveData(); render(); },
    }, TRACK1_KEYS.map(k => h('option', { value: k, selected: c.track1 === k ? '' : null }, SUBJECT_MAP[k].name)));
    const t2Boxes = h('div', { style: 'display:flex;gap:10px;flex-wrap:wrap' },
      TRACK2_KEYS.map(k => h('label', {
        style: 'display:inline-flex;align-items:center;gap:4px;font-size:13px;cursor:pointer',
      },
        h('input', {
          type: 'checkbox', checked: t2.includes(k) ? '' : null,
          onchange: ev => {
            const set = new Set(c.track2 || []);
            if (ev.target.checked) set.add(k); else set.delete(k);
            const next = TRACK2_KEYS.filter(x => set.has(x));
            // 再选科目必须恰好 2 门，否则总分口径失真（3+1+2）
            if (next.length !== 2) {
              ev.target.checked = t2.includes(k);
              alert('再选科目必须恰好 2 门（3+1+2 口径）。当前选了 ' + next.length + ' 门。');
              return;
            }
            c.track2 = next;
            saveData(); render();
          },
        }),
        SUBJECT_MAP[k].name)));
    comboRows.push(h('tr', {},
      h('td', {}, h('input', {
        type: 'text', value: c.name || '', style: 'min-width:90px',
        oninput: ev => { c.name = ev.target.value; saveData(); refreshWarningBar(); },
      })),
      h('td', {}, track1Sel),
      h('td', {}, t2Boxes),
      h('td', {}, h('span', { class: 'hint', text: comboName(c) + ' · 满分 ' + comboMaxScore(c) })),
      h('td', {}, h('button', {
        class: 'btn danger', text: '删', style: 'padding:2px 8px;font-size:12px',
        onclick: () => {
          if (combos.length <= 1) { alert('至少要保留一个选科组合。'); return; }
          if (!confirm(`删除组合「${c.name}」？已导入的学生会回退到其它组合。`)) return;
          data.settings.combos = combos.filter(x => x.id !== c.id);
          for (const cl of classes) cl.comboIds = (cl.comboIds || []).filter(id => id !== c.id);
          saveData(); render();
        },
      }))));
  }
  const comboTbl = h('table', { class: 'tb set-tbl' });
  comboTbl.append(h('thead', {}, h('tr', {}, ['组合名', '首选科目', '再选两科（赋分）', '说明', ''].map(t => h('th', { text: t })))));
  comboTbl.append(h('tbody', {}, comboRows));

  main.append(h('div', { class: 'card' },
    h('h2', { text: '选科组合' }),
    h('p', { class: 'sub', text: '新高考 3+1+2：首选科目（物理 / 历史）二选一，再选两门再选科目（化学 / 生物 / 政治 / 地理），两门再选科目按等级赋分计入总分。组合可以自定义，改这里后全表自动重算。' }),
    h('div', { class: 'tscroll' }, comboTbl),
    h('div', { class: 'row', style: 'margin-top:12px;gap:8px' },
      h('button', {
        class: 'btn primary', text: '＋ 新增选科组合',
        onclick: () => {
          const id = 'combo-' + Date.now().toString(36);
          // 组合名必须唯一（导入表按名匹配），用序号生成
          let n = 1;
          const used = new Set(combos.map(c => String(c.name || '').trim()));
          while (used.has('新组合 ' + n)) n++;
          data.settings.combos.push({ id, name: '新组合 ' + n, track1: 'physics', track2: ['chem', 'bio'] });
          saveData(); render();
        },
      }),
      h('span', { class: 'hint', style: 'align-self:center', text: '组合名可自定义；导入表里写组合名（如「物化地」）也会被识别' }))));

  // ===== 班级管理 =====
  const classRows = [];
  for (const cl of classes) {
    const comboChecks = h('div', { style: 'display:flex;gap:10px;flex-wrap:wrap' },
      combos.map(c => h('label', { style: 'display:inline-flex;align-items:center;gap:4px;font-size:13px;cursor:pointer' },
        h('input', {
          type: 'checkbox', checked: (cl.comboIds || []).includes(c.id) ? '' : null,
          onchange: ev => {
            const set = new Set(cl.comboIds || []);
            if (ev.target.checked) set.add(c.id); else set.delete(c.id);
            cl.comboIds = combos.filter(x => set.has(x.id)).map(x => x.id);
            saveData(); render();
          },
        }),
        comboLabel(c))));
    classRows.push(h('tr', {},
      h('td', {}, h('input', {
        type: 'text', value: cl.name || '', style: 'min-width:110px',
        oninput: ev => { cl.name = ev.target.value; saveData(); refreshWarningBar(); },
      })),
      h('td', {}, comboChecks),
      h('td', {}, h('span', { class: 'hint', text: (cl.comboIds || []).length > 1 ? '拼班（多组合混排）' : (cl.comboIds || []).length === 1 ? '单一组合' : '未配置' })),
      h('td', {}, h('button', {
        class: 'btn danger', text: '删', style: 'padding:2px 8px;font-size:12px',
        onclick: () => {
          if (!confirm(`删除班级「${cl.name}」？`)) return;
          data.settings.classes = classes.filter(x => x.id !== cl.id);
          saveData(); render();
        },
      }))));
  }
  const classTbl = h('table', { class: 'tb set-tbl' });
  classTbl.append(h('thead', {}, h('tr', {}, ['班级名称', '包含的选科组合', '班型', ''].map(t => h('th', { text: t })))));
  classTbl.append(h('tbody', {}, classRows));

  main.append(h('div', { class: 'card' },
    h('h2', { text: '班级与班型' }),
    h('p', { class: 'sub', text: '一个班级可以包含多个选科组合（拼班）。勾选多个组合 = 该班学生按各自组合赋分和分类排名；班内排名仍按整个班混排。导入表里带「选科组合」列时优先用列里的值。' }),
    h('div', { class: 'tscroll' }, classTbl),
    h('div', { class: 'row', style: 'margin-top:12px;gap:8px' },
      h('button', {
        class: 'btn primary', text: '＋ 新增班级',
        onclick: () => {
          data.settings.classes.push({ id: 'cls-' + Date.now().toString(36), name: '高三(' + (data.settings.classes.length + 1) + ')班', comboIds: [] });
          saveData(); render();
        },
      }),
      h('span', { class: 'hint', style: 'align-self:center', text: '班级名要和导入表里的「班级」列一致，否则按未分班处理' }))));

  main.append(h('div', { class: 'card' },
    h('h2', { text: '等级赋分规则' }),
    h('p', { class: 'sub', text: '默认为辽宁 / 八省联考式 5 档（A15% B35% C35% D13% E2%）。江苏 3+1+2 同比例；如学校口径不同，改这里后全表自动重算。档内按线性插值，赋分取整。' }),
    (() => {
      const tbl = h('table', { class: 'tb set-tbl' });
      tbl.append(h('thead', {}, h('tr', {}, ['等级', '比例 %', '赋分下限', '赋分上限'].map(t => h('th', { text: t })))));
      tbl.append(h('tbody', {}, b.map((band, i) => h('tr', {},
        h('td', { text: band.name }),
        h('td', {}, h('input', { type: 'number', value: band.pct, min: '0', max: '100', oninput: ev => { band.pct = Number(ev.target.value) || 0; saveData(); refreshWarningBar(); } })),
        h('td', {}, h('input', { type: 'number', value: band.min, min: '0', max: '100', oninput: ev => { band.min = Number(ev.target.value); saveData(); refreshWarningBar(); } })),
        h('td', {}, h('input', { type: 'number', value: band.max, min: '0', max: '100', oninput: ev => { band.max = Number(ev.target.value); saveData(); refreshWarningBar(); } }))))));
      const sum = b.reduce((a, x) => a + (Number(x.pct) || 0), 0);
      return h('div', {}, h('div', { class: 'tscroll' }, tbl),
        h('p', { class: 'hint', style: 'margin:8px 0 0', text: '比例合计：' + sum + '%' + (Math.abs(sum - 100) > 0.01 ? '（不符合规则，计算已用默认档位）' : ' ✓') }));
    })(),
    cfgWarn));

  main.append(h('div', { class: 'card' },
    h('h2', { text: '默认分数线' }),
    h('p', { class: 'sub', text: '新建考试时自动带入；每场考试可在「成绩录入」里单独改。本二线必须低于本一线。' }),
    h('div', { class: 'entry-cols' },
      h('label', { class: 'fld' }, '本一线（0–750）', h('input', { type: 'number', min: '0', max: '750', value: data.settings.line1, oninput: ev => { data.settings.line1 = Number(ev.target.value) || 0; saveData(); } })),
      h('label', { class: 'fld' }, '本二线（0–750）', h('input', { type: 'number', min: '0', max: '750', value: data.settings.line2, oninput: ev => { data.settings.line2 = Number(ev.target.value) || 0; saveData(); } })))));

  // 偏科 / 不匹配判定阈值
  if (!data.settings.mismatch || typeof data.settings.mismatch !== 'object') data.settings.mismatch = { ...DEFAULT_MISMATCH };
  const mmCfg = data.settings.mismatch;
  // 比例类字段存小数，界面按百分数显示；人数类字段原样存
  const mmField = (key, label, hint) => h('label', { class: 'fld' }, label,
    h('input', { type: 'number', min: '0', max: '100', value: Math.round((Number.isFinite(mmCfg[key]) ? mmCfg[key] : DEFAULT_MISMATCH[key]) * 100), oninput: ev => {
      const v = Number(ev.target.value);
      mmCfg[key] = (Number.isFinite(v) && v >= 0 && v <= 100) ? v / 100 : DEFAULT_MISMATCH[key];
      saveData();
    } }),
    hint ? h('span', { class: 'hint', text: hint }) : null);
  const mmCountField = (key, label, hint) => h('label', { class: 'fld' }, label,
    h('input', { type: 'number', min: '2', max: '200', value: Number.isFinite(mmCfg[key]) ? mmCfg[key] : DEFAULT_MISMATCH[key], oninput: ev => {
      const v = Number(ev.target.value);
      mmCfg[key] = (Number.isFinite(v) && v >= 2 && v <= 200) ? Math.round(v) : DEFAULT_MISMATCH[key];
      saveData();
    } }),
    hint ? h('span', { class: 'hint', text: hint }) : null);
  main.append(h('div', { class: 'card' },
    h('h2', { text: '偏科 / 不匹配判定' }),
    h('p', { class: 'sub', text: '双口径判定：自身失衡决定档位（各科里总有一科排名靠后，所以排名不能单独触发）；名单口径（低于该科均分 / 排名后段）只作佐证并用于排序。自身失衡达标标「关注」，失衡特别严重标「预警」。改这里后学生页和总览名单自动重算。' }),
    h('div', { class: 'entry-cols', style: 'margin-top:10px' },
      mmField('selfGap', '关注 · 自身失衡阈值（%）', '默认 15，即某科比自身各科平均低 15 个百分点'),
      mmField('severeGap', '预警 · 严重失衡阈值（%）', '默认 22，达到即预警'),
      mmField('vsAvgGap', '佐证 · 低于名单均分阈值（%）', '默认 10，即某科比该科名单均分低 10 个百分点'),
      mmField('rankTail', '佐证 · 排名后段阈值（%）', '默认 30，即单科排名落入名单后 30%'),
      mmCountField('minRanked', '启用排名口径的最少人数', '默认 5；名单不足该人数时只看得分率，避免小样本误判'))));

  // AI 深度分析配置
  const aiMsg = h('div', { class: 'msg' });
  const baseIn = h('input', { type: 'text', value: aiCfg.base, placeholder: 'https://…/v1', oninput: ev => { aiCfg.base = ev.target.value.trim(); saveAiCfg(); } });
  const modelIn = h('input', { type: 'text', value: aiCfg.model, placeholder: '模型名', oninput: ev => { aiCfg.model = ev.target.value.trim(); saveAiCfg(); } });
  main.append(h('div', { class: 'card' },
    h('h2', { text: 'AI 深度分析（学生页使用）' }),
    h('p', { class: 'sub', text: 'API Key 由老师自己填写，只保存在这台电脑的浏览器里，不会出现在导出的 JSON 备份中。建议在服务商后台建一个设了消费限额的子 key。' }),
    h('div', { class: 'entry-cols', style: 'margin-top:10px' },
      h('label', { class: 'fld' }, '服务商',
        h('select', {
          onchange: ev => {
            aiCfg.provider = ev.target.value;
            const p = AI_PROVIDERS[aiCfg.provider];
            if (p && aiCfg.provider !== 'custom') { aiCfg.base = p.base; aiCfg.model = p.model; }
            saveAiCfg(); render();
          },
        }, Object.keys(AI_PROVIDERS).map(k =>
          h('option', { value: k, selected: aiCfg.provider === k ? '' : null }, AI_PROVIDERS[k].name)))),
      h('label', { class: 'fld' }, 'API Key（只存在本机）',
        h('input', { type: 'password', value: aiCfg.key, placeholder: 'sk-…', autocomplete: 'off', oninput: ev => { aiCfg.key = ev.target.value.trim(); saveAiCfg(); } }))),
    h('div', { class: 'entry-cols', style: 'margin-top:10px' },
      h('label', { class: 'fld' }, '接口地址', baseIn),
      h('label', { class: 'fld' }, '模型名', modelIn)),
    h('div', { class: 'row', style: 'margin-top:12px;gap:8px' },
      h('button', {
        class: 'btn', text: '测试连接',
        onclick: async ev => {
          if (!aiCfg.key || !aiCfg.base || !aiCfg.model) { aiMsg.className = 'msg err'; aiMsg.textContent = '服务商、接口地址、模型名、Key 都要填。'; return; }
          ev.target.disabled = true; aiMsg.className = 'msg'; aiMsg.textContent = '测试中…';
          try {
            const r = await testAiCfg(aiCfg);
            aiMsg.className = 'msg ok';
            aiMsg.textContent = '连接成功' + (r ? '，模型回复：' + String(r).slice(0, 40) : ' ✓');
          } catch (e) {
            aiMsg.className = 'msg err';
            aiMsg.textContent = '连接失败：' + e.message;
          } finally { ev.target.disabled = false; }
        },
      }),
      h('button', {
        class: 'btn danger', text: '清除本机 Key',
        onclick: () => { aiCfg.key = ''; saveAiCfg(); render(); },
      })),
    aiMsg,
    h('p', { class: 'hint', style: 'margin:12px 0 0' },
      '已实测支持浏览器直连：DeepSeek、通义、Kimi。智谱、OpenAI 不支持直连（会被浏览器拦截），' +
      '如一定要用，请在「自定义」里填支持 CORS 的中转地址。')));

  main.append(h('div', { class: 'card' },
    h('h2', { text: '口径说明' }),
    h('ul', { style: 'margin:8px 0 0;padding-left:20px;color:var(--ink-2);font-size:13px;line-height:1.9' },
      h('li', { text: '总分 = 语文 + 数学 + 英语 + 物理（或历史）+ 两门再选科目赋分，满分 750（各组合总分口径一致）。' }),
      h('li', { text: '选科组合可在「设置」里自定义：首选科目（物理/历史）二选一，再选两门再选科目（化学/生物/政治/地理）按等级赋分。' }),
      h('li', { text: '一个班级可以包含多个选科组合（拼班）。班内排名按整个行政班混排；组合内排名按选科组合；总榜为全年级混合排名。' }),
      h('li', { text: '物理类与历史类分别排名：本页显示的三榜为「总榜 / 物理类 / 历史类」，跨类不混排。' }),
      h('li', { text: '「年级排名」为导入必填项，直接采用学校官方年排；未填写会阻止导入。' }),
      h('li', { text: '学号是跨场追踪的稳定 ID；旧数据无学号时暂按「班级 + 姓名」对齐。重名请补学号，否则导入会拦截。' }),
      h('li', { text: '单科名次、班内排名、各科均分只覆盖本次导入名单，不代表全校；年级排名采用学校官方年排。' }),
      h('li', { text: '上线率分母为有有效总分的人数；越界分数按缺考处理并在导入前拦截。' }),
      h('li', { text: '赋分按本场考试中该科有成绩的学生排位；要算准，需要录全年级选考该科的学生。' }),
      h('li', { text: '学校已给赋分时，在导入表里加「化学赋分 地理赋分」两列覆盖即可；没有则按设置里的等级规则自动赋分。' }),
      h('li', { text: '同分同档会让实际档位占比偏离设定；偏差较大时页面会提示，最终以学校赋分为准。' }),
      h('li', { text: '「连续退步」和单科近三次走势只判断相邻场次均有成绩的情况，缺考不连缀比较。' }),
      h('li', { text: '「偏科 / 不匹配」以自身失衡定档：某科得分率比该生各科平均低达到阈值标「关注」，失衡特别严重标「预警」；名单口径（低于该科均分 / 排名后段）只作佐证与排序，不单独触发，避免各科里总有一科靠后造成误报。阈值可在「设置」里调整。' }))));
}

/* ================================================================
   启动
   ================================================================ */
document.getElementById('tabs').addEventListener('click', ev => {
  const b = ev.target.closest('button[data-tab]');
  if (!b) return;
  ui.tab = b.dataset.tab;
  render();
});
document.getElementById('themeBtn').addEventListener('click', () => {
  const next = isDark() ? 'light' : 'dark';
  document.documentElement.setAttribute('data-theme', next);
  try { localStorage.setItem(LS_THEME, next); } catch (e) { /* ignore */ }
  render();
});
(function initTheme() {
  try {
    const t = localStorage.getItem(LS_THEME);
    if (t === 'light' || t === 'dark') document.documentElement.setAttribute('data-theme', t);
  } catch (e) { /* ignore */ }
})();
data = loadData();
aiCfg = loadAiCfg();
(function initRoute() {
  const hm = location.hash.slice(1).split('|');
  if (hm[0] && ['overview', 'student', 'entry', 'settings'].includes(hm[0])) ui.tab = hm[0];
  if (ui.tab === 'student' && hm[1]) {
    try { ui.student = decodeURIComponent(hm[1]); } catch (e) { /* 兼容旧版链接：按姓名回退 */ }
  }
})();
render();
</script>
</body>
</html>
