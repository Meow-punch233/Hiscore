<title>哈绩咪 Hiscore v2.4 · 一屏成绩工作台</title>
<style>
/* ============ 主题变量（浅色默认 / 深色两套入口） ============ */
:root {
  color-scheme: light;
  --page: #f9f9f7; --surface: #fcfcfb; --surface-2: #f3f3ef;
  --ink: #0b0b0b; --ink-2: #52514e; --muted: #898781;
  --grid: #e1e0d9; --axis: #c3c2b7; --border: rgba(11,11,11,0.10);
  --accent: #2a78d6; --accent-soft: #cde2fb;
  --good: #0ca30c; --good-text: #006300;
  --warn: #fab219; --serious: #ec835a; --critical: #d03b3b;
  --shadow: 0 1px 2px rgba(11,11,11,0.04);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    color-scheme: dark;
    --page: #0d0d0d; --surface: #1a1a19; --surface-2: #232322;
    --ink: #ffffff; --ink-2: #c3c2b7; --muted: #898781;
    --grid: #2c2c2a; --axis: #383835; --border: rgba(255,255,255,0.10);
    --accent: #3987e5; --accent-soft: #184f95;
    --good: #0ca30c; --good-text: #0ca30c;
    --shadow: 0 1px 2px rgba(0,0,0,0.3);
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --page: #0d0d0d; --surface: #1a1a19; --surface-2: #232322;
  --ink: #ffffff; --ink-2: #c3c2b7; --muted: #898781;
  --grid: #2c2c2a; --axis: #383835; --border: rgba(255,255,255,0.10);
  --accent: #3987e5; --accent-soft: #184f95;
  --good: #0ca30c; --good-text: #0ca30c;
  --shadow: 0 1px 2px rgba(0,0,0,0.3);
}

* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; }
body {
  background: var(--page); color: var(--ink);
  font-family: system-ui, -apple-system, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
  font-size: 14px; line-height: 1.55;
}
.wrap { max-width: 1080px; margin: 0 auto; padding: 0 16px 64px; }

/* ============ 头部与导航 ============ */
header.app {
  position: sticky; top: 0; z-index: 20;
  background: var(--page); border-bottom: 1px solid var(--border);
}
.hd-in { max-width: 1080px; margin: 0 auto; padding: 12px 16px 0; }
.hd-top { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
.hd-top h1 { font-size: 17px; font-weight: 650; margin: 0; }
.hd-sub { color: var(--muted); font-size: 12px; }
.hd-actions { margin-left: auto; display: flex; gap: 8px; }
nav.tabs { display: flex; gap: 4px; margin-top: 10px; overflow-x: auto; }
nav.tabs button {
  appearance: none; border: none; background: none; color: var(--ink-2);
  font: inherit; font-size: 14px; padding: 8px 14px 10px; cursor: pointer;
  border-bottom: 2px solid transparent; white-space: nowrap;
}
nav.tabs button.on { color: var(--ink); font-weight: 600; border-bottom-color: var(--accent); }
nav.tabs button:hover { color: var(--ink); }

/* ============ 通用组件 ============ */
.card {
  background: var(--surface); border: 1px solid var(--border);
  border-radius: 12px; padding: 16px 18px; box-shadow: var(--shadow);
  margin-top: 16px;
}
.card h2 { font-size: 15px; font-weight: 650; margin: 0 0 2px; }
.card .sub { color: var(--muted); font-size: 12px; margin: 0 0 12px; }
.row { display: flex; gap: 12px; flex-wrap: wrap; }
.grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
@media (max-width: 820px) { .grid2 { grid-template-columns: 1fr; } }
button.btn {
  appearance: none; font: inherit; font-size: 13px; cursor: pointer;
  background: var(--surface); color: var(--ink);
  border: 1px solid var(--border); border-radius: 8px; padding: 6px 12px;
}
button.btn:hover { background: var(--surface-2); }
button.btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
button.btn.danger { color: var(--critical); }
button.chip {
  appearance: none; font: inherit; font-size: 13px; cursor: pointer;
  background: var(--surface); color: var(--ink-2);
  border: 1px solid var(--border); border-radius: 999px; padding: 4px 12px;
}
button.chip.on { background: var(--accent); border-color: var(--accent); color: #fff; font-weight: 600; }
button.chip:hover { color: var(--ink); }
button.chip.on:hover { color: #fff; }
input[type=text], input[type=number], select, textarea {
  font: inherit; color: var(--ink); background: var(--surface);
  border: 1px solid var(--border); border-radius: 8px; padding: 6px 10px;
}
input:focus, select:focus, textarea:focus, button:focus-visible {
  outline: 2px solid var(--accent); outline-offset: 1px;
}
label.fld { display: flex; flex-direction: column; gap: 4px; font-size: 12px; color: var(--ink-2); }
.hint { color: var(--muted); font-size: 12px; }
.tag { display: inline-flex; align-items: center; gap: 4px; font-size: 12px; padding: 1px 8px; border-radius: 999px; border: 1px solid var(--border); color: var(--ink-2); }
.tag.good { color: var(--good-text); } .tag.crit { color: var(--critical); }
.tag.warn { color: var(--ink-2); }

/* ============ KPI / 状态瓷砖 ============ */
.kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 12px; margin-top: 16px; }
.kpi { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 12px 14px; box-shadow: var(--shadow); }
.kpi .lb { font-size: 12px; color: var(--ink-2); }
.kpi .vl { font-size: 26px; font-weight: 650; letter-spacing: -0.01em; margin-top: 2px; }
.kpi .dt { font-size: 12px; margin-top: 2px; }
.kpi .dt.up { color: var(--good-text); } .kpi .dt.down { color: var(--critical); } .kpi .dt.flat { color: var(--muted); }
.hero .vl { font-size: 48px; line-height: 1.1; }

/* 得分率 meter：同色系轨道 */
.meter { height: 6px; border-radius: 3px; background: var(--accent-soft); overflow: hidden; margin-top: 6px; }
.meter > i { display: block; height: 100%; background: var(--accent); border-radius: 3px; }

/* ============ 图表 ============ */
.chart-head { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; margin-bottom: 6px; }
.chart-head h3 { font-size: 14px; font-weight: 650; margin: 0; }
.chart-head .cs { color: var(--muted); font-size: 12px; }
.chart-head .tw { margin-left: auto; }
svg.line, svg.bar { display: block; width: 100%; height: auto; }
.legend { display: flex; flex-wrap: wrap; gap: 6px 14px; margin-top: 8px; }
.legend .li { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; color: var(--ink-2); cursor: pointer; user-select: none; }
.legend .li .key { width: 14px; height: 0; border-top: 2.5px solid; border-radius: 2px; }
.legend .li.off { opacity: 0.38; }
.legend .li:hover { color: var(--ink); }

/* tooltip */
#tt {
  position: fixed; z-index: 50; pointer-events: none; display: none;
  background: var(--surface); color: var(--ink);
  border: 1px solid var(--border); border-radius: 8px; box-shadow: 0 4px 16px rgba(0,0,0,0.12);
  padding: 8px 10px; font-size: 12px; min-width: 120px; max-width: 260px;
}
#tt .t { font-weight: 650; margin-bottom: 4px; }
#tt .r { display: flex; align-items: center; gap: 6px; margin-top: 2px; }
#tt .r .key { width: 12px; height: 0; border-top: 2.5px solid; border-radius: 2px; flex: none; }
#tt .r .v { font-weight: 650; font-variant-numeric: tabular-nums; }
#tt .r .n { color: var(--muted); }

/* ============ 表格 ============ */
table.tb { width: 100%; border-collapse: collapse; font-size: 13px; font-variant-numeric: tabular-nums; }
table.tb th, table.tb td { padding: 6px 8px; text-align: right; border-bottom: 1px solid var(--grid); white-space: nowrap; }
table.tb th { color: var(--muted); font-weight: 500; font-size: 12px; position: sticky; top: 0; background: var(--surface); }
table.tb th:first-child, table.tb td:first-child { text-align: left; }
table.tb td.up { color: var(--good-text); } table.tb td.down { color: var(--critical); } table.tb td.flat { color: var(--muted); }
.tscroll { overflow: auto; max-height: 420px; border: 1px solid var(--grid); border-radius: 8px; scrollbar-color: var(--axis) transparent; }
.tscroll table.tb th { z-index: 1; }

/* 名单 */
ul.mv { list-style: none; margin: 0; padding: 0; }
ul.mv li { display: flex; align-items: center; gap: 8px; padding: 7px 2px; border-bottom: 1px solid var(--grid); font-size: 13px; }
ul.mv li:last-child { border-bottom: none; }
ul.mv .nm { font-weight: 600; }
ul.mv .meta { color: var(--muted); font-size: 12px; }
ul.mv .val { margin-left: auto; font-variant-numeric: tabular-nums; }

/* 评估卡 */
.subj-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(230px, 1fr)); gap: 12px; }
.subj-card { border: 1px solid var(--border); border-radius: 10px; padding: 12px 14px; background: var(--surface); }
.subj-card .hd { display: flex; align-items: center; gap: 8px; }
.subj-card .dot { width: 9px; height: 9px; border-radius: 50%; flex: none; }
.subj-card .nm { font-weight: 650; }
.subj-card .bd { margin-left: auto; }
.subj-card .sc { font-size: 22px; font-weight: 650; margin-top: 6px; }
.subj-card .sc small { font-size: 12px; color: var(--muted); font-weight: 400; }
.subj-card dl { display: grid; grid-template-columns: auto 1fr; gap: 2px 10px; margin: 8px 0 0; font-size: 12px; }
.subj-card dt { color: var(--muted); } .subj-card dd { margin: 0; text-align: right; font-variant-numeric: tabular-nums; }

/* 建议 */
ul.advice { list-style: none; margin: 0; padding: 0; }
ul.advice li { padding: 10px 2px; border-bottom: 1px solid var(--grid); }
ul.advice li:last-child { border-bottom: none; }
ul.advice .ah { display: flex; align-items: center; gap: 8px; font-weight: 650; font-size: 13px; }
ul.advice .ah .dot { width: 9px; height: 9px; border-radius: 50%; }
ul.advice .ah .pr { margin-left: auto; font-size: 12px; color: var(--muted); font-weight: 400; }
ul.advice p { margin: 4px 0 0; color: var(--ink-2); font-size: 13px; }

/* 录入 */
textarea.paste { width: 100%; min-height: 140px; font-family: ui-monospace, Menlo, Consolas, monospace; font-size: 12px; }
.entry-cols { display: grid; grid-template-columns: 1fr 1fr; gap: 12px 16px; }
@media (max-width: 820px) { .entry-cols { grid-template-columns: 1fr; } }
.msg { margin-top: 8px; font-size: 13px; }
.msg.err { color: var(--critical); } .msg.ok { color: var(--good-text); }
.banner { border: 1px solid var(--border); border-left: 3px solid var(--warn); background: var(--surface); border-radius: 8px; padding: 10px 14px; margin-top: 16px; font-size: 13px; color: var(--ink-2); }
.banner.crit { border-left-color: var(--critical); }
.banner ul { margin: 6px 0 0; padding-left: 20px; line-height: 1.8; }
.set-tbl input { width: 72px; text-align: right; font-variant-numeric: tabular-nums; }
.cfg-warn { border: 1px solid var(--border); border-left: 3px solid var(--critical); border-radius: 8px; padding: 8px 12px; margin-top: 12px; font-size: 12px; color: var(--ink-2); }
.cfg-warn ul { margin: 4px 0 0; padding-left: 20px; line-height: 1.7; }

footer.app { margin-top: 40px; color: var(--muted); font-size: 12px; text-align: center; }
.empty { color: var(--muted); text-align: center; padding: 28px 0; font-size: 13px; }

/* ================================================================
   复古视觉：港式旧招牌、奶油纸与黄铜。无外部资源，单文件离线可用。
   ================================================================ */

}

}

    color-scheme: dark;
    --page: #17251f; --surface: #23332b; --surface-2: #2d3c31;

html { scroll-behavior: smooth; scrollbar-color: var(--axis) var(--page); }
body {
  position: relative;
  background-color: var(--page);
  background-image:
    radial-gradient(ellipse at 8% 0%, rgba(255,255,255,.34), transparent 48%),
    radial-gradient(ellipse at 90% 45%, rgba(126,104,60,.045), transparent 55%);
  font-family: var(--sans);
  font-size: 14px;
  line-height: 1.7;
  -webkit-font-smoothing: antialiased;
}
body::before {
  content: "";
  position: fixed;
  inset: 0;
  z-index: 100;
  pointer-events: none;
  opacity: .12;
  background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 180 180' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.76' numOctaves='3' stitchTiles='stitch'/%3E%3CfeColorMatrix type='saturate' values='0'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' opacity='.5' filter='url(%23n)'/%3E%3C/svg%3E");
  mix-blend-mode: multiply;
}
:root[data-theme="dark"] body { background-image: radial-gradient(ellipse at 10% 0%, rgba(175,158,104,.035), transparent 55%); }

.wrap { max-width: 1180px; padding: 0 28px 52px; }
::selection { background: var(--brass); color: #183e35; }

/* 旧漆木招牌 */
header.app { position: static; border: 0; background: transparent; }
.hd-in { max-width: 1180px; padding: 28px 28px 0; }
.hd-top {
  position: relative;
  display: flex;
  align-items: center;
  flex-wrap: nowrap;
  gap: 22px;
  min-height: 134px;
  padding: 27px 32px;
  color: #f2e6c9;
  background:
    radial-gradient(ellipse at 16% 15%, rgba(220,194,126,.11), transparent 45%),
    linear-gradient(112deg, #234d41 0%, var(--sign) 48%, #15372e 100%);
  border: 1px solid #a38b58;
  border-radius: 4px 4px 0 0;
  box-shadow: 0 3px 0 #102d25, 0 9px 22px rgba(39,44,27,.13), inset 0 0 35px rgba(3,24,18,.15);
}
.hd-top::before {
  content: "";
  position: absolute;
  inset: 7px;
  pointer-events: none;
  border: 1px solid rgba(197,169,107,.55);
  border-radius: 1px;
}
.brand { display: flex; align-items: center; gap: 18px; min-width: 0; }
.brand-mark {
  display: grid;
  place-items: center;
  flex: 0 0 84px;
  width: 84px;
  height: 76px;
  color: #dbc38a;
  border-right: 1px solid rgba(197,169,107,.45);
  padding-right: 17px;
}
.brand-mark img { display: block; width: 64px; height: 64px; filter: drop-shadow(0 1px 2px rgba(0,0,0,.28)); }
.hd-top h1 {
  margin: 0;
  color: #f4e8c9;
  font-family: var(--serif);
  font-size: 34px;
  font-weight: 600;
  line-height: 1.35;
  letter-spacing: .16em;
  text-shadow: 0 1px 0 #0e2c23;
}
.hd-en {
  display: inline-block;
  margin-left: 14px;
  font-family: Georgia, "Times New Roman", var(--serif);
  font-size: 15px;
  font-weight: 500;
  letter-spacing: .32em;
  color: #d9c08a;
  vertical-align: 4px;
  text-shadow: 0 1px 0 #0e2c23;
}
.hd-sub {
  display: block;
  margin-top: 8px;
  color: #c9c3a6;
  font-size: 12px;
  letter-spacing: .04em;
}
.hd-actions { position: relative; z-index: 1; margin-left: auto; align-self: flex-start; }
.hd-motto {
  margin-left: auto;
  padding: 4px 10px;
  color: #c6aa6f;
  border: 1px solid rgba(197,169,107,.45);
  font-family: var(--serif);
  font-size: 12px;
  line-height: 1.5;
  letter-spacing: .13em;
  writing-mode: vertical-rl;
}
.hd-actions + .hd-motto { margin-left: 0; }
button.btn.theme-toggle {
  padding: 5px 9px;
  color: #dbcca7;
  background: rgba(248,233,191,.04);
  border-color: rgba(197,169,107,.42);
  font-size: 12px;
}
button.btn.theme-toggle:hover { color: #fff3d3; background: rgba(248,233,191,.1); }
.theme-icon { width: 15px; height: 15px; vertical-align: -3px; margin-right: 5px; }

/* 像茶餐厅菜单一样的页签，导航独立吸顶 */
nav.tabs {
  position: sticky;
  top: 0;
  z-index: 20;
  gap: 5px;
  margin-top: 0;
  padding: 10px 14px;
  background: color-mix(in srgb, var(--page) 94%, transparent);
  border-bottom: 1px solid var(--border);
  box-shadow: 0 4px 12px rgba(64,51,29,.025);
  backdrop-filter: blur(12px);
  scrollbar-width: thin;
}
nav.tabs button {
  position: relative;
  min-height: 38px;
  padding: 6px 20px;
  color: var(--ink-2);
  border: 1px solid transparent;
  border-radius: 2px;
  font-size: 13px;
  letter-spacing: .08em;
  transition: color .16s, background .16s, border-color .16s;
}
nav.tabs button.on {
  color: #f5e9cb;
  background: var(--sign);
  border-color: var(--sign);
  font-weight: 500;
}
nav.tabs button.on::after {
  content: "";
  position: absolute;
  bottom: 4px;
  left: 50%;
  width: 3px;
  height: 3px;
  background: #d1b779;
  transform: translateX(-50%) rotate(45deg);
}
nav.tabs button:hover:not(.on) { color: var(--accent); background: var(--surface-2); border-color: var(--border); }

/* 内容页首 */
.page-heading {
  display: flex;
  align-items: flex-end;
  justify-content: space-between;
  gap: 20px;
  margin: 30px 0 0;
  padding: 0 2px 14px;
  border-bottom: 1px solid var(--border);
}
.page-heading h2 {
  margin: 0;
  color: var(--ink);
  font-family: var(--serif);
  font-size: 27px;
  font-weight: 600;
  line-height: 1.35;
  letter-spacing: .12em;
}
.page-heading .heading-note { color: var(--muted); font-size: 12px; text-align: right; }
.page-heading .heading-note::before { content: "✦"; margin-right: 8px; color: var(--brass); font-size: 10px; }

/* 纸页、黄铜线与印章式标题 */
.card {
  position: relative;
  margin-top: 18px;
  padding: 23px 25px;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 3px;
  box-shadow: var(--shadow);
}
.card h2, .chart-head h3 {
  color: var(--ink);
  font-family: var(--serif);
  font-size: 18px;
  font-weight: 600;
  letter-spacing: .07em;
}
.card h2 { display: flex; align-items: center; gap: 9px; margin-bottom: 5px; }
.card h2::before { content: ""; width: 4px; height: 16px; flex: none; background: var(--brass); }
.card .sub { max-width: 92ch; margin: 0 0 17px; color: var(--muted); font-size: 12px; line-height: 1.75; }
.chart-head { margin-bottom: 14px; }
.chart-head h3 { font-size: 18px; }
.chart-head .cs { line-height: 1.65; }
.grid2 { gap: 18px; }
button.btn {
  min-height: 32px;
  padding: 5px 13px;
  color: var(--ink-2);
  background: transparent;
  border: 1px solid var(--border);
  border-radius: 3px;
  font-size: 12px;
  transition: background .16s, color .16s, border-color .16s;
}
button.btn:hover { color: var(--accent); background: var(--surface-2); border-color: var(--brass); }
button.btn.primary { color: #fff3d5; background: var(--sign); border-color: var(--sign); }
button.btn.primary:hover { color: #fff9e9; background: #285648; border-color: #285648; }
button.btn.danger { color: var(--critical); }
button.btn:disabled, button.chip:disabled { cursor: not-allowed; opacity: .5; }
button.chip {
  min-height: 31px;
  padding: 4px 14px;
  color: var(--ink-2);
  background: transparent;
  border: 1px solid transparent;
  border-radius: 2px;
  font-size: 12px;
  transition: color .16s, background .16s, border-color .16s;
}
button.chip:hover { color: var(--accent); background: var(--surface-2); border-color: var(--border); }
button.chip.on { color: #fff1d0; background: var(--accent); border-color: var(--accent); font-weight: 500; }
:root[data-theme="dark"] button.chip.on { color: #183e35; }
button.chip.on:hover { color: #fff8e7; background: var(--sign); }
:root[data-theme="dark"] button.chip.on:hover { color: #183e35; background: var(--accent); }
input[type=text], input[type=number], input[type=password], select, textarea {
  min-height: 36px;
  padding: 7px 11px;
  color: var(--ink);
  background: color-mix(in srgb, var(--surface) 84%, var(--page));
  border: 1px solid var(--border);
  border-radius: 2px;
}
input:hover, select:hover, textarea:hover { border-color: var(--axis); }
input:focus, select:focus, textarea:focus, button:focus-visible, [role="button"]:focus-visible {
  outline: 2px solid var(--brass);
  outline-offset: 3px;
}
label.fld { gap: 6px; line-height: 1.6; }
.hint { line-height: 1.65; }
.tag { padding: 2px 8px; background: var(--surface-2); border-radius: 2px; line-height: 1.6; }
.tag.good { color: var(--good-text); border-color: color-mix(in srgb, var(--good-text) 35%, transparent); }
.tag.crit { color: var(--critical); border-color: color-mix(in srgb, var(--critical) 35%, transparent); }
.tag.warn { color: var(--serious); }
:root[data-theme="dark"] .tag.warn { color: var(--warn); }

/* 一张连续账页，而不是五张悬浮小卡片 */
.kpis {
  grid-template-columns: repeat(auto-fit, minmax(165px, 1fr));
  gap: 0;
  margin-top: 18px;
  overflow: hidden;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 3px;
  box-shadow: var(--shadow);
}
.kpi {
  position: relative;
  min-width: 0;
  padding: 21px 22px 19px;
  background: transparent;
  border: 0;
  border-right: 1px solid var(--grid);
  border-radius: 0;
  box-shadow: none;
}
.kpi:last-child { border-right: 0; }
.kpi .lb { color: var(--muted); font-size: 12px; letter-spacing: .07em; }
.kpi .vl {
  margin-top: 5px;
  color: var(--ink);
  font-family: Georgia, "Times New Roman", var(--serif);
  font-size: 34px;
  font-weight: 400;
  line-height: 1.25;
  letter-spacing: -.035em;
  font-variant-numeric: tabular-nums;
}
.kpi .dt { margin-top: 7px; font-size: 11px; line-height: 1.65; }
.kpi .meter { margin: 9px 0 2px; }
.hero .vl { color: var(--accent); font-size: 50px; }
.meter { height: 4px; margin-top: 8px; background: var(--accent-soft); border-radius: 0; }
.meter > i { border-radius: 0; }

/* 筛选工具栏 */
.filters { padding: 12px 20px; background: color-mix(in srgb, var(--surface) 60%, var(--page)); }
.filters .row { align-items: center; gap: 7px; }
.filters .row + .row { margin-top: 7px; padding-top: 8px; border-top: 1px dashed var(--grid); }
.filters .filter-label { min-width: 68px; color: var(--muted); font-size: 12px; }
.filters .filter-lines { margin-left: auto; color: var(--muted); font-family: Georgia, var(--serif); font-size: 12px; }

/* 图表保留阅读性，只换油墨 */
svg.line text, svg.bar text { font-family: var(--sans); }
.legend { gap: 8px 18px; margin-top: 13px; padding-top: 11px; border-top: 1px dashed var(--grid); }
.legend .li { color: var(--ink-2); }
.legend .li .key { width: 18px; border-top-width: 2px; }
#tt { padding: 10px 12px; border-color: var(--brass); border-radius: 3px; box-shadow: 0 8px 28px rgba(32,35,23,.16); }
#tt .t { font-family: var(--serif); font-size: 14px; }

/* 成绩表：横向格线、浅纸色隔行 */
.tscroll { border: 1px solid var(--grid); border-radius: 2px; }
table.tb { font-size: 12px; line-height: 1.65; }
table.tb th, table.tb td { padding: 10px 11px; border-bottom-color: var(--grid); }
table.tb th { color: var(--ink-2); background: var(--surface-2); font-family: var(--serif); font-size: 12px; font-weight: 500; letter-spacing: .04em; }
table.tb tbody tr:nth-child(even) { background: color-mix(in srgb, var(--surface-2) 40%, transparent); }
table.tb tbody tr:hover { background: color-mix(in srgb, var(--accent-soft) 52%, transparent); }
table.tb tbody tr:last-child td { border-bottom: 0; }
ul.mv li { flex-wrap: wrap; gap: 5px 9px; padding: 11px 2px; }
ul.mv .nm { color: var(--ink); font-family: var(--serif); font-size: 14px; font-weight: 600; }
ul.mv .meta { font-size: 11px; line-height: 1.65; }
ul.mv .val { display: flex; flex-direction: column; align-items: flex-end; min-width: 0; line-height: 1.55; }
ul.mv .val .meta { text-align: right; overflow-wrap: anywhere; }
.subj-grid { gap: 13px; }
.subj-card { padding: 16px 17px; background: color-mix(in srgb, var(--surface-2) 38%, var(--surface)); border-radius: 2px; }
.subj-card .dot { width: 7px; height: 7px; border-radius: 1px; }
.subj-card .nm { font-family: var(--serif); font-size: 16px; }
.subj-card .sc { font-family: Georgia, var(--serif); font-size: 29px; font-weight: 400; }
.subj-card dl { gap: 4px 10px; }
ul.advice li { padding: 15px 2px; }
ul.advice .ah .dot { width: 7px; height: 7px; border-radius: 1px; }
ul.advice p { max-width: 95ch; line-height: 1.85; }

/* 录入、提醒与收尾 */
textarea.paste { line-height: 1.8; }
.banner, .cfg-warn { background: color-mix(in srgb, var(--warn) 5%, var(--surface)); border-radius: 2px; line-height: 1.75; }
.banner.crit, .cfg-warn { background: color-mix(in srgb, var(--critical) 4%, var(--surface)); }
.msg { line-height: 1.75; }
footer.app {
  max-width: 780px;
  margin: 22px auto 0;
  padding: 25px 28px 35px;
  color: var(--muted);
  border-top: 1px solid var(--border);
  font-size: 11px;
  line-height: 1.8;
  text-align: center;
}
footer.app::before { content: "学 业 有 迹"; display: block; margin-bottom: 8px; color: var(--brass); font-family: var(--serif); font-size: 13px; letter-spacing: .15em; }
.empty { padding: 36px 0; }

@media (min-width: 821px) {
  .kpis:has(.kpi:nth-child(5)) { grid-template-columns: repeat(5, 1fr); }
  .kpis:has(.hero) { grid-template-columns: 1.12fr repeat(3, 1fr); }
}
@media (max-width: 1000px) {
  .hd-motto { display: none; }
  .kpi { padding: 18px; }
  .kpi .vl { font-size: 30px; }
}
@media (max-width: 820px) {
  .wrap, .hd-in { padding-left: 20px; padding-right: 20px; }
  .hd-in { padding-top: 20px; }
  .hd-top { min-height: 120px; padding: 24px; }
  .hd-top h1 { font-size: 30px; }
  .brand-mark { flex-basis: 70px; width: 70px; padding-right: 13px; }
  .brand-mark img { width: 52px; height: 52px; }
  .brand { gap: 14px; }
  .hd-sub { font-size: 11px; }
  .card { padding: 21px; }
  .grid2 { gap: 0; }
}
@media (max-width: 600px) {
  body { font-size: 13px; }
  .wrap { padding: 0 14px 36px; }
  .hd-in { padding: 14px 14px 0; }
  .hd-top { display: grid; grid-template-columns: 1fr auto; gap: 14px 8px; min-height: 0; padding: 23px 19px 19px; }
  .brand { gap: 10px; }
  .brand-mark { flex-basis: 52px; width: 52px; height: 56px; padding-right: 9px; }
  .brand-mark img { width: 40px; height: 40px; }
  .hd-top h1 { font-size: 25px; letter-spacing: .08em; }
  .hd-en { margin-left: 8px; font-size: 11px; letter-spacing: .22em; vertical-align: 2px; }
  .hd-sub { max-width: 235px; margin-top: 5px; font-size: 10px; line-height: 1.75; letter-spacing: 0; }
  .hd-actions { align-self: start; }
  button.btn.theme-toggle { width: 32px; height: 32px; min-height: 32px; padding: 5px; }
  button.btn.theme-toggle .theme-icon { width: 15px; margin: 0; }
  button.btn.theme-toggle .theme-label { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); }
  nav.tabs { gap: 3px; padding: 8px 0; }
  nav.tabs button { flex: 1 0 auto; min-height: 36px; padding: 5px 13px; font-size: 12px; letter-spacing: .02em; }
  .page-heading { align-items: flex-start; flex-direction: column; gap: 3px; margin-top: 23px; padding-bottom: 11px; }
  .page-heading h2 { font-size: 23px; }
  .page-heading .heading-note { font-size: 11px; text-align: left; }
  .card { margin-top: 13px; padding: 18px 16px; }
  .card h2, .chart-head h3 { font-size: 17px; }
  .kpis { grid-template-columns: repeat(2, minmax(0, 1fr)); margin-top: 13px; }
  .kpi { padding: 16px 15px; border-bottom: 1px solid var(--grid); }
  .kpi:nth-child(even) { border-right: 0; }
  .kpi:nth-last-child(-n+2) { border-bottom: 0; }
  .kpis:has(.kpi:nth-child(5)) .kpi:nth-child(4) { border-bottom: 1px solid var(--grid); }
  .kpis:has(.kpi:nth-child(5)) .kpi:nth-child(5) { grid-column: 1 / -1; }
  .kpi .vl { font-size: 30px; }
  .hero .vl { font-size: 40px; }
  .kpi .dt { font-size: 10px; }
  .filters { padding: 10px 13px; }
  .filters .filter-label { min-width: 100%; }
  .filters .filter-lines { margin-left: 0; }
  .chart-head { align-items: center; gap: 5px 10px; }
  .chart-head .cs { flex: 1 1 60%; }
  .chart-head .tw { margin-left: auto; }
  .chart-head .tw .btn { padding: 4px 8px; font-size: 11px; }
  svg.line, svg.bar { min-width: 450px; }
  .chart-view { max-width: 100%; overflow-x: auto; scrollbar-width: thin; }
  .chart-view + .legend { min-width: 0; }
  ul.mv .val { max-width: 68%; }
  ul.mv .val .meta { font-size: 10px; }
  .subj-grid { grid-template-columns: 1fr; }
  ul.advice .ah { flex-wrap: wrap; }
  ul.advice .ah .pr { flex-basis: 100%; margin-left: 15px; }
  .row .hint[style*="margin-left:auto"] { margin-left: 0 !important; }
  footer.app { margin-top: 14px; padding: 20px 24px 28px; }
}
@media (prefers-reduced-motion: reduce) {
  html { scroll-behavior: auto; }
  *, *::before, *::after { transition-duration: .01ms !important; animation-duration: .01ms !important; }
}
/* ================================================================
   班级 PK：阵列 / 榜单 / 擂台
   ================================================================ */
.pk-views { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 14px; align-items: center; }
.pk-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(212px, 1fr)); gap: 14px; margin-top: 4px; }
.pk-card {
  --tc: var(--accent);
  display: flex; flex-direction: column; gap: 8px;
  background: var(--surface); border: 1px solid var(--border); border-top: 4px solid var(--tc);
  border-radius: 12px; padding: 13px 14px; box-shadow: var(--shadow);
  animation: pkRise .5s cubic-bezier(.2,.8,.3,1) backwards; animation-delay: calc(var(--i,0)*70ms);
}
.pk-card:hover { transform: translateY(-3px); box-shadow: 0 12px 26px rgba(65,47,25,.13); }
.pk-card-top { display: flex; gap: 10px; align-items: center; min-width: 0; }
.pk-mascot { flex: 0 0 auto; display: grid; place-items: center; line-height: 0; }
.pk-mascot img { display: block; border-radius: 8px; }
.pk-mascot svg { display: block; }
.pk-rank-tag { font-family: var(--serif); font-size: 11px; letter-spacing: .12em; color: var(--tc); font-weight: 700; }
.pk-name { font-family: var(--serif); font-size: 15px; font-weight: 700; line-height: 1.3; }
.pk-slogan { font-size: 11px; color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.pk-meter { height: 7px; border-radius: 4px; background: var(--surface-2); overflow: hidden; }
.pk-meter i { display: block; height: 100%; background: var(--tc); transform-origin: left; animation: pkGrowX .8s cubic-bezier(.2,.8,.3,1) backwards; animation-delay: calc(.15s + var(--i,0)*70ms); }
.pk-card-stats { display: flex; justify-content: space-between; gap: 8px; font-size: 12px; color: var(--ink-2); }
.pk-card-stats b { font-size: 14px; color: var(--ink); font-variant-numeric: tabular-nums; }
.pk-badge-row { display: flex; gap: 6px; flex-wrap: wrap; }
.pk-badge-row .tag { white-space: nowrap; }

/* 榜单与领奖台 */
.podium { display: flex; align-items: flex-end; justify-content: center; gap: 14px; margin: 18px 0 6px; }
.pod-step { flex: 0 1 190px; text-align: center; --tc: var(--accent); animation: pkGrow .75s cubic-bezier(.2,.8,.3,1) backwards; }
.pod-step.p2 { animation-delay: .1s; } .pod-step.p1 { animation-delay: .28s; } .pod-step.p3 { animation-delay: .46s; }
.pod-head { display: flex; flex-direction: column; align-items: center; gap: 4px; padding-bottom: 8px; }
.pod-base {
  border-radius: 10px 10px 0 0; background: var(--tc); color: rgba(255,248,230,.94);
  font-family: var(--serif); font-size: 22px; font-weight: 700; display: grid; place-items: center;
}
.pod-step.p1 .pod-base { height: 92px; } .pod-step.p2 .pod-base { height: 64px; } .pod-step.p3 .pod-base { height: 48px; }
.rank-row {
  display: grid; grid-template-columns: 36px 36px minmax(96px, 1.2fr) minmax(72px, 1fr) 86px 50px;
  gap: 10px; align-items: center; padding: 9px 6px; border-bottom: 1px solid var(--grid); --tc: var(--accent);
  animation: pkRise .5s cubic-bezier(.2,.8,.3,1) backwards; animation-delay: calc(var(--i,0)*55ms);
}
.rank-row:last-child { border-bottom: 0; }
.rank-no { font-family: var(--serif); font-size: 16px; font-weight: 700; color: var(--tc); text-align: center; }
.rank-who { min-width: 0; }
.rank-who .n { font-weight: 650; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.rank-who .s { font-size: 11px; color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.rank-meter { height: 8px; border-radius: 4px; background: var(--surface-2); overflow: hidden; }
.rank-meter i { display: block; height: 100%; background: var(--tc); transform-origin: left; animation: pkGrowX .8s cubic-bezier(.2,.8,.3,1) backwards; animation-delay: calc(.1s + var(--i,0)*55ms); }
.rank-val { text-align: right; font-variant-numeric: tabular-nums; font-weight: 650; }
.rank-chg { text-align: right; font-size: 12px; color: var(--muted); }
.rank-chg.up { color: var(--good-text); } .rank-chg.down { color: var(--critical); }

/* 擂台对战 */
.vs-stage { position: relative; display: grid; grid-template-columns: 1fr 92px 1fr; gap: 14px; margin-top: 16px; }
.vs-side {
  --tc: var(--accent); border: 1px solid var(--border); border-top: 4px solid var(--tc);
  border-radius: 12px; background: var(--surface); padding: 16px; box-shadow: var(--shadow);
}
.vs-side.a { animation: pkSlideL .55s cubic-bezier(.2,.8,.3,1) backwards; }
.vs-side.b { animation: pkSlideR .55s cubic-bezier(.2,.8,.3,1) backwards; }
.vs-head { display: flex; flex-direction: column; align-items: center; gap: 6px; text-align: center; }
.vs-name { font-family: var(--serif); font-size: 17px; font-weight: 700; }
.slogan-bar {
  display: inline-block; font-family: var(--serif); font-size: 12px;
  background: var(--brass); color: #223327; border-radius: 999px; padding: 2px 12px;
  animation: pkPop .45s .55s cubic-bezier(.2,.9,.3,1.2) backwards;
}

/* 班级档案编辑卡（设置页） */

/* 动效骨架 */

@keyframes pkSlideL { from { opacity: 0; transform: translateX(-34px); } }

  --serious: #d6aa73;
  --critical: #e3a08b;
  --brass: #ddb477;
  --vermilion: #e5a280;
  --sign: #142e24;
  --shadow: 0 4px 18px rgba(0,0,0,.10);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    color-scheme: dark;
    --page: #19261f; --surface: #26362c; --surface-2: #304237;
    --ink: #f0eedc; --ink-2: #cbd4c2; --muted: #b0b9a4;
    --grid: #405044; --axis: #72806c; --border: #455547;
    --accent: #b3cda0; --accent-soft: #3b5140;
    --good: #a8c794; --good-text: #b6d4a0; --warn: #dfb570;
    --serious: #d6aa73; --critical: #e3a08b; --brass: #ddb477;
    --vermilion: #e5a280; --sign: #142e24;
    --shadow: 0 4px 18px rgba(0,0,0,.10);
  }
}
html { background: var(--page); }
body.v12 {
  background: var(--page);
  background-image: radial-gradient(circle at 94% 2%, color-mix(in srgb,var(--cat-orange) 10%,transparent), transparent 340px);
  color: var(--ink);
  font-family: var(--sans);
  font-size: 14px;
  line-height: 1.6;
}
body.v12::before { display: none; }
::selection { background: #f0c58e; color: #24483b; }
:focus-visible { outline: 3px solid var(--cat-orange) !important; outline-offset: 3px; }
button, [role="button"] { cursor: pointer; }
button.btn, button.chip, .icon-btn { transition: background .18s, border-color .18s, color .18s, box-shadow .18s, transform .18s; }
button.btn:active, button.chip:active, .icon-btn:active { transform: translateY(1px); }
button.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 7px;
  min-height: 38px; padding: 7px 14px;
  color: var(--ink-2); background: var(--surface);
  border: 1px solid var(--border); border-radius: 9px;
  font-size: 12px; font-weight: 500;
}
button.btn:hover { color: var(--accent); background: var(--surface-2); border-color: var(--axis); }
button.btn.primary { color: #fffaf0; background: var(--sign); border-color: var(--sign); }
button.btn.primary:hover { color: #fff; background: #35644f; border-color: #35644f; }
button.btn.danger { color: var(--critical); }
button.chip {
  min-height: 34px; padding: 5px 13px;
  color: var(--ink-2); background: var(--surface);
  border: 1px solid var(--border); border-radius: 8px;
  font-size: 12px; font-weight: 400;
}
button.chip.on { color: #fffaf0; background: var(--accent); border-color: var(--accent); font-weight: 600; }
:root[data-theme="dark"] button.chip.on { color: #203a2e; }
button.chip:hover { color: var(--ink); background: var(--surface-2); border-color: var(--axis); }
button.chip.on:hover { color: #fffaf0; background: var(--accent); }
:root[data-theme="dark"] button.chip.on:hover { color: #203a2e; }
input[type=text], input[type=number], input[type=password], select, textarea {
  min-height: 38px; padding: 7px 10px;
  color: var(--ink); background: var(--surface);
  border: 1px solid var(--border); border-radius: 8px;
}
input:hover, select:hover, textarea:hover { border-color: var(--axis); }
input:focus, select:focus, textarea:focus { border-color: var(--accent); }
input[type=checkbox], input[type=radio] { width: 18px; height: 18px; accent-color: var(--accent); }
.hint, .card .sub { color: var(--muted); }
.tag { border-radius: 6px; background: var(--surface-2); }
.banner { border-radius: 10px; border-left-width: 4px; }

/* 桌面：品牌侧栏，让内容区域有独立的阅读起点 */
body.v12 header.app { display: block; position: static; height: auto; }
body.v12 .hd-in { display: contents; }
body.v12 .hd-top {
  position: fixed; inset: 16px auto 16px 16px; z-index: 45;
  display: flex; flex-direction: column; align-items: stretch; flex-wrap: nowrap; gap: 0;
  width: var(--sidebar); min-height: 0; height: auto; margin: 0; padding: 24px 16px 18px;

  box-shadow: 0 8px 30px rgba(30,62,47,.08);
}

.brand { gap: 12px; padding: 0 7px; }

}

body.v12 .hd-motto {

  color: #d9dfc8; border: 1px solid #526d58; border-radius: 6px;
  font-size: 10px; letter-spacing: .16em; writing-mode: horizontal-tb;
}
.hd-actions { order: 3; align-self: stretch; margin: auto 0 0; padding-top: 22px; }
button.btn.theme-toggle {
  width: 100%; min-height: 42px; padding: 8px 12px; justify-content: flex-start;
  color: #e0e7d5; background: transparent; border-color: #4e6855; border-radius: 9px;
  font-size: 12px;
}
button.btn.theme-toggle:hover { color: #fff9e9; background: #355846; border-color: #6d856b; }
.theme-icon { width: 17px; height: 17px; margin-right: 4px; vertical-align: -4px; }
body.v12 nav.tabs {
  position: static; display: flex; flex-direction: column; align-items: stretch; gap: 6px;
  order: 2; width: 100%; height: auto; max-width: none; margin: 28px 0 0; padding: 0;
  overflow: visible; background: transparent; border: 0; box-shadow: none; backdrop-filter: none;
}
body.v12 nav.tabs button {
  display: flex; align-items: center; gap: 11px;
  min-height: 46px; padding: 9px 14px;
  color: #d1dbc8; background: transparent;
  border: 1px solid transparent; border-radius: 10px;
  font-size: 13px; font-weight: 400; letter-spacing: .05em; text-align: left;
}
.nav-icon { width: 19px; height: 19px; flex: none; stroke-width: 1.65; }
body.v12 nav.tabs button.on {
  color: #294b3d; background: #f5efdf; border-color: #f5efdf;
  font-weight: 650; box-shadow: inset 3px 0 var(--cat-orange);
}
body.v12 nav.tabs button.on::after { display: none; }
body.v12 nav.tabs button:hover:not(.on) { color: #fff9e9; background: #355746; border-color: transparent; }
body.v12 nav.tabs .nav-help { margin: 8px 0 0; border-top-color: #49644f; border-radius: 0 0 9px 9px; }
.sidebar-foot { order: 2; margin: 20px 8px 0; color: #aebfaa; font-size: 10px; line-height: 1.8; }
.sidebar-foot::before { content: ''; display: block; width: 16px; height: 3px; margin-bottom: 10px; background: var(--cat-orange); }
body.v12 .workbench {
  width: auto; max-width: var(--maxw); min-height: 100dvh;
  margin: 0 0 0 calc(var(--sidebar) + 16px); padding: 29px 32px 44px;
  overflow: visible;
}
.workspace-bar { min-height: 66px; gap: 20px; }
.workspace-title { color: var(--ink); font-family: var(--serif); font-size: 29px; font-weight: 650; letter-spacing: .04em; }
.workspace-note { display: block; margin-top: 5px; color: var(--muted); font-size: 12px; }
.workspace-actions { gap: 9px; }
.workspace-actions .btn { min-height: 38px; padding: 7px 13px; }
.saved-note { font-size: 11px; }
.context-bar {
  gap: 10px; margin-top: 20px; padding: 10px 12px;
  background: var(--surface); border: 1px solid var(--border); border-radius: 12px;
  box-shadow: var(--shadow);
}

.context-bar select {

}

.metric-strip {

  background: transparent; border: 0; box-shadow: none;
}
.metric-cell {
  position: relative; min-width: 0; padding: 17px 18px 16px;
  background: var(--surface); border: 1px solid var(--border); border-radius: 12px;
  box-shadow: var(--shadow);
}
.metric-cell:last-child { border: 1px solid var(--border); }
.metric-cell:nth-child(2) { background: color-mix(in srgb,var(--cat-orange) 13%,var(--surface)); }
.metric-cell .metric-label { color: var(--muted); font-size: 11px; letter-spacing: .03em; }
.metric-cell .metric-value {

  border-radius: 3px; background: var(--surface); overflow: hidden; }
.focus-mm .hs-mm .mb i { display: block; height: 100%; background: var(--warn); }
.focus-mm .hs-mm.sev .mb i { background: var(--critical); }
.focus-mm .hs-mm .num { font-size: 11.5px; font-variant-numeric: tabular-nums; color: var(--muted); }
.focus-mm .hs-mm.sev .num { color: var(--critical); font-weight: 600; }
/* 折叠的口径说明：默认只露前 3 条 */
ul.hs-collapsed { max-height: 74px; overflow: hidden; position: relative; }
ul.hs-collapsed::after { content: ''; position: absolute; left: 0; right: 0; bottom: 0; height: 34px;
  background: linear-gradient(to bottom, transparent, var(--surface)); pointer-events: none; }

/* 本机快照中心 */
.panel-body .snap-section { margin-top: 18px; padding-top: 16px; border-top: 1px solid var(--border); }.panel-body .snap-info { margin: 8px 0 10px; }
.panel-body .snap-list { display: flex; flex-direction: column; gap: 6px; }
.panel-body .snap-row { display: flex; align-items: center; gap: 12px; flex-wrap: wrap;
  padding: 8px 10px; border: 1px solid var(--border); border-radius: 9px; background: var(--surface-2); }
.panel-body .snap-meta { display: flex; flex-direction: column; gap: 2px; min-width: 0; flex: 1; }
.panel-body .snap-meta strong { font-size: 13px; font-variant-numeric: tabular-nums; }
.panel-body .snap-acts { display: flex; gap: 6px; flex: none; }
.panel-body .snap-acts .btn { width: auto; flex: none; padding: 5px 12px; font-size: 12.5px; }

/* 只读（手机查看）模式 */
.hs-ro-badge { display: inline-flex; align-items: center; padding: 4px 10px; border-radius: 999px;
  font-size: 12px; background: var(--accent-soft); color: var(--accent);
  border: 1px solid var(--accent); white-space: nowrap; }
/* hidden 属性必须能压过上面的 display:inline-flex，否则页头会留一个空气泡 */
.hs-ro-badge[hidden] { display: none !important; }
.hs-ro-badge.warn { background: var(--surface-2); color: var(--warn); border-color: var(--warn); }
body.hs-ro .hd-actions { flex: none; }
body.hs-ro nav.tabs button[data-tab="entry"], body.hs-ro nav.tabs button[data-tab="settings"] { opacity: .45; }
body.hs-ro #print-root .ph-page { color: #111; }
/* 字号档位：工作台整体缩放（内部字号多为 px 写死，只改根字号不会生效）
   zoom 会把元素自身的长度单位也一起缩放，所以 min-height 要除以 zoom，
   否则工作台会比视口高出一截、凭空多出滚动条。 */
.hd-actions .fs-toggle { width: auto; padding: 5px 11px; font-size: 12.5px; white-space: nowrap; }
#workbench { --fs-zoom: 1; zoom: var(--fs-zoom); }
body.v12 .workbench { min-height: calc(100dvh / var(--fs-zoom)); }
</style>

<!-- 家长版打印包的独立样式：导出后脱离本系统变量，仍能正确排版 -->
<style id="parent-pack-css">
body { margin: 0; background: #fff; color: #111; font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif; }
.pack-bar { position: sticky; top: 0; z-index: 10; background: #f3f5f4; border-bottom: 1px solid #ddd;
  padding: 10px 16px; display: flex; align-items: center; gap: 14px; font-size: 14px; }
.pack-bar button { font-size: 14px; padding: 6px 16px; border: 1px solid #888; background: #fff;
  border-radius: 6px; cursor: pointer; }
.ph-sec { page-break-after: always; break-after: page; }
.ph-sec:last-child { page-break-after: auto; break-after: auto; }
.ph-page { width: 100%; background: #fff; color: #111; padding: 0; }
.ph-page * { color: #111; }
.ph-hd { border-bottom: 2px solid #333; padding-bottom: 8px; margin-bottom: 12px; }
.ph-title { font-size: 20px; font-weight: 700; letter-spacing: 1px; }
.ph-sub { font-size: 12px; margin-top: 4px; color: #444; }
.ph-name { font-size: 17px; font-weight: 700; margin-top: 6px; }
.ph-page h3 { font-size: 14px; margin: 14px 0 6px; border-left: 3px solid #444; padding-left: 8px; }
.ph-page table { width: 100%; border-collapse: collapse; font-size: 12px; }
.ph-page th, .ph-page td { border: 1px solid #999; padding: 5px 7px; text-align: left; }
.ph-page th { background: #f0f0f0; font-weight: 600; }
.ph-page ul { margin: 4px 0 0; padding-left: 20px; font-size: 12.5px; line-height: 1.85; }
.ph-kpi { display: flex; gap: 10px; margin: 8px 0; }
.ph-kpi div { flex: 1; border: 1px solid #aaa; border-radius: 4px; padding: 6px 8px; font-size: 12px; }
.ph-kpi b { display: block; font-size: 18px; margin-top: 2px; }
.ph-trend { font-size: 12px; line-height: 1.9; color: #444; }
.ph-eval-split { display: flex; gap: 16px; align-items: flex-start; flex-wrap: wrap; margin: 4px 0 10px; }
.ph-eval-left { flex: 1 1 300px; min-width: 260px; }
.ph-eval-right { flex: 1 1 300px; min-width: 260px; border: 1px solid #ccc; border-radius: 8px; padding: 8px 6px 4px; }
.ph-chart-cap { font-size: 12px; color: #444; text-align: center; margin: 0 0 4px; }
.ph-weaker { margin-top: 6px; margin-bottom: 0; padding-left: 20px; }
@page { size: A4; margin: 14mm 12mm; }
@media print {
  .pack-bar { display: none !important; }
  body { background: #fff; }
  .ph-page svg { print-color-adjust: exact; -webkit-print-color-adjust: exact; }
}

/* ================================================================
   v2.4：G 线指标面板（三档分布 / 各班对比 / 跨场走势）
   ================================================================ */
.gstack { display: flex; height: 24px; border-radius: 8px; overflow: hidden; border: 1px solid var(--border); }
.gstack .gseg { min-width: 0; transition: width .4s ease; }
.glegend { display: flex; gap: 14px; flex-wrap: wrap; margin-top: 8px; font-size: 12px; color: var(--ink-2); }
.glegend span { display: inline-flex; align-items: center; gap: 5px; }
.glegend i { width: 10px; height: 10px; border-radius: 3px; display: inline-block; flex: none; }
.gline-tbl { margin-top: 14px; }
.gline-tbl .hint { margin: 8px 0 0; }

/* ================================================================
   v2.4：界面优化探索层
   ① KPI 信息层级  ② 设计 token（圆角/间距/字号）  ③ 手机密度
   只收敛既有取值，不改变现有视觉基调
   ================================================================ */
:root {
  /* 圆角阶梯（与现存视觉一一对应：chip 2 / 卡片按钮 3 / 面板 4 / 输入 8 / KPI 12） */
  --r-xs: 2px; --r-sm: 3px; --r-md: 4px; --r-lg: 8px; --r-xl: 12px; --r-2xl: 18px; --r-full: 999px;
  /* 间距阶梯（4 的倍数） */
  --s-1: 4px; --s-2: 8px; --s-3: 12px; --s-4: 16px; --s-5: 22px; --s-6: 28px;
  /* 字号阶梯（闭合级数 10/11/12/14/16/20/26/32） */
  --t-2xs: 10px; --t-xs: 11px; --t-sm: 12px; --t-md: 14px; --t-lg: 16px; --t-xl: 20px; --t-2xl: 26px; --t-3xl: 32px;
}

/* ① 指标条三层节奏：标签 → 数字 → 辅助；G 线上线人数变化做成角标 */
.metric-cell .metric-label { letter-spacing: .08em; }
.metric-cell .metric-value { font-weight: 600; letter-spacing: -.01em; }
.metric-cell .metric-delta { display: inline-flex; align-items: center; gap: 5px; margin-top: 3px;
  font-size: var(--t-2xs); font-weight: 600; font-variant-numeric: tabular-nums; }
.metric-cell .metric-delta::before { content: ''; width: 5px; height: 5px; border-radius: var(--r-full); background: currentColor; opacity: .8; flex: none; }
.metric-cell .metric-delta.up { color: var(--good-text); }
.metric-cell .metric-delta.down { color: var(--critical); }
.metric-cell .metric-delta.flat { color: var(--muted); }

/* ② 统一走 token：卡片 / 按钮 / 弹窗 / 输入框（取值与改造前一致） */
.card { border-radius: var(--r-sm); }
button.btn { border-radius: var(--r-sm); }
button.chip { border-radius: var(--r-xs); }
.panel { border-radius: var(--r-md); }
.kpi { border-radius: var(--r-xl); }
#workspace-overlay .ws-dialog { border-radius: var(--r-2xl); }
input[type=text], input[type=number], input[type=password], select, textarea { border-radius: var(--r-lg); }

/* ③ 手机密度：字底不再低于 10px；G 线图例紧凑换行；表格更省横向空间 */
@media (max-width: 999px) {
  .metric-cell .metric-foot { font-size: var(--t-2xs); }
  .gstack { height: 21px; }
}
@media (max-width: 700px) {
  .glegend { gap: var(--s-2) var(--s-3); font-size: var(--t-sm); }
  .gline-tbl .hint { font-size: var(--t-xs); }
  .panel-body table.tb th, .panel-body table.tb td { padding: 7px 8px; }
  .workspace-actions { gap: var(--s-2); }
  .metric-cell .metric-delta { margin-top: 2px; }
  #workspace-overlay .ws-dialog, #workspace-overlay .ws-dialog.wide { border-radius: var(--r-2xl) var(--r-2xl) 0 0; }
}
</style>
</head>

function templateClasses(n) {
  const out = [];
  for (let i = 0; i < n; i++) {
    out.push({
      id: 'cls-' + (i + 1) + '-' + Date.now().toString(36),
      name: '高三(' + (i + 1) + ')班',
      slogan: CLASS_SLOGANS[i % CLASS_SLOGANS.length],

      comboIds: DEFAULT_COMBOS.length ? [DEFAULT_COMBOS[i % DEFAULT_COMBOS.length].id] : [],
    });

  return out;
}

/* 根据组合定义生成 6 科列表 */
function comboSubjects(combo) {
  if (!combo) return [...CORE3, 'physics'].map(k => SUBJECT_MAP[k]).filter(Boolean);
  const t1 = combo.track1 || 'physics';
  // 再选科目必须恰好 2 门（3+1+2 口径）；设置不合规时取前两个，
  // 保证总分口径恒为 750，不会算出 829 这类超满分
  let t2 = (combo.track2 || []).filter(k => TRACK2_KEYS.includes(k));
  if (t2.length > 2) t2 = t2.slice(0, 2);
  return [...CORE3, t1, ...t2]
    .map(k => SUBJECT_MAP[k]).filter(Boolean);
}
function comboSubjectKeys(combo) { return comboSubjects(combo).map(s => s.key); }
function comboName(combo) {
  if (!combo) return '—';
  const t1 = SUBJECT_MAP[combo.track1] ? SUBJECT_MAP[combo.track1].name : combo.track1;
  const t2 = (combo.track2 || []).map(k => SUBJECT_MAP[k] ? SUBJECT_MAP[k].name : k).join('');
  return t1 + t2;
}
/* 组合的显示名：用户自定义名优先，否则用科目推导名 */
function comboLabel(combo) {
  if (!combo) return '—';
  const custom = combo.name != null ? String(combo.name).trim() : '';
  return custom || comboName(combo);
}
/* 组合的实际满分：语数外各150 + 首选100 + 每门再选100 */
function comboMaxScore(combo) {
  if (!combo) return 750;
  return 450 + 100 + (combo.track2 || []).length * 100;
}
function comboTrackName(combo) {
  if (!combo) return '—';
  return combo.track1 === 'history' ? '历史类' : '物理类';
}
/* --- 选科简码解析：「物化政」「物化地」「物理化学政治」→ {track1, track2} --- */
const COMBO_TOKENS = [
  ['物理', 'physics'], ['化学', 'chem'], ['生物', 'bio'], ['政治', 'politics'], ['地理', 'geo'], ['历史', 'history'],
  ['物', 'physics'], ['化', 'chem'], ['生', 'bio'], ['政', 'politics'], ['地', 'geo'], ['历', 'history'],
];
const SHORT1 = { physics: '物', history: '历' };
const SHORT2 = { chem: '化', bio: '生', politics: '政', geo: '地' };
function parseComboText(s) {
  let t = String(s == null ? '' : s).trim().replace(/[\s+＋/、,，·．.。:：\-—（）()【】]/g, '');
  if (!t) return null;
  const found = [];
  let i = 0;
  while (i < t.length) {
    let hit = null;
    for (const [pat, key] of COMBO_TOKENS) {
      if (t.startsWith(pat, i)) { hit = { pat, key }; break; }
    }
    if (!hit) return null;
    found.push(hit.key);
    i += hit.pat.length;
  }
  const t1 = found.filter(k => k === 'physics' || k === 'history');
  const t2 = found.filter(k => TRACK2_KEYS.includes(k));
  if (found.length !== 3 || t1.length !== 1 || t2.length !== 2 || new Set(t2).size !== 2) return null;
  return { track1: t1[0], track2: TRACK2_KEYS.filter(k => t2.includes(k)) };
}
function comboShortName(p) {
  return (SHORT1[p.track1] || '') + (p.track2 || []).map(k => SHORT2[k] || '').join('');
}
function comboMatchSubjects(c, p) {
  if (!c || !p) return false;
  const t2c = TRACK2_KEYS.filter(x => (c.track2 || []).includes(x));
  return c.track1 === p.track1 && t2c.length === 2 && p.track2.every(x => t2c.includes(x));
}
/* 班级选科快捷输入：「物化政」→ 找到或新建对应组合，设为该班组合 */
function applyComboQuick(cl, text, combos) {
  const p = parseComboText(text);
  if (!p) {
    alert('没认出「' + String(text || '').trim() + '」。\n支持 3 字简码（物化政 / 物化地 / 历政地…）或全称（物理化学政治），首选 + 再选共 3 门。');
    return;
  }
  let combo = (combos || []).find(c => comboMatchSubjects(c, p));
  if (!combo) {
    const used = new Set((combos || []).map(c => String(c.name || '').trim()));
    let nm = comboShortName(p);
    if (used.has(nm)) { let n = 2; while (used.has(nm + '（' + n + '）')) n++; nm = nm + '（' + n + '）'; }
    combo = { id: 'combo-' + Date.now().toString(36), name: nm, track1: p.track1, track2: p.track2.slice() };
    if (!Array.isArray(data.settings.combos)) data.settings.combos = [];
    data.settings.combos.push(combo);
  }
  cl.comboIds = [combo.id];
  saveData(); render();
  const hintEl = document.getElementById('combo-status');
  if (hintEl) hintEl.textContent = '「' + cl.name + '」已设为 ' + comboShortName(p) + '（' + comboName(p) + '）';
}
/* 学生 → 该科是否赋分 */
/* 科目列的统一排序：语数外 → 物理 → 历史 → 再选科目（化生政地） */
const SUBJECT_ORDER = ['chinese', 'math', 'english', 'physics', 'history', 'chem', 'bio', 'politics', 'geo'];
function sortSubjectKeys(keys) {
  return (keys || []).slice().sort((a, b) => {
    const ia = SUBJECT_ORDER.indexOf(a), ib = SUBJECT_ORDER.indexOf(b);
    return (ia < 0 ? 99 : ia) - (ib < 0 ? 99 : ib);
  });
}
function isAssignedSubject(key) {
  const s = SUBJECT_MAP[key];
  return s ? !!s.assigned : false;
}
/* 学生 → 赋分科目 key 列表（与 comboSubjects 同一口径：恰好 2 门） */
function assignedKeysForCombo(combo) {
  if (!combo) return [];
  let t2 = (combo.track2 || []).filter(k => TRACK2_KEYS.includes(k));
  if (t2.length > 2) t2 = t2.slice(0, 2);
  return t2;
}
