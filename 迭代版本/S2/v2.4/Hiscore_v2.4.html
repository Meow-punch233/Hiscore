function lineChartCard(opts) {
  const pal = P();
  const off = new Set();
  const W = 720, H = opts.height || 240;
  const padL = 48, padR = (opts.refs && opts.refs.length) ? 92 : 56, padT = 14, padB = 30;
  const plotW = W - padL - padR, plotH = H - padT - padB;

  function visSeries() { return opts.series.filter(s => !off.has(s.key)); }

  function domain() {
    let vals = [];
    for (const s of visSeries()) for (const v of s.values) if (v != null && !isNaN(v)) vals.push(v);
    for (const r of (opts.refs || [])) if (r.y != null) vals.push(r.y);
    if (!vals.length) return { lo: 0, hi: 1, ticks: [0, 1] };
    let min = Math.min.apply(null, vals), max = Math.max.apply(null, vals);
    const pad = Math.max(1, (max - min) * 0.12);
    return niceTicks(min - pad, max + pad, 5);
  }

  function build(onlyTable) {
    const d = domain();
    const n = opts.xLabels.length;
    const X = i => n <= 1 ? padL + plotW / 2 : padL + plotW * i / (n - 1);
    const Yraw = v => padT + plotH * (1 - (v - d.lo) / (d.hi - d.lo));
    const Y = v => opts.invertY ? padT + plotH * (v - d.lo) / (d.hi - d.lo) : Yraw(v);
    const wrap = h('div', { class: tblHidden ? 'chart-as-table' : '' });
    wrap.append(h('div', { class: 'chart-head' },
      h('h3', { text: opts.title }),
      opts.sub ? h('span', { class: 'cs', text: opts.sub }) : null,
      h('span', { class: 'tw' },
        h('button', { class: 'btn', onclick: () => { tblHidden = !tblHidden; rerender(); }, text: tblHidden ? '返回图表' : '表格视图' }))));

    if (tblHidden) {
      const tbl = h('table', { class: 'tb' });
      const thead = h('thead', {}, h('tr', {}, h('th', { text: '考试' }),
        visSeries().map(s => h('th', { text: s.name })),
        (opts.refs || []).map(r => h('th', { text: r.label }))));
      const tbody = h('tbody', {}, opts.xLabels.map((lb, i) => h('tr', {},
        h('td', { text: lb }),
        visSeries().map(s => h('td', { text: s.values[i] == null ? '—' : fmt(s.values[i]) })),
        (opts.refs || []).map(() => h('td', { text: '—' })))));
      tbl.append(thead, tbody);
      wrap.append(h('div', { class: 'tscroll' }, tbl));
      return wrap;
    }
    if (!visSeries().length || !n) { wrap.append(h('div', { class: 'empty', text: '暂无数据' })); return wrap; }

    // SVG 字符串（静态颜色/数字，动态文本已转义）
    let g = '';
    for (const t of d.ticks) {
      const y = Y(t);
      g += `<line x1="${padL}" y1="${y}" x2="${W - padR}" y2="${y}" stroke="${pal.grid}" stroke-width="1"/>`;
      g += `<text x="${padL - 8}" y="${y + 4}" text-anchor="end" font-size="11" fill="${pal.muted}" style="font-variant-numeric:tabular-nums">${t}</text>`;
    }
    g += `<line x1="${padL}" y1="${padT + plotH}" x2="${W - padR}" y2="${padT + plotH}" stroke="${pal.axis}" stroke-width="1"/>`;
    for (let i = 0; i < n; i++) {
      g += `<text x="${X(i)}" y="${H - 8}" text-anchor="middle" font-size="11" fill="${pal.muted}">${esc(opts.xLabels[i])}</text>`;
    }
    // 参考线
    for (const r of (opts.refs || [])) {
      if (r.y == null) continue;
      const y = Y(r.y);
      if (y < padT - 2 || y > padT + plotH + 2) continue;
      g += `<line x1="${padL}" y1="${y}" x2="${W - padR}" y2="${y}" stroke="${r.color}" stroke-width="1.5" stroke-opacity="0.75" stroke-dasharray="6 4"/>`;
      g += `<text x="${W - padR + 6}" y="${y + 4}" font-size="11" fill="${pal.ink2}">${esc(r.label)}</text>`;
    }
    // 折线（缺值断开）
    for (const s of visSeries()) {
      let dstr = '', pen = false;
      for (let i = 0; i < n; i++) {
        const v = s.values[i];
        if (v == null || isNaN(v)) { pen = false; continue; }
        dstr += (pen ? 'L' : 'M') + X(i).toFixed(1) + ' ' + Y(v).toFixed(1) + ' ';
        pen = true;
      }
      g += `<path d="${dstr}" fill="none" stroke="${s.color}" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>`;
      // 端点直标（仅单系列时）
      if (opts.labelLast && visSeries().length === 1) {
        for (let i = n - 1; i >= 0; i--) if (s.values[i] != null) {
          g += `<circle cx="${X(i)}" cy="${Y(s.values[i])}" r="4.5" fill="${s.color}" stroke="${pal.surface}" stroke-width="2"/>`;
          g += `<text x="${X(i) + 8}" y="${Y(s.values[i]) + 4}" font-size="12" font-weight="600" fill="${pal.ink}">${fmt(s.values[i])}</text>`;
          break;
        }
      } else {
        for (let i = 0; i < n; i++) if (s.values[i] != null)
          g += `<circle cx="${X(i)}" cy="${Y(s.values[i])}" r="3.5" fill="${s.color}" stroke="${pal.surface}" stroke-width="2"/>`;
      }
    }
    const svg =
      `<svg class="line" viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(opts.title)}">` +
      g +
      `<line class="xh" x1="0" y1="${padT}" x2="0" y2="${padT + plotH}" stroke="${pal.axis}" stroke-width="1" opacity="0"/>` +
      `<rect x="0" y="0" width="${W}" height="${H}" fill="transparent" style="cursor:crosshair"/>` +
      `</svg>`;
    const holder = h('div', { class: 'chart-view', html: svg });
    const svgEl = holder.firstChild;
    // 十字线 + tooltip
    const xh = svgEl.querySelector('.xh');
    svgEl.addEventListener('pointermove', ev => {
      const box = svgEl.getBoundingClientRect();
      const px = (ev.clientX - box.left) * W / box.width;
      let idx = n <= 1 ? 0 : Math.round((px - padL) / plotW * (n - 1));
      idx = Math.max(0, Math.min(n - 1, idx));
      xh.setAttribute('x1', X(idx)); xh.setAttribute('x2', X(idx)); xh.setAttribute('opacity', '0.8');
      const rows = visSeries().map(s => {
        let previous = null;
        for (let i = idx - 1; i >= 0; i--) if (s.values[i] != null) { previous = s.values[i]; break; }
        const delta = s.values[idx] == null || previous == null ? null : s.values[idx] - previous;
        const better = opts.invertY ? delta < 0 : delta > 0;
        return { color: delta == null ? s.color : better ? pal.good : delta < 0 || opts.invertY ? pal.critical : pal.muted,
          name: s.name + (delta == null ? '' : ' · 较上场 ' + fmtSigned(delta)), value: s.values[idx] == null ? '—' : fmt(s.values[idx]) + (opts.yUnit || '') };
      });
      for (const r of (opts.refs || [])) rows.push({ color: r.color, name: r.label, value: fmt(r.y) + (opts.yUnit || '') });
      showTT(ev.clientX, ev.clientY, opts.xLabels[idx], rows);
    });
    svgEl.addEventListener('pointerleave', () => { xh.setAttribute('opacity', '0'); hideTT(); });
    wrap.append(holder);

    // 图例（≥2 系列；点击可隐藏/显示）
    if (opts.series.length >= 2) {
      const lg = h('div', { class: 'legend' }, opts.series.map(s =>
        h('span', {
          class: 'li' + (off.has(s.key) ? ' off' : ''), role: 'button', tabindex: '0',
          title: '点击显示/隐藏',
          onclick: () => { off.has(s.key) ? off.delete(s.key) : off.add(s.key); rerender(); },
          onkeydown: ev => { if (ev.key === 'Enter' || ev.key === ' ') { ev.preventDefault(); off.has(s.key) ? off.delete(s.key) : off.add(s.key); rerender(); } },
        },
          h('span', { class: 'key', style: 'border-top-color:' + s.color }),
          s.name)));
      wrap.append(lg);
    }
    return wrap;
  }

  let tblHidden = false;
  let cur = null;
  function rerender() {
    const next = build();
    if (cur && cur.parentNode) cur.parentNode.replaceChild(next, cur);
    cur = next;
  }
  cur = build();
  const host = h('div', { class: 'card' }, cur);
  return host;
}

/* ---------- 柱状图（单系列，名义类别 → 统一 slot1 色） ---------- */
/* 与均值的差距决定柱色：高于 3% 为绿、低于 3% 为红、其余用主色；均值缺失时退回主色 */
function barColor(value, mean, opts) {
  const pal = P();
  if (opts && !opts.showMean) return pal.accent;
  if (value == null || mean == null || !isFinite(mean) || mean === 0) return pal.accent;
  if (value >= mean * 1.03) return pal.good;
  if (value <= mean * 0.97) return pal.critical;
  return pal.accent;
}
function barChartCard(opts) {
  // opts: {title, sub, items:[{label, value, color?, detail?}], yMax, unit, height}
  // opts: {title, sub, items:[{label, value, ref?}], yMax, unit, height}
  // opts.showMean = true：画各柱均值的虚线，并按「与均值相差 3%」把柱子分成三档颜色
  const pal = P();
  const W = 720, H = opts.height || 220;
  const padL = 44, padR = 16, padT = 18, padB = 30;
  const plotW = W - padL - padR, plotH = H - padT - padB;
  const vals = opts.items.map(i => i.value).filter(v => v != null);
  const maxV = opts.yMax != null ? opts.yMax : (vals.length ? Math.max.apply(null, vals) : 1);
  const d = niceTicks(0, Math.max(maxV, 1), 5);
  const n = opts.items.length;
  const band = plotW / Math.max(1, n);
  const barW = Math.min(24, band * 0.55);
  const Y = v => padT + plotH * (1 - (v - d.lo) / (d.hi - d.lo));
  let g = '';
  for (const t of d.ticks) {
    const y = Y(t);
    g += `<line x1="${padL}" y1="${y}" x2="${W - padR}" y2="${y}" stroke="${pal.grid}" stroke-width="1"/>`;
    g += `<text x="${padL - 8}" y="${y + 4}" text-anchor="end" font-size="11" fill="${pal.muted}">${t}</text>`;
  }
  g += `<line x1="${padL}" y1="${padT + plotH}" x2="${W - padR}" y2="${padT + plotH}" stroke="${pal.axis}" stroke-width="1"/>`;
  // 均值参考线：高于均值 3% 为绿、低于 3% 为红，柱色与虚线对应，一眼看出强弱
  const mean = vals.length ? vals.reduce((a, b) => a + b, 0) / vals.length : null;
  if (opts.showMean && mean != null) {
    const my = Y(mean);
    g += `<line x1="${padL}" y1="${my}" x2="${W - padR}" y2="${my}" stroke="${pal.critical}" stroke-width="1.2" stroke-dasharray="5 3" stroke-opacity="0.8"/>`;
    g += `<text x="${W - padR - 2}" y="${my - 5}" text-anchor="end" font-size="10" fill="${pal.critical}">均值 ${fmt(mean, 1)}</text>`;
  }
  const base = Y(d.lo);
  opts.items.forEach((it, i) => {
    const cx = padL + band * (i + 0.5);
    if (it.value != null) {
      const y = Y(it.value), hgt = Math.max(2, base - y);
      const r = Math.min(4, barW / 2, hgt);
      const color = it.color || barColor(it.value, mean, opts);
      g += `<path d="M${cx - barW / 2} ${base} L${cx - barW / 2} ${y + r} Q${cx - barW / 2} ${y} ${cx - barW / 2 + r} ${y} L${cx + barW / 2 - r} ${y} Q${cx + barW / 2} ${y} ${cx + barW / 2} ${y + r} L${cx + barW / 2} ${base} Z" fill="${color}"/>`;
      g += `<text x="${cx}" y="${y - 6}" text-anchor="middle" font-size="11" font-weight="600" fill="${pal.ink}">${fmt(it.value)}${opts.valueSuffix === '%' ? '%' : ''}</text>`;
    }
    g += `<text x="${cx}" y="${H - 8}" text-anchor="middle" font-size="11" fill="${pal.muted}">${esc(it.label)}</text>`;
    g += `<rect x="${cx - band / 2}" y="${padT}" width="${band}" height="${plotH}" fill="transparent" data-i="${i}" style="cursor:default"/>`;
  });
  const holder = h('div', { class: 'chart-view', html: `<svg class="bar" viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(opts.title)}">${g}</svg>` });
  const svgEl = holder.firstChild;
  svgEl.querySelectorAll('rect[data-i]').forEach(rc => {
    rc.addEventListener('pointermove', ev => {
      const it = opts.items[+rc.getAttribute('data-i')];
      showTT(ev.clientX, ev.clientY, it.label, [{ color: it.color || barColor(it.value, mean, opts), name: opts.unit || '', value: it.value == null ? '—' : fmt(it.value) + (opts.valueSuffix || '') }], it.detail ? [{ color: pal.muted, name: '原始成绩', value: it.detail }] : []);
    });
    rc.addEventListener('pointerleave', hideTT);
  });
  // 表格孪生
  let asTable = false, curEl = null;
  const head = h('div', { class: 'chart-head' },
    h('h3', { text: opts.title }),
    opts.sub ? h('span', { class: 'cs', text: opts.sub }) : null,
    h('span', { class: 'tw' }, h('button', {
      class: 'btn', text: asTable ? '返回图表' : '表格视图',
      onclick: () => { asTable = !asTable; rerenderBar(); },
    })));
  const root = h('div', { class: 'card' }, head, holder);
  curEl = holder;
  function rerenderBar() {
    head.querySelector('.tw button').textContent = asTable ? '返回图表' : '表格视图';
    const next = asTable
      ? h('div', { class: 'tscroll' }, h('table', { class: 'tb' },
        h('thead', {}, h('tr', {}, h('th', { text: '科目' }), h('th', { text: opts.unit || '均分' }))),
        h('tbody', {},
          opts.items.map(it => h('tr', {}, h('td', { text: it.label }), h('td', { text: it.value == null ? '—' : fmt(it.value) + (opts.valueSuffix || '') }))),
          opts.showMean && mean != null
            ? h('tr', { class: 'bar-mean-row' }, h('td', { text: '均值' }), h('td', { text: fmt(mean, 1) + (opts.valueSuffix || '') }))
            : null))
      )
      : holder;
    if (curEl && curEl.parentNode) curEl.parentNode.replaceChild(next, curEl);
    else if (curEl) head.parentNode.insertBefore(next, head.nextSibling);
    curEl = next;
  }
  return root;
}

/* ---------- sparkline ---------- */
function sparkline(values, color, invert) {
  const pal = P();
  const w = 84, hgt = 26, pad = 3;
  const pts = values.filter(v => v != null);
  if (pts.length < 2) return h('span', { class: 'hint', text: pts.length ? String(fmt(pts[0])) : '—' });
  const min = Math.min.apply(null, pts), max = Math.max.apply(null, pts);
  const span = max - min || 1;
  const X = i => pad + (w - pad * 2) * i / (values.length - 1);
  const Y = v => {
    const t = (v - min) / span;
    return invert ? pad + (hgt - pad * 2) * t : pad + (hgt - pad * 2) * (1 - t);
  };
  let dstr = '', pen = false, last = null;
  values.forEach((v, i) => {
    if (v == null) { pen = false; return; }
    dstr += (pen ? 'L' : 'M') + X(i).toFixed(1) + ' ' + Y(v).toFixed(1) + ' ';
    pen = true; last = { x: X(i), y: Y(v) };
  });
  // 未指定颜色时按整条线的升降着色：涨绿跌红（invert＝名次类指标，方向相反）
  const up = pts[pts.length - 1] >= pts[0];
  const rising = invert ? !up : up;
  const stroke = color || (rising ? pal.good : pal.critical);
  const svg = `<svg width="${w}" height="${hgt}" viewBox="0 0 ${w} ${hgt}" aria-hidden="true">
    <path d="${dstr}" fill="none" stroke="${stroke}" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round"/>
    ${last ? `<circle cx="${last.x}" cy="${last.y}" r="2.6" fill="${stroke}" stroke="${pal.surface}" stroke-width="1.5"/>` : ''}
  </svg>`;
  return h('span', { html: svg });
}

/* --- 调用 OpenAI 兼容 API（流式） --- */
async function callAI(cfg, messages, onDelta) {
  const url = cfg.base.replace(/\/+$/, '') + '/chat/completions';
  const res = await fetch(url, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + cfg.key },
    body: JSON.stringify({ model: cfg.model, messages, stream: true, temperature: 0.6 }),
  });
  if (!res.ok || !res.body) {
    let detail = '';
    try { detail = (await res.text()).slice(0, 300); } catch (e) { /* ignore */ }
    const map = { 401: 'API Key 无效或已过期', 402: '账户余额不足', 403: '没有权限（模型名写错了？）', 429: '请求太频繁或欠费限流' };
    throw new Error(`HTTP ${res.status}${map[res.status] ? '：' + map[res.status] : ''}${detail ? '｜' + detail : ''}`);
  }
  const reader = res.body.getReader();
  const dec = new TextDecoder();
  let buf = '';
  for (;;) {
    const { done, value } = await reader.read();
    if (done) break;
    buf += dec.decode(value, { stream: true });
    const lines = buf.split('\n');
    buf = lines.pop();
    for (const ln of lines) {
      const m = ln.match(/^data:\s*(.+)$/);
      if (!m) continue;
      if (m[1].trim() === '[DONE]') return;
      try {
        const j = JSON.parse(m[1]);
        const d = j.choices && j.choices[0] && j.choices[0].delta && j.choices[0].delta.content;
        if (d) onDelta(d);
      } catch (e) { /* 非 JSON 行忽略 */ }
    }
  }
}

/* 数据结构兼容：旧 JSON 备份、Excel 恢复都要走这里，保证缺的字段有默认值 */
function normalizeData(d) {
  if (!d || !Array.isArray(d.exams) || !d.settings) {
    return { settings: defaultSettings(), exams: generateSample(), isSample: true, profiles: {} };
  }
  d.isSample = !!d.isSample;
  if (!d.profiles || typeof d.profiles !== 'object') d.profiles = {};
  const def = defaultSettings();
  if (!Array.isArray(d.settings.combos) || !d.settings.combos.length) d.settings.combos = def.combos;
  if (!Array.isArray(d.settings.classes)) d.settings.classes = def.classes;
  if (!d.settings.mismatch || typeof d.settings.mismatch !== 'object') d.settings.mismatch = def.mismatch;
  if (d.settings.line1 == null) d.settings.line1 = def.line1;
  if (d.settings.line2 == null) d.settings.line2 = def.line2;
  if (!d.settings.line1Name) d.settings.line1Name = def.line1Name;   // G1/G2 线名（可自定义），旧备份兜底
  if (!d.settings.line2Name) d.settings.line2Name = def.line2Name;
  // 班级档案：旧数据补口号 / 代表色 / 形象
  d.settings.classes.forEach((c, i) => {
    if (typeof c.slogan !== 'string') c.slogan = '';
    if (!c.color) c.color = TEAM_COLORS[i % TEAM_COLORS.length];
    if (!c.mascot) c.mascot = MASCOT_PRESETS[i % MASCOT_PRESETS.length].id;
  });
  // 考试：补可选的考试日期；学生：补数组
  for (const ex of d.exams) {
    if (ex.date == null) ex.date = '';
    if (!Array.isArray(ex.students)) ex.students = [];
  }
  // 学生档案：补数值型目标总分
  for (const k in d.profiles) {
    const p = d.profiles[k];
    if (p && p.goalScore == null) p.goalScore = null;
  }
  return d;
}
function loadData() {
  try {
    const raw = localStorage.getItem(LS_KEY);
    if (raw) {
      const d = JSON.parse(raw);
      if (d && Array.isArray(d.exams) && d.settings) return normalizeData(d);
    }
  } catch (e) { /* fallthrough */ }
  return normalizeData({ settings: defaultSettings(), exams: generateSample(), isSample: true, profiles: {} });
}
function saveData(reason) {
  // 先把「改动前的旧内容」存进本机快照，改坏了还能回滚
  try {

/* ================================================================
   本机自动快照（IndexedDB）：改数据前自动留档，误操作可回滚
   localStorage 只有一份，误删一次就没了；IndexedDB 可以留最近几份。
   ================================================================ */
const SNAP = {
  DB: null, DB_NAME: 'hiscore-v23-snap', STORE: 'snaps', MAX: 5,
  snaps: [], lastSnapAt: 0, lastSig: '',
  openDB() {
    return new Promise(res => {
      if (!window.indexedDB) return res(null);
      try {
        const rq = indexedDB.open(this.DB_NAME, 1);
        rq.onupgradeneeded = () => {
          const db = rq.result;
          if (!db.objectStoreNames.contains(this.STORE)) db.createObjectStore(this.STORE, { keyPath: 'id', autoIncrement: true });
        };
        rq.onsuccess = () => { this.DB = rq.result; res(this.DB); };
        rq.onerror = () => res(null);
      } catch (e) { res(null); }
    });
  },
  tx(mode, fn) {
    return new Promise(async res => {
      const db = this.DB || await this.openDB();
      if (!db) return res(null);
      try {
        const t = db.transaction(this.STORE, mode);
        const rq = fn(t.objectStore(this.STORE));
        rq.onsuccess = () => res(rq.result);
        rq.onerror = () => res(null);
      } catch (e) { res(null); }
    });
  },
  async listSnaps() {
    const all = await this.tx('readonly', st => st.getAll());
    this.snaps = (all || []).slice().sort((a, b) => b.ts - a.ts);
    if (this.snaps.length > this.MAX) {
      for (const old of this.snaps.slice(this.MAX)) await this.tx('readwrite', st => st.delete(old.id));
      this.snaps = this.snaps.slice(0, this.MAX);
    }
    return this.snaps;
  },
  async putSnap(rec) {
    await this.tx('readwrite', st => st.add(rec));
    const all = await this.listSnaps();
    if (all.length > this.MAX) for (const old of all.slice(this.MAX)) await this.tx('readwrite', st => st.delete(old.id));
    return true;
  },
  async delSnap(id) { await this.tx('readwrite', st => st.delete(id)); await this.listSnaps(); },
  /* prevRaw = 改动前的 localStorage 内容，也就是「还能回滚的旧版」 */
  autoSnapshot(prevRaw, reason) {
    if (!prevRaw) return;
    try {
      const d = JSON.parse(prevRaw);
      const exams = (d.exams || []).length;
      const students = (d.exams || []).reduce((n, x) => n + ((x.students || []).length), 0);
      const sig = exams + '/' + students;
      const now = Date.now();
      // 强制存档（带 reason）立刻留；自动快照 10 分钟内且规模没变就不重复留
      if (!reason && now - this.lastSnapAt < 10 * 60 * 1000 && sig === this.lastSig) return;
      this.lastSnapAt = now; this.lastSig = sig;
      this.putSnap({ ts: now, reason: reason || '自动快照', exams, students, bytes: prevRaw.length, payload: prevRaw });
    } catch (e) { /* 快照失败不影响主流程 */ }
  },
  async snapshotNow(label) {
    const raw = localStorage.getItem(LS_KEY);
    if (!raw) return false;
    try {
      const d = JSON.parse(raw);
      await this.putSnap({ ts: Date.now(), reason: label || '手动存档',
        exams: (d.exams || []).length,
        students: (d.exams || []).reduce((n, x) => n + ((x.students || []).length), 0),
        bytes: raw.length, payload: raw });
      await this.listSnaps();
      return true;
    } catch (e) { return false; }
  },
  async rollback(id) {
    const snap = (await this.listSnaps()).find(x => x.id === id);
    if (!snap) { myAlert('找不到这份快照。'); return false; }
    const ok = await myConfirm('回滚到 ' + this.fmtTime(snap.ts) + '（' + snap.reason + '）？\n当前数据会先自动留一份快照，再被这份覆盖。', '确认回滚');
    if (!ok) return false;
    await this.snapshotNow('回滚前自动留档');
    try {
      const d = JSON.parse(snap.payload);
      data = normalizeData(d);
      localStorage.setItem(LS_KEY, snap.payload);
      ui.examIdx = 0; ui.student = '';
      render();
      myAlert('已回滚到 ' + this.fmtTime(snap.ts) + ' 的数据。');
      return true;
    } catch (e) { myAlert('回滚失败：' + e.message); return false; }
  },
  fmtTime(ts) {
    const d = new Date(ts), p = n => String(n).padStart(2, '0');
    return d.getFullYear() + '-' + p(d.getMonth() + 1) + '-' + p(d.getDate()) + ' ' + p(d.getHours()) + ':' + p(d.getMinutes()) + ':' + p(d.getSeconds());
  },
  /* 数据体检：本地占用多大、够不够快撑爆 */
  health() {
    let bytes = 0;
    try { bytes = (localStorage.getItem(LS_KEY) || '').length * 2; } catch (e) { /* ignore */ }
    const exams = (data.exams || []).length;
    const students = (data.exams || []).reduce((n, x) => n + ((x.students || []).length), 0);
    return { bytes, exams, students, snaps: this.snaps.length, pct: Math.min(100, bytes / (5 * 1024 * 1024) * 100) };
  },
};

  kpis.append(h('div', { class: 'kpi' }, h('div', { class: 'lb', text: '平均总分' }), h('div', { class: 'vl', text: fmt(avgTotal, 1) }),
    h('div', { class: 'dt ' + (dtAvg == null ? 'flat' : dtAvg > 0 ? 'up' : dtAvg < 0 ? 'down' : 'flat'),
      text: dtAvg == null ? (ei === 0 ? '首场考试' : '无同批学生可对比')
        : (dtAvg > 0 ? '↑ ' : dtAvg < 0 ? '↓ ' : '') + `同 ${comparable.length} 人较上场 ` + fmtSigned(dtAvg) })));
  kpis.append(meterCard('G1 线上', validCount ? l1c / validCount : null, `${l1c} / ${validCount} 人`, l1Delta == null ? null : { v: l1Delta, text: '较上场 ' + fmtSigned(l1Delta) + ' 人' }));
  kpis.append(meterCard('G2 线上', validCount ? l2c / validCount : null, `${l2c} / ${validCount} 人`, l2Delta == null ? null : { v: l2Delta, text: '较上场 ' + fmtSigned(l2Delta) + ' 人' }));
  kpis.append(h('div', { class: 'kpi' }, h('div', { class: 'lb', text: '进步 / 退步' }),
    h('div', { class: 'vl' }, h('span', { style: 'color:var(--good-text)', text: String(upRows.length) }), h('span', { class: 'hint', text: ' / ' }), h('span', { style: 'color:var(--critical)', text: String(downRows.length) })),
    h('div', { class: 'dt flat', text: matched.length ? `共 ${matched.length} 人可对比` : '本场为首次考试' })));
  main.append(kpis);

  // 各科均分（仅本次筛选范围内该科有成绩的学生）
  const subjKeys = [];
  const subjSeen = new Set();
  for (const r of rows) for (const k of (r.subjectKeys || [])) {
    if (!subjSeen.has(k)) { subjSeen.add(k); subjKeys.push(k); }
  }
  subjKeys.sort((a, b) => SUBJECT_ORDER.indexOf(a) - SUBJECT_ORDER.indexOf(b));
  const subjItems = subjKeys.map(k => {
    const def = SUBJECT_MAP[k];
    const vs = rows.map(r => r.subj[k]).filter(v => v != null);
    return { label: def ? def.name : k, value: avg(vs), ref: def ? def.max : 100 };
  });
  main.append(barChartCard({ title: '各科平均分', sub: `本次筛选名单（${scopeText}）· 非全校；虚线为本次各科均值`, items: subjItems, unit: '均分', showMean: true }));

  // 各选科组合的班级均分对比（拼班班型用得上）
  if (comboNames.length > 1) {
    const comboItems = comboNames.map(c => {
      const grp = cur.rows.filter(r => r.comboId === c.id && r.total != null);
      return { label: c.name, value: avg(grp.map(r => r.total)), n: grp.length };
    });
    main.append(barChartCard({
      title: '各选科组合平均总分', sub: '按选科组合分组（同一班内的不同组合分开统计）；虚线为各组合均值的均值',
      items: comboItems, unit: '均分', showMean: true,
    }));
  }

  // 名单两列
  const topUp = upRows.slice().sort((a, b) => b.totalDelta - a.totalDelta).slice(0, 5);
  const topDown = downRows.slice().sort((a, b) => a.totalDelta - b.totalDelta).slice(0, 5);
  const nearLine = withTotal.filter(r => Math.abs(r.toLine1) <= 25).sort((a, b) => Math.abs(a.toLine1) - Math.abs(b.toLine1)).slice(0, 10);
  const dec3 = rows.filter(r => continuousDecline(studentHistory(computed, r.id), 2));
  // 偏科 / 不匹配名单：按严重度 + 最大拖累分排序，预警在前
  const mmAll = [];
  for (const r of rows) {
    const mm = mismatchEval(r, ei, cur.stats.subjAvg);
    if (mm && mm.level !== 'ok') mmAll.push({ r, mm });
  }
  mmAll.sort((a, b) => {
    if (a.mm.level !== b.mm.level) return a.mm.level === 'severe' ? -1 : 1;
    const score = m => (m.weakest ? m.weakest.selfGap + (m.weakest.vsAvgGap || 0) : 0);
    return score(b.mm) - score(a.mm);
  });

  function mvList(title, sub, items, renderRow, emptyText) {
    const ul = h('ul', { class: 'mv' });
    if (!items.length) ul.append(h('li', {}, h('span', { class: 'meta', text: emptyText || '暂无' })));
    else items.forEach(r => ul.append(renderRow(r)));
    return h('div', { class: 'card' }, h('h2', { text: title }), h('p', { class: 'sub', text: sub }), ul);
  }
  const rowMv = (r, kind) => h('li', {},
    h('span', { class: 'nm', text: r.name }),
    r.studentId ? h('span', { class: 'meta', text: r.studentId }) : null,
    r.comboName ? h('span', { class: 'meta', text: r.comboName }) : null,
    h('span', { class: 'val' },
      h('span', { style: 'color:' + (kind === 'up' ? 'var(--good-text)' : 'var(--critical)'), text: (kind === 'up' ? '↑ +' : '↓ ') + Math.abs(r.totalDelta) }),
      h('span', { class: 'meta', text: ` 总分 ${fmt(r.total)}（年级 ${fmt(r.totalRank)}）` })));

  const grid = h('div', { class: 'grid2' });
  grid.append(mvList('进步最快', '总分较上场涨幅前 5', topUp, r => rowMv(r, 'up'), ei === 0 ? '首场考试，从下一场开始对比' : '暂无'));
  grid.append(mvList('退步最多', '总分较上场跌幅前 5', topDown, r => rowMv(r, 'down'), ei === 0 ? '首场考试，从下一场开始对比' : '暂无'));
  main.append(grid);

  const grid2 = h('div', { class: 'grid2' });
  grid2.append(mvList('G1 临界生', `距G1线 ±25 分（线 ${st.line1}），适合重点谈话`, nearLine, r => h('li', {},
    h('span', { class: 'nm', text: r.name }),
    r.cls ? h('span', { class: 'meta', text: r.cls }) : null,
    r.comboName ? h('span', { class: 'meta', text: r.comboName }) : null,
    h('span', { class: 'val' },
      h('span', { style: 'color:' + (r.toLine1 >= 0 ? 'var(--good-text)' : 'var(--critical)'), text: (r.toLine1 >= 0 ? '线上 +' : '线下 ') + fmt(Math.abs(r.toLine1)) + ' 分' }),
      h('span', { class: 'meta', text: ` 总分 ${fmt(r.total)}` })))));
  grid2.append(mvList('连续退步', '最近 3 场均有成绩且总分连降（缺考不判定），建议面谈', dec3, r => h('li', {},
    h('span', { class: 'nm', text: r.name }),
    r.cls ? h('span', { class: 'meta', text: r.cls }) : null,
    r.comboName ? h('span', { class: 'meta', text: r.comboName }) : null,
    h('span', { class: 'val' },
      h('span', { style: 'color:var(--critical)', text: '↓ 连降' }),
      h('span', { class: 'meta', text: ` 当前总分 ${fmt(r.total)}（年级 ${fmt(r.totalRank)}）` })))));
  main.append(grid2);

  // 偏科 / 不匹配名单（点击姓名跳到该生追踪页）
  const mmList = mvList('偏科 / 不匹配名单', '按失衡幅度排序；● 预警优先介入，⚠ 关注建议谈话；带 * 表示该科在名单里也落后。点击姓名看详情', mmAll, ({ r, mm }) => h('li', {},
    h('span', { class: 'nm', text: r.name, style: 'cursor:pointer;text-decoration:underline dotted', onclick: () => { ui.student = r.id; ui.tab = 'student'; render(); } }),
    r.cls ? h('span', { class: 'meta', text: r.cls }) : null,
    r.comboName ? h('span', { class: 'meta', text: r.comboName }) : null,
    h('span', { class: 'val' },
      h('span', { style: 'color:' + (mm.level === 'severe' ? 'var(--critical)' : '#d98a00'), text: mm.level === 'severe' ? '● 预警' : '⚠ 关注' }),
      h('span', { class: 'meta', text: ` ${mm.flagged.map(x => x.name + (x.listHit ? '*' : '') + ' -' + Math.round(x.selfGap * 100) + '%').join('、')}` }))), '本名单暂无偏科/不匹配学生');
  main.append(mmList);

  // 完整成绩表（表格视图兜底）
  const tbl = h('table', { class: 'tb' });
  const headCells = ['学号', '姓名', '班级', '选科组合', ...subjKeys.map(k => {
    const def = SUBJECT_MAP[k];
    return (def ? def.name : k) + (isAssignedSubject(k) ? '(赋)' : '');
  }), '总分', '总榜', '物理类', '历史类', '班内', '组合内', '较上场', '上线'];
  tbl.append(h('thead', {}, h('tr', {}, headCells.map(t => h('th', { text: t })))));
  const sorted = rows.slice().sort((a, b) => (a.totalRank || 9999) - (b.totalRank || 9999));
  tbl.append(h('tbody', {}, sorted.map(r => h('tr', {},
    h('td', { text: r.studentId || '—' }), h('td', { text: r.name }), h('td', { text: r.cls || '—' }),
    h('td', { text: r.comboName || '—' }),
    subjKeys.map(k => h('td', { text: r.subj[k] == null ? '—' : fmt(r.subj[k]) })),
    h('td', { text: fmt(r.total) }),
    h('td', { text: fmt(r.totalRank) }),
    h('td', { text: fmt(r.physRank) }),
    h('td', { text: fmt(r.histRank) }),
    h('td', { text: fmt(r.classRank) }),
    h('td', { text: fmt(r.comboRank) }),
    h('td', { class: r.trend || '', text: r.totalDelta == null ? '—' : (r.totalDelta > 0 ? '↑ +' + r.totalDelta : r.totalDelta < 0 ? '↓ ' + r.totalDelta : '持平') }),
    h('td', { text: r.lineStatus || '—' })))));
  main.append(h('div', { class: 'card' },
    h('h2', { text: '成绩明细' }),
    h('p', { class: 'sub', text: '选考科目按赋分计入总分；上线率分母为有有效总分的人数。总榜 = 全年级混合排名；物理类 / 历史类分别排名；班内排名按行政班（拼班混排），组合内排名按选科组合。' }),
    h('div', { class: 'tscroll' }, tbl)));
}

/* ---------- 学生追踪 ---------- */
function renderStudent() {
  const options = studentOptions(data.exams);
  if (!options.length) { main.append(h('div', { class: 'card' }, h('div', { class: 'empty', text: '还没有学生数据。' }))); return; }
  let curOpt = options.find(o => o.key === ui.student);
  if (!curOpt) {
    curOpt = options.find(o => o.name === ui.student) || options[0];
    ui.student = curOpt.key;
  }
  const computed = computeAll(data);
  const hist = studentHistory(computed, ui.student);
  const latestIdx = (() => { for (let i = hist.length - 1; i >= 0; i--) if (hist[i]) return i; return -1; })();
  const row = latestIdx >= 0 ? hist[latestIdx] : null;
  const examNames = data.exams.map(e => e.name);

  // 学生选择：下拉按学号/身份 key 定位，显示姓名（学号）

          onchange: ev => { ui.student = ev.target.value; render(); },
        }, options.map(o => h('option', { value: o.key, selected: o.key === ui.student ? '' : null }, studentOptionLabel(o))))),
      row ? h('span', { class: 'tag', text: row.cls || '未分班' }) : null,
      row && row.comboName ? h('span', { class: 'tag', text: row.comboName + '（' + row.trackName + '）' }) : null,
      row ? h('span', { class: 'tag', text: row.studentId ? '学号 ' + row.studentId : '无学号（按班级姓名对齐）' }) : null,
      row && latestIdx >= 0 ? h('span', { class: 'tag', text: data.exams[latestIdx].name }) : null,
      row ? lineTag(row) : null,
      h('div', { style: 'flex:1' }),
      row ? h('button', {
        class: 'btn', text: '⬇ PDF（本学生）',
        onclick: () => pdfStudentPrint(computed, row, hist, latestIdx,
          sortSubjectKeys(row.subjectKeys && row.subjectKeys.length ? row.subjectKeys
            : SUBJECT_DEFS.map(s => s.key).filter(k => row.subj[k] != null))),
      }) : null)));

  if (!row) { main.append(h('div', { class: 'card' }, h('div', { class: 'empty', text: '没有找到该学生的成绩。' }))); return; }

  // KPI（一个 hero + 若干 stat）
  const kpis = h('div', { class: 'kpis' });
  kpis.append(h('div', { class: 'kpi hero' },
    h('div', { class: 'lb', text: '最近总分' }),
    h('div', { class: 'vl', text: fmt(row.total) }),
    h('div', { class: 'dt ' + (row.trend === 'up' ? 'up' : row.trend === 'down' ? 'down' : 'flat'),
      text: row.totalDelta == null ? '首次考试' : (row.totalDelta > 0 ? '↑ 较上场 +' + row.totalDelta : row.totalDelta < 0 ? '↓ 较上场 ' + row.totalDelta : '与上场持平') })));
  kpis.append(h('div', { class: 'kpi' }, h('div', { class: 'lb', text: '年级排名（总榜）' }), h('div', { class: 'vl', text: fmt(row.totalRank) }),
    h('div', { class: 'dt ' + (row.rankDelta > 0 ? 'up' : row.rankDelta < 0 ? 'down' : 'flat'),
      text: row.rankDelta == null ? (row.totalRank ? (row.hasOfficialRank ? '学校官方年排' : `名单内 ${computed[latestIdx].stats.validCount} 人有成绩`) : '—') : (row.rankDelta > 0 ? '↑ 升 ' + row.rankDelta + ' 名' : row.rankDelta < 0 ? '↓ 降 ' + Math.abs(row.rankDelta) + ' 名' : '名次不变') })));
  // 物理类 / 历史类排名
  if (row.track1 === 'physics') {
    kpis.append(h('div', { class: 'kpi' }, h('div', { class: 'lb', text: '物理类排名' }), h('div', { class: 'vl', text: fmt(row.physRank) }),
      h('div', { class: 'dt flat', text: '物理类单独排名' })));
  } else {
    kpis.append(h('div', { class: 'kpi' }, h('div', { class: 'lb', text: '历史类排名' }), h('div', { class: 'vl', text: fmt(row.histRank) }),
      h('div', { class: 'dt flat', text: '历史类单独排名' })));
  }
  kpis.append(h('div', { class: 'kpi' }, h('div', { class: 'lb', text: '班内排名' }), h('div', { class: 'vl', text: fmt(row.classRank) }),

  kpis.append(h('div', { class: 'kpi' }, h('div', { class: 'lb', text: '上线情况' }),
    h('div', { class: 'vl', style: 'font-size:18px;' + (row.lineBand === 1 ? 'color:var(--good-text)' : row.lineBand === 0 ? 'color:var(--critical)' : ''), text: row.lineStatus || '—' }),
    h('div', { class: 'dt flat', text: `距G1 ${fmtSigned(row.toLine1)} · 距G2 ${fmtSigned(row.toLine2)}` })));
  main.append(kpis);

  // 该生本场的科目列表（动态，雷达图与后续各卡共用）
  const myKeys = sortSubjectKeys(row.subjectKeys && row.subjectKeys.length
    ? row.subjectKeys
    : SUBJECT_DEFS.map(s => s.key).filter(k => row.subj[k] != null));

  // 学科能力雷达图
  main.append(radarCardFor(computed, row, hist, latestIdx, myKeys));

  // 总分趋势（含两条线）
  const stLast = computed[latestIdx].stats;
  main.append(lineChartCard({
    title: '总分趋势', sub: '满分 750，横线为 ' + lineName1(data.settings) + ' / ' + lineName2(data.settings),
    xLabels: examNames,
    series: [{ key: 'total', name: '总分', color: P().accent, values: hist.map(r => r ? r.total : null) }],
    refs: [
      { y: stLast.line1, label: 'G1 ' + stLast.line1, color: P().good },
      { y: stLast.line2, label: 'G2 ' + stLast.line2, color: P().warn },
    ],
    labelLast: true, height: 230,
  }));

  // 年级排名趋势（名次越小越好 → 反转轴）
  main.append(lineChartCard({
    title: '年级排名趋势', sub: '名次越靠上越好 · 优先使用学校官方年排',
    xLabels: examNames,
    series: [{ key: 'rank', name: '年级排名', color: P().accent, values: hist.map(r => r ? r.totalRank : null) }],
    invertY: true, labelLast: true, height: 210, yUnit: ' 名',

  // 分类排名趋势（物理类 / 历史类）
  const trackKey = row.track1 === 'history' ? 'histRank' : 'physRank';
  if (hist.some(r => r && r[trackKey] != null)) {
    main.append(lineChartCard({
      title: row.track1 === 'history' ? '历史类排名趋势' : '物理类排名趋势',
      sub: '同一类别内的排名（不含另一类）',
      xLabels: examNames,
      series: [{ key: trackKey, name: row.track1 === 'history' ? '历史类排名' : '物理类排名', color: P().series[3], values: hist.map(r => r ? r[trackKey] : null) }],
      invertY: true, labelLast: true, height: 210, yUnit: ' 名',
    }));
  }

  // 各科趋势（动态系列 + 图例开关）
  main.append(lineChartCard({
    title: '各科成绩趋势', sub: '选考科目为赋分；点击图例可隐藏科目',
    xLabels: examNames,
    series: myKeys.map(k => {
      const def = SUBJECT_MAP[k];
      return { key: k, name: def ? def.name : k, color: subjColor(k), values: hist.map(r => r ? r.subj[k] : null) };
    }),
    height: 260,
  }));

  // 各科评估
  const evals = [];
  const grid = h('div', { class: 'subj-grid' });
  for (const k of myKeys) {
    const s = SUBJECT_MAP[k];
    if (!s) continue;
    const cExam = computed[latestIdx];
    const listAvg = cExam.stats.subjAvg[k];
    const clsRows = row.cls ? cExam.rows.filter(r => r.cls === row.cls && r.subj[k] != null) : [];
    const classAvg = clsRows.length ? clsRows.reduce((a, r) => a + r.subj[k], 0) / clsRows.length : null;
    const ev = subjectEval(row, s, listAvg, classAvg, clsRows.length, hist, latestIdx);
    if (!ev) { grid.append(h('div', { class: 'subj-card' }, h('div', { class: 'hd' }, h('span', { class: 'dot', style: 'background:' + subjColor(k) }), h('span', { class: 'nm', text: s.name })), h('div', { class: 'hint', text: '本场缺考/未录入' }))); continue; }
    evals.push({ s, ev });
    const bdCls = ev.levelCls === 'good' ? 'good' : ev.levelCls === 'crit' ? 'crit' : 'warn';
    grid.append(h('div', { class: 'subj-card' },
      h('div', { class: 'hd' },
        h('span', { class: 'dot', style: 'background:' + subjColor(k) }),
        h('span', { class: 'nm', text: s.name }),
        h('span', { class: 'bd tag ' + bdCls, text: (ev.levelCls === 'good' ? '✓ ' : ev.levelCls === 'crit' ? '⚠ ' : '') + ev.level })),
      h('div', { class: 'sc' }, fmt(ev.score), h('small', { text: ' / ' + s.max + (isAssignedSubject(k) ? '（赋分）' : '') })),
      h('div', { class: 'meter' }, h('i', { style: 'width:' + Math.round(ev.rate * 100) + '%;background:' + subjColor(k) })),
      h('dl', {},
        h('dt', { text: '得分率' }), h('dd', { text: pct(ev.rate) }),
        h('dt', { text: '名单单科名次' }), h('dd', { text: fmt(ev.rank) }),
        h('dt', { text: '与名单均分比' }), h('dd', { style: ev.vsSchool != null && ev.vsSchool < 0 ? 'color:var(--critical)' : 'color:var(--good-text)', text: ev.vsSchool == null ? '—' : fmtSigned(Math.round(ev.vsSchool * 10) / 10) + ' 分' }),
        h('dt', { text: '与班均比' }), h('dd', { text: ev.vsClass == null ? '—' : fmtSigned(Math.round(ev.vsClass * 10) / 10) }),
        h('dt', { text: '近三次' }), h('dd', {}, ev.trendDelta == null ? h('span', { class: 'hint', text: '数据不连续' }) : sparkline(ev.spark, subjColor(k))))));
  }
  main.append(h('div', { class: 'card' }, h('h2', { text: '各科评估' }),
    h('p', { class: 'sub', text: '均分与单科名次仅覆盖本次导入名单；缺考/间隔场次不做走势判断。按得分率分档：≥85% 优秀 · ≥70% 良好 · ≥60% 中等 · 其余待提高' }), grid));

  // ---- 偏科 / 不匹配评估 ----
  const subjAvgs = computed[latestIdx].stats.subjAvg;
  const mm = mismatchEval(row, latestIdx, subjAvgs);
  if (mm) {
    const cfg = mismatchSettings();
    const totalRanked = mm.listTotal || mm.subjects.filter(x => x.ranked).length;
    const sub = `双口径判定：自身失衡决定档位——某科得分率比自身各科平均低 ≥${Math.round(cfg.selfGap * 100)}% 标「关注」，≥${Math.round(cfg.severeGap * 100)}% 标「预警」；名单口径（比该科均分低 ≥${Math.round(cfg.vsAvgGap * 100)}% 或排名落入后 ${Math.round(cfg.rankTail * 100)}%）作佐证并用于排序，不单独触发（名单不足 ${cfg.minRanked} 人不看排名）`;
    let headTag = null;
    if (mm.level === 'severe') headTag = h('span', { class: 'tag crit', text: '● 预警 · 严重不匹配，优先介入' });
    else if (mm.level === 'watch') headTag = h('span', { class: 'tag warn', text: '⚠ 关注 · 明显偏科，建议谈话' });
    else headTag = h('span', { class: 'tag good', text: '✓ 各科均衡' });
    // 各科得分率横向条形（按与自身平均/名单均分差距着色）
    const wrap = h('div', { style: 'display:flex;flex-direction:column;gap:6px;margin-top:10px' });
    for (const x of mm.subjects.slice().sort((a, b) => b.rate - a.rate)) {
      const bad = x.level === 'severe' ? 'var(--critical)' : x.level === 'watch' ? '#d98a00' : 'var(--good-text)';
      const barColor = x.level === 'ok' ? subjColor(x.key) : bad;
      const marks = [];
      // 只有该科已被标记时才列佐证，避免「均衡」的学生满屏红字造成误读
      if (x.level !== 'ok') {
        if (x.selfHit) marks.push(`自身 -${Math.round(x.selfGap * 100)}%`);
        if (x.avgHit) marks.push(x.vsAvgGap != null ? `均分 -${Math.round(x.vsAvgGap * 100)}%` : '低于均分');
        if (x.rankHit) marks.push(`名单后 ${Math.round(x.tail * 100)}%`);
      }
      wrap.append(h('div', { style: 'display:flex;align-items:center;gap:10px' },
        h('span', { style: 'width:36px;font-size:12px;color:var(--ink-2)', text: x.name }),
        h('div', { class: 'meter', style: 'flex:1;margin:0' },
          h('i', { style: 'width:' + Math.round(x.rate * 100) + '%;background:' + barColor })),
        h('span', { style: 'width:44px;text-align:right;font-variant-numeric:tabular-nums;font-size:12px', text: pct(x.rate) }),
        h('span', { style: 'width:64px;text-align:right;font-size:12px;color:var(--muted)', text: x.ranked ? `第 ${x.rank} / ${totalRanked}` : '无排名' }),
        marks.length ? h('span', { style: 'font-size:12px;color:' + bad, text: marks.join(' · ') }) : null));
    }
    let noteHtml = null;
    if (mm.level !== 'ok') {
      const tips = [];
      for (const x of mm.flagged) {
        const parts = [`得分率 ${pct(x.rate)}`];
        if (x.selfHit) parts.push(`比自身各科平均（${pct(mm.selfAvg)}）低 ${Math.round(x.selfGap * 100)}%`);
        if (x.avgHit && x.vsAvgGap != null) parts.push(`比该科名单均分（${pct(x.avgRate)}）低 ${Math.round(x.vsAvgGap * 100)}%`);
        if (x.rankHit) parts.push(`本次名单单科排名第 ${x.rank}（共 ${totalRanked} 人），落入后 ${Math.round(x.tail * 100)}%`);
        tips.push(h('li', {}, h('strong', { text: x.name + '：' }), parts.join('；') + '。'));
      }
      noteHtml = h('div', { style: 'margin-top:10px' },
        h('div', { style: 'font-size:13px;font-weight:650;margin-bottom:2px', text: mm.level === 'severe' ? '不匹配科目（优先介入）' : '不匹配科目（建议关注）' }),
        h('ul', { style: 'margin:4px 0 0;padding-left:20px;color:var(--ink-2);font-size:13px;line-height:1.8' }, tips));
    }
    main.append(h('div', { class: 'card' },
      h('h2', { text: '偏科 / 不匹配' }),
      h('p', { class: 'sub', text: sub }),
      h('div', { style: 'margin-bottom:6px' }, headTag),
      wrap, noteHtml));
  }

  // 复习建议
  const adviceItems = evals.map(({ s, ev }) => {
    const a = buildAdvice(s, {
      rate: ev.rate, trend: ev.trend, trendDelta: ev.trendDelta, vsSchool: ev.vsSchool,
      score: ev.score, schoolAvg: computed[latestIdx].stats.subjAvg[s.key], subjectName: s.name,
    });
    return { s, ev, a };
  }).sort((x, y) => y.a.priority - x.a.priority);
  const ul = h('ul', { class: 'advice' });
  for (const it of adviceItems) {
    ul.append(h('li', {},
      h('div', { class: 'ah' },
        h('span', { class: 'dot', style: 'background:' + subjColor(it.s.key) }),
        it.s.name,
        h('span', { class: 'pr', text: `优先级：${it.ev.rate < 0.65 ? '高' : it.ev.rate < 0.80 ? '中' : '巩固'} · 得分率 ${pct(it.ev.rate)}` })),
      h('p', { text: it.a.text })));
  }
  main.append(h('div', { class: 'card' }, h('h2', { text: '复习建议' }), h('p', { class: 'sub', text: '按提分空间自动排序，供谈话和作业布置参考' }), ul));

  // ---- 背景档案 + AI 深度分析 ----
  if (!data.profiles) data.profiles = {};
  const profKey = row.studentId ? 'id:' + row.studentId : ui.student;
  if (!data.profiles[profKey] && data.profiles[row.name]) data.profiles[profKey] = data.profiles[row.name];
  const prof = data.profiles[profKey] || (data.profiles[profKey] = { goal: '', notes: '' });
  main.append(h('div', { class: 'card' },
    h('h2', { text: '背景档案' }),
    h('p', { class: 'sub', text: '选填。写上目标和老师掌握的情况，AI 分析会结合这些信息，规则版建议不受影响。' }),
    h('div', { class: 'entry-cols' },
      h('label', { class: 'fld' }, '目标（如：上G1线 / 苏州大学 / 保G2线）',
        h('input', { type: 'text', value: prof.goal, placeholder: '选填', oninput: ev => { prof.goal = ev.target.value; saveData(); } })),
      h('label', { class: 'fld' }, '背景备注（课堂状态、偏科原因、家庭期望等）',
        h('textarea', { style: 'min-height:64px', placeholder: '选填', oninput: ev => { prof.notes = ev.target.value; saveData(); } }, prof.notes)))));

  const briefCtx = {
    name: row.name, cls: row.cls, comboName: row.comboName, trackName: row.trackName,
    subjectKeys: myKeys, examNames, rows: hist,
    line1: computed[latestIdx].stats.line1, line2: computed[latestIdx].stats.line2,
    profile: prof,
    subjEvals: adviceItems.map(it => ({
      name: it.s.name, score: it.ev.score, max: it.s.max, rate: it.ev.rate, rank: it.ev.rank,
      schoolAvg: computed[latestIdx].stats.subjAvg[it.s.key], vsSchool: it.ev.vsSchool, trendDelta: it.ev.trendDelta,
    })),
    ruleAdvice: adviceItems.map(it => ({ name: it.s.name, text: it.a.text })),
    mismatch: mm || null,
  };
  const briefMd = studentBriefMd(briefCtx);
  const aiMsg = h('div', { class: 'msg' });
  const aiText = h('div', {
    style: 'white-space:pre-wrap;margin-top:10px;font-size:13px;line-height:1.75;color:var(--ink-2);' +
      'max-height:520px;overflow:auto;border:1px solid var(--grid);border-radius:8px;padding:12px 14px;display:none',
  });
  if (aiOut.name === ui.student && aiOut.text) { aiText.style.display = 'block'; aiText.textContent = aiOut.text; }
  const genBtn = h('button', {
    class: 'btn primary', text: '生成 AI 深度分析',
    onclick: async () => {
      if (!aiCfg.key) { aiMsg.className = 'msg err'; aiMsg.textContent = '还没配置 API：请先到「设置」页选择服务商并填入 API Key。'; return; }
      if (aiOut.running) return;
      aiOut = { name: ui.student, text: '', running: true };
      genBtn.disabled = true; genBtn.textContent = '分析中…';
      aiMsg.className = 'msg'; aiMsg.textContent = '正在获取分析（流式输出，可能要几十秒）…';
      aiText.style.display = 'block'; aiText.textContent = '';
      try {
        const msgs = buildAnalysisPrompt(briefMd);
        await callAI(aiCfg, [{ role: 'system', content: msgs.system }, { role: 'user', content: msgs.user }], d => {
          aiOut.text += d;
          aiText.textContent = aiOut.text;
          aiText.scrollTop = aiText.scrollHeight;
        });
        aiMsg.className = 'msg ok';
        aiMsg.textContent = '完成。内容由 AI 生成，请老师把关后再用于谈话。';
      } catch (e) {
        aiMsg.className = 'msg err';
        aiMsg.textContent = '生成失败：' + e.message + '。若是跨域/网络问题，可换一家服务商，或点「复制简报」自己贴给任意 AI。';
      } finally {
        aiOut.running = false; genBtn.disabled = false; genBtn.textContent = '生成 AI 深度分析';
      }
    },
  });
  main.append(h('div', { class: 'card' },
    h('h2', { text: 'AI 深度分析' }),
    h('p', { class: 'sub', text: '把该生全部数据 + 背景档案发给你在「设置」里配置的 AI，流式生成逐生定制的分析。费用由你的 API 账户承担，单次约几分钱。' }),
    h('div', { class: 'row', style: 'gap:8px' },
      genBtn,
      h('button', {
        class: 'btn', text: '复制简报',
        onclick: async ev => { ev.target.textContent = (await copyText(briefMd)) ? '已复制 ✓' : '复制失败'; setTimeout(() => { ev.target.textContent = '复制简报'; }, 1500); },
      }),
      h('button', {
        class: 'btn', text: '复制分析结果',
        onclick: async ev => { ev.target.textContent = (await copyText(aiOut.text)) ? '已复制 ✓' : '先生成再复制'; setTimeout(() => { ev.target.textContent = '复制分析结果'; }, 1500); },
      })),
    aiMsg, aiText));

  // 历次明细表
  const tbl = h('table', { class: 'tb' });
  const histHead = ['考试', ...myKeys.map(k => {
    const def = SUBJECT_MAP[k];
    return (def ? def.name : k) + (isAssignedSubject(k) ? '(赋)' : '');
  }), '总分', '总榜', '物理类', '历史类', '班内', '组合内', '较上场', '上线'];
  tbl.append(h('thead', {}, h('tr', {}, histHead.map(t => h('th', { text: t })))));
  tbl.append(h('tbody', {}, hist.map((r, i) => {
    if (!r) return h('tr', {}, h('td', { text: examNames[i] }), h('td', { colspan: histHead.length - 1, style: 'text-align:center;color:var(--muted)', text: '本场无记录' }));
    return h('tr', {},
      h('td', { text: examNames[i] }),
      myKeys.map(k => h('td', { text: r.subj[k] == null ? '—' : fmt(r.subj[k]) })),
      h('td', { text: fmt(r.total) }), h('td', { text: fmt(r.totalRank) }),
      h('td', { text: fmt(r.physRank) }), h('td', { text: fmt(r.histRank) }),
      h('td', { text: fmt(r.classRank) }), h('td', { text: fmt(r.comboRank) }),
      h('td', { class: r.trend || '', text: r.totalDelta == null ? '—' : (r.totalDelta > 0 ? '↑ +' + r.totalDelta : r.totalDelta < 0 ? '↓ ' + r.totalDelta : '持平') }),
      h('td', { text: r.lineStatus || '—' }));
  })));
  main.append(h('div', { class: 'card' }, h('h2', { text: '历次明细' }), h('div', { class: 'tscroll' }, tbl)));
}

function renderImportPreview(exam) {
  const pv = entryPreview;
  if (!pv || pv.examIdx !== ui.examIdx) return null;
  const blocked = !!pv.errors.length;
  const wrap = h('div', { class: 'banner', id: 'importPreview', style: 'border-left-color:var(--accent);margin-top:14px' });

  wrap.append(h('div', { style: 'display:flex;align-items:center;gap:8px;flex-wrap:wrap' },
    h('strong', { text: '整理结果预览' }),
    h('span', { class: 'tag good', text: `识别 ${pv.students.length} 人` }),
    pv.meta && pv.meta.skipped ? h('span', { class: 'tag', text: `跳过 ${pv.meta.skipped} 行` }) : null,
    pv.meta && pv.meta.filledClass ? h('span', { class: 'tag', text: `补班级 ${pv.meta.filledClass} 行` }) : null,
    pv.meta && pv.meta.missingYearRank ? h('span', { class: 'tag crit', text: `缺年排 ${pv.meta.missingYearRank} 人` })
      : (pv.meta && pv.meta.yearRankColumn ? h('span', { class: 'tag good', text: '官方年排已就绪' }) : null),
    pv.errors.length ? h('span', { class: 'tag crit', text: `${pv.errors.length} 个必须修正` }) : h('span', { class: 'tag good', text: '校验通过' })));

  if (pv.notes.length) {
    wrap.append(h('ul', { style: 'margin:8px 0 0;padding-left:20px;color:var(--ink-2);font-size:12px;line-height:1.8' },
      pv.notes.map(t => h('li', { text: t }))));
  }

  // 无表头表：科目列是按位置推测的，让用户核对（改完点「按此对照重新整理」）
  if (pv.meta && pv.meta.mode === 'position' && pv.meta.guessedSubjects) {
    const cur = data.settings.combos || DEFAULT_COMBOS;
    const pool = SUBJECT_DEFS.map(s => s.key).filter(k => cur.some(c => comboSubjectKeys(c).includes(k)));
    const guessed = pv.meta.guessedSubjects;
    const assignCols = pv.meta.assignedIdx || [];
    const rowFor = (label, idx, isAssign) => {
      // 当前值：用户手动指定过的优先，否则用系统推测的
      const curVal = (isAssign ? (entryAssignedMap || {})[idx] : (entrySubjectMap || {})[idx])
        || (isAssign ? '' : (guessed[idx] || ''));
      const sel = h('select', {
        onchange: ev => {
          const target = isAssign ? (entryAssignedMap || (entryAssignedMap = {})) : (entrySubjectMap || (entrySubjectMap = {}));
          target[idx] = ev.target.value || '';
          if (!isAssign) entrySubjectMap = target;
          else entryAssignedMap = target;
        },
      },
        h('option', { value: '', text: isAssign ? '（不作为赋分列）' : '（忽略此列）' }),
        (isAssign ? pool.filter(k => isAssignedSubject(k)) : pool).map(k => h('option', {
          value: k, selected: curVal === k ? '' : null,
        }, (SUBJECT_MAP[k] ? SUBJECT_MAP[k].name : k) + (isAssignedSubject(k) ? '（赋分）' : ''))));
      return h('div', { style: 'display:flex;align-items:center;gap:8px;margin-bottom:6px' },
        h('span', { style: 'min-width:80px;font-size:12px;color:var(--ink-2)', text: label }),
        h('span', { style: 'min-width:52px;font-size:12px;color:var(--muted)', text: `第 ${idx + 1} 列` }),
        sel);
    };
    const box = h('div', { style: 'margin-top:10px;padding:12px 14px;border:1px solid var(--border);border-radius:10px;background:var(--surface-2)' },
      h('div', { style: 'font-size:13px;font-weight:650;margin-bottom:8px', text: '科目列对照（请核对）' }),
      h('p', { class: 'hint', style: 'margin:0 0 10px', text: '没有表头时系统只能按位置推测科目，认错了请在这里改，然后点「按此对照重新整理」。' }),
      h('div', { style: 'display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:0 24px' },
        h('div', {}, guessed.map((k, i) => rowFor('第 ' + (i + 1) + ' 个科目列', i, false))),
        assignCols.length ? h('div', {}, assignCols.map((idx, i) => rowFor('赋分列 ' + (i + 1), i, true))) : null),
      h('div', { style: 'margin-top:10px' },
        h('button', {
          class: 'btn primary', id: 'reparseBtn', text: '按此对照重新整理',
          onclick: () => {
            const opts = {
              requireYearRank: true,
              combos: data.settings.combos || DEFAULT_COMBOS,
              classes: data.settings.classes || DEFAULT_CLASSES,
            };
            if (entrySubjectMap) opts.subjectMap = entrySubjectMap;
            if (entryAssignedMap) opts.assignedMap = entryAssignedMap;
            const res = parseImport(entryText, opts);
            entryPreview = Object.assign({ examIdx: ui.examIdx }, res);
            render();
          },
        })));
    wrap.append(box);
  }

  if (pv.errors.length) {
    wrap.append(h('div', { class: 'banner crit', style: 'margin-top:10px' },
      h('div', { style: 'font-weight:600', text: `必须修正（显示前 ${Math.min(10, pv.errors.length)} 条；导入已暂停）：` }),
      h('ul', {}, pv.errors.slice(0, 10).map(t => h('li', { text: t }))),
      pv.errors.length > 10 ? h('div', { class: 'hint', text: `还有 ${pv.errors.length - 10} 条，请修正源表后重新粘贴。` }) : null));
  }

  // 预览表：动态科目
  const combosNow = data.settings.combos || DEFAULT_COMBOS;
  const previewFields = scoreFieldsForCombos(combosNow);
  const cols = [
    ['学号', 'studentId'], ['姓名', 'name'], ['班级', 'cls'], ['组合', 'comboId'], ['年排', 'yearRank'],
    ...previewFields.map(f => [f.label, f.key]),
  ];
  const tbl = h('table', { class: 'tb' });
  tbl.append(h('thead', {}, h('tr', {}, cols.map(c => h('th', { text: c[0] })))));
  tbl.append(h('tbody', {}, pv.students.slice(0, 200).map(s => h('tr', {},
    cols.map(([, key]) => h('td', {
      text: key === 'comboId'
        ? (combosNow.find(c => c.id === s.comboId) ? comboLabel(combosNow.find(c => c.id === s.comboId)) : '—')
        : (s[key] == null || s[key] === '' ? '—' : s[key]),
    }))))));
  wrap.append(h('div', { class: 'tscroll', style: 'margin-top:10px;max-height:320px' }, tbl));
  if (pv.students.length > 200) wrap.append(h('p', { class: 'hint', text: `预览仅显示前 200 人，实际会导入全部 ${pv.students.length} 人。` }));

  wrap.append(h('div', { class: 'row', style: 'margin-top:12px;gap:8px;align-items:center' },
    h('button', {
      class: 'btn primary',
      text: blocked ? '修正错误后才能导入' : (pv.students.length ? `确认导入 ${pv.students.length} 人` : '没有可导入的学生'),
      disabled: pv.students.length && !blocked ? null : '',
      onclick: () => {
        if (!pv.students.length || blocked) return;
        if (exam.students.length && !confirm(`确认导入 ${pv.students.length} 人，覆盖原有 ${exam.students.length} 人？`)) return;
        exam.students = pv.students.map(s => {
          const out = {
            studentId: s.studentId || '', name: s.name, cls: s.cls || '',
            comboId: s.comboId || '', yearRank: s.yearRank,
          };
          for (const f of previewFields) out[f.key] = s[f.key];
          return out;
        });
        data.isSample = false;
        entryNotice = `已导入 ${pv.students.length} 名学生到「${exam.name}」（年级排名采用学校官方年排）。`;
        entryPreview = null;
        entryText = '';
        saveData('导入成绩前');
        render();
      },
    }),
    h('button', { class: 'btn', text: '取消', onclick: () => { entryPreview = null; render(); } }),
    blocked
      ? h('span', { class: 'hint', style: 'color:var(--critical)', text: '错误已拦截：修正源表后重新粘贴并预览。' })
      : h('span', { class: 'hint', text: '跨场追踪优先按学号；无学号时按「班级 + 姓名」对齐。' })));
  return wrap;
}

function lineTag(r) {
  if (!r.lineStatus) return null;
  const cls = r.lineBand === 1 ? 'good' : r.lineBand === 0 ? 'crit' : '';
  return h('span', { class: 'tag ' + cls, text: (r.lineBand === 1 ? '✓ ' : r.lineBand === 0 ? '⚠ ' : '') + r.lineStatus });
}

/* ---------- 录入 ---------- */
function renderEntry() {
  if (entryPreview && entryPreview.examIdx !== ui.examIdx) { entryPreview = null; entryText = ''; entrySubjectMap = null; entryAssignedMap = null; }
  if (data.isSample) {
    main.append(h('div', { class: 'banner' },
      h('div', { text: '当前显示的是示例数据（44 名虚拟学生 × 3 次考试），用来演示功能。' }),
      h('div', { class: 'row', style: 'margin-top:8px' },
        h('button', {
          class: 'btn primary', text: '清空示例，开始录入',
          onclick: () => { if (confirm('清空全部示例数据，创建一场空考试？')) { data = { settings: data.settings, exams: [{ name: '考试1', line1: data.settings.line1, line2: data.settings.line2, students: [] }], isSample: false, profiles: {} }; saveData(); ui.examIdx = 0; render(); } },
        }),
        h('span', { class: 'hint', style: 'align-self:center', text: '或先在下面试试导入自己的表格' }))));
  }

  // 考试管理
  main.append(h('div', { class: 'card' },
    h('h2', { text: '考试场次' }),
    h('p', { class: 'sub', text: '点击切换要编辑的场次；名称可直接改，其他视图会跟着变。' }),
    h('div', { class: 'row', style: 'gap:8px;align-items:center' },
      data.exams.map((ex, i) => h('button', {
        class: 'chip' + (i === ui.examIdx ? ' on' : ''), text: ex.name,
        onclick: () => { ui.examIdx = i; entryText = ''; entryPreview = null; entryNotice = ''; render(); },
      })),
      h('button', {
        class: 'btn', text: '＋ 新建考试',
        onclick: () => { data.exams.push({ name: '考试' + (data.exams.length + 1), line1: data.settings.line1, line2: data.settings.line2, students: [] }); data.isSample = false; ui.examIdx = data.exams.length - 1; entryText = ''; entryPreview = null; entryNotice = ''; saveData(); render(); },
      }))));

  const exam = data.exams[ui.examIdx];
  if (!exam) return;

  // 基本信息
  main.append(h('div', { class: 'card' },
    h('h2', { text: '本场设置' }),
    h('div', { class: 'entry-cols', style: 'margin-top:10px' },
      h('label', { class: 'fld' }, '考试名称',

/* ================================================================
   班级 PK（阵列 / 榜单 / 擂台）
   ================================================================ */
function prefersReducedMotion() {
  return typeof matchMedia === 'function' && matchMedia('(prefers-reduced-motion: reduce)').matches;
}
/* 形象：预设 SVG / 哈绩咪像素猫（页头内嵌图）/ 自定义上传 */
function mascotHtml(prof, px) {
  const m = String((prof && prof.mascot) || '');
  const S = px || 64;
  const st = `width:${S}px;height:${S}px`;
  if (m.indexOf('upload:') === 0) return `<img class="msvg" style="${st}" src="${m.slice(7)}" alt="">`;
  if (m === 'm-01') {
    const img = document.querySelector('.brand-mark img');
    const src = img && img.getAttribute('src');
    if (src && src.indexOf('data:') === 0) return `<img class="msvg" style="${st}" src="${src}" alt="">`;
    return mascotSvg('cat', prof && prof.color, S);
  }
  const src = MASCOT_SRC[m];
  if (src) return `<img class="msvg" style="${st}" src="${src}" alt="">`;
  const pre = MASCOT_PRESETS.find(x => x.id === m) || MASCOT_PRESETS[1];
  return mascotSvg(pre.kind, prof && prof.color, S);
}
/* 数字滚轮（reduced-motion 直接定格；RAF 不推进的环境用定时器兜底） */
function rollNumber(el, to, dur, digits) {
  const target = Number(to);
  if (!isFinite(target) || prefersReducedMotion()) { el.textContent = fmt(target, digits); return; }
  const t0 = performance.now(), D = dur || 950;
  setTimeout(() => { if (el.isConnected) el.textContent = fmt(target, digits); }, D + 250);
  (function step(t) {
    const p = Math.min(1, (t - t0) / D), e = 1 - Math.pow(1 - p, 3);
    el.textContent = fmt(target * e, digits);
    if (p < 1) requestAnimationFrame(step);
  })(performance.now());
}
/* 彩带 */
function burstConfetti(container) {
  if (prefersReducedMotion()) return;
  const colors = TEAM_COLORS.concat(['#e2c180', '#f0e0b8']);
  for (let i = 0; i < 26; i++) {
    const d = document.createElement('i');
    d.className = 'confetti';
    d.style.left = (Math.random() * 100) + '%';
    d.style.background = colors[i % colors.length];
    d.style.animationDuration = (1.2 + Math.random() * 1.3) + 's';
    d.style.animationDelay = (Math.random() * 0.6) + 's';
    container.appendChild(d);
    setTimeout(() => { if (d.parentNode) d.parentNode.removeChild(d); }, 3600);
  }
}
/* 班级档案映射（设置里的 + 成绩里出现但没配置的兜底） */
function pkProfileMap() {
  const map = new Map();
  const classes = (data.settings && data.settings.classes) || [];
  classes.forEach((c, i) => map.set(c.name, {
    name: c.name,
    slogan: typeof c.slogan === 'string' ? c.slogan : '',
    color: c.color || TEAM_COLORS[i % TEAM_COLORS.length],
    mascot: c.mascot || MASCOT_PRESETS[i % MASCOT_PRESETS.length].id,
  }));
  return map;
}
function pkProf(map, name) {
  return map.get(name) || { name, slogan: '', color: TEAM_COLORS[0], mascot: MASCOT_PRESETS[0].id };
}
/* 自定义形象：上传图片 → 居中裁方 → 压缩到 256px 存进班级档案 */
function uploadMascot(cl) {
  const inp = h('input', { type: 'file', accept: 'image/*' });
  inp.addEventListener('change', () => {
    const f = inp.files && inp.files[0];
    if (!f) return;
    const rd = new FileReader();
    rd.onload = () => {
      const img = new Image();
      img.onload = () => {
        const size = 256, s = Math.min(img.width, img.height);
        const cv = document.createElement('canvas');
        cv.width = cv.height = size;
        cv.getContext('2d').drawImage(img, (img.width - s) / 2, (img.height - s) / 2, s, s, 0, 0, size, size);
        let url = '';
        try { url = cv.toDataURL('image/webp', 0.85); } catch (e) { /* ignore */ }
        if (!url || url.indexOf('data:image/webp') !== 0) url = cv.toDataURL('image/png');
        cl.mascot = 'upload:' + url;
        saveData(); render();
      };
      img.onerror = () => alert('这张图读不出来，换一张试试。');
      img.src = rd.result;
    };
    rd.onerror = () => alert('读取文件失败。');
    rd.readAsDataURL(f);
  });
  inp.click();
}

  main.append(h('div', { class: 'pk-views' },

      h('div', { class: 'pk-meter' }, h('i', { style: `width:${Math.max(3, Math.round((x.avgTotal || 0) / maxAvg * 100))}%` })),
      h('div', { class: 'pk-card-stats' },
        h('span', {}, '均分 ', h('b', { text: fmt(x.avgTotal) })),

        h('span', {}, h('b', { text: String(x.count) }), ' 人')),
      x.strongSubj ? h('div', { class: 'pk-badge-row' },
        h('span', { class: 'tag good', text: '最强科目 · ' + SUBJECT_MAP[x.strongSubj].name }),

      h('button', {

          const rival = sorted[idx + 1] || sorted[idx - 1];

    grid));
}

/* ---------- 榜单：颁奖台 + 全班排名 ---------- */
function renderPkRank(league, pmap, computed, ei) {
  const metrics = [['avg', '总均分'], ['line1', 'G1 率'], ['delta', '进步幅度'], ['stability', '稳定性']];
  const mLabel = (metrics.find(m => m[0] === ui.pk.metric) || metrics[0])[1];
  const sorted = pkSort(league, ui.pk.metric);
  const metricVal = x => ({ avg: x.avgTotal, line1: x.line1Rate, delta: x.avgDelta, stability: x.sd }[ui.pk.metric]);
  const valText = x => {
    const v = metricVal(x);
    if (v == null) return '—';
    if (ui.pk.metric === 'line1') return pct(v);
    if (ui.pk.metric === 'stability') return '±' + fmt(v, 1);
    return ui.pk.metric === 'delta' ? fmtSigned(v) : fmt(v);
  };
  // 上一场同口径名次（算升降箭头）
  let prevRank = null;
  if (ei > 0) {
    const prevPrev = ei > 1 ? computed[ei - 2] : null;
    const pl = pkSort(classAggList(computed[ei - 1], prevPrev), ui.pk.metric);
    prevRank = new Map(pl.map((x, i) => [x.cls, i + 1]));
  }
  const maxV = Math.max(...sorted.map(x => Math.abs(metricVal(x) || 0)), 1);

  main.append(h('div', { class: 'pk-views', style: 'margin-top:10px' },
    h('span', { class: 'hint', style: 'margin-right:2px', text: '指标' }),
    metrics.map(([k, label]) => h('button', {
      class: 'chip' + (ui.pk.metric === k ? ' on' : ''), text: label,
      onclick: () => { ui.pk.metric = k; render(); },
    }))));

  const top = sorted.slice(0, 3);
  const order = top.length >= 3 ? [top[1], top[0], top[2]] : top;
  const podium = h('div', { class: 'podium' }, order.map(x => {
    const p = pkProf(pmap, x.cls);
    const pl = sorted.indexOf(x) + 1;
    return h('div', { class: 'pod-step p' + pl, style: `--tc:${p.color}` },
      h('div', { class: 'pod-head' },
        h('div', { class: 'pk-mascot', html: mascotHtml(p, 52) }),
        h('div', { class: 'pk-name', text: x.cls }),
        h('div', { class: 'hint', text: valText(x) })),
      h('div', { class: 'pod-base', text: String(pl) }));
  }));
  main.append(h('div', { class: 'card' },
    h('h2', { text: '颁奖台' }),
    h('p', { class: 'sub', text: '按「' + mLabel + '」排定座次。' + (ui.pk.metric === 'stability' ? '波动越小越稳。' : '') }),
    top.length ? podium : h('div', { class: 'empty', text: '暂无数据' })));

  const rows = sorted.map((x, i) => {
    const p = pkProf(pmap, x.cls);
    const pr = prevRank ? prevRank.get(x.cls) : null;
    const chg = pr != null ? pr - (i + 1) : null;
    return h('div', { class: 'rank-row', style: `--tc:${p.color};--i:${i}` },
      h('div', { class: 'rank-no', text: String(i + 1) }),
      h('div', { class: 'pk-mascot', html: mascotHtml(p, 30) }),
      h('div', { class: 'rank-who' },
        h('div', { class: 'n', text: x.cls }),
        h('div', { class: 's', text: p.slogan || '—' })),
      h('div', { class: 'rank-meter' }, h('i', { style: `width:${Math.max(3, Math.round(Math.abs(metricVal(x) || 0) / maxV * 100))}%` })),
      h('div', { class: 'rank-val', text: valText(x) }),
      h('div', { class: 'rank-chg' + (chg > 0 ? ' up' : chg < 0 ? ' down' : ''), text: chg == null ? '' : (chg > 0 ? '↑' + chg : chg < 0 ? '↓' + (-chg) : '—') }));
  });
  main.append(h('div', { class: 'card' },
    h('h2', { text: '全班榜单' }),
    h('p', { class: 'sub', text: '箭头为较上一场的名次变化。稳定性按总分波动（标准差）排序，越小越稳。' }),
    h('div', {}, rows)));
}

/* ---------- 擂台：两班对战动画 ---------- */
function renderPkBattle(league, pmap) {
  const names = league.map(x => x.cls);
  if (names.length < 2) {
    main.append(h('div', { class: 'card' }, h('div', { class: 'empty', text: '至少要有两个班才能开打，先去「设置」加一个班。' })));
    return;
  }
  if (!ui.pk.a || names.indexOf(ui.pk.a) < 0) ui.pk.a = names[0];
  if (!ui.pk.b || names.indexOf(ui.pk.b) < 0 || ui.pk.b === ui.pk.a) ui.pk.b = names.find(n => n !== ui.pk.a) || names[0];
  const A = league.find(x => x.cls === ui.pk.a), B = league.find(x => x.cls === ui.pk.b);
  const pa = pkProf(pmap, A.cls), pb = pkProf(pmap, B.cls);

  const selA = h('select', {
    onchange: ev => {
      ui.pk.a = ev.target.value;
      if (ui.pk.b === ui.pk.a) ui.pk.b = names.find(n => n !== ui.pk.a) || '';
      render();
    },
  }, names.map(n => h('option', { value: n, selected: n === A.cls ? '' : null }, n)));
  const selB = h('select', {
    onchange: ev => {
      ui.pk.b = ev.target.value;
      if (ui.pk.a === ui.pk.b) ui.pk.a = names.find(n => n !== ui.pk.b) || '';
      render();
    },
  }, names.map(n => h('option', { value: n, selected: n === B.cls ? '' : null }, n)));

  const aWin = A.avgTotal != null && B.avgTotal != null && A.avgTotal > B.avgTotal;
  const bWin = A.avgTotal != null && B.avgTotal != null && B.avgTotal > A.avgTotal;
  const tie = A.avgTotal != null && B.avgTotal != null && !aWin && !bWin;

  const sideCard = (p, x, win, cls) => h('div', { class: 'vs-side ' + cls + (win ? ' win' : ''), style: `--tc:${p.color}` },
    h('div', { class: 'vs-head' },
      h('div', { class: 'pk-mascot', html: mascotHtml(p, 96) }),
      h('div', { class: 'vs-name', text: x.cls }),
      h('div', { class: 'slogan-bar', text: p.slogan || '口号未定' }),
      h('div', { class: 'hint', text: '人数 ' + x.count + ' · G1 率 ' + pct(x.line1Rate) }),
      h('div', { class: 'hint', text: '较上场 ' + (x.avgDelta == null ? '—' : fmtSigned(x.avgDelta)) }),
      !win && !tie ? h('span', { class: 'tag warn', style: 'margin-top:4px', text: '潜力股 · 下次反超' }) : null));

  // 回合制：只比较两班共同开设的科目
  const order = SUBJECT_ORDER.filter(k => A.subj[k] != null && B.subj[k] != null);
  const rounds = order.map((k, idx) => {
    const ra = A.subjRate[k] || 0, rb = B.subjRate[k] || 0;
    const sum = ra + rb || 1;
    const wa = Math.round(ra / sum * 100);
    return h('div', { class: 'round' },
      h('div', { class: 'round-lane l' + (ra > rb ? ' win' : ''), style: `--tc:${pa.color}` },
        h('i', { class: 'round-fill', style: `width:${wa}%;animation-delay:${(0.5 + idx * 0.18).toFixed(2)}s` })),
      h('div', { class: 'round-name' },
        h('div', { text: SUBJECT_MAP[k].name }),
        h('div', { class: 'hint', style: 'font-size:11px', text: fmt(A.subj[k]) + ' / ' + fmt(B.subj[k]) })),
      h('div', { class: 'round-lane r' + (rb > ra ? ' win' : ''), style: `--tc:${pb.color}` },
        h('i', { class: 'round-fill', style: `width:${100 - wa}%;animation-delay:${(0.5 + idx * 0.18).toFixed(2)}s` })));
  });

  const rollers = [];
  const scoreCell = (p, v) => {
    const b = h('b', { text: v == null ? '—' : fmt(v) });
    if (v != null) rollers.push({ el: b, to: v });
    return h('div', { class: 'vs-score', style: `color:${p.color}` }, b);
  };
  const totalRow = h('div', { class: 'vs-total' },
    scoreCell(pa, A.avgTotal),
    h('div', { class: 'vs-verdict' },
      tie ? h('div', { class: 'win-tag', text: '势均力敌' })
        : (aWin || bWin) ? h('div', { class: 'win-tag', text: (aWin ? A.cls : B.cls) + ' 胜出' })
          : h('div', { class: 'hint', text: '暂无有效总分' }),
      h('div', { class: 'hint', style: 'font-size:11px', text: '总均分对垒' })),
    scoreCell(pb, B.avgTotal));

  const stage = h('div', { class: 'vs-stage' },
    sideCard(pa, A, aWin, 'a'),
    h('div', { class: 'vs-mid' }, h('div', { class: 'vs-mark', text: 'VS' })),
    sideCard(pb, B, bWin, 'b'));

  main.append(h('div', { class: 'card' },
    h('h2', { text: '擂台对战' }),
    h('p', { class: 'sub', text: '逐科回合只比较两班共同开设的科目，比条按得分率对垒；总分为本场有效总分均值。' }),
    h('div', { class: 'row', style: 'gap:8px;align-items:center' }, selA, h('span', { class: 'hint', text: 'VS' }), selB),
    stage,
    h('div', {}, rounds),
    totalRow));

  for (const r of rollers) rollNumber(r.el, r.to, 1000, 1);
  if (aWin || bWin) setTimeout(() => { if (stage.isConnected) burstConfetti(stage); }, 1300);
}

  if (!cards.length) return emptyPanel('设置内容暂时无法显示');
