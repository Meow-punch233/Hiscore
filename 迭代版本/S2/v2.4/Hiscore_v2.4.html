      dv.setUint16(26, name.length, true); dv.setUint16(28, 0, true);
      lh.set(name, 30);
      locals.push(lh, dat);
      const ch = new Uint8Array(46 + name.length), cv = new DataView(ch.buffer);
      cv.setUint32(0, 0x02014b50, true); cv.setUint16(4, 20, true); cv.setUint16(6, 20, true);
      cv.setUint16(8, 0x0800, true); cv.setUint16(10, 0, true); cv.setUint16(12, 0, true);
      cv.setUint16(14, 0, true); cv.setUint32(16, crc, true);
      cv.setUint32(20, dat.length, true); cv.setUint32(24, dat.length, true);
      cv.setUint16(28, name.length, true); cv.setUint16(30, 0, true); cv.setUint16(32, 0, true);
      cv.setUint16(34, 0, true); cv.setUint16(36, 0, true); cv.setUint32(38, 0, true);
      cv.setUint32(42, offset, true);
      ch.set(name, 46);
      centrals.push(ch);
      offset += lh.length + dat.length;
    }
    const cSize = centrals.reduce((a, b) => a + b.length, 0);
    const end = new Uint8Array(22), ev = new DataView(end.buffer);
    ev.setUint32(0, 0x06054b50, true); ev.setUint16(4, 0, true); ev.setUint16(6, 0, true);
    ev.setUint16(8, files.length, true); ev.setUint16(10, files.length, true);
    ev.setUint32(12, cSize, true); ev.setUint32(16, offset, true); ev.setUint16(20, 0, true);
    return new Blob([...locals, ...centrals, end],
      { type: 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet' });
  },
  xe(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&apos;' }[c])); },
  colName(n) { let s = ''; n++; while (n > 0) { const m = (n - 1) % 26; s = String.fromCharCode(65 + m) + s; n = Math.floor((n - 1) / 26); } return s; },
  sheetXml(rows) {
    let x = '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>' +
      '<worksheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main"><sheetData>';
    rows.forEach((row, ri) => {
      x += '<row r="' + (ri + 1) + '">';
      row.forEach((v, ci) => {
        const ref = this.colName(ci) + (ri + 1);
        if (typeof v === 'number' && isFinite(v)) x += '<c r="' + ref + '"><v>' + v + '</v></c>';
        else x += '<c r="' + ref + '" t="inlineStr"><is><t xml:space="preserve">' + this.xe(v) + '</t></is></c>';
      });
      x += '</row>';
    });
    return x + '</sheetData></worksheet>';
  },
  safeSheet(s) { return String(s || '表').replace(/[\\\/\?\*\[\]:]/g, '-').slice(0, 30) || '表'; },

  /* ---------- 导出 ---------- */
  buildXlsx() {
    const sheets = [];
    const all = computeAll(data);
    data.exams.forEach((ex, i) => {
      const c = all[i];
      const keys = [];
      const seen = new Set();
      for (const r of (c.rows || [])) for (const k of (r.subjectKeys || [])) if (!seen.has(k)) { seen.add(k); keys.push(k); }
      keys.sort((a, b) => SUBJECT_ORDER.indexOf(a) - SUBJECT_ORDER.indexOf(b));
      const head = ['学号', '姓名', '班级', '选科组合', '年级排名(官方)'];
      const cols = [];
      for (const k of keys) {
        const def = SUBJECT_MAP[k] || { name: k, assigned: false };
        if (def.assigned) {
          head.push(def.name + '(原始分)', def.name + '(赋分)');
          cols.push({ k: k, from: 'raw' }, { k: k, from: 'subj' });
        } else {
          head.push(def.name);
          cols.push({ k: k, from: 'subj' });
        }
      }
      const rows = [head.concat(['总分', '总榜', '物理类', '历史类', '班内', '组合内', '较上场', '上线情况'])];
      for (const r of (c.rows || [])) rows.push([
        r.studentId || '', r.name || '', r.cls || '', r.comboName || '',
        r.yearRank == null ? '' : r.yearRank,
        ...cols.map(col => {
          const v = col.from === 'raw' ? (r.raw ? r.raw[col.k] : null) : r.subj[col.k];
          return v == null ? '' : v;
        }),
        r.total == null ? '' : r.total, r.totalRank == null ? '' : r.totalRank,
        r.physRank == null ? '' : r.physRank, r.histRank == null ? '' : r.histRank,
        r.classRank == null ? '' : r.classRank, r.comboRank == null ? '' : r.comboRank,
        r.totalDelta == null ? '' : r.totalDelta, r.lineStatus || '',
      ]);
      sheets.push({ name: this.safeSheet(ex.name || ('考试' + (i + 1))), rows });
    });
    const st = [['项目', '值'], ['版本', 'Hiscore v2.4'], ['格式版本', 'V4.2'], ['导出时间', new Date().toLocaleString('zh-CN')],
      ['默认G1线', data.settings.line1], ['默认G2线', data.settings.line2], ['', ''],
      ['G1线名', data.settings.line1Name], ['G2线名', data.settings.line2Name], ['', ''],
      ['考试名称', '考试日期', 'G1线', 'G2线', '人数']];
    data.exams.forEach(ex => st.push([ex.name || '', ex.date || '', ex.line1 == null ? '' : ex.line1,
      ex.line2 == null ? '' : ex.line2, (ex.students || []).length]));
    st.push([''], ['选科组合', '首选', '再选']);
    (data.settings.combos || []).forEach(c => st.push([comboLabel(c),
      SUBJECT_MAP[c.track1] ? SUBJECT_MAP[c.track1].name : c.track1,
      (c.track2 || []).map(k => SUBJECT_MAP[k] ? SUBJECT_MAP[k].name : k).join('+')]));
    st.push([''], ['等级赋分档位', '比例%', '最低分', '最高分']);
    (data.settings.bands || []).forEach(b => st.push([b.name, b.pct, b.min, b.max]));
    st.push([''], ['偏科阈值参数', '值']);
    const mm = data.settings.mismatch || {};
    for (const mk in mm) st.push([mk, typeof mm[mk] === 'object' ? JSON.stringify(mm[mk]) : mm[mk]]);
    sheets.push({ name: '设置与说明', rows: st });

    const clsRows = [['班级ID', '班级名称', '选科组合']];
    (data.settings.classes || []).forEach(c => clsRows.push([
      c.id || '', c.name || '',
      (c.comboIds || []).map(id => {
        const cb = (data.settings.combos || []).find(x => x.id === id);
        return cb ? comboLabel(cb) : id;
      }).join('、')
    ]));
    sheets.push({ name: '班级配置', rows: clsRows });

    const profRows = [['档案键', '目标', '目标总分', '背景备注']];
    for (const pk in (data.profiles || {})) {
      const pf = data.profiles[pk] || {};
      profRows.push([pk, pf.goal || '', pf.goalScore == null ? '' : pf.goalScore, pf.notes || '']);
    }
    sheets.push({ name: '学生档案', rows: profRows });

    sheets.push({ name: '完整设置(JSON)', rows: [
      ['说明', '程序「导入 Excel」用此表精确还原设置与学生档案，请勿修改'],
      ['内容', JSON.stringify({ settings: data.settings, profiles: data.profiles || {} })]
    ] });

    const files = [];
    files.push({ name: '[Content_Types].xml', data: '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>' +
      '<Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types">' +
      '<Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/>' +
      '<Default Extension="xml" ContentType="application/xml"/>' +
      '<Override PartName="/xl/workbook.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.sheet.main+xml"/>' +
      sheets.map((sh, i) => '<Override PartName="/xl/worksheets/sheet' + (i + 1) + '.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.worksheet+xml"/>').join('') +
      '</Types>' });
    files.push({ name: '_rels/.rels', data: '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>' +
      '<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships">' +
      '<Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/officeDocument" Target="xl/workbook.xml"/>' +
      '</Relationships>' });
    files.push({ name: 'xl/workbook.xml', data: '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>' +
      '<workbook xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main" xmlns:r="http://schemas.openxmlformats.org/officeDocument/2006/relationships"><sheets>' +
      sheets.map((sh, i) => '<sheet name="' + this.xe(sh.name) + '" sheetId="' + (i + 1) + '" r:id="rId' + (i + 1) + '"/>').join('') +
      '</sheets></workbook>' });
    files.push({ name: 'xl/_rels/workbook.xml.rels', data: '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>' +
      '<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships">' +
      sheets.map((sh, i) => '<Relationship Id="rId' + (i + 1) + '" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/worksheet" Target="worksheets/sheet' + (i + 1) + '.xml"/>').join('') +
      '</Relationships>' });
    sheets.forEach((sh, i) => files.push({ name: 'xl/worksheets/sheet' + (i + 1) + '.xml', data: this.sheetXml(sh.rows) }));
    return this.zip(files);
  },
  exportXlsx() {
    try {
      const blob = this.buildXlsx();
      const a = document.createElement('a');
      const d = new Date(), p = n => String(n).padStart(2, '0');
      const stu = data.exams.reduce((n, x) => n + ((x.students || []).length), 0);
      a.href = URL.createObjectURL(blob);
      a.download = `成绩数据备份-${d.getFullYear()}${p(d.getMonth() + 1)}${p(d.getDate())}-${p(d.getHours())}${p(d.getMinutes())}-${data.exams.length}场-${stu}人.xlsx`;
      document.body.append(a); a.click(); a.remove();
      setTimeout(() => URL.revokeObjectURL(a.href), 2000);
      myAlert('Excel 数据备份已生成（含原始分、赋分、计算结果、设置与学生档案），可直接再导入。');
    } catch (e) { myAlert('导出 Excel 失败：' + e.message); }
  },

  /* ---------- 读：ZIP → 工作表 ---------- */
  async unzipXlsx(buf) {
    const dv = new DataView(buf), u8 = new Uint8Array(buf), dec = new TextDecoder();
    let eocd = -1;
    for (let i = buf.byteLength - 22; i >= Math.max(0, buf.byteLength - 65558); i--) {
      if (dv.getUint32(i, true) === 0x06054b50) { eocd = i; break; }
    }
    if (eocd < 0) throw new Error('不是有效的 .xlsx 文件');
    const count = dv.getUint16(eocd + 10, true);
    let off = dv.getUint32(eocd + 16, true);
    const out = {};
    for (let n = 0; n < count; n++) {
      if (off + 46 > buf.byteLength || dv.getUint32(off, true) !== 0x02014b50) break;
      const method = dv.getUint16(off + 10, true);
      const csize = dv.getUint32(off + 20, true);
      const nlen = dv.getUint16(off + 28, true);
      const elen = dv.getUint16(off + 30, true);
      const clen = dv.getUint16(off + 32, true);
      const name = dec.decode(u8.subarray(off + 46, off + 46 + nlen));
      const lho = dv.getUint32(off + 42, true);
      const lnlen = dv.getUint16(lho + 26, true), lelen = dv.getUint16(lho + 28, true);
      const start = lho + 30 + lnlen + lelen;
      let bytes = u8.subarray(start, start + csize);
      if (method === 8) {
        if (typeof DecompressionStream === 'undefined') throw new Error('该 Excel 经过压缩，请用 Excel/WPS 另存为 .xlsx 后再试');
        const ds = new DecompressionStream('deflate-raw');
        bytes = new Uint8Array(await new Response(new Blob([bytes]).stream().pipeThrough(ds)).arrayBuffer());
      } else if (method !== 0) throw new Error('不支持的 Excel 压缩方式：' + method);
      out[name] = bytes;
      off += 46 + nlen + elen + clen;
    }
    return out;
  },
  async readXlsxSheets(file) {
    const files = await this.unzipXlsx(await file.arrayBuffer());
    const dec = new TextDecoder();
    const xml = n => files[n] ? dec.decode(files[n]) : '';
    const PX = s => new DOMParser().parseFromString(s, 'application/xml');
    const shared = [];
    if (files['xl/sharedStrings.xml']) {
      const sis = PX(xml('xl/sharedStrings.xml')).getElementsByTagName('si');
      for (let i = 0; i < sis.length; i++) {
        const ts = sis[i].getElementsByTagName('t');
        let s = ''; for (let j = 0; j < ts.length; j++) s += ts[j].textContent;
        shared.push(s);
      }
    }
    const rels = PX(xml('xl/_rels/workbook.xml.rels')).getElementsByTagName('Relationship');
    const relMap = {};
    for (let i = 0; i < rels.length; i++) relMap[rels[i].getAttribute('Id')] = rels[i].getAttribute('Target');
    const shs = PX(xml('xl/workbook.xml')).getElementsByTagName('sheet');
    const out = [];
    for (let i = 0; i < shs.length; i++) {
      let target = relMap[shs[i].getAttribute('r:id')] || ('worksheets/sheet' + (i + 1) + '.xml');
      if (target.charAt(0) === '/') target = target.slice(1);
      else if (target.indexOf('xl/') !== 0) target = 'xl/' + target;
      const rowEls = PX(xml(target)).getElementsByTagName('row');
      const rows = [];
      for (let ri = 0; ri < rowEls.length; ri++) {
        const cs = rowEls[ri].getElementsByTagName('c');
        const cells = [];
        for (let ci = 0; ci < cs.length; ci++) {
          const c = cs[ci];
          const m = /^([A-Z]+)/.exec(c.getAttribute('r') || '');
          let idx = 0;
          if (m) { for (const ch of m[1]) idx = idx * 26 + (ch.charCodeAt(0) - 64); idx--; }
          const t = c.getAttribute('t');
          const vEl = c.getElementsByTagName('v')[0];
          const isEl = c.getElementsByTagName('is')[0];
          let val = '';
          if (t === 's' && vEl) val = shared[Number(vEl.textContent)] || '';
          else if (t === 'inlineStr' && isEl) {
            const ts = isEl.getElementsByTagName('t');
            for (let j = 0; j < ts.length; j++) val += ts[j].textContent;
          } else if (vEl) val = vEl.textContent;
          cells[idx] = val;
        }
        for (let j = 0; j < cells.length; j++) if (cells[j] === undefined) cells[j] = '';
        rows.push(cells);
      }
      out.push({ name: shs[i].getAttribute('name') || ('表' + (i + 1)), rows: rows });
    }
    return out;
  },

  /* 只保留输入列，剔除结果列，避免「物理类 / 组合内」被误认成科目列 */
  sheetToTsv(rows) {
    if (!rows || !rows.length) return '';
    const hdr = rows[0].map(x => String(x == null ? '' : x));
    const RESULT = /^(总分|合计|总榜|总排名|总分排名|物理类|物理类排名|历史类|历史类排名|文科排名|理科排名|文理类排名|班内|班级排名|班内排名|组合内|组合内排名|较上场|上线情况|上线|档次|人数|均分|平均分)$/;
    const keep = [];
    hdr.forEach((c, i) => { if (!RESULT.test(normalizeHeader(c))) keep.push(i); });
    const esc = v => {
      const s = String(v == null ? '' : v);
      return /[\t\r\n"]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s;
    };
    const out = [keep.map(i => esc(hdr[i])).join('\t')];
    for (let r = 1; r < rows.length; r++) {
      const cells = rows[r] || [];
      if (!cells.some(c => String(c == null ? '' : c).trim())) continue;
      out.push(keep.map(i => esc(cells[i])).join('\t'));
    }
    return out.join('\r\n');
  },
  embedded(sheets) {
    const full = sheets.find(s => s.name === '完整设置(JSON)');
    if (!full) return null;
    try {
      for (const row of (full.rows || [])) if (row[0] === '内容' && row[1]) return JSON.parse(row[1]);
    } catch (e) { return null; }
    return null;
  },
  examMeta(sheets) {
    const info = sheets.find(s => s.name === '设置与说明');
    const out = {};
    if (!info) return out;
    const rows = info.rows || [];
    for (let i = 0; i < rows.length; i++) {
      if (rows[i][0] === '考试名称' && rows[i][1] === '考试日期') {
        for (let j = i + 1; j < rows.length; j++) {
          const r = rows[j];
          if (!r || !r[0]) break;
          out[r[0]] = {
            date: r[1] || '',
            line1: (r[2] === '' || r[2] == null) ? null : Number(r[2]),
            line2: (r[3] === '' || r[3] == null) ? null : Number(r[3]),
          };
        }
        break;
      }
    }
    return out;
  },
  parseSheets(gradeSheets, opts) {
    const res = [];
    for (const sh of gradeSheets) {
      const tsv = this.sheetToTsv(sh.rows);
      if (!tsv) continue;
      const r = parseImport(tsv, opts);
      if (!r.students || !r.students.length) continue;
      res.push({ name: sh.name, students: r.students, errors: r.errors || [], notes: r.notes || [], meta: r.meta });
    }
    return res;
  },

  /* ---------- 导入入口 ---------- */
  importControl(mode, onDone) {
    const fi = h('input', { type: 'file', accept: '.xlsx', style: 'display:none', onchange: async ev => {
      const f = ev.target.files[0]; if (!f) return;
      try {
        const sheets = await this.readXlsxSheets(f);
        const gradeSheets = sheets.filter(s => this.AUX_SHEETS.indexOf(s.name) < 0);
        if (!gradeSheets.length) { myAlert('这个文件里没找到成绩表。'); return; }
        const opts = {
          combos: data.settings.combos || DEFAULT_COMBOS,
          classes: data.settings.classes || DEFAULT_CLASSES,
        };
        if (mode === 'single') {
          let picked = gradeSheets[0];
          if (gradeSheets.length > 1) {
            const choice = await myAskChoice('选择要导入的成绩表',
              '文件里有 ' + gradeSheets.length + ' 张成绩表，请选一张导入到当前场次「' + ((data.exams[ui.examIdx] || {}).name || '') + '」。',
              gradeSheets.map((s, i) => ({ label: s.name + '（约 ' + Math.max(0, s.rows.length - 1) + ' 人）', value: String(i), primary: i === 0 })));
            if (choice == null) return;
            picked = gradeSheets[Number(choice)];
          }
          const res = parseImport(this.sheetToTsv(picked.rows), opts);
          if (res.students.length && res.students.every(s => s.yearRank == null)) {
            const fix = await myAskChoice('这张表没有年级排名',
              '本表没有任何有效的年级排名。年级排名是选填项，但留空后本场的年级排名、较上场升降、排名趋势都会显示「—」。建议回源表补上「年级排名」列后重新选择文件。',
              [
                { label: '仍然导入（排名留空）', value: 'keep', primary: true },
                { label: '重新选择文件（去补录年排）', value: 'reselect' },
              ]);
            if (fix == null || fix === 'reselect') return;
          }

        }
        const embedded = this.embedded(sheets);
        const hasFull = !!(embedded && embedded.settings);
        const modeChoice = await myAskChoice('设置与学生档案从哪里取？',
          'Excel 里有 ' + gradeSheets.length + ' 张成绩表。' + (hasFull ? '文件内含完整设置与学生档案。' : '这是旧格式 Excel，不含完整设置与学生档案。'),
          [
            { label: hasFull ? '用 Excel 里的（推荐）' : '保留当前设置与档案（推荐）', value: hasFull ? 'excel' : 'keep', primary: true },
            { label: hasFull ? '保留当前设置与档案' : '用系统默认值', value: hasFull ? 'keep' : 'default' },
            { label: '用系统默认值', value: 'default', hidden: !hasFull },
          ]);
        if (modeChoice == null) return;
        let settings = data.settings, profiles = data.profiles;
        if (modeChoice === 'excel' && hasFull) { settings = embedded.settings; profiles = embedded.profiles || {}; }
        else if (modeChoice === 'default') { settings = defaultSettings(); profiles = {}; }
        const opts2 = { combos: settings.combos || DEFAULT_COMBOS, classes: settings.classes || DEFAULT_CLASSES };
        const parsed = this.parseSheets(gradeSheets, opts2);
        if (!parsed.length) { myAlert('没解析出任何学生，请检查表头是否有「姓名」和各科成绩列。'); return; }
        const errs = [];
        parsed.forEach(p => p.errors.forEach(e => errs.push('[' + p.name + '] ' + e)));
        const total = parsed.reduce((n, p) => n + p.students.length, 0);
        const noRank = parsed.filter(p => p.students.length && p.students.every(s => s.yearRank == null)).map(p => p.name);
        const summary = '导入 Excel 备份：' + parsed.length + ' 场考试 / ' + total + ' 条成绩。\n' +
          (errs.length ? '校验提示 ' + errs.length + ' 条（前 3 条）：\n' + errs.slice(0, 3).join('\n') + '\n' : '') +
          (noRank.length ? '注意：有 ' + noRank.length + ' 场没有年级排名（' + noRank.slice(0, 3).join('、') + (noRank.length > 3 ? ' 等' : '') + '）。这些场次的年级排名将留空，建议补录年排后重新导出再恢复。\n' : '') +
          '当前全部数据将被覆盖。';
        if (!(await myConfirm(summary))) return;
        const meta = this.examMeta(sheets);
        const d = {
          settings: settings, profiles: profiles, isSample: false,
          exams: parsed.map(p => {
            const m = meta[p.name] || {};
            return { name: p.name, date: m.date || '', line1: m.line1 == null ? null : m.line1,
              line2: m.line2 == null ? null : m.line2, students: p.students };

        };

function exportMobileViewer() {
  try {
    const H = SNAP.health();
    const d = new Date(), p2 = x => String(x).padStart(2, '0');
    const ts = d.getFullYear() + '-' + p2(d.getMonth() + 1) + '-' + p2(d.getDate()) + ' ' + p2(d.getHours()) + ':' + p2(d.getMinutes());
    const payload = { ver: '2.3', ts, exams: H.exams, students: H.students,
      hideStudentId: true, note: '手机只读快照：不含 API Key 与老师内部备注；学号只在显示层隐藏', data: snapshotSafeData() };
    // 注意：这里拼的字符串里不能出现字面量的 script 标签，否则会提前闭合当前脚本块
    const OPEN = '<' + 'script>';
    const CLOSE = '<' + '/script>';
    const inject = OPEN + 'window.__HS_DATA__=' + JSON.stringify(payload).replace(/</g, '\\u003c') +
      ';window.__HS_READONLY__=true;' + CLOSE + '\n';
    cleanDocForExport();
    let out = document.documentElement.outerHTML;

    out = out.replace(HEAD_RE, () => inject + OPEN + '\n"use strict";');
    const html = out.replace('</head>', '<meta name="viewport" content="width=device-width, initial-scale=1"></head>');
    render();  // 把刚才清空的界面画回来
    downloadTextFile('手机查看版.html', html, 'text/html;charset=utf-8');

function maskDisplayIds() {
  const root = workbench || document.body;
  const tables = root.querySelectorAll('table.tb');
  tables.forEach(tbl => {
    const thead = tbl.querySelector('thead');
    const headTrs = thead ? Array.from(thead.querySelectorAll('tr')) : [];
    let idx = -1;
    for (const tr of headTrs) {
      const ths = Array.from(tr.querySelectorAll('th'));
      const i = ths.findIndex(th => String(th.textContent || '').trim() === '学号');
      if (i >= 0) { idx = i; break; }
    }
    if (idx < 0) return;
    const rows = headTrs.concat(Array.from(tbl.querySelectorAll('tbody tr')));
    for (const r of rows) {
      const c = r.children[idx];
      if (c && c.textContent && c.textContent.trim() !== '—') c.textContent = '已隐藏';
    }
  });
  // 文本里出现的「学号 20240301」也一并打码
  const walk = el => {
    for (const c of el.childNodes) {
      if (c.nodeType === 3) {
        const t = c.textContent || '';
        if (/学号\s*[A-Za-z0-9\-]{4,}/.test(t)) c.textContent = t.replace(/学号\s*[A-Za-z0-9\-]+/g, '学号 已隐藏');
      } else if (c.nodeType === 1) walk(c);
    }
  };
  walk(root);
}

  root.append(presets, h('p', { class: 'hint', text: '选择预设会替换该页布局；成绩、选科和 AI 配置不会改变。也可以逐项自定义。' }));
  const list = workspacePanels();

}
function showHelp(panelId) {

  showWorkspaceDialog(def ? def.title + ' · 说明' : '使用指南', root);
}

/* 自动补满每一行：某行总跨度不足 12 列时，把多出的列分给该行最后一块，避免右侧留白 */
function balancePanelGrid(grid) {
  const ps = Array.from(grid.children).filter(el => el.classList && el.classList.contains('panel'));
  ps.forEach(p => p.style.removeProperty('--extra'));
  if (!ps.length || getComputedStyle(grid).display !== 'grid') return;
  let used = 0, last = null;
  ps.forEach(p => {
    const span = Math.min(12, parseInt(getComputedStyle(p).getPropertyValue('--span'), 10) || 6);
    if (used + span > 12) { if (last && used < 12) last.style.setProperty('--extra', 12 - used); used = 0; }
    used += span; last = p;
  });
  if (last && used < 12) last.style.setProperty('--extra', 12 - used);
}
let balanceTimer = 0;
window.addEventListener('resize', () => {
  clearTimeout(balanceTimer);
  balanceTimer = setTimeout(() => { const g = document.querySelector('.panel-grid'); if (g) balancePanelGrid(g); }, 120);
});
function render() {

  const ctx = workspaceContext();
  // 入场动画只在切换板块时播放；页内改选项不重播，避免整页闪一下
  const tabChanged = render.lastTab !== ui.tab;
  // 重建工作台前记住滚动位置：innerHTML='' 的瞬间页面高度骤降，浏览器会把 scrollTop 钳回 0（表现为"点选项就回到顶部"）
  const scrollKeeper = { y: window.scrollY, keep: window.scrollY > 0 };
  workbench.innerHTML = '';
  workbench.classList.remove('page-enter');
  if (tabChanged) { void workbench.offsetWidth; workbench.classList.add('page-enter'); }
  const titles = { overview: '成绩总览', pk: '班级对比', student: '学生诊断', entry: '数据管理', settings: '系统设置' };
  const notes = { overview: '每一场考试，都是下一程的坐标', pk: '看见班级的高光，也看见一起进步的空间', student: '看见进退，也看见每一科的可能', entry: '从一张成绩表，开始清晰的成长记录', settings: '按学校的口径，校准每一份数据' };
  const customize = h('button', { class: 'btn primary', html: uiIcon('plus') + '<span>定制信息板</span>', onclick: openCatalog });
  const actions = h('div', { class: 'workspace-actions' }, h('span', { class: 'saved-note', text: '布局已自动保存' }), customize);
  if (ui.tab === 'student') actions.append(h('button', { class: 'btn', html: uiIcon('download') + '<span>导出 PDF</span>', onclick: () => { if (ctx.student) pdfStudentPrint(ctx.computed, ctx.student.row, ctx.student.hist, ctx.student.latestIdx, ctx.student.keys); } }));
  if (ui.tab === 'overview') actions.append(h('button', { class: 'btn', html: uiIcon('download') + '<span>批量导出 PDF</span>', onclick: openBatchPdfPanel }));
  workbench.append(h('div', { class: 'workspace-bar' }, h('div', { class: 'workspace-intro' }, h('h2', { class: 'workspace-title', text: titles[ui.tab] }), h('p', { class: 'workspace-note', text: notes[ui.tab] })), actions));
  workbench.append(renderContextBar(ctx));
  if (!['entry', 'settings'].includes(ui.tab)) workbench.append(renderMetricStrip(ctx));
  if (ui.tab === 'student' && ctx.student) workbench.append(studentSummary(ctx));
  const warn = workspaceWarning();
  if (warn && !['entry', 'settings'].includes(ui.tab)) workbench.append(warn);
  const slot = h('div', { class: 'settings-warning-slot' });
  if (warn && ['entry', 'settings'].includes(ui.tab)) slot.append(warn);
  workbench.append(slot);
  const list = workspacePanels();
  const grid = h('div', { class: 'panel-grid' });
  if (!list.length) grid.append(h('div', { class: 'panel', 'data-size': 'full' }, h('div', { class: 'panel-placeholder' }, h('strong', { text: '挑几块需要的信息板吧' }), h('span', { text: '不用一次看完全部图表。' }), h('button', { class: 'btn primary', text: '选择信息板', onclick: openCatalog }))));
  list.forEach((item, i) => { if (PANEL_DEFS[item.id]) grid.append(panelElement(item, i, ctx)); });
  const tabs = h('div', { class: 'mobile-panel-tabs' });
  list.forEach((item, i) => { if (!PANEL_DEFS[item.id]) return; tabs.append(h('button', { class: 'chip' + (i === 0 ? ' on' : ''), text: PANEL_DEFS[item.id].title, onclick: ev => { grid.querySelectorAll('.panel').forEach(p => p.classList.toggle('mobile-on', p.dataset.panel === item.id)); tabs.querySelectorAll('button').forEach(b => b.classList.toggle('on', b === ev.currentTarget)); } })); });
  workbench.append(tabs, grid);

  workbench.append(h('div', { class: 'workspace-status' }, h('span', { text: ui.tab === 'student' ? '趋势使用学生最近有成绩的场次 · 排名优先采用官方年排' : '单科均分与班内排名仅覆盖当前导入名单' }), h('span', { text: '本机存储 · 随时导出备份' })));
  // 页面重绘后，若有打开的弹窗（重点关注 / 定制信息板等），原位刷新其内容
  refreshWorkspaceDialog();

/* 渲染后的收尾：只读模式打码学号、显示状态徽标 */
function afterRender() {
  if (!READ_ONLY) return;
  document.body.classList.add('hs-ro');
  const badge = document.getElementById('roBadge');
  if (badge) {
    badge.hidden = false;
    badge.textContent = '只读' + (SNAP_TS ? ' · 数据 ' + SNAP_TS : ' · 正在获取最新数据');

}
function scrollWorkTop() {

document.getElementById('tabs').addEventListener('click', ev => {
  const help = ev.target.closest('button[data-action="help"]');
  if (help) { showHelp(); return; }
  const b = ev.target.closest('button[data-tab]');
  if (!b) return;
  if (READ_ONLY && (b.dataset.tab === 'entry' || b.dataset.tab === 'settings')) {
    myAlert('手机查看版为只读，不能修改数据。'); return;
  }
  const changed = ui.tab !== b.dataset.tab;
  ui.tab = b.dataset.tab;
  render();
  if (changed) scrollWorkTop();
});
workspaceOverlay.addEventListener('click', ev => { if (ev.target === workspaceOverlay) closeWorkspaceDialog(); });
document.addEventListener('click', ev => { if (!ev.target.closest('.panel-tools')) closePanelMenus(); });
document.addEventListener('keydown', ev => {
  if (ev.key === 'Escape' && workspaceOverlay.children.length) closeWorkspaceDialog();
  else if (ev.key === 'Escape') closePanelMenus();
  if (ev.key === 'Tab' && workspaceOverlay.children.length) {
    const focusable = Array.from(workspaceOverlay.querySelectorAll('button:not([disabled]),input,select,textarea,summary,[tabindex="0"]')).filter(el => el.offsetParent !== null);
    if (!focusable.length) return;
    const first = focusable[0], last = focusable[focusable.length - 1];
    if (ev.shiftKey && document.activeElement === first) { ev.preventDefault(); last.focus(); }
    else if (!ev.shiftKey && document.activeElement === last) { ev.preventDefault(); first.focus(); }
  }
});

document.getElementById('themeBtn').addEventListener('click', () => {
  const next = isDark() ? 'light' : 'dark';
  document.documentElement.setAttribute('data-theme', next);
  try { localStorage.setItem(LS_THEME, next); } catch (e) { /* ignore */ }
  render();
});
(function initTheme() {
  try {
    const t = localStorage.getItem(LS_THEME);
    if (t === 'light' || t === 'dark') document.documentElement.setAttribute('data-theme', t);
  } catch (e) { /* ignore */ }
})();
data = loadData();
aiCfg = loadAiCfg();
loadPref();
applyPref();
/* 只读模式：手机查看版。数据优先取内嵌快照，其次取同目录 snapshot.json */
const READ_ONLY = /[?&]readonly=1/.test(location.search) || !!window.__HS_READONLY__;
let SNAP_TS = '';
async function bootReadOnly() {
  document.body.classList.add('hs-ro');
  if (window.__HS_DATA__) {
    try {
      SNAP_TS = (window.__HS_DATA__.ts || '');
      data = normalizeData(window.__HS_DATA__.data || window.__HS_DATA__);
    } catch (e) { myAlert('内嵌快照解析失败：' + e.message); }
    return;
  }
  const url = 'snapshot.json?t=' + Date.now();
  try {
    const res = await fetch(url, { cache: 'no-store' });
    if (!res.ok) throw new Error('HTTP ' + res.status);
    const j = await res.json();
    if (!j || !j.data || !Array.isArray(j.data.exams)) throw new Error('快照格式不对');
    data = normalizeData(j.data);
    SNAP_TS = j.ts || '';
    try { sessionStorage.setItem('hiscore-v23-ro-cache', JSON.stringify(j)); } catch (e) { /* ignore */ }
  } catch (e) {
    let ok = false;
    try {
      const c = JSON.parse(sessionStorage.getItem('hiscore-v23-ro-cache') || 'null');
      if (c && c.data) { data = normalizeData(c.data); SNAP_TS = (c.ts || '') + '（缓存）'; ok = true; }
    } catch (e2) { /* ignore */ }
    document.body.classList.add('hs-ro-stale');
    const badge = document.getElementById('roBadge');
    if (badge) { badge.textContent = ok ? '离线 · 显示上次缓存，非最新' : '离线 · 暂无数据'; badge.classList.add('warn'); }
  }
}
if (READ_ONLY) {

  });
} else {
  (function initRoute() {
    const hm = location.hash.slice(1).split('|');
    if (hm[0] && ['overview', 'pk', 'student', 'entry', 'settings'].includes(hm[0])) ui.tab = hm[0];
    if (ui.tab === 'student' && hm[1]) {
      try { ui.student = decodeURIComponent(hm[1]); } catch (e) { /* 兼容旧版链接：按姓名回退 */ }
    }
  })();
  render();
  afterRender();
}
