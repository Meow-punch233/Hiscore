/* 偏科 / 不匹配默认阈值（定档：自身失衡；佐证：名单落后） */
const DEFAULT_MISMATCH = {
  selfGap: 0.15,      // 关注：某科得分率比自身各科平均低 15 个百分点（约前 25% 偏科幅度）
  severeGap: 0.22,    // 预警：自身失衡达到 22 个百分点（约前 10%）
  vsAvgGap: 0.10,     // 佐证：同时比该科名单均分低 10 个百分点
  rankTail: 0.30,     // 佐证：同时单科排名落入名单后 30%
  minRanked: 5,       // 名单不足该人数时，排名口径不参与（波动太大）
};

function defaultSettings() {
  return {
    bands: DEFAULT_BANDS.map(b => ({ ...b })),
    line1: 512, line2: 448,
    line1Name: '本一线', line2Name: '本二线',   // G1/G2 线名可自定义（初中可改「重点线/普高线」）
    mismatch: { ...DEFAULT_MISMATCH },
    combos: DEFAULT_COMBOS.map(c => ({ ...c, track2: [...(c.track2 || [])] })),
    classes: DEFAULT_CLASSES.map(c => ({ ...c, comboIds: [...(c.comboIds || [])] })),
  };
}

/* --- 确定性随机（示例数据用） --- */
function mulberry32(seed) {
  let a = seed >>> 0;
  return function () {
    a |= 0; a = (a + 0x6D2B79F5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
function gauss(rnd) {
  let u = 0, v = 0;
  while (u === 0) u = rnd();
  while (v === 0) v = rnd();
  return Math.sqrt(-2 * Math.log(u)) * Math.cos(2 * Math.PI * v);
}

/* --- 示例数据：9 班 × 72 人 × 3 次考试（含拼班 + 多选科组合 + 班级强弱画像） --- */
function generateSample() {
  const rnd = mulberry32(20261029);
  const surn = ['王', '李', '张', '刘', '陈', '杨', '赵', '黄', '周', '吴', '徐', '孙', '朱', '马', '胡', '郭', '林', '何', '高', '罗', '郑', '梁'];
  const giv = ['嘉怡', '思远', '雨桐', '宇轩', '诗涵', '子墨', '欣然', '俊杰', '佳琪', '浩然', '婉清', '梓涵',
    '一鸣', '若曦', '天佑', '静娴', '沐辰', '知夏', '语彤', '奕辰', '可欣', '致远', '芷若', '晨曦'];
  const names = [];
  const used = new Set();
  for (let i = 0; i < 72; i++) {
    let nm, attempt = 0;
    do {
      nm = surn[i % surn.length] + giv[(i * 7 + names.length * 3 + attempt) % giv.length];
      attempt++;
    } while (used.has(nm));
    used.add(nm);
    names.push(nm);
  }
  // 全科目均分/标准差
  const mus = {
    chinese: 102, math: 97, english: 104,
    physics: 67, history: 70,
    chem: 70, bio: 68, politics: 72, geo: 72,
  };
  const sds = {
    chinese: 11, math: 19, english: 14,
    physics: 13, history: 12,
    chem: 12, bio: 11, politics: 10, geo: 11,
  };
  const maxs = {
    chinese: 150, math: 150, english: 150,
    physics: 100, history: 100,
    chem: 100, bio: 100, politics: 100, geo: 100,
  };
  // 拼班示范：1/2/8/9 班多组合混排，其余单组合；每班有强弱画像让 PK 有看头
  const classCombos = {
    '高三(1)班': ['wu-hua-di', 'wu-hua-sheng'],
    '高三(2)班': ['wu-sheng-di', 'li-zheng-di'],
    '高三(3)班': ['wu-hua-di'],
    '高三(4)班': ['wu-hua-sheng'],
    '高三(5)班': ['wu-sheng-di'],
    '高三(6)班': ['li-zheng-di'],
    '高三(7)班': ['li-zheng-sheng'],
    '高三(8)班': ['wu-hua-di', 'li-zheng-sheng'],
    '高三(9)班': ['wu-hua-sheng', 'wu-sheng-di'],
  };
  const settings = defaultSettings();
  const comboMap = {};
  for (const c of settings.combos) comboMap[c.id] = c;

  // 班级整体水平（温和分差）+ 每班一强一弱科目（PK 有故事）；
  // 学生个体差异仍走随机，但降低跨科联动，避免整班被一个随机数带偏
  const classBias = {}, classTilt = {};
  const CLASS_LEVEL = [0, -6, 8, 2, 4, -3, 6, -5, 1];
  let ci = 0;
  for (const cl of Object.keys(classCombos)) {
    classBias[cl] = CLASS_LEVEL[ci % CLASS_LEVEL.length];
    classTilt[cl] = {};
    const keys = comboSubjectKeys(comboMap[classCombos[cl][0]]);
    classTilt[cl][keys[ci % keys.length]] = 5;          // 优势科目
    classTilt[cl][keys[(ci + 2) % keys.length]] = -4;   // 待提升科目
    ci++;
  }

  const students = names.map((nm, i) => {
    const cls = '高三(' + (Math.floor(i / 8) + 1) + ')班';
    const combos = classCombos[cls];
    const comboId = combos[i % combos.length];
    const combo = comboMap[comboId];
    const h = gauss(rnd);
    const abi = {};
    for (const k of comboSubjectKeys(combo)) {
      abi[k] = mus[k] + classBias[cls] + (classTilt[cls][k] || 0) + h * sds[k] * 0.35 + gauss(rnd) * sds[k] * 0.8;
    }
    return { studentId: 'S' + String(i + 1).padStart(3, '0'), name: nm, cls, comboId, abi };
  });
  const examNames = ['月考一', '期中考', '月考二'];
  const exams = examNames.map((en, ei) => ({
    name: en,
    line1: 512, line2: 448,
    students: students.map(st => {
      const combo = comboMap[st.comboId];
      const drift = gauss(rnd) * 2.5;
      const row = { studentId: st.studentId, name: st.name, cls: st.cls, comboId: st.comboId };
      for (const k of comboSubjectKeys(combo)) {
        let v = st.abi[k] + drift + gauss(rnd) * sds[k] * 0.45;
        v = Math.max(8, Math.min(maxs[k] - 2, v));
        row[k] = Math.round(v);
      }
      return row;
    }),
  }));
  // 示例数据也带上「学校官方年排」，让演示与新导入口径一致
  for (const ex of exams) {
    const comp = computeExamData(ex, settings, null);
    const byId = new Map(comp.rows.map(r => [r.id, r]));
    for (const s of ex.students) {
      const r = byId.get(s.studentId);
      if (r && r.totalRank != null) s.yearRank = r.totalRank;
    }
  }
  return exams;
}

/* --- 档位、分数线、学生身份的安全兜底：只影响计算，不改写用户数据 --- */
function safeBands(bands) {
  const fallback = defaultSettings().bands;
  if (!Array.isArray(bands) || !bands.length) return fallback;
  const out = bands.map((b, i) => ({
    name: b && b.name != null ? String(b.name) : (fallback[i] ? fallback[i].name : '档' + (i + 1)),
    pct: Number(b && b.pct), min: Number(b && b.min), max: Number(b && b.max),
  }));
  const ok = out.every(b => Number.isFinite(b.pct) && b.pct >= 0 && b.pct <= 100 &&
    Number.isFinite(b.min) && Number.isFinite(b.max) && b.min <= b.max && b.min >= 0 && b.max <= 100);
  return ok ? out : fallback;
}
function lineNumberOrNull(v) {
  if (v === '' || v == null) return null;
  const n = Number(v);
  return Number.isFinite(n) ? n : null;
}
function resolveLines(exam, settings) {
  const fallback = defaultSettings();
  let l1 = lineNumberOrNull(exam && exam.line1);
  let l2 = lineNumberOrNull(exam && exam.line2);
  if (l1 == null) l1 = lineNumberOrNull(settings && settings.line1);
  if (l2 == null) l2 = lineNumberOrNull(settings && settings.line2);
  if (l1 == null || l1 < 0 || l1 > 750) l1 = fallback.line1;
  if (l2 == null || l2 < 0 || l2 > 750) l2 = fallback.line2;
  if (l2 >= l1) l2 = Math.max(0, l1 - (fallback.line1 - fallback.line2));
  return { line1: l1, line2: l2 };
}
function examLine1(exam, settings) { return resolveLines(exam, settings).line1; }
function examLine2(exam, settings) { return resolveLines(exam, settings).line2; }
/* --- G 线命名：G1/G2 是固定编号（第一/第二参考线），线名可在设置里自定义（如 重点线/普高线） ---
   展示约定：短处（KPI、表头、PK 指标名）用 G1/G2；长处（说明、家长版）给自定义线名全称。 */
function lineName1(s) { return (s && s.line1Name) || '本一线'; }
function lineName2(s) { return (s && s.line2Name) || '本二线'; }
function gLineTag(n, s) { return 'G' + n + ' · ' + (n === 1 ? lineName1(s) : lineName2(s)); }
function lineBandLabel(band, s) { return band === 1 ? lineName1(s) + '以上' : band === 2 ? lineName2(s) + '以上' : '未上线'; }
function lineBandWord(band, s) { return band === 1 ? '达到' + lineName1(s) : band === 2 ? '达到' + lineName2(s) : '暂未达到' + lineName1(s); }
function scoreOrNull(v, max) {
  const n = numOrNull(v);
  return n == null || n < 0 || n > max ? null : n;
}
/* 学号优先；旧备份无学号时按「班级 + 姓名」对齐，避免不同班同名串人。
   key 只用可安全放进 DOM 属性/URL 的字符，避免控制字符被浏览器改写。 */
function studentIdentity(s) {
  s = s || {};
  const studentId = normalizeStudentId(typeof s.studentId !== 'undefined' ? s.studentId : (typeof s.id !== 'undefined' ? s.id : s.sid));
  const name = normalizeCell(s.name);
  const cls = normalizeCell(s.cls);
  return {
    studentId, name, cls,
    key: studentId ? 'id:' + encodeURIComponent(studentId)
      : (cls ? 'class:' + encodeURIComponent(cls) + ':' + encodeURIComponent(name)
        : 'name:' + encodeURIComponent(name)),
  };
}
function studentKey(s) { return studentIdentity(s).key; }

/* --- 等级赋分（江苏：A15/B35/C35/D13/E2，档内线性插值） --- */
function assignGrades(entries, bands) {
  // entries: [{id, raw}] → Map id → {level, score}；diagnostics 记录实际档位占比
  const res = new Map();
  const useBands = safeBands(bands);
  const list = entries.filter(e => e && e.id != null && e.raw != null && Number.isFinite(Number(e.raw)))
    .map(e => ({ id: e.id, raw: Number(e.raw) }))
    .sort((a, b) => b.raw - a.raw);
  const n = list.length;
  const counts = useBands.map(() => 0);
  let tiedBoundary = 0;
  if (n > 0) {
    let prev = 0, cum = 0;
    for (let bi = 0; bi < useBands.length; bi++) {
      const band = useBands[bi];
      cum += band.pct / 100;
      const i0 = prev;
      // 档位人数按比例取整；但某档比例>0 时至少留 1 人，
      // 否则选考人数少（如 1~6 人）会把第一名挤到下一档，总分被低估
      let i1 = bi === useBands.length - 1
        ? n
        : Math.min(n, band.pct > 0 ? Math.max(i0 + 1, Math.round(n * cum)) : Math.round(n * cum));
      // 同分同档：档位边界若切开同分考生，把边界下移让同分进同一档
      if (i1 > i0 && i1 < n) {
        const v = list[i1 - 1].raw;
        const before = i1;
        while (i1 < n && list[i1].raw === v) i1++;
        if (i1 > before) tiedBoundary++;
      }
      prev = i1;
      if (i1 <= i0) continue;
      counts[bi] = i1 - i0;
      const hiRaw = list[i0].raw, loRaw = list[i1 - 1].raw;
      const span = hiRaw - loRaw;
      const bSpan = band.max - band.min;
      for (let i = i0; i < i1; i++) {
        const e = list[i];
        let sc;
        if (span > 0) sc = Math.round(band.min + (e.raw - loRaw) * bSpan / span);
        else sc = Math.round((band.min + band.max) / 2);
        sc = Math.max(band.min, Math.min(band.max, sc));
        res.set(e.id, { level: band.name, score: sc });
      }
    }
  }
  const target = useBands.map(b => b.pct);
  const actual = counts.map(c => n ? c / n * 100 : 0);
  const maxDeviation = Math.max.apply(null, actual.map((v, i) => Math.abs(v - target[i])).concat([0]));
  Object.defineProperty(res, 'diagnostics', {
    value: { count: n, target, actual, counts, maxDeviation, tiedBoundary },
    enumerable: false,
  });
  return res;
}

/* --- 并列名次（1,2,2,4 式）：dir=-1 降序 --- */
function competitionRanks(items, valueOf, dir) {
  dir = dir === undefined ? -1 : dir;
  const ranks = new Map();
  const list = items.filter(x => valueOf(x) != null && !isNaN(valueOf(x)))
    .slice().sort((a, b) => dir * (valueOf(a) - valueOf(b)));
  let i = 0;
  while (i < list.length) {
    const v = valueOf(list[i]);
    let j = i;
    while (j < list.length && valueOf(list[j]) === v) j++;
    for (let k = i; k < j; k++) ranks.set(list[k], i + 1);
    i = j;
  }
  return ranks;
}

/* --- 单场考试全量计算（按稳定学生 ID 对齐，越界分数按缺考处理） --- */
function computeExamData(exam, settings, prevExam) {
  const array = Array.isArray(exam && exam.students) ? exam.students : [];
  const combos = (settings && settings.combos) || DEFAULT_COMBOS;
  const classes = (settings && settings.classes) || DEFAULT_CLASSES;
  // 建立 comboId → combo 映射
  const comboMap = {};
  for (const c of combos) comboMap[c.id] = c;
  // 建立 className → combos 映射（同名班级的组合合并，避免后者覆盖前者）
  const classComboMap = {};
  for (const c of classes) {
    const cs = (c.comboIds || []).map(id => comboMap[id]).filter(Boolean);
    const key = c.name;
    if (!classComboMap[key]) classComboMap[key] = [];
    for (const x of cs) if (!classComboMap[key].includes(x)) classComboMap[key].push(x);
  }

  const rows = array.map(s => {
    const ident = studentIdentity(s);
    // 解析该生的选科组合
    let combo = null;
    if (s.comboId) combo = comboMap[s.comboId] || null;
    if (!combo && s.cls) {
      const clsCombos = classComboMap[s.cls] || [];
      if (clsCombos.length) combo = clsCombos[0];
    }
    if (!combo) combo = combos[0] || DEFAULT_COMBOS[0];
    const keys = comboSubjectKeys(combo);
    const raw = {};
    for (const k of keys) {
      const def = SUBJECT_MAP[k];
      raw[k] = scoreOrNull(s[k], def ? def.max : 100);
    }
    // 未选考的科目统一置 null，避免下游读到 undefined
    for (const def of SUBJECT_DEFS) {
      if (!(def.key in raw)) raw[def.key] = null;
    }
    // 赋分覆盖列（旧格式：chemScore/geoScore；新格式：用科目 key 命名）
    const assigned = assignedKeysForCombo(combo);
    const ov = {};
    for (const k of assigned) {
      ov[k] = scoreOrNull(s[k + 'Score'] || s[k + 'Assigned'], 100);
    }
    return {
      id: ident.key, studentId: ident.studentId,
      name: ident.name || String(s && s.name || ''), cls: ident.cls,
      comboId: combo.id, comboName: comboLabel(combo), trackName: comboTrackName(combo),
      track1: combo.track1 || 'physics',
      yearRank: scoreOrNull(s.yearRank, 100000),
      raw, ov, assignedKeys: assigned,
    };
  });

  const bands = settings && settings.bands;
  // 按赋分科目分组赋分（每个赋分科目独立排位）
  const gradeResults = {};
  for (const r of rows) {
    for (const k of r.assignedKeys) {
      if (!gradeResults[k]) gradeResults[k] = [];
      gradeResults[k].push({ id: r.id, raw: r.raw[k] });
    }
  }
  const assignedMaps = {};
  for (const k of Object.keys(gradeResults)) {
    assignedMaps[k] = assignGrades(gradeResults[k].filter(e => e.raw != null), bands);
  }

  const seen = new Set(), duplicateKeys = [];
  for (const r of rows) {
    if (seen.has(r.id)) duplicateKeys.push(r.id);
    seen.add(r.id);
    // 赋分
    const assigned = {};
    const levels = {};
    for (const k of r.assignedKeys) {
      const g = assignedMaps[k] ? assignedMaps[k].get(r.id) : null;
      assigned[k] = r.ov[k] != null ? r.ov[k] : (g ? g.score : null);
      levels[k] = r.ov[k] != null ? '—' : (g ? g.level : '—');
    }
    // 总分：语数外 + 物理/历史 + 赋分2科
    const core = [...CORE3, r.track1];
    const coreVals = core.map(k => r.raw[k]);
    const assignedVals = r.assignedKeys.map(k => assigned[k]);
    r.total = (coreVals.every(v => v != null) && assignedVals.every(v => v != null))
      ? coreVals.reduce((a, b) => a + b, 0) + assignedVals.reduce((a, b) => a + b, 0)
      : null;
    r.assigned = assigned;
    r.levels = levels;
    // subj 统一映射：只含该生实际选考的科目（raw 里未选考的科目是 null 占位，不算入）
    r.subj = {};
    r.subjectKeys = [];
    for (const k of comboSubjectKeys(comboMap[r.comboId])) {
      if (!(k in r.raw)) continue;
      r.subj[k] = r.raw[k];
      r.subjectKeys.push(k);
    }
    for (const k of r.assignedKeys) {
      r.subj[k] = assigned[k];
      if (!r.subjectKeys.includes(k)) r.subjectKeys.push(k);
    }
  }
  // 名次：只统计有该科成绩的学生；单科名次不写成「校/年级名次」
  const allKeys = new Set();
  for (const r of rows) for (const k of Object.keys(r.subj)) allKeys.add(k);
  for (const k of allKeys) {
    const rk = competitionRanks(rows, r => r.subj[k]);
    for (const r of rows) r[k + 'Rank'] = rk.get(r) || null;
  }
  // 总榜、物理类榜、历史类榜
  const totalRk = competitionRanks(rows, r => r.total);
  const physRows = rows.filter(r => r.track1 === 'physics');
  const histRows = rows.filter(r => r.track1 === 'history');
  const physRk = competitionRanks(physRows, r => r.total);
  const histRk = competitionRanks(histRows, r => r.total);
  for (const r of rows) {
    r.computedTotalRank = totalRk.get(r) || null;
    const official = numOrNull(r.yearRank);
    r.hasOfficialRank = official != null && Number.isInteger(official) && official > 0;
    r.totalRank = r.hasOfficialRank ? official : r.computedTotalRank;
    r.physRank = r.track1 === 'physics' ? (physRk.get(r) || null) : null;
    r.histRank = r.track1 === 'history' ? (histRk.get(r) || null) : null;
    // 类别排名：物理类/历史类
    r.trackRank = r.track1 === 'history' ? r.histRank : r.physRank;
  }
  // 班内排名（行政班口径：整个班混排）
  for (const r of rows) r.classRank = null;
  const byCls = new Map();
  for (const r of rows) {
    if (!r.cls) continue;
    if (!byCls.has(r.cls)) byCls.set(r.cls, []);
    byCls.get(r.cls).push(r);
  }
  for (const grp of byCls.values()) {
    const rk = competitionRanks(grp, r => r.total);
    for (const r of grp) r.classRank = rk.get(r) || null;
  }
  // 组合内排名（选科组合口径：同一组合的学生排）
  const byCombo = new Map();
  for (const r of rows) {
    if (!byCombo.has(r.comboId)) byCombo.set(r.comboId, []);
    byCombo.get(r.comboId).push(r);
  }
  for (const grp of byCombo.values()) {
    const rk = competitionRanks(grp, r => r.total);
    for (const r of grp) r.comboRank = rk.get(r) || null;
  }
  // 只有紧邻上一场、且同一学生都有有效总分时才算变化
  const prevMap = new Map();
  if (prevExam) {
    const prevRows = computeExamData(prevExam, settings, null).rows;
    for (const pr of prevRows) if (!prevMap.has(pr.id)) prevMap.set(pr.id, pr);
  }
  for (const r of rows) {
    const pr = prevMap.get(r.id);
    r.prevTotal = pr ? pr.total : null;
    r.prevRank = pr ? pr.totalRank : null;
    r.totalDelta = (pr && r.total != null && pr.total != null) ? r.total - pr.total : null;
    const rankComparable = pr && r.totalRank != null && pr.totalRank != null && r.hasOfficialRank === pr.hasOfficialRank;
    r.rankDelta = rankComparable ? pr.totalRank - r.totalRank : null;
    r.trend = r.totalDelta == null ? null : (r.totalDelta > 0 ? 'up' : (r.totalDelta < 0 ? 'down' : 'flat'));
  }
  // 上线
  const lines = resolveLines(exam, settings);
  const L1 = lines.line1, L2 = lines.line2;
  for (const r of rows) {
    if (r.total == null) { r.lineStatus = null; r.lineBand = null; r.toLine1 = null; r.toLine2 = null; continue; }
    r.lineBand = r.total >= L1 ? 1 : (r.total >= L2 ? 2 : 0);   // 数值档位：1=G1 线上 / 2=两线之间 / 0=线下；文案一律经 lineBandLabel
    r.lineStatus = lineBandLabel(r.lineBand, settings);
    r.toLine1 = r.total - L1; r.toLine2 = r.total - L2;
  }
  // 统计（分母统一为有有效总分的人数）
  const withTotal = rows.filter(r => r.total != null);
  const avg = arr => arr.length ? arr.reduce((a, b) => a + b, 0) / arr.length : null;
  const subjAvg = {};
  for (const k of allKeys) subjAvg[k] = avg(rows.map(r => r.subj[k]).filter(v => v != null));
  const matched = rows.filter(r => r.totalDelta != null);
  const l1c = withTotal.filter(r => r.total >= L1).length;
  const l2c = withTotal.filter(r => r.total >= L2).length;
  // 赋分诊断（人数太少时档位占比天然偏差大，不作警告）
  const useBandsPct = (safeBands(bands) || []).map(x => Number(x.pct) || 0);
  const gradeDiagnostics = { warning: false, bySubject: {} };
  for (const k of Object.keys(assignedMaps)) {
    const g = assignedMaps[k];
    gradeDiagnostics.bySubject[k] = g.diagnostics;
    // 样本量太小时档位占比天然偏差大（最小档 2% 取不到整人），不作为警告
    // 阈值：至少要有 2 倍最小档位的人数才可靠（5 档制 → 2% → 100 人）
    const minReliable = Math.max(30, Math.round(100 / Math.max(1, useBandsPct[4] || 2)));
    if (g.diagnostics.count >= minReliable && g.diagnostics.maxDeviation >= 8) gradeDiagnostics.warning = true;
  }
  const stats = {
    count: rows.length, validCount: withTotal.length,
    avgTotal: avg(withTotal.map(r => r.total)),
    line1Count: l1c, line2Count: l2c,
    line1Rate: withTotal.length ? l1c / withTotal.length : null,
    line2Rate: withTotal.length ? l2c / withTotal.length : null,
    upCount: matched.filter(r => r.totalDelta > 0).length,
    downCount: matched.filter(r => r.totalDelta < 0).length,
    flatCount: matched.filter(r => r.totalDelta === 0).length,
    subjAvg, line1: L1, line2: L2, duplicateKeys, gradeDiagnostics,
  };
  return { rows, stats };
}

function computeAll(data) {
  const out = [];
  for (let i = 0; i < data.exams.length; i++) {
    out.push(computeExamData(data.exams[i], data.settings, i > 0 ? data.exams[i - 1] : null));
  }
  return out;
}

function numOrNull(v) {
  if (v === '' || v == null) return null;
  const n = Number(v);
  return isNaN(n) ? null : n;
}

/* --- 多次考试后学生历史（按稳定 ID 对齐） --- */
function studentHistory(computed, key) {
  return computed.map(c => c.rows.find(x => x.id === key) || null);
}

/* --- 连续退步判定：只看最近的连续 k+1 场，缺考即不判定 --- */
function continuousDecline(history, k) {
  const tail = history.slice(-(k + 1));
  if (tail.length < k + 1 || tail.some(r => !r || r.total == null)) return false;
  for (let i = 1; i < tail.length; i++) if (tail[i].total >= tail[i - 1].total) return false;
  return true;
}

/* --- 班级 PK：班级聚合（均分 / 上线 / 进步 / 稳定 / 学科画像） --- */
function classAggList(computed, prevComputed) {
  const rows = (computed && computed.rows || []).filter(r => r.cls);
  const byCls = new Map();
  for (const r of rows) {
    if (!byCls.has(r.cls)) byCls.set(r.cls, []);
    byCls.get(r.cls).push(r);
  }
  // 上一场的班均分（用于进步幅度）
  const prevAvg = new Map();
  if (prevComputed) {
    const pm = new Map();
    for (const r of (prevComputed.rows || [])) {
      if (!r.cls || r.total == null) continue;
      if (!pm.has(r.cls)) pm.set(r.cls, []);
      pm.get(r.cls).push(r.total);
    }
    for (const [k, arr] of pm) prevAvg.set(k, arr.reduce((a, b) => a + b, 0) / arr.length);
  }
  const L1 = computed && computed.stats ? computed.stats.line1 : null;
  const L2 = computed && computed.stats ? computed.stats.line2 : null;
  const list = [];
  for (const [cls, arr] of byCls) {
    const totals = arr.map(r => r.total).filter(v => v != null);
    const avg = totals.length ? totals.reduce((a, b) => a + b, 0) / totals.length : null;
    const sorted = [...totals].sort((a, b) => a - b);
    const median = !sorted.length ? null
      : sorted.length % 2 ? sorted[(sorted.length - 1) / 2]
        : (sorted[sorted.length / 2 - 1] + sorted[sorted.length / 2]) / 2;
    const sd = totals.length > 1
      ? Math.sqrt(totals.reduce((a, v) => a + (v - avg) * (v - avg), 0) / totals.length) : null;
    const subj = {}, subjRate = {};
    const keySet = new Set();
    for (const r of arr) for (const k of (r.subjectKeys || [])) keySet.add(k);
    for (const k of keySet) {
      const vs = arr.map(r => r.subj[k]).filter(v => v != null);
      const a = vs.length ? vs.reduce((x, y) => x + y, 0) / vs.length : null;
      subj[k] = a;
      const def = SUBJECT_MAP[k];
      subjRate[k] = (a != null && def) ? a / def.max : null;
    }
    list.push({
      cls, count: totals.length, avgTotal: avg, median, sd,
      line1Rate: (totals.length && L1 != null) ? totals.filter(v => v >= L1).length / totals.length : null,
      line2Rate: (totals.length && L2 != null) ? totals.filter(v => v >= L2).length / totals.length : null,
      avgDelta: (prevAvg.get(cls) != null && avg != null) ? avg - prevAvg.get(cls) : null,
      subj, subjRate,
    });
  }
  // 学科优势 / 待提升：与联盟（各班平均得分率）比
  const leagueRate = {};
  for (const k of Object.keys(SUBJECT_MAP)) {
    const rs = list.map(x => x.subjRate[k]).filter(v => v != null);
    if (rs.length >= 2) leagueRate[k] = rs.reduce((a, b) => a + b, 0) / rs.length;
  }
  for (const x of list) {
    x.leagueRate = leagueRate;
    let best = null, worst = null, strong = null;
    for (const k of Object.keys(x.subjRate)) {
      const rate = x.subjRate[k];
      if (rate == null) continue;
      if (strong == null || rate > x.subjRate[strong]) strong = k;
      if (leagueRate[k] == null) continue;
      const gap = rate - leagueRate[k];
      if (best == null || gap > x.subjRate[best] - leagueRate[best]) best = k;
      if (worst == null || gap < x.subjRate[worst] - leagueRate[worst]) worst = k;
    }
    x.bestSubj = best; x.worstSubj = worst; x.strongSubj = strong;
  }
  return list;
}

/* PK 排序：avg 总均分 / line1 G1 率 / delta 进步 / stability 稳定（波动小在前） */
function pkSort(list, metric) {
  const l = [...list];
  if (metric === 'line1') l.sort((a, b) => (b.line1Rate == null ? -1 : b.line1Rate) - (a.line1Rate == null ? -1 : a.line1Rate));
  else if (metric === 'delta') l.sort((a, b) => (b.avgDelta == null ? -Infinity : b.avgDelta) - (a.avgDelta == null ? -Infinity : a.avgDelta));
  else if (metric === 'stability') l.sort((a, b) => (a.sd == null ? Infinity : a.sd) - (b.sd == null ? Infinity : b.sd));
  else l.sort((a, b) => (b.avgTotal == null ? -1 : b.avgTotal) - (a.avgTotal == null ? -1 : a.avgTotal));
  return l;
}

function validateSettings(settings) {
  const errors = [];
  // ===== 选科组合 / 班级校验 =====
  const combos = (settings && settings.combos) || [];
  const classes = (settings && settings.classes) || [];
  if (combos.length) {
    const names = new Map();
    combos.forEach((c, i) => {
      const label = (c && c.name != null && String(c.name).trim()) ? String(c.name).trim() : ('第 ' + (i + 1) + ' 个组合');
      const t2 = (c && c.track2) || [];
      if (!TRACK1_KEYS.includes(c && c.track1)) errors.push(`组合「${label}」：首选科目须是物理或历史。`);
      if (t2.length !== 2) {
        errors.push(`组合「${label}」：再选科目须恰好 2 门（当前 ${t2.length} 门）——3+1+2 的两门再选科目按赋分计入总分，少于或多于 2 门都会让总分口径失真。`);
      } else if (t2[0] === t2[1]) {
        errors.push(`组合「${label}」：再选科目重复。`);
      }
      const key = String(c && c.name != null ? c.name : '').trim();
      if (!key) errors.push(`第 ${i + 1} 个组合名称为空，导入表按名称匹配时会认错，请补上名称。`);
      if (key) {
        if (names.has(key)) errors.push(`组合名称重复：「${key}」，导入表按名称匹配时会认错，请改成唯一名称。`);
        else names.set(key, true);
      }
    });
  }
  const clsNames = new Map();
  classes.forEach((cl, i) => {
    const nm = cl && cl.name != null ? String(cl.name).trim() : '';
    if (!nm) { errors.push(`第 ${i + 1} 个班级名称为空。`); return; }
    if (clsNames.has(nm)) errors.push(`班级名称重复：「${nm}」，同一个班级名只能对应一组选科组合。`);
    else clsNames.set(nm, true);
    if (!((cl && cl.comboIds) || []).length) errors.push(`班级「${nm}」未勾选任何选科组合，该班学生将回退到第一个组合。`);
  });
  const bands = settings && settings.bands;
  if (!Array.isArray(bands) || !bands.length) {
    errors.push('赋分档位为空，已临时使用默认 5 档。');
  } else {
    const sum = bands.reduce((a, b) => a + (Number(b.pct) || 0), 0);
    if (Math.abs(sum - 100) > 0.01) errors.push(`各档比例合计为 ${sum}%，应为 100%。`);
    let prevMin = null;
    bands.forEach((b, i) => {
      const label = b.name || '第 ' + (i + 1) + ' 档';
      if (!(Number(b.pct) >= 0 && Number(b.pct) <= 100)) errors.push(`${label}：比例须在 0–100% 之间。`);
      if (!(Number(b.min) >= 0 && Number(b.max) <= 100 && Number(b.min) <= Number(b.max))) {
        errors.push(`${label}：赋分区间须在 0–100 分之间，且下限不大于上限。`);
      }
      // 档位按分值从高到低排列：下一档的下限应低于上一档的下限，且区间不重叠
      if (prevMin != null && Number(b.min) >= prevMin) errors.push(`${label}：赋分下限须低于上一档的下限（档位从高到低排列）。`);
      prevMin = Number(b.min);
    });
  }
  const l1 = Number(settings && settings.line1), l2 = Number(settings && settings.line2);
  if (!Number.isFinite(l1) || l1 < 0 || l1 > 750) errors.push('G1 线须在 0–750 分之间。');
  if (!Number.isFinite(l2) || l2 < 0 || l2 > 750) errors.push('G2 线须在 0–750 分之间。');
  if (Number.isFinite(l1) && Number.isFinite(l2) && l2 >= l1) errors.push('G2 线须低于 G1 线。');
  return errors;
}

function dataWarnings(exams, settings) {
  const out = validateSettings(settings);
  for (let i = 0; i < exams.length; i++) {
    const ex = exams[i];
    const l1 = Number(ex.line1), l2 = Number(ex.line2);
    if (Number.isFinite(l1) && (l1 < 0 || l1 > 750)) out.push(`「${ex.name}」G1 线 ${l1} 超出 0–750，计算时已用默认值。`);
    if (Number.isFinite(l2) && (l2 < 0 || l2 > 750)) out.push(`「${ex.name}」G2 线 ${l2} 超出 0–750，计算时已用默认值。`);
    if (Number.isFinite(l1) && Number.isFinite(l2) && l2 >= l1) out.push(`「${ex.name}」G2 线不低于 G1 线，计算时已自动调整。`);
    const students = Array.isArray(ex.students) ? ex.students : [];
    const seen = new Set(), dup = [];
    for (const s of students) {
      const key = studentKey(s);
      if (seen.has(key)) dup.push(s.name || key);
      seen.add(key);
    }
    if (dup.length) out.push(`「${ex.name}」有 ${dup.length} 条重复身份（${dup.slice(0, 3).join('、')}${dup.length > 3 ? '…' : ''}），跨场对比会取第一条；请补学号并重导。`);
    const withId = students.filter(s => studentIdentity(s).studentId).length;
    if (students.length && !withId) out.push(`「${ex.name}」没有学号，按「班级 + 姓名」临时对齐；同名/改名/转班时建议补学号。`);
  }
  return out;
}

/* --- 成绩模板 / 规范导出（动态科目） --- */
function csvEscape(v) {
  const s = String(v == null ? '' : v);
  return /[",\r\n]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s;
}
function csvCellNum(v) {
  return v == null || v === '' || isNaN(Number(v)) ? '' : v;
}
/* 根据 settings 里的组合定义生成表头 */
function buildTemplateHeaders(settings) {
  const combos = (settings && settings.combos) || DEFAULT_COMBOS;
  const subjKeys = new Set();
  for (const c of combos) for (const k of comboSubjectKeys(c)) subjKeys.add(k);
  // 语数外 + 物理/历史 + 赋分科目
  const ordered = ['chinese', 'math', 'english'];
  if (subjKeys.has('physics')) ordered.push('physics');
  if (subjKeys.has('history')) ordered.push('history');
  for (const k of TRACK2_KEYS) if (subjKeys.has(k)) ordered.push(k);
  const headers = ['学号', '姓名', '班级', '选科组合', '年级排名'];
  for (const k of ordered) {
    const def = SUBJECT_MAP[k];
    headers.push(def ? def.name : k);
  }
  // 赋分列
  for (const k of TRACK2_KEYS) {
    if (subjKeys.has(k) && SUBJECT_MAP[k] && SUBJECT_MAP[k].assigned) {
      headers.push((SUBJECT_MAP[k].name || k) + '赋分');
    }
  }
  return { headers, subjectKeys: ordered };
}
/* 名单模板带学号，保证跨场追踪与重名区分 */
function buildTemplateCsv(students, settings) {
  const { headers, subjectKeys } = buildTemplateHeaders(settings);
  const rows = [headers.slice()];
  for (const s of (students || [])) {
    const row = [s.studentId || '', s.name || '', s.cls || '', s.comboName || s.comboId || '', csvCellNum(s.yearRank)];
    for (const k of subjectKeys) row.push(csvCellNum(s[k]));
    // 赋分列
    const subjSet = new Set(subjectKeys);
    for (const k of TRACK2_KEYS) {
      if (subjSet.has(k) && SUBJECT_MAP[k] && SUBJECT_MAP[k].assigned) {
        row.push(csvCellNum(s[k + 'Score'] || s[k + 'Assigned']));
      }
    }
    rows.push(row);
  }
  return String.fromCharCode(0xFEFF) + rows.map(r => r.map(csvEscape).join(',')).join('\r\n') + '\r\n';
}
/* 本场规范化成绩表（含原始分、赋分、总分、名次、上线） */
function buildGradesExportCsv(rows) {
  const out = [];
  if (!rows.length) return String.fromCharCode(0xFEFF);

  const subjKeys = [];
  const seen = new Set();
  for (const r of rows) {

  out.push(head.map(csvEscape).join(','));

    const row = [

      csvCellNum(r.classRank), csvCellNum(r.comboRank), r.lineStatus || '',
    ];
    out.push(row.map(csvEscape).join(','));

/* --- 导入解析：CSV / TSV，自动识别表头、汇总行、空班级、无关列 --- */
function splitImportLines(text) {
  const lines = String(text == null ? '' : text).replace(/^\uFEFF/, '').split(/\r\n|\n|\r/).map(l => l.replace(/\u00A0/g, ' ').trimEnd());
  while (lines.length && lines[lines.length - 1].trim() === '') lines.pop();
  return lines;
}
function normalizeCell(raw) {
  let s = String(raw == null ? '' : raw);
  s = s.replace(/\u00A0/g, ' ').replace(/\u3000/g, ' ');
  // 全角 ASCII（数字、字母、括号、逗号等）转半角
  s = s.replace(/[！-～]/g, ch => String.fromCharCode(ch.charCodeAt(0) - 0xFEE0));
  return s.replace(/\s+/g, ' ').trim();
}
function normalizeHeader(raw) {
  return normalizeCell(raw).replace(/[\s（）()【】\[\]：:·.、]/g, '');
}
function detectDelimiter(lines) {
  let tab = 0, comma = 0, semi = 0;
  for (const ln of lines.slice(0, 30)) {
    tab += (ln.match(/\t/g) || []).length;
    comma += (ln.match(/,/g) || []).length;
    semi += (ln.match(/;/g) || []).length;
  }
  if (tab > 0) return '\t';
  if (semi > comma) return ';';
  return ',';
}
function splitImportLine(line, delim) {
  const out = [];
  let cur = '', quoted = false;
  for (let i = 0; i < line.length; i++) {
    const ch = line[i];
    if (quoted) {
      if (ch === '"') {
        if (line[i + 1] === '"') { cur += '"'; i++; }
        else quoted = false;
      } else cur += ch;
    } else if (ch === '"') {
      quoted = true;
    } else if (ch === delim) {
      out.push(cur); cur = '';
    } else cur += ch;
  }
  out.push(cur);
  return out.map(normalizeCell);
}

const HEADER_IGNORE_RE = /(序号|编号|总分|合计|小计|统计|人数|平均|均分|最高|最低|及格率|优秀率|标准差|中位数|排名|名次|位次|等第|备注|联系|电话|地址|特长|评语)/;
function subjectHeaderScore(s, label) {
  if (s === label) return 100;
  if (s === label + '成绩' || s === label + '分数' || s === label + '原始分' || s === label + '得分') return 95;
  if (s.startsWith(label)) return 85;
  if (s.includes(label)) return 70;
  return 0;
}
/* 全科目识别（含历史/生物/政治） */
const SUBJ_HEADER_DEFS = [
  { key: 'chinese',  re: /语文/, name: '语文' },
  { key: 'math',     re: /数学/, name: '数学' },
  { key: 'english',  re: /英语|外语/, name: '英语' },
  { key: 'physics',  re: /物理/, name: '物理' },
  { key: 'history',  re: /历史/, name: '历史' },
  { key: 'chem',     re: /化学/, name: '化学', skip: /化学与生活/ },
  { key: 'bio',      re: /生物/, name: '生物' },
  { key: 'politics', re: /政治/, name: '政治' },
  { key: 'geo',      re: /地理/, name: '地理' },
];
function headerMatch(raw) {
  const s = normalizeHeader(raw);
  if (!s) return null;
  if (/(学号|考号|考生号|学籍号|准考证号)/.test(s) && !/(姓名|班级)/.test(s)) return { key: 'studentId', score: 100 };
  if (/(姓名|名字)/.test(s) && !/(拼音|家长|教师|老师)/.test(s)) return { key: 'name', score: 100 };
  if (/^(学生|考生)$/.test(s)) return { key: 'name', score: 90 };
  // 首选科目位：表头写「首选」「物理/历史」「物理历史」等泛指时，
  // 由该生组合决定这列装物理还是历史（否则历史类学生的分会装进物理列）
  if (/(首选|物理\/历史|物理历史|历史\/物理|历史物理|物理或历史|第一学科)/.test(s)
      && !/(赋分|等级分|转换分|标准分)/.test(s)) {
    return { key: 'track1', score: 98 };
  }
  // 选科组合列
  if (/(选科组合|选科|组合|科目组合)/.test(s) && !/(排名|名次)/.test(s)) return { key: 'combo', score: 90 };
  // 年级排名（学校官方年排）：优先于普通的“排名/名次”忽略规则
  if (/(年级排名|年级名次|全年级排名|全校排名|校排名|校名次|年排|总分排名|总排名)/.test(s)
      && !/(班级|班内|班排|班名次|单科|学科|语文|数学|英语|外语|物理|化学|生物|政治|历史|地理|省|市|区|变化|升降)/.test(s)) {
    return { key: 'yearRank', score: 100 };

  const uniq = new Set(ne).size / ne.length;
  const sequential = ne.every(v => /^\d{1,3}$/.test(v)) &&
    ne.map(Number).sort((a, b) => a - b).every((v, i) => v === i + 1);
  const idLike = ne.filter(v => /^[A-Za-z0-9_-]{4,32}$/.test(v) && /\d/.test(v) && !/^\d{1,3}$/.test(v)).length;
  return uniq > 0.8 && !sequential && idLike / ne.length >= 0.8 ? 2 : 0;
}
function extraColumnKind(vals) {
  let nums = [], nonEmpty = 0;
  for (const raw of vals) {
    const s = normalizeCell(raw);
    if (!s) continue;
    nonEmpty++;
    const p = parseImportScore(raw);
    if (p.error || p.value == null) continue;
    nums.push(p.value);
  }
  if (!nonEmpty) return 'empty';
  if (nums.length / nonEmpty < 0.6) return 'other';
  if (nums.some(v => v > 150)) return 'total';
  if (nums.some(v => v < 20)) return 'rank';
  if (nums.every(v => v >= 0 && v <= 150)) return 'assigned';
  return 'other';
}

function parseNoHeaderTable(lines, delim, opts) {
  opts = opts || {};
  const rawRows = [];
  for (let i = 0; i < lines.length; i++) {
    const cells = splitImportLine(lines[i], delim);
    if (cells.some(c => c !== '')) rawRows.push({ line: i + 1, cells });
  }
  if (!rawRows.length) return { students: [], errors: ['没有内容'], notes: [], meta: null };

  const maxLen = Math.max.apply(null, rawRows.map(r => r.cells.length));
  // 1. 找姓名列（唯一性高的中文姓名列）
  let nameIdx = 0, bestNameScore = -Infinity;
  for (let j = 0; j < Math.min(6, maxLen); j++) {
    const sc = nameColumnScore(rawRows.map(r => r.cells[j] == null ? '' : r.cells[j]));
    if (sc > bestNameScore) { bestNameScore = sc; nameIdx = j; }
  }
  if (!isFinite(bestNameScore) || bestNameScore <= 0) nameIdx = 0;

  // 2. 找成绩列起点（允许姓名与成绩之间夹班级/序号列）
  //    科目数不固定：从 6 到 9 逐个尝试，取评分最高的起点
  const start = nameIdx + 1;
  let bestStart = -1, bestScore = -Infinity, bestCount = 0;
  for (let s = start; s <= Math.min(start + 3, maxLen - 1); s++) {
    for (let cnt = 6; cnt <= 9; cnt++) {
      if (s + cnt > maxLen) continue;
      let sc = 0, valid = 0;
      for (let k = 0; k < cnt; k++) {
        const def = SUBJECT_DEFS[k];
        const one = subjectColumnScore(rawRows.map(r => r.cells[s + k] == null ? '' : r.cells[s + k]), def.max);
        if (one > 0) valid++;
        sc += one;
      }
      if (valid < 3) continue;
      if (s === start) sc += 0.5;
      if (sc > bestScore) { bestScore = sc; bestStart = s; bestCount = cnt; }
    }
  }
  if (bestStart < 0) {
    return {
      students: [], errors: ['没识别到表头，也无法按列位置识别成绩。建议先点「下载空白模板」按模板填写，或确认每行包含姓名和各科成绩。'],
      notes: [], meta: null,
    };
  }
  const subjCount = bestCount;

  // 3. 学号 / 班级列：姓名与成绩之间，或姓名之前
  let clsIdx = -1, studentIdIdx = -1;
  const colVals = j => rawRows.map(r => r.cells[j] == null ? '' : r.cells[j]);
  for (let j = start; j < bestStart; j++) {
    if (studentIdIdx < 0 && studentIdColumnScore(colVals(j)) > 0) { studentIdIdx = j; continue; }
    if (clsIdx < 0 && classColumnScore(colVals(j)) > 0) clsIdx = j;
  }
  if (nameIdx > 0) {
    if (studentIdIdx < 0 && studentIdColumnScore(colVals(nameIdx - 1)) > 0) studentIdIdx = nameIdx - 1;
    if (clsIdx < 0 && classColumnScore(colVals(nameIdx - 1)) > 0) clsIdx = nameIdx - 1;
  }
  if (studentIdIdx === clsIdx) studentIdIdx = -1;
  // 常见老格式：姓名 + 班级 + 六科（正好 8 列）直接认定，
  // 避免把某一科里的错字（如 "abc"）当成"额外列"跳过去。
  if (bestStart > start && clsIdx === start && maxLen === nameIdx + 8) { bestStart = start + 1; }

  // 4. 多出来的列：赋分 / 总分 / 名次 / 备注
  const extraStart = bestStart + subjCount;
  let yearRankIdx = null, ignoredExtras = 0;
  const assignedIdx = [];
  for (let j = extraStart; j < maxLen; j++) {
    const kind = extraColumnKind(rawRows.map(r => r.cells[j] == null ? '' : r.cells[j]));
    if (kind === 'assigned') {
      assignedIdx.push(j);
    } else if (kind === 'rank') {
      if (yearRankIdx == null) yearRankIdx = j;
      else ignoredExtras++;
    } else if (kind !== 'empty') {
      ignoredExtras++;
    }
  }
  // 有些表把年排放在姓名和成绩之间
  if (yearRankIdx == null) {
    for (let j = start; j < bestStart; j++) {
      if (j === clsIdx) continue;
      if (extraColumnKind(rawRows.map(r => r.cells[j] == null ? '' : r.cells[j])) === 'rank') { yearRankIdx = j; break; }
    }
  }
  const ignoredBefore = Math.max(0, bestStart - start
    - (clsIdx >= start && clsIdx < bestStart ? 1 : 0)
    - (studentIdIdx >= start && studentIdIdx < bestStart ? 1 : 0)
    - (yearRankIdx != null && yearRankIdx >= start && yearRankIdx < bestStart && yearRankIdx !== clsIdx && yearRankIdx !== studentIdIdx ? 1 : 0));

  // 5. 解析
  const students = [], errors = [], notes = [];
  const seen = new Set(), seenNames = new Map();
  let duplicateKeys = 0;
  let lastCls = '', filled = 0, skipped = 0, blankRows = 0;
  // 无表头时按位置猜科目：语数外固定在前三列，其余按「已配置组合里最常见的排列」推断。
  // 排列候选：把每个组合的科目顺序按出现频次排序，频次相同则用标准顺序（语数外→物理→历史→化生政地）。
  const combos = (opts.combos) || DEFAULT_COMBOS;
  const comboKeyOrder = [];
  for (const c of combos) {
    for (const k of comboSubjectKeys(c)) if (!comboKeyOrder.includes(k)) comboKeyOrder.push(k);
  }
  // 统计每个科目出现在第几位（按组合）的频次，取最常见的位置
  const posCount = {};
  for (const c of combos) {
    comboSubjectKeys(c).forEach((k, idx) => {
      if (!posCount[k]) posCount[k] = {};
      posCount[k][idx] = (posCount[k][idx] || 0) + 1;
    });
  }
  const guessKeys = comboKeyOrder.slice().sort((a, b) => {
    // 该科目在所有组合里出现在第 0/1/2 位的累计次数（越靠前越优先）
    const score = k => {
      const m = posCount[k] || {};
      return (m[0] || 0) * 100 + (m[1] || 0) * 10 + (m[2] || 0);
    };
    const d = score(b) - score(a);
    if (d !== 0) return d;
    return SUBJECT_ORDER.indexOf(a) - SUBJECT_ORDER.indexOf(b);
  });
  // 用户指定的科目列映射（列序号 → 科目 key）；没指定时按位置猜
  const userMap = opts.subjectMap || null;
  const guessed = [];
  for (let k = 0; k < subjCount; k++) {
    guessed.push(userMap && userMap[k] ? userMap[k] : (guessKeys[k] || ''));
  }
  for (const r of rawRows) {
    const cells = r.cells;
    if (isAggregateRow(cells)) { skipped++; continue; }
    if (studentIdIdx >= 0 && /^(学号|考号|考生号|学籍号)/.test(normalizeHeader(cells[studentIdIdx] || ''))) { skipped++; continue; }
    const name = normalizeCell(cells[nameIdx] || '');
    if (!name) {
      if (cells.some(c => normalizeCell(c) !== '')) errors.push(`第 ${r.line} 行：姓名为空，已跳过`);
      continue;
    }
    if (/^(姓名|学生姓名|名字|备注|说明|注)[:：]?/.test(name)) { skipped++; continue; }
    if (!looksLikeName(name) && cells.filter(c => normalizeCell(c) !== '').length <= 2) { skipped++; continue; }
    let cls = clsIdx >= 0 ? normalizeCell(cells[clsIdx] || '') : '';
    if (!cls && lastCls) { cls = lastCls; filled++; }
    if (cls) lastCls = cls;
    const studentId = studentIdIdx >= 0 ? normalizeStudentId(cells[studentIdIdx]) : '';
    // 组合：无表头时按班级配置推断
    let comboId = '';
    if (cls) {
      const byCls = comboForClass(cls, opts.classes, combos);
      if (byCls) comboId = byCls.id;
    }
    const row = { studentId, name, cls, comboId };
    let blanks = 0;
    for (let k = 0; k < subjCount; k++) {
      const key = guessed[k];
      if (!key) { blanks++; continue; }
      const def = SUBJECT_MAP[key];
      const v = parseImportScoreField(row, cells, bestStart + k, key, def ? def.name : key, def ? def.max : 100, r.line, errors);
      if (v == null) blanks++;
    }
    // 额外列里的赋分：按已配置的组合顺序，把前 N 个赋分列对应到该生的赋分科目
    const assignKeyPool = TRACK2_KEYS.filter(k => comboKeyOrder.includes(k));
    for (let i = 0; i < assignedIdx.length; i++) {
      const key = (opts.assignedMap && opts.assignedMap[i]) || assignKeyPool[i];
      if (!key) break;
      parseImportScoreField(row, cells, assignedIdx[i], key + 'Score', (SUBJECT_MAP[key] ? SUBJECT_MAP[key].name : key) + '赋分', 100, r.line, errors);
    }
    const allSubjectBlank = guessed.every(k => row[k] == null);
    if (allSubjectBlank && assignedIdx.length === 0) { skipped++; continue; }
    applyYearRank(row, yearRankIdx != null ? cells[yearRankIdx] : '', r.line, errors);
    if (blanks) blankRows++;
    const key = studentKey(row);
    if (seen.has(key)) {
      duplicateKeys++;
      errors.push(`第 ${r.line} 行：学生「${name}」与前面重复（${studentId || '班级 + 姓名'}），已拦截导入；请补唯一学号或改名后缀`);
    }
    seen.add(key);
    if (!studentId && seenNames.has(name) && seenNames.get(name) !== cls) {
      errors.push(`第 ${r.line} 行：不同班级出现同名「${name}」，且没有学号，已拦截导入`);
    }
    if (!studentId) seenNames.set(name, cls);
    students.push(row);
  }

  notes.push('未识别到表头，已按列位置自动整理（建议下次用「下载空白模板」）');
  notes.push(`识别为：${studentIdIdx >= 0 ? '学号 + ' : ''}姓名${clsIdx >= 0 ? ' + 班级' : ''} + ${subjCount} 科（${guessed.map(k => SUBJECT_MAP[k] ? SUBJECT_MAP[k].name : (k || '未识别')).join('、')}）`);
  if (!userMap) notes.push('科目列是按位置推测的，请在下方「科目列对照」里核对；有表头的表不会走到这里。');
  if (studentIdIdx < 0 && students.length) notes.push(`${students.length} 人未带学号：按「班级 + 姓名」临时对齐，建议改用新模板`);
  if (studentIdIdx >= 0 && students.some(s => !s.studentId)) errors.push('有学生学号为空，已拦截导入；请补齐唯一学号');
  if (yearRankIdx != null) notes.push('识别到年级排名列（无表头时按名次列处理）');
  else if (opts.requireYearRank) notes.push('未识别到年级排名列（必填）');
  if (assignedIdx.length) notes.push(`识别到 ${assignedIdx.length} 个赋分列（无表头时按已配置组合的赋分科目顺序对应）`);
  if (ignoredExtras) notes.push(`忽略 ${ignoredExtras} 列（疑似总分/名次/备注）`);
  if (ignoredBefore) notes.push(`忽略姓名与成绩之间的 ${ignoredBefore} 列（疑似序号/学号）`);
  if (filled) notes.push(`补全 ${filled} 行空班级（按上一行向下填充）`);
  if (skipped) notes.push(`跳过 ${skipped} 行标题/汇总/说明行`);
  if (blankRows) notes.push(`有 ${blankRows} 行存在空分（按缺考处理）`);
  const missingYearRank = students.filter(s => s.yearRank == null).length;
  if (opts.requireYearRank && missingYearRank) {
    errors.push(yearRankIdx == null
      ? `年级排名为必填：没有识别到名次列（缺 ${missingYearRank} 人）`
      : `年级排名为必填：有 ${missingYearRank} 人未填写或填写无效`);
  }
  if (!students.length && !errors.length) errors.push('没有解析出学生，请检查内容和列顺序');
  return { students, errors, notes, meta: {
    mode: 'position', nameIdx, subjStart: bestStart, subjCount, clsIdx, skipped, filledClass: filled,
    yearRankColumn: yearRankIdx != null, missingYearRank, requireYearRank: !!opts.requireYearRank,
    guessedSubjects: guessed, assignedIdx, assignedMap: opts.assignedMap || null,
    subjectStart: bestStart,
  } };
}

function parseImport(text, opts) {
  opts = opts || {};
  const lines = splitImportLines(text);
  if (!lines.length) return { students: [], errors: ['没有内容'], notes: [], meta: null };
  let delim = detectDelimiter(lines);
  let header = findHeader(lines, delim);
  if (!header) {
    for (const d of ['\t', ',', ';']) {
      if (d === delim) continue;
      const h = findHeader(lines, d);
      if (h && (!header || h.score > header.score)) { header = h; delim = d; }
    }
  }  if (header) {
    // 两行表头：科目行 + 原始分/赋分行
    const mainCells = header.cells || splitImportLine(lines[header.index], delim);
    const nextIdx = header.index + 1;
    if (nextIdx < lines.length) {
      const subCells = splitImportLine(lines[nextIdx], delim);
      if (isSubHeaderCells(subCells)) {
        const mergedCells = mergeHeaderCells(mainCells, subCells);
        const merged = buildHeaderCandidate(mergedCells, header.index);
        if (merged.hasName && merged.subjCount >= header.subjCount) {
          merged.subRows = 1;
          header = merged;
        }
      }
    }
    return parseHeaderTable(lines, delim, header, opts);
  }
  return parseNoHeaderTable(lines, delim, opts);
}

/* --- 各科评估 --- */
function subjectEval(row, subj, schoolAvg, classAvg, classCount, history, examIdx) {
  const score = row.subj[subj.key];
  if (score == null) return null;
  const rate = score / subj.max;
  let level, levelCls;
  if (rate >= 0.85) { level = '优秀'; levelCls = 'good'; }
  else if (rate >= 0.70) { level = '良好'; levelCls = 'ok'; }
  else if (rate >= 0.60) { level = '中等'; levelCls = 'warn'; }
  else { level = '待提高'; levelCls = 'crit'; }
  // 近三场趋势：保留缺考场次为空，只有最近两场连续有成绩才判断升降
  const window = history.slice(Math.max(0, examIdx - 2), examIdx + 1);
  while (window.length < 3) window.unshift(null);
  const vals = window.map(r => r && r.subj ? r.subj[subj.key] : null);
  let trend = null, trendDelta = null;
  if (vals[1] != null && vals[2] != null) {
    trendDelta = vals[2] - vals[1];
    trend = trendDelta > 0 ? 'up' : (trendDelta < 0 ? 'down' : 'flat');
  }
  return {
    score, rate, level, levelCls,
    rank: row[subj.key + 'Rank'],
    vsSchool: schoolAvg != null ? score - schoolAvg : null,
    vsClass: classAvg != null ? score - classAvg : null,
    trend, trendDelta, spark: vals,
  };
}

/* --- 偏科 / 不匹配判定（双口径，两档：关注 / 预警） ---
   口径说明（「不匹配」= 该科相对应有水平明显落后）：
   1. 自身失衡【定档】：某科得分率 比 该生各科平均得分率 低多少。
   2. 名单落后【佐证 / 排序】：该科 比名单均分低 / 排名落入后段。
   为什么定档只看自身失衡：各科里「总有一科排在后段」是数学必然，
   单独用排名会几乎人人误报；名单口径用来说明「落后是否也被榜单印证」，
   并据此排优先级，不改变档位。
   两档：
   - 关注：自身失衡达 selfGap。
   - 预警：自身失衡达 severeGap。
   参数可在设置页调整。 */
function mismatchSettings() {
  const s = (data && data.settings && data.settings.mismatch) || {};
  const d = DEFAULT_MISMATCH;
  return {
    selfGap: Number.isFinite(s.selfGap) ? s.selfGap : d.selfGap,
    vsAvgGap: Number.isFinite(s.vsAvgGap) ? s.vsAvgGap : d.vsAvgGap,
    rankTail: Number.isFinite(s.rankTail) ? s.rankTail : d.rankTail,
    severeGap: Number.isFinite(s.severeGap) ? s.severeGap : d.severeGap,
    minRanked: Number.isFinite(s.minRanked) ? s.minRanked : d.minRanked,
  };
}
/* examIdx 取最近一场有成绩的考试；从 row.subj 取该生自己选考科目的得分率。
   subjAvgs: {chinese: 均分, ...}（本场名单该科均分），缺省时名单口径只按排名。
   subjectKeys: 该生本场的科目列表（由 row.subjectKeys 提供） */
function mismatchEval(row, examIdx, subjAvgs) {
  if (!row || !row.subj) return null;
  const cfg = mismatchSettings();
  const keys = row.subjectKeys && row.subjectKeys.length
    ? row.subjectKeys
    : SUBJECT_DEFS.map(s => s.key).filter(k => row.subj[k] != null);
  const ranks = [];
  const rates = [];
  for (const k of keys) {
    const def = SUBJECT_MAP[k];
    if (!def) continue;
    const v = row.subj[k];
    if (v == null) continue;
    const rank = row[k + 'Rank'];
    const ranked = rank != null && Number.isFinite(rank);
    if (ranked) ranks.push(rank);
    const avg = subjAvgs && Number.isFinite(subjAvgs[k]) ? subjAvgs[k] : null;
    rates.push({ key: k, name: def.name, score: v, max: def.max, rate: v / def.max, rank, ranked,
      avgRate: avg != null ? avg / def.max : null });
  }
  if (rates.length < 2) return null;
  const selfAvg = rates.reduce((a, x) => a + x.rate, 0) / rates.length;
  const listTotal = ranks.length ? Math.max.apply(null, ranks) : null;
  const useRank = listTotal != null && listTotal >= cfg.minRanked;
  const subjects = rates.map(x => {
    const selfGap = selfAvg - x.rate;                    // 正 = 低于自身平均
    const vsAvgGap = x.avgRate != null ? x.avgRate - x.rate : null; // 正 = 低于名单均分
    const tail = (useRank && x.ranked && x.rank <= listTotal) ? x.rank / listTotal : null;
    const selfHit = selfGap >= cfg.selfGap;
    const avgHit = vsAvgGap != null && vsAvgGap >= cfg.vsAvgGap;
    const rankHit = tail != null && tail > (1 - cfg.rankTail);
    // 名单口径 = 低于均分 或 排名后段；只作佐证与排序，不单独触发、不改档位
    const listHit = avgHit || rankHit;
    let level = 'ok';
    if (selfHit) level = selfGap >= cfg.severeGap ? 'severe' : 'watch';
    return { ...x, selfGap, vsAvgGap, tail, selfHit, avgHit, rankHit, listHit, level };
  });
  const flagged = subjects.filter(x => x.level !== 'ok').sort((a, b) => (b.selfGap + (b.vsAvgGap || 0)) - (a.selfGap + (a.vsAvgGap || 0)));
  if (!flagged.length) return { level: 'ok', subjects, weakest: null, strongest: null, listTotal, selfAvg };
  const worst = flagged[0];
  const level = flagged.some(x => x.level === 'severe') ? 'severe' : 'watch';
  const strongest = subjects.slice().sort((a, b) => b.rate - a.rate)[0];
  return { level, subjects, weakest: worst, strongest, flagged, listTotal, selfAvg };
}

/* --- 复习建议（按得分率 + 趋势生成） --- */
function buildAdvice(subj, ctx) {
  // ctx: {rate, trend, trendDelta, vsSchool, score, schoolAvg, subjectName}
  const weak = ctx.rate < 0.65, mid = ctx.rate >= 0.65 && ctx.rate < 0.80;
  const down = ctx.trend === 'down';
  const gap = ctx.vsSchool != null ? Math.round(Math.abs(ctx.vsSchool)) : null;
  let core = '';
  switch (subj.key) {
    case 'chinese':
      core = weak
        ? '优先抓「性价比」：默写 64 篇篇目轮背（每天 15 分钟）、文言实词虚词过一遍课内清单，这两块最接近「背了就得分」。现代文阅读先固化答题模板（概括题、作用题、探究题各一套话术），作文准备 3 个可迁移素材。'
        : mid
          ? '阅读题的失分多半在「答题不全点」：对答案时数一数自己踩到几个得分点，补齐漏掉的角度。作文升格练「一材多用」，把现有素材写出层次。'
          : '基础已稳，重点放在作文和阅读的「精准度」：研究近几次大考的评分细则，把丢掉的步骤分、要点分找回来。';
      break;
    case 'math':
      core = weak
        ? '先把选填的正确率打上来：每天 1 组限时选填（40 分钟内），目标正确率 80%。大题保住前 2 问的过程分——三角、数列、概率统计这三个板块相对好拿，优先练熟。'
        : mid
          ? '主攻两个「拉分大户」：解析几何与导数的第 2 问。每天 1 题大题精做（写出完整过程再对答案），同时保持选填手感不掉。'
          : '目标是压轴题的步骤分与全卷零失误：每周 2 次全卷限时模拟，重点复盘「会做但做错」的题，这类分丢得最冤。';
      break;
    case 'english':
      core = weak

        : mid
          ? '主观题是最值分的增量：练「设问拆解」，把「如何做」「为什么」翻译成答题要点，每题写满要点再对照答案补漏。选择题重点练组合型、时政型易错项。'
          : '冲高分要靠术语的精准和逻辑的层次：把同一话题的答题角度分类整理（主体、层面、领域），遇到新题直接套框架；关注时政热点的固定表述。';
      break;
    case 'geo':
      core = weak
        ? '区域定位和地图判读先过关：每张图问自己「在哪、什么特征、为什么」。自然地理的气候、地形成因背熟答题模板。'
        : mid
          ? '综合题失分多在「术语不专业、要点不全」：背熟常用答题术语（如「昼夜温差大—有利于养分积累」），对照答案补角度。'
          : '冲击高分靠材料信息的提取和「地理过程」的逻辑链：练从材料里抠隐藏条件，答题按「因果链」展开。';
      break;
  }
  if (down && ctx.trendDelta != null) {
    core += `近两次下滑了 ${Math.abs(Math.round(ctx.trendDelta))} 分，先回看上次考试的丢分题，确认是知识点漏洞还是失误，再对症练。`;
  } else if (ctx.trend === 'up' && ctx.trendDelta) {
    core += `近两次在回升（+${Math.round(ctx.trendDelta)} 分），保持当前节奏。`;
  }
  if (gap != null && ctx.vsSchool != null && ctx.vsSchool < 0) {
    core += `目前比${ctx.avgLabel || '本次名单均分'}低 ${gap} 分，先把这一截追平。`;
  }
  const priority = Math.round((1 - ctx.rate) * 100) + (down ? 25 : 0) + (ctx.vsSchool != null && ctx.vsSchool < 0 ? 10 : 0);
  return { text: core, priority };
}

/* --- 学生简报 markdown（导出 / 发给 AI 的数据包） --- */
function studentBriefMd(ctx) {
  // ctx: {name, cls, comboName, trackName, examNames, rows, line1, line2, profile, subjEvals, ruleAdvice}
  const L = [];
  const keys = (ctx.subjectKeys && ctx.subjectKeys.length)
    ? ctx.subjectKeys
    : ['chinese', 'math', 'english', 'physics', 'chem', 'geo'];
  const subjName = k => SUBJECT_MAP[k] ? SUBJECT_MAP[k].name : k;
  const head = ['考试', ...keys.map(k => subjName(k) + (isAssignedSubject(k) ? '(赋分)' : '')), '总分', '年级排名', '物理类', '历史类', '班内排名', '组合内排名', '较上场', '上线'];
  L.push('# 学生学业数据简报');
  L.push('');
  L.push(`- 学生：${ctx.name}${ctx.cls ? '（' + ctx.cls + '）' : ''}`);
  if (ctx.comboName) L.push(`- 选科组合：${ctx.comboName}（${ctx.trackName || ''}）`);
  if (ctx.profile && ctx.profile.goal) L.push(`- 目标：${ctx.profile.goal}`);
  if (ctx.profile && ctx.profile.notes) L.push(`- 背景备注：${ctx.profile.notes}`);
  L.push(`- 数据范围：${ctx.examNames.join('、')}（共 ${ctx.examNames.length} 次考试）`);
  L.push(`- 分数线：G1·${lineName1(data.settings)} ${ctx.line1} / G2·${lineName2(data.settings)} ${ctx.line2}`);
  L.push('- 总分口径：语数外（各 150）+ 物理或历史（100）+ 两门选考赋分（各 100），满分 750');
  L.push('- 年级排名：优先采用学校官方年排；没有年排的旧数据按导入名单计算');
  L.push('- 单科名次、各科均分均以本次导入名单为范围，不代表全校');
  L.push('');
  L.push('## 历次成绩');
  L.push('');
  L.push('| ' + head.join(' | ') + ' |');
  L.push('|' + head.map(() => '---').join('|') + '|');
  ctx.rows.forEach((r, i) => {
    if (!r) { L.push(`| ${ctx.examNames[i]} | ` + head.slice(1).map(() => '—').join(' | ') + ' | 无记录 |'); return; }
    const s = k => r.subj[k] == null ? '—' : r.subj[k];
    const d = r.totalDelta == null ? '—' : (r.totalDelta > 0 ? '+' + r.totalDelta : String(r.totalDelta));
    const cells = [
      ctx.examNames[i], ...keys.map(s),
      r.total == null ? '—' : r.total,
      r.totalRank == null ? '—' : r.totalRank,
      r.physRank == null ? '—' : r.physRank,
      r.histRank == null ? '—' : r.histRank,
      r.classRank == null ? '—' : r.classRank,
      r.comboRank == null ? '—' : r.comboRank,
      d, r.lineStatus || '—',
    ];
    L.push('| ' + cells.join(' | ') + ' |');
  });
  L.push('');
  if (ctx.subjEvals && ctx.subjEvals.length) {
    L.push('## 最近一次各科与本次名单均分对比');
    L.push('');
    L.push('| 科目 | 得分 | 满分 | 得分率 | 本次名单单科名次 | 名单均分 | 与名单均分差 | 近三次走势 |');
    L.push('|---|---|---|---|---|---|---|---|');
    for (const e of ctx.subjEvals) {
      const trend = e.trendDelta == null ? '数据不连续' : (e.trendDelta > 0 ? '+' + e.trendDelta : String(e.trendDelta));
      L.push(`| ${e.name} | ${e.score} | ${e.max} | ${Math.round(e.rate * 100)}% | ${e.rank == null ? '—' : e.rank} | ${e.schoolAvg == null ? '—' : Math.round(e.schoolAvg * 10) / 10} | ${e.vsSchool == null ? '—' : (e.vsSchool > 0 ? '+' : '') + Math.round(e.vsSchool * 10) / 10} | ${trend} |`);
    }
    L.push('');
  }
  if (ctx.mismatch && ctx.mismatch.level !== 'ok') {
    const mm = ctx.mismatch;
    L.push('## 偏科 / 不匹配（系统判定，供参考）');
    L.push('');
    L.push(`- 判定：${mm.level === 'severe' ? '● 预警（严重不匹配，建议优先介入）' : '⚠ 关注（明显偏科，建议谈话）'}`);
    for (const x of mm.flagged) {
      const parts = [`得分率 ${Math.round(x.rate * 100)}%`];
      if (x.selfHit) parts.push(`比自身各科平均（${Math.round(mm.selfAvg * 100)}%）低 ${Math.round(x.selfGap * 100)}%`);
      if (x.avgHit && x.vsAvgGap != null) parts.push(`比该科名单均分低 ${Math.round(x.vsAvgGap * 100)}%`);
      if (x.rankHit) parts.push(`本次名单单科排名第 ${x.rank}，落入后 ${Math.round(x.tail * 100)}%`);
      L.push(`- **${x.name}**：${parts.join('；')}`);
    }
    L.push('');
  }
  if (ctx.ruleAdvice && ctx.ruleAdvice.length) {
    L.push('## 规则版复习建议（供参考，可修正）');
    L.push('');
    for (const a of ctx.ruleAdvice) L.push(`- **${a.name}**：${a.text}`);
    L.push('');
  }
  return L.join('\n');
}

function isDark() {
  const t = document.documentElement.getAttribute('data-theme');
  if (t === 'dark') return true;
  if (t === 'light') return false;
  return window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
}
function P() { return isDark() ? PALETTES.dark : PALETTES.light; }
function subjColor(key) { const s = SUBJECT_MAP[key]; return P().series[s ? s.ci % P().series.length : 0]; }

function esc(s) {
  return String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
}
function h(tag, attrs) {
  const e = document.createElement(tag);
  if (attrs) for (const k in attrs) {
    const v = attrs[k];
    if (v == null) continue;
    if (k === 'class') e.className = v;
    else if (k === 'text') e.textContent = v;
    else if (k === 'html') e.innerHTML = v;
    else if (k.slice(0, 2) === 'on') e.addEventListener(k.slice(2), v);
    else e.setAttribute(k, v);
  }
  for (let i = 2; i < arguments.length; i++) {
    const c = arguments[i];
    if (c == null) continue;
    if (Array.isArray(c)) c.forEach(x => x != null && e.append(x));
    else e.append(c.nodeType ? c : document.createTextNode(String(c)));
  }
  return e;
}
function fmt(v, d) { return v == null || isNaN(v) ? '—' : (d ? Number(v).toFixed(d) : String(Math.round(v * 10) / 10)); }
function fmtSigned(v) { return v == null || isNaN(v) ? '—' : (v > 0 ? '+' + fmt(v) : fmt(v)); }
function pct(v) { return v == null ? '—' : (v * 100).toFixed(1) + '%'; }

async function copyText(t) {
  try { await navigator.clipboard.writeText(t); return true; } catch (e) {
    const ta = document.createElement('textarea');
    ta.value = t; ta.style.position = 'fixed'; ta.style.opacity = '0';
    document.body.append(ta); ta.select();
    let ok = false;
    try { ok = document.execCommand('copy'); } catch (e2) { /* ignore */ }
    ta.remove();
    return ok;
  }
}

function safeFileName(s) {
  return String(s == null ? '' : s).replace(/[\\/:*?"<>|\r\n]+/g, '-').trim() || '成绩';

function downloadTextFile(filename, text, mime) {
  const blob = new Blob([text], { type: mime || 'text/csv;charset=utf-8' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);

  setTimeout(() => URL.revokeObjectURL(a.href), 1000);
}

/* ================================================================
   自研确认框 / 轻提示 / 多选一弹窗
   为什么要自己写：原生 confirm/alert 会阻塞整个页面、样式不可控，
   在信息板工作台里尤其突兀（弹窗盖住面板、返回值同步拿不到）。
   ================================================================ */
function myConfirm(msg, okText) {
  return new Promise(resolve => {
    const mask = h('div', { class: 'v41-mask' });
    const box = h('div', { class: 'v41-dialog', role: 'dialog', 'aria-modal': 'true' });
    box.append(h('div', { class: 'v41-dlg-title', text: '请确认' }),
      h('div', { class: 'v41-dlg-msg', text: msg }));
    let done = false;
    const finish = v => { if (done) return; done = true; mask.remove(); document.removeEventListener('keydown', onKey, true); resolve(v); };
    // Enter 只在焦点落在「确认」键上时才生效：否则在输入框里敲回车会误删数据
    const onKey = e => {
      if (e.key === 'Escape') { e.stopPropagation(); finish(false); }
      else if (e.key === 'Enter' && document.activeElement === ok) { e.preventDefault(); e.stopPropagation(); finish(true); }
    };
    const ok = h('button', { class: 'btn primary', text: okText || '确认', onclick: () => finish(true) });
    box.append(h('div', { class: 'v41-dlg-bar' },
      h('button', { class: 'btn', text: '取消', onclick: () => finish(false) }), ok));
    mask.append(box);
    mask.addEventListener('click', e => { if (e.target === mask) finish(false); });
    document.body.append(mask);
    document.addEventListener('keydown', onKey, true);
    setTimeout(() => { try { ok.focus(); } catch (e) { /* ignore */ } }, 30);
  });
}
function myAlert(msg) {
  const old = document.querySelector('.v41-toast');
  if (old) old.remove();
  const t = h('div', { class: 'v41-toast', text: String(msg) });
  document.body.append(t);
  clearTimeout(myAlert._timer);
  myAlert._timer = setTimeout(() => t.remove(), 3200);
}
/* 多选一：opts = [{label, value, primary?, hidden?, disabled?}]，返回选中的 value，取消返回 null */
function myAskChoice(title, msg, opts) {
  return new Promise(resolve => {
    const mask = h('div', { class: 'v41-mask' });
    const box = h('div', { class: 'v41-dialog v41-dialog-wide', role: 'dialog', 'aria-modal': 'true' });
    box.append(h('div', { class: 'v41-dlg-title', text: title }),
      h('div', { class: 'v41-dlg-msg', text: msg }));
    let done = false;
    const finish = v => { if (done) return; done = true; mask.remove(); document.removeEventListener('keydown', onKey); resolve(v); };
    const onKey = e => { if (e.key === 'Escape') finish(null); };
    const bar = h('div', { class: 'v41-dlg-bar' });
    (opts || []).forEach(o => {
      if (o.hidden) return;
      const attrs = { class: 'btn' + (o.primary ? ' primary' : ''), text: o.label };
      if (o.disabled) attrs.disabled = 'disabled';
      else attrs.onclick = () => finish(o.value);
      bar.append(h('button', attrs));
    });
    box.append(bar);
    mask.append(box);
    mask.addEventListener('click', e => { if (e.target === mask) finish(null); });
    document.body.append(mask);
    document.addEventListener('keydown', onKey);
  });
}

/* ---------- 折线图 ---------- */
function niceTicks(min, max, count) {
  if (min === max) { min -= 1; max += 1; }
  const span = max - min;
  const step0 = span / Math.max(1, count - 1);
  const mag = Math.pow(10, Math.floor(Math.log10(step0)));
  const norm = step0 / mag;
  const step = (norm <= 1 ? 1 : norm <= 2 ? 2 : norm <= 2.5 ? 2.5 : norm <= 5 ? 5 : 10) * mag;
  const lo = Math.floor(min / step) * step, hi = Math.ceil(max / step) * step;
  const ticks = [];
  for (let v = lo; v <= hi + step * 0.5; v += step) ticks.push(Math.round(v * 1e6) / 1e6);
  return { lo, hi, ticks };
}

    const classAvg = clsRows.length ? clsRows.reduce((a, r) => a + r.subj[k], 0) / clsRows.length : null;

    for (let i = latestIdx - 1; i >= 0; i--) if (hist[i] && hist[i].subj[k] != null) { prev = hist[i].subj[k]; break; }

      rate: row.subj[k] == null ? null : row.subj[k] / max,
      classRate: classAvg == null ? null : classAvg / max,

function mdToHtml(md) {

    if (/^### /.test(t)) return '<h4>' + t.slice(4) + '</h4>';
    if (/^## /.test(t)) return '<h3>' + t.slice(3) + '</h3>';
    if (/^# /.test(t)) return '<h2>' + t.slice(2) + '</h2>';

    for (let i = 0; i < n; i++) { const x = pt(i, lv); p.push(x[0].toFixed(1) + ',' + x[1].toFixed(1)); }
    refs += '<polygon points="' + p.join(' ') + '" fill="none" stroke="#bcd0c4" stroke-width="1" stroke-dasharray="4 4"/>';
    const y = cy - R * lv / 100;
    refs += '<text x="' + (cx + 4) + '" y="' + y.toFixed(1) + '" font-size="10" fill="#9bb3a6">' + lv + '%' + (lv === 60 ? '(及格)' : '(优秀)') + '</text>';
  });
  let axes = '';
  for (let i = 0; i < n; i++) {
    const end = pt(i, 100), lab = pt(i, 120);
    axes += '<line x1="' + cx + '" y1="' + cy + '" x2="' + end[0].toFixed(1) + '" y2="' + end[1].toFixed(1) + '" stroke="#e3ebe6" stroke-width="1"/>';
    const c = Math.cos(ang(i)), s = Math.sin(ang(i));
    let anc = 'middle';
    if (c > 0.3) anc = 'start'; else if (c < -0.3) anc = 'end';
    const dy = s > 0.5 ? 8 : (s < -0.5 ? -6 : 4);
    axes += '<text x="' + lab[0].toFixed(1) + '" y="' + (lab[1] + dy).toFixed(1) + '" text-anchor="' + anc + '" font-size="13" font-weight="500" fill="#2b3a30">' + esc(valid[i].name || '') + '</text>';
  }
  const stuPts = valid.map((it, i) => pt(i, it.rate)).map(p => p[0].toFixed(1) + ',' + p[1].toFixed(1)).join(' ');
  const stuPoly = '<polygon points="' + stuPts + '" fill="url(#' + id + ')" stroke="#1f3d2b" stroke-width="2.5" stroke-linejoin="round"/>';
  let stuDots = '';
  valid.forEach((it, i) => { const p = pt(i, it.rate); stuDots += '<circle cx="' + p[0].toFixed(1) + '" cy="' + p[1].toFixed(1) + '" r="3.6" fill="#1f3d2b"/>'; });
  const hasAvg = valid.some(it => it.avgRate != null && Number.isFinite(it.avgRate));
  let avgPoly = '', avgDots = '';
  if (hasAvg) {
    const aPts = valid.map((it, i) => pt(i, it.avgRate != null && Number.isFinite(it.avgRate) ? it.avgRate : it.rate)).map(p => p[0].toFixed(1) + ',' + p[1].toFixed(1)).join(' ');
    avgPoly = '<polygon points="' + aPts + '" fill="none" stroke="#7a8a80" stroke-width="2" stroke-dasharray="7 5" stroke-linejoin="round"/>';
    valid.forEach((it, i) => { const v = it.avgRate != null && Number.isFinite(it.avgRate) ? it.avgRate : it.rate; const p = pt(i, v); avgDots += '<circle cx="' + p[0].toFixed(1) + '" cy="' + p[1].toFixed(1) + '" r="3.2" fill="#ffffff" stroke="#7a8a80" stroke-width="1.6"/>'; });
  }
  const legend = '<g transform="translate(200,452)">' +
    '<rect x="0" y="-11" width="14" height="14" rx="3" fill="url(#' + id + ')" stroke="#1f3d2b" stroke-width="2"/>' +
    '<text x="20" y="1" font-size="13" fill="#2b3a30">该生（实线+斜纹）</text>' +
    (hasAvg ? '<line x1="165" y1="-1" x2="183" y2="-1" stroke="#7a8a80" stroke-width="2" stroke-dasharray="7 5"/>' +
             '<text x="190" y="1" font-size="13" fill="#2b3a30">班级平均（虚线）</text>' : '') +
    '</g>';
  return '<svg viewBox="0 0 ' + W + ' ' + H + '" width="100%" xmlns="http://www.w3.org/2000/svg" role="img">' +
    '<title>各科得分率雷达图</title>' +
    '<desc>以各选考科目为轴，实线斜纹填充多边形为该生各科得分率，虚线多边形为班级平均；轴数为本次实际选考科目。</desc>' +
    '<defs><pattern id="' + id + '" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">' +
    '<line x1="0" y1="0" x2="0" y2="7" stroke="#1f3d2b" stroke-width="1.3"/></pattern></defs>' +
    rings + refs + axes + avgPoly + stuPoly + stuDots + avgDots + legend + '</svg>';
}
/* 教师口吻 → 家长口吻。
   注意：只替换「预警 / 关注 / 临界生」这三个词本身会误伤
   「关注时政热点的固定表述」这类正常句子，所以这里按带上下文的短语替换。 */
function parentText(t) {
  return String(t == null ? '' : t)
    .replace(/●\s*预警/g, '需要留心的部分')
    .replace(/⚠\s*关注/g, '需要留心的部分')
    .replace(/建议谈话/g, '建议多沟通鼓励')
    .replace(/本次名单均分/g, '本次考试该科平均水平')
    .replace(/临界生/g, '需要留心的部分');
}
function parentPageHtml(computed, row, hist, examIdx, myKeys) {
  const st = computed[examIdx].stats;
  const exam = data.exams[examIdx] || {};
  const prof = (data.profiles || {})[profileKey(row, row.id)] || {};
  // 班级均分：现算本班该科均分（不是名单均分）
  // 同页表格、雷达图、复习建议必须用同一个基准，否则同一科会出现两个差值
  const clsRows = row.cls ? computed[examIdx].rows.filter(r => r.cls === row.cls) : [];
  const clsAvgOf = (k) => {
    const vs = clsRows.map(r => r.subj[k]).filter(v => v != null);
    return vs.length ? vs.reduce((a, b) => a + b, 0) / vs.length : null;
  };
  const evals = [];
  for (const k of myKeys) {
    const sdef = SUBJECT_MAP[k];
    if (!sdef) continue;
    const clsAvg = clsAvgOf(k);
    const ev = subjectEval(row, sdef, clsAvg, clsAvg, clsRows.length, hist, examIdx);
    if (!ev) continue;
    const a = buildAdvice(sdef, { rate: ev.rate, trend: ev.trend, trendDelta: ev.trendDelta,
      vsSchool: ev.vsSchool, score: ev.score, schoolAvg: clsAvg, subjectName: sdef.name,
      avgLabel: '本班该科平均分' });
    evals.push({ k, sdef, ev, a });
  }
  const advice = evals.slice().sort((x, y) => (x.ev.rate - y.ev.rate) || (y.a.priority - x.a.priority)).slice(0, 3);
  const weaker = evals.slice().sort((x, y) => x.ev.rate - y.ev.rate).slice(0, 1);
  const trend = hist.slice(0, examIdx + 1).map((r, i) => ({ r, i })).filter(x => x.r && x.r.total != null).slice(-4);
  const lineWord = row.lineStatus == null ? '—' : lineBandWord(row.lineBand, data.settings);
  const goalTxt = prof.goal ? String(prof.goal)
    : (prof.goalScore ? '目标总分 ' + prof.goalScore + ' 分' : '以' + lineName1(data.settings) + '为阶段目标');
  const radarItems = evals.map(e => {
    const clsAvg = clsAvgOf(e.k);
    return { name: e.sdef.name,
      rate: e.ev.rate == null ? null : e.ev.rate * 100,
      avgRate: (clsAvg != null && e.sdef.max) ? clsAvg / e.sdef.max * 100 : null };
  });
  const radarHtml = parentRadarSVG(radarItems);
  const e = esc;
  const rowsTrend = trend.map(({ r, i }) =>
    '<tr><td>' + e((data.exams[i] || {}).name || ('第' + (i + 1) + '场')) + '</td><td>' + fmt(r.total) + '</td>' +
    '<td>' + (r.totalDelta == null ? '—' : fmtSigned(r.totalDelta) + ' 分') + '</td>' +
    '<td>' + (r.total == null ? '—' : (r.total / 750 * 100).toFixed(1) + '%') + '</td></tr>').join('');
  const rowsSubj = evals.map(({ k, sdef, ev }) => {
    const clsAvg = clsAvgOf(k);
    // 四舍五入取一位小数，按「远离零」处理，避免 -0.75 被舍成 -0.7
    const diff = (clsAvg != null && ev.score != null)
      ? (ev.score - clsAvg < 0 ? -1 : 1) * Math.round(Math.abs(ev.score - clsAvg) * 10) / 10 : null;
    return '<tr><td>' + e(sdef.name + (isAssignedSubject(sdef.key) ? '（赋分）' : '')) + '</td>' +
      '<td>' + fmt(ev.score) + ' / ' + sdef.max + '</td>' +
      '<td>' + pct(ev.rate) + '</td>' +
      '<td>' + (diff == null ? '—' : fmtSigned(diff) + ' 分') + '</td></tr>';
  }).join('');
  const noteWeak = weaker.length
    ? '<ul class="ph-weaker"><li>' + e(weaker[0].sdef.name) + '目前得分率 ' + pct(weaker[0].ev.rate) +
      '，相对其他学科还有提升空间，建议优先安排这部分的复习时间。</li></ul>'
    : '';
  const adviceHtml = advice.length
    ? '<ul>' + advice.map(({ sdef, a }) => '<li><strong>' + e(sdef.name) + '：</strong>' + e(parentText(a.text)) + '</li>').join('') + '</ul>'
    : '<ul><li>本次各科数据完整度不足，建议先与任课老师沟通后再定重点。</li></ul>';
  const evalLeft = '<div class="ph-eval-left"><table><thead><tr><th>科目</th><th>得分 / 满分</th><th>得分率</th><th>与班级平均比</th></tr></thead>' +
    '<tbody>' + rowsSubj + '</tbody></table>' +
    '<div class="ph-trend">「得分率」＝得分 ÷ 满分，可直接比较不同满分科目；「与班级平均比」＝本人得分 − 本班该科平均分。</div>' + noteWeak + '</div>';
  const radarBlock = radarHtml
    ? '<div class="ph-eval-split">' + evalLeft +
      '<div class="ph-eval-right"><div class="ph-chart-cap">各科得分率雷达图（实线斜纹＝该生，虚线＝班级平均；轴数为本次实际选考科目）</div>' + radarHtml + '</div></div>'
    : evalLeft;
  return '<div class="ph-page">' +
    '<div class="ph-hd"><div class="ph-title">学生学业情况反馈</div>' +
    '<div class="ph-sub">' + e((exam.name || '本次考试') + (exam.date ? '（' + exam.date + '）' : '') + ' · 由班主任提供 · 仅供家庭沟通参考') + '</div>' +
    '<div class="ph-name">' + e((row.name || '') + '　' + (row.cls || '') + (row.comboName ? ' · ' + row.comboName : '')) + '</div></div>' +
    '<div class="ph-kpi"><div>本次总分<b>' + fmt(row.total) + '</b></div>' +
    '<div>较上次<b>' + (row.totalDelta == null ? '—' : fmtSigned(row.totalDelta) + ' 分') + '</b></div>' +
    '<div>阶段目标线<b>' + fmt(goalFor(prof, st.line1)) + '</b></div>' +
    '<div>上线情况<b style="font-size:13px">' + e(lineWord) + '</b></div></div>' +
    '<h3>一、成绩与近期走势</h3>' +
    '<table><thead><tr><th>考试</th><th>总分</th><th>较上次</th><th>得分率</th></tr></thead><tbody>' + rowsTrend + '</tbody></table>' +
    '<div class="ph-trend">满分 750；得分率＝总分 ÷ 750。单科对比以本班该科平均分为基准，不含排名。</div>' +
    '<h3>二、各科明细与学科均衡</h3>' + radarBlock +
    '<h3>三、下阶段复习建议（按优先级）</h3>' + adviceHtml +
    '<h3>四、阶段目标</h3>' +
    '<div class="ph-trend">' + e(parentText(goalTxt)) + '。建议结合孩子实际情况，与任课老师沟通后安排每周复习节奏。</div>' +
    '</div>';
}
/* 四种导出范围 */
function parentPrintKeys(range, picked) {
  const ctx = workspaceContext();
  if (!ctx.cur) return [];
  const computed = ctx.computed;
  const rows = ctx.rows;
  const ei = ui.examIdx;
  if (range === 'pick') return (picked || []).slice();
  if (range === 'near') return rows.filter(r => r.total != null && Math.abs(r.total - ctx.cur.stats.line1) <= 25).map(r => r.id);
  if (range === 'risk') return rows.filter(r => {
    if (continuousDecline(studentHistory(computed, r.id), 2)) return true;
    const mm = mismatchEval(r, ei, ctx.cur.stats.subjAvg);
    return !!(mm && mm.level !== 'ok');
  }).map(r => r.id);
  return rows.map(r => r.id); // filter：当前筛选结果
}
/* 打印合订：把家长版页面写进 #print-root，复用现成的 body.printing-doc 机制 */
function parentPrint(range, picked) {
  const keys = parentPrintKeys(range, picked);
  if (!keys.length) { myAlert('当前范围没有学生，请先调整筛选或勾选名单。'); return; }
  const computed = computeAll(data);
  const ei = ui.examIdx;
  let root = document.getElementById('print-root');
  if (!root) { root = h('div', { id: 'print-root' }); document.body.append(root); }
  let html = '';
  let count = 0;
  for (const k of keys) {
    const hist = studentHistory(computed, k);
    const row = hist[ei];            // 固定用当前选中场次，不用每人的最新一场
    if (!row) continue;
    const myKeys = sortSubjectKeys(row.subjectKeys && row.subjectKeys.length
      ? row.subjectKeys : SUBJECT_DEFS.map(s => s.key).filter(x => row.subj[x] != null));
    html += '<section class="pdf-sec ph-sec">' + parentPageHtml(computed, row, hist, ei, myKeys) + '</section>';
    count++;
  }
  if (!count) { myAlert('当前范围没有可打印的学生。'); return; }
  root.innerHTML = html;
  document.body.classList.add('printing-doc');
  setTimeout(() => window.print(), 60);
}

/* 勾选学生的弹窗：自绘遮罩，不依赖工作台弹窗（打印前要脱离主流程） */
function pickParentStudents() {
  const ctx = workspaceContext();
  if (!ctx.cur) { myAlert('还没有成绩数据。'); return; }
  return new Promise(resolve => {
    const mask = h('div', { class: 'v41-mask' });
    const box = h('div', { class: 'v41-dialog v41-dialog-wide', role: 'dialog', 'aria-modal': 'true' });
    const chosen = new Set(parentPicked);
    let query = '';
    const listHost = h('div', { class: 'pick-list' });
    const cnt = h('span', { class: 'hint' });
    const build = () => {
      const q = String(query || '').trim().toLowerCase();
      const shown = ctx.rows.filter(r => !q || [r.name, r.studentId, r.cls].some(v => String(v || '').toLowerCase().indexOf(q) >= 0));
      listHost.innerHTML = '';
      if (!shown.length) listHost.append(h('div', { class: 'hint', text: '没有匹配的学生' }));
      shown.forEach(r => {
        const cb = h('input', { type: 'checkbox', checked: chosen.has(r.id) ? '' : null,
          onchange: ev => { if (ev.target.checked) chosen.add(r.id); else chosen.delete(r.id); } });
        listHost.append(h('label', { class: 'pick-row' }, cb,
          h('span', { text: r.name + (r.studentId ? '（' + r.studentId + '）' : '') }),
          h('span', { class: 'hint', style: 'margin-left:auto', text: r.cls || '' })));
      });
      cnt.textContent = '已选 ' + chosen.size + ' 人';
    };
    const search = h('input', { type: 'search', placeholder: '搜索姓名 / 学号 / 班级',
      style: 'width:100%;margin:10px 0 6px', oninput: ev => { query = ev.target.value; build(); } });
    box.append(h('div', { class: 'v41-dlg-title', text: '选择要导出的学生' }),
      h('div', { class: 'v41-dlg-msg', text: '勾选后点「确定」；可搜索姓名或班级。' }),
      search,
      h('div', { class: 'row', style: 'gap:8px;margin-bottom:8px' },
        h('span', { class: 'hint', text: '共 ' + ctx.rows.length + ' 人' }), cnt),
      listHost);
    const done = v => { mask.remove(); document.removeEventListener('keydown', onKey); resolve(v); };
    const onKey = e => { if (e.key === 'Escape') done(null); };
    const bar = h('div', { class: 'v41-dlg-bar' },
      h('button', { class: 'btn', text: '全选当前结果', onclick: () => { ctx.rows.forEach(r => chosen.add(r.id)); build(); } }),
      h('button', { class: 'btn', text: '清空', onclick: () => { chosen.clear(); build(); } }),
      h('button', { class: 'btn', text: '取消', onclick: () => done(null) }),
      h('button', { class: 'btn primary', text: '确定', onclick: () => done(Array.from(chosen)) }));
    box.append(bar);
    mask.append(box);
    mask.addEventListener('click', e => { if (e.target === mask) done(null); });
    document.body.append(mask);
    document.addEventListener('keydown', onKey);
    build();
  });
}
