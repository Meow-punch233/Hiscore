<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src data: blob:; connect-src 'none';">
<title>Hiscore v3.4 · English Case Study · Campus Grade Workbench</title>
<style>
/* ================================================================
   Hiscore v3.3 · Unified Warm-Paper Campus Pixel Design System
   Final cascade layer: overrides the 10 legacy style blocks.
   Tokens → surfaces → components → motion → responsive → a11y.
   ================================================================ */

/* ---------- 1. Design tokens (single source of truth) ---------- */
:root, :root[data-theme="light"] {
  --page: #F5F1E6;
  --surface: #FFFDF7;
  --surface-2: #F1EBDC;
  --ink: #1F362D;
  --ink-2: #47584E;
  --muted: #66736A;
  --grid: #E4DECF;
  --border: #CFC7B4;
  --accent: #265745;
  --accent-soft: #E2EBDD;
  --good: #5F8450;
  --good-text: #48663C;
  --warn: #8C5A1E;
  --serious: #B28A48;
  --critical: #A64B38;
  --cat-orange: #E69547;
  --brass: #B28A48;
  --ref-line: #7B6A53;
  --sticker-paper: #FBF5E9;
  --shadow-hard: rgba(31, 54, 45, .18);
  --shadow: rgba(31, 54, 45, .18);
  --r-xs: 2px; --r-sm: 4px; --r-md: 6px; --r-lg: 10px;
  --serif: Georgia, "Times New Roman", "Songti SC", "SimSun", serif;
  --number: ui-monospace, "SF Mono", "Cascadia Mono", Consolas, monospace;
  --ease-out: cubic-bezier(.2, .8, .2, 1);
}
:root[data-theme="dark"] {
  --page: #14201A;
  --surface: #1D2D25;
  --surface-2: #24362D;
  --ink: #F3EFE2;
  --ink-2: #CBD4C2;
  --muted: #A9B4A6;
  --grid: #33453B;
  --border: #43584C;
  --accent: #A8C99A;
  --accent-soft: #2C4234;
  --good: #A8C794;
  --good-text: #B9D3A6;
  --warn: #DFB570;
  --serious: #D3B078;
  --critical: #E7A188;
  --cat-orange: #E6A468;
  --brass: #D3B078;
  --ref-line: #B8AE99;
  --sticker-paper: #FBF5E9;
  --shadow-hard: rgba(0, 0, 0, .45);
  --shadow: rgba(0, 0, 0, .45);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --page: #14201A; --surface: #1D2D25; --surface-2: #24362D;
    --ink: #F3EFE2; --ink-2: #CBD4C2; --muted: #A9B4A6;
    --grid: #33453B; --border: #43584C;
    --accent: #A8C99A; --accent-soft: #2C4234;
    --good: #A8C794; --good-text: #B9D3A6; --warn: #DFB570;
    --serious: #D3B078; --critical: #E7A188; --cat-orange: #E6A468;
    --brass: #D3B078; --ref-line: #B8AE99; --sticker-paper: #FBF5E9;
    --shadow-hard: rgba(0, 0, 0, .45); --shadow: rgba(0, 0, 0, .45);
  }
}

/* ---------- 2. Paper surface & noise removal ---------- */
body {
  background-color: var(--page);
  background-image: radial-gradient(color-mix(in srgb, var(--ink) 7%, transparent) 1px, transparent 1px);
  background-size: 24px 24px;
  color: var(--ink);
}
body::before { display: none !important; }   /* retire the animated feTurbulence film */
body.v12 { padding-top: env(safe-area-inset-top, 0px); }
::selection { background: var(--accent-soft); color: var(--ink); }
* { scrollbar-width: thin; scrollbar-color: var(--border) transparent; }

/* ---------- 3. Radii & shadow contract ---------- */
body.v12 .panel,
body.v12 .metric-strip,
body.v12 .context-bar,
body.v12 .card,
body.v12 .pk-summary-bar { border-radius: var(--r-md); }
body.v12 .btn, body.v12 input, body.v12 select, body.v12 textarea,
body.v12 .agent-input, body.v12 .hs-uni-import-text { border-radius: var(--r-sm); }
body.v12 .chip, body.v12 .tag, body.v12 .focus-tag, body.v12 .cap-badge,
body.v12 .pk-meter, body.v12 .round-lane, body.v12 .gseg { border-radius: var(--r-xs); }
body.v12 .workspace-dialog, body.v12 .panel-menu { border-radius: var(--r-lg); }
/* hard offset shadow = workbench surfaces; soft shadow = floating layers only */
body.v12 .panel { border: 1px solid var(--border); box-shadow: 4px 4px 0 var(--shadow-hard); transition: box-shadow .18s var(--ease-out), border-color .18s var(--ease-out); }
body.v12 .panel:hover { box-shadow: 5px 5px 0 var(--shadow-hard); }
body.v12 .metric-strip, body.v12 .context-bar { border: 1px solid var(--border); box-shadow: 3px 3px 0 var(--shadow-hard); }
body.v12 .workspace-overlay > * { box-shadow: 0 12px 32px rgba(10, 16, 12, .32); }
body.v12 .panel-menu { box-shadow: 0 8px 24px rgba(10, 16, 12, .28); }

/* ---------- 4. Typography rhythm ---------- */
body.v12 .brand h1, body.v12 .panel-title, body.v12 .psb-count,
body.v12 .agent-name, body.v12 .settings-subtitle { font-family: var(--serif); }
body.v12 .panel-title { font-size: 15px; font-weight: 700; letter-spacing: .02em; display: inline-flex; align-items: center; gap: 10px; }
body.v12 .panel-title::before {
  content: ""; width: 6px; height: 6px; flex: none;
  background: var(--accent); box-shadow: 9px 0 0 var(--cat-orange);
}
body.v12 .metric-cell .metric-label { font-size: 12px; color: var(--muted); letter-spacing: .04em; }
body.v12 .metric-cell .metric-value { font-family: var(--number); font-size: 28px; font-weight: 700; font-variant-numeric: tabular-nums; letter-spacing: -.01em; }
body.v12 .metric-cell .metric-foot { font-size: 11px; color: var(--muted); }
body.v12 .metric-cell.up .metric-value { color: var(--good-text); }
body.v12 .metric-cell.down .metric-value { color: var(--critical); }
body.v12 .hint { color: var(--muted); }
body.v12 .workspace-status { font-size: 11px; color: var(--muted); }

/* ---------- 5. Attention list: calm, non-stigmatizing ---------- */
body.v12 .focus-summary { display: flex; gap: 10px; flex-wrap: wrap; }
body.v12 .fs-item { flex: 1 1 0; min-width: 118px; border-radius: var(--r-xs); padding: 6px 10px; border: 1px solid var(--border); border-left-width: 4px; background: var(--surface-2); }
body.v12 .fs-item b { font-family: var(--number); font-size: 18px; display: block; }
body.v12 .fs-urgent { border-color: var(--critical); color: var(--critical); background: color-mix(in srgb, var(--critical) 8%, var(--surface)); }
body.v12 .fs-bias { border-color: var(--serious); color: var(--warn); }
body.v12 .fs-line { border-color: var(--critical); color: var(--critical); }
body.v12 .fs-down { border-color: var(--serious); color: var(--warn); }
body.v12 .fs-up { border-color: var(--good); color: var(--good-text); background: color-mix(in srgb, var(--good) 10%, var(--surface)); }
body.v12 .fs-muted { cursor: pointer; font: inherit; color: var(--muted); flex: 0 0 auto; min-width: 0; }
body.v12 .focus-row { position: relative; padding-right: 44px; border-left: 3px solid transparent; transition: background .15s var(--ease-out), transform .12s steps(2); }
body.v12 .focus-row.sev-3 { border-left-color: var(--critical); background: color-mix(in srgb, var(--critical) 5%, var(--surface)); }
body.v12 .focus-row.sev-2 { border-left-color: var(--serious); }
body.v12 .focus-row.sev-0 { border-left-color: var(--good); }
body.v12 .focus-idx {
  width: 24px; height: 24px; border-radius: var(--r-xs);
  background: transparent; border: 1.5px solid var(--border); color: var(--muted);
  font-family: var(--number); font-size: 12px; font-weight: 700;
}
body.v12 .focus-row.sev-3 .focus-idx { border-color: var(--critical); color: var(--critical); }
body.v12 .focus-row.sev-2 .focus-idx { border-color: var(--serious); color: var(--warn); }
body.v12 .focus-tag { background: var(--surface-2); border: 1px solid var(--border); color: var(--ink-2); font-size: 11px; padding: 2px 7px; }
body.v12 .focus-tag.bias { border-color: var(--serious); color: var(--warn); }
body.v12 .focus-tag.line { border-color: var(--critical); color: var(--critical); }
body.v12 .focus-tag.decline { border-color: var(--serious); color: var(--warn); }
body.v12 .focus-reason .num { font-family: var(--number); font-weight: 700; }
body.v12 .focus-reason.line.down .num { color: var(--critical); }
body.v12 .focus-reason.line.up .num { color: var(--good-text); }
body.v12 .focus-mute {
  position: absolute; right: 10px; top: 50%; transform: translateY(-50%);
  width: 24px; height: 24px; display: inline-flex; align-items: center; justify-content: center;
  border: 1px dashed var(--border); border-radius: var(--r-xs); color: var(--muted);
  font-size: 11px; cursor: pointer; user-select: none; background: var(--surface);
}
body.v12 .focus-mute:hover { border-color: var(--accent); color: var(--accent); }
body.v12 .focus-caliber { font-size: 11px; margin-top: 8px; line-height: 1.7; }
body.v12 .eval-row.weak { background: color-mix(in srgb, var(--serious) 9%, var(--surface)); border-left: 3px solid var(--critical); }
body.v12 .student-conclusion-item.attention { border-color: var(--serious); }
body.v12 .student-conclusion-item.attention strong { color: var(--warn); }

/* ---------- 6. Sticker frames for line-art characters (dark-mode contrast fix) ---------- */
body.v12 .agent-portrait,
body.v12 .agent-choice img,
body.v12 .pk-mascot img, body.v12 .pk-mascot .msvg,
body.v12 .brand-mark img,
body.v12 .pod-mascot img, body.v12 .pod-mascot .msvg {
  background: var(--sticker-paper);
  border: 1.5px solid var(--ink);
  border-radius: var(--r-sm);
  padding: 5px;
  box-shadow: 3px 3px 0 var(--shadow-hard);
  filter: sepia(10%) contrast(.98);
  box-sizing: content-box;
}
body.v12 .agent-choice img { padding: 3px; box-shadow: 2px 2px 0 var(--shadow-hard); }
body.v12 .brand-mark img { padding: 3px; }

/* ---------- 7. Class PK page ---------- */
body.v12 .pk-summary-bar {
  display: flex; flex-wrap: wrap; align-items: baseline; gap: 6px 16px;
  margin-top: 12px; padding: 8px 14px;
  background: var(--surface); border: 1px solid var(--border);
}
body.v12 .psb-count { font-size: 15px; font-weight: 700; color: var(--accent); }
body.v12 .psb-item { font-family: var(--number); font-size: 12.5px; color: var(--ink-2); }
body.v12 .psb-note { font-size: 11px; margin-left: auto; }
/* flatten duplicated inner card shells inside PK panels */
body.v12[data-page="pk"] .panel .card { background: transparent; border: 0; box-shadow: none; padding: 0; margin: 0; }
body.v12[data-page="pk"] .panel .card > h2, body.v12[data-page="pk"] .panel .card > .sub { display: none; }
body.v12 .pk-card { position: relative; }
body.v12 .pk-duel-btn {
  position: absolute; top: 10px; right: 10px;
  font-size: 11px; padding: 3px 8px; min-height: 0;
  background: transparent; border: 1px dashed var(--border); color: var(--muted);
  border-radius: var(--r-xs); cursor: pointer;
}
body.v12 .pk-duel-btn:hover { border-color: var(--cat-orange); color: var(--warn); border-style: solid; }
body.v12 .pk-meter-wrap { margin: 6px 0 2px; }
body.v12 .pk-meter { height: 8px; background: var(--surface-2); border: 1px solid var(--border); overflow: hidden; }
body.v12 .pk-meter i { display: block; height: 100%; background: var(--tc, var(--accent)); }
body.v12 .pk-meter-scale { display: flex; justify-content: space-between; font-family: var(--number); font-size: 10px; color: var(--muted); margin-top: 2px; }
/* battle: absolute score-rate lanes + 3-stage timing */
body.v12 .round-lane { position: relative; height: 22px; background: var(--surface-2); border: 1px solid var(--border); overflow: hidden; }
body.v12 .round-fill { position: absolute; inset: 0 auto 0 0; display: block; background: var(--tc, var(--accent)); transform-origin: left center; animation: hsRoundGrow .36s var(--ease-out) both; }
body.v12 .round-lane.r .round-fill { inset: 0 0 0 auto; transform-origin: right center; }
body.v12 .round-rate { position: absolute; top: 50%; transform: translateY(-50%); font-family: var(--number); font-size: 11px; font-weight: 700; color: var(--ink); z-index: 1; }
body.v12 .round-lane.l .round-rate { right: 6px; }
body.v12 .round-lane.r .round-rate { left: 6px; }
body.v12 .round-star {
  position: absolute; top: 50%; transform: translateY(-50%);
  font-size: 10px; line-height: 1.4; color: var(--warn); z-index: 1;
  background: var(--sticker-paper); padding: 0 3px; border-radius: 2px;
}
body.v12 .round-lane.l .round-star { left: auto; right: 44px; }
body.v12 .round-lane.r .round-star { right: auto; left: 44px; }
body.v12 .win-tag { animation: hsStampIn .3s var(--ease-out) 1.68s both; }
body.v12 .confetti { width: 4px; height: 4px; border-radius: 0; animation-name: hsPixelSpark; }
/* podium: rise the base only, never squash the sticker */
body.v12 .podium .pod.base { animation: none; }
body.v12 .podium .pod.base .pod-mascot { animation: hsPodRise .6s var(--ease-out) both; transform-origin: bottom center; }

/* ---------- 8. Student page: natural scroll + readable radar ---------- */
@media (min-width: 1200px) and (min-height: 800px) {
  html:has(body.v12[data-page="student"]) { height: auto; overflow: auto; }
  body.v12[data-page="student"] { height: auto; overflow: auto; }
  body.v12[data-page="student"] .workbench { height: auto; max-height: none; overflow: visible; }
}
body.v12 .panel-grid.primary-zone, body.v12 .panel-grid.more-grid { grid-auto-rows: minmax(0, 1fr); }
body.v12[data-page="student"] .panel[data-panel="radar"] .radar-eval-radar > svg {
  width: auto; max-width: 100%; max-height: min(52vh, 470px); margin: 0 auto;
}
body.v12 .radar-chip { border-radius: var(--r-xs); }
body.v12 .radar-weak-note { color: var(--warn); }

/* ---------- 9. Agent workbench ---------- */
body.v12[data-page="agents"] .agent-hub .agent-conversation { background: var(--surface); border: 1px solid var(--border); border-radius: var(--r-md); }
body.v12[data-page="agents"] .agent-hub .agent-conversation .agent-dock {
  align-self: stretch; width: 100%; margin: 0; grid-column: auto; grid-row: auto;
  background: var(--surface); border-top: 1px solid var(--border);
  padding: 10px 14px calc(10px + env(safe-area-inset-bottom, 0px));
}
body.v12[data-page="agents"] .agent-hub .agent-sidebar .agent-stage,
body.v12[data-page="agents"] .agent-hub .agent-sidebar .agent-actions,
body.v12[data-page="agents"] .agent-hub .agent-sidebar .agent-action-hint { align-self: stretch; width: 100%; }
body.v12 .agent-dock-foot { flex-wrap: wrap; gap: 4px 12px; }
body.v12 .agent-md.streaming:not(:empty)::after {
  content: ""; display: inline-block; width: 5px; height: 1em; margin-left: 2px;
  background: var(--accent); vertical-align: -2px; animation: hsCaretBlink 1s steps(2, start) infinite;
}
body.v12 .agent-md.streaming:empty::after {
  content: "● ● ●"; font-size: 10px; letter-spacing: 2px; color: var(--accent);
  animation: hsThinkPulse 1.2s steps(2, end) infinite;
}
body.v12 .agent-welcome { border: 1px dashed var(--border); border-radius: var(--r-md); background: var(--surface-2); }
body.v12 .agent-empty-chip { border-radius: var(--r-xs); }

/* ---------- 10. Demo banner & export watermarks ---------- */
#demo-banner {
  display: flex; align-items: center; gap: 10px; flex-wrap: wrap;
  margin: 0 0 12px; padding: 7px 12px; font-size: 12px; line-height: 1.6;
  background: var(--accent-soft); color: var(--ink);
  border: 1px solid var(--accent); border-radius: var(--r-sm);
  box-shadow: 3px 3px 0 var(--shadow-hard);
}
#demo-banner[hidden] { display: none; }
#demo-banner .db-dot { width: 8px; height: 8px; flex: none; background: var(--cat-orange); animation: hsDemoPulse 2.4s steps(2, end) infinite; }
#demo-banner .db-zh { font-weight: 600; }
#demo-banner .db-en { color: var(--muted); font-size: 11px; }
.ph-demo, .pdf-demo {
  margin: 10px 0; padding: 6px 10px; text-align: center;
  border: 1px dashed var(--critical); border-radius: var(--r-xs);
  color: var(--critical); font-size: 11px; letter-spacing: .06em;
  background: color-mix(in srgb, var(--critical) 6%, transparent);
}

/* ---------- 11. University GPA presets ---------- */
.hs-uni-gpa-presets { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; margin: 10px 0 4px; }
.hs-uni-gpa-presets .btn { font-size: 11.5px; padding: 4px 9px; min-height: 0; }

/* ---------- 12. Motion system ---------- */
@keyframes hsPaperIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
@keyframes hsStampIn { from { opacity: 0; transform: scale(.86) rotate(-3deg); } to { opacity: 1; transform: none; } }
@keyframes hsPodRise { from { transform: scaleY(.2); opacity: .4; } to { transform: scaleY(1); opacity: 1; } }
@keyframes hsRoundGrow { from { transform: scaleX(0); } to { transform: scaleX(1); } }
@keyframes hsPixelSpark {
  0% { transform: translateY(-10px) rotate(0deg); opacity: 1; }
  100% { transform: translateY(150px) rotate(90deg); opacity: 0; }
}
@keyframes hsCaretBlink { 0%, 49% { opacity: 1; } 50%, 100% { opacity: 0; } }
@keyframes hsThinkPulse { 0%, 100% { opacity: .35; } 50% { opacity: 1; } }
@keyframes hsDemoPulse { 0%, 100% { opacity: 1; } 50% { opacity: .45; } }
/* retire double entrance animations; single staggered paper-in on tab switch */
body.v12 .workbench.page-enter { animation: none; }
body.v12 .workbench.page-enter > * { animation: hsPaperIn .36s var(--ease-out) both; }
body.v12 .workbench.page-enter > *:nth-child(1) { animation-delay: 0ms; }
body.v12 .workbench.page-enter > *:nth-child(2) { animation-delay: 45ms; }
body.v12 .workbench.page-enter > *:nth-child(3) { animation-delay: 90ms; }
body.v12 .workbench.page-enter > *:nth-child(4) { animation-delay: 135ms; }
body.v12 .workbench.page-enter > *:nth-child(5) { animation-delay: 180ms; }
body.v12 .workbench.page-enter > *:nth-child(n+6) { animation-delay: 225ms; }
body.v12 .panel { animation: none; }
/* 2-step pixel press feedback */
body.v12 .btn:active, body.v12 .chip:active, body.v12 .focus-row:active,
body.v12 .pk-duel-btn:active, body.v12 .agent-empty-chip:active {
  transform: translateY(1px); transition: transform .12s steps(2);
}
body.v12 .btn, body.v12 .chip { transition: background .15s var(--ease-out), color .15s var(--ease-out), border-color .15s var(--ease-out), transform .12s steps(2); }

/* ---------- 13. Responsive: mobile tab bar, overflow, safe areas ---------- */
body.v12[data-page="agents"] .workbench { padding-bottom: calc(12px + env(safe-area-inset-bottom, 0px)); }
@media (max-width: 999px) {
  body.v12 .rank-row { grid-template-columns: 34px minmax(0, 1fr) 76px 64px; row-gap: 4px; }
  body.v12 .rank-row .rank-bar { grid-column: 2 / -1; }
  body.v12 .rank-row .rank-g { grid-column: 2 / -1; justify-self: start; }
}
@media (max-width: 700px) {
  /* keep the last panel clear of the fixed bottom nav */
  body.v12 .workbench { padding-bottom: calc(88px + env(safe-area-inset-bottom, 0px)); }
  /* re-assert the intended compact tab bar (legacy 999px block squeezed it at 390px) */
  body.v12 nav.tabs { display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 3px; padding: 5px; }
  body.v12 nav.tabs button { min-height: 50px; padding: 5px 2px; font-size: 11px; border-radius: var(--r-sm); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  body.v12 nav.tabs button.on { color: var(--accent); background: var(--accent-soft); border-color: var(--accent); box-shadow: inset 0 -2px 0 var(--accent); }
  body.v12 nav.tabs .nav-help { grid-column: 1 / -1; min-height: 34px; }
  body.v12 .nav-tab-full { display: none; }
  body.v12 .nav-tab-short { display: inline; }
  body.v12 .workspace-actions .saved-note { display: none; }
  body.v12 .metric-cell .metric-foot { display: block; font-size: 10px; }
  body.v12 .mobile-panel-tabs {
    -webkit-mask-image: linear-gradient(90deg, transparent 0, #000 18px, #000 calc(100% - 18px), transparent 100%);
    mask-image: linear-gradient(90deg, transparent 0, #000 18px, #000 calc(100% - 18px), transparent 100%);
  }
  body.v12 .pk-summary-bar { gap: 4px 10px; padding: 7px 10px; }
  body.v12 .psb-note { margin-left: 0; flex-basis: 100%; }
  #demo-banner { padding: 5px 12px; font-size: 11px; }
  #demo-banner .db-en { flex-basis: 100%; }
}
@media (max-width: 700px) {
  body.v12[data-page="student"] .metric-strip .metric-cell:last-child { grid-column: 1 / -1; }
}
@media (max-width: 390px) {
  body.v12 nav.tabs button { font-size: 10.5px; min-height: 48px; }
  body.v12 .metric-cell .metric-value { font-size: 23px; }
}

/* ---------- 14. Focus & reduced motion (single authoritative block) ---------- */
body.v12 :focus-visible { outline: 2px solid var(--cat-orange); outline-offset: 2px; border-radius: var(--r-xs); }
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after {
    animation-duration: .001ms !important;
    animation-iteration-count: 1 !important;
    transition-duration: .001ms !important;
    scroll-behavior: auto !important;
  }
}

</style>
<style>
:root { --mono: var(--number); --line: var(--border); --sans: -apple-system, "Segoe UI", "Helvetica Neue", Arial, "Noto Sans", sans-serif; }
body { margin: 0; background: var(--page); color: var(--ink); font-family: var(--sans); }
#app { max-width: 1080px; margin: 0 auto; padding: 20px 18px 60px; display: grid; gap: 16px; }
.case-head { display: flex; justify-content: space-between; align-items: flex-end; gap: 12px; flex-wrap: wrap; }
.case-head h1 { font-family: var(--serif); font-size: 26px; margin: 0; }
.case-sub { margin: 4px 0 0; color: var(--muted); font-size: 13px; }
.panel { background: var(--surface); border: 1.5px solid var(--ink); border-radius: 6px; box-shadow: 4px 4px 0 var(--shadow); padding: 14px 16px; }
.panel-head { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; flex-wrap: wrap; margin-bottom: 10px; }
.panel-head h2 { font-family: var(--serif); font-size: 17px; margin: 0; }
.panel-note { color: var(--muted); font-size: 12px; }
.case-method { color: var(--muted); font-size: 12px; line-height: 1.6; margin: 8px 0; }
.case-two { display: grid; grid-template-columns: minmax(0, 420px) minmax(0, 1fr); gap: 16px; align-items: start; }
.case-side ul, .case-list { margin: 6px 0; padding-left: 18px; font-size: 13px; line-height: 1.7; }
.case-dim { color: var(--muted); }
.att-list { display: grid; gap: 6px; }
.att-row { display: grid; grid-template-columns: 26px 190px auto minmax(0, 1fr); gap: 10px; align-items: center; padding: 7px 9px; border: 1px solid var(--line); border-radius: 4px; background: var(--surface-2); font-size: 12.5px; }
.att-row.urgent { border-left: 4px solid var(--critical); }
.att-idx { font-family: var(--mono); color: var(--muted); }
.att-name { font-weight: 600; }
.att-tags { display: flex; gap: 5px; flex-wrap: wrap; }
.att-tag { border: 1px solid currentColor; border-radius: 2px; padding: 1px 5px; font-size: 11px; }
.att-tag.severe { color: var(--critical); }
.att-tag.watch { color: var(--warn); }
.att-tag.line { color: var(--warn); }
.att-tag.decline { color: var(--critical); }
.att-ev { color: var(--muted); font-family: var(--mono); font-size: 11.5px; }
.battle { display: grid; gap: 8px; }
.round { display: grid; grid-template-columns: minmax(0, 1fr) 150px minmax(0, 1fr); gap: 10px; align-items: center; }
.round-name { text-align: center; font-size: 12px; display: grid; gap: 2px; }
.round-name span { color: var(--muted); font-family: var(--mono); font-size: 10.5px; }
.round-lane { position: relative; height: 20px; border: 1px solid var(--ink); border-radius: 2px; background: var(--surface-2); overflow: hidden; }
.round-fill { position: absolute; inset: 0 auto 0 0; background: var(--accent); }
.round-lane.r .round-fill { inset: 0 0 0 auto; background: var(--cat-orange); }
.round-rate { position: absolute; top: 50%; transform: translateY(-50%); right: 6px; font-family: var(--mono); font-size: 11px; }
.round-lane.r .round-rate { right: auto; left: 6px; }
.round-star { position: absolute; top: 50%; transform: translateY(-50%); right: 44px; background: var(--sticker-paper); color: var(--warn); padding: 0 3px; border-radius: 2px; font-size: 10px; }
.round-lane.r .round-star { right: auto; left: 44px; }
.case-table { width: 100%; border-collapse: collapse; font-size: 12.5px; margin: 10px 0; }
.case-table th, .case-table td { border: 1px solid var(--line); padding: 6px 8px; text-align: left; }
.case-table th { background: var(--surface-2); font-family: var(--serif); }
.case-foot { color: var(--muted); font-size: 12px; text-align: center; }
.demo-banner { display: flex; gap: 8px; align-items: flex-start; border: 1.5px solid var(--accent); background: var(--surface); border-radius: 4px; padding: 8px 10px; font-size: 12.5px; }
.demo-dot { width: 8px; height: 8px; background: var(--cat-orange); margin-top: 4px; flex: none; }
.metric-strip { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 10px; }
.metric-cell { border: 1px solid var(--line); border-radius: 4px; background: var(--surface-2); padding: 10px 12px; display: grid; gap: 3px; }
.metric-label { color: var(--muted); font-size: 11.5px; }
.metric-value { font-family: var(--mono); font-size: 24px; }
.metric-note { color: var(--muted); font-size: 11px; }
.focus-summary { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 8px; }
.fs { border: 1px solid var(--line); border-radius: 2px; padding: 4px 8px; font-size: 12px; background: var(--surface-2); }
.fs.urgent { color: var(--critical); border-color: currentColor; }
.fs.bias, .fs.line { color: var(--warn); border-color: currentColor; }
@media (max-width: 760px) {
  .case-two { grid-template-columns: 1fr; }
  .metric-strip { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .att-row { grid-template-columns: 22px minmax(0, 1fr); }
  .att-tags, .att-ev { grid-column: 2; }
  .round { grid-template-columns: 1fr; }
  .round-name { order: -1; }
}
</style>

function hs31High(settings) {
  const s = settings || defaultSettings();
  return {schema:1, stage:'high', grade:'high', policy:'原版高中 3+1+2', subjects:HS31_BASE_SUBJECTS.map(x => ({key:x.key,name:x.name,max:x.max})), combos:hs31Clone(s.combos || DEFAULT_COMBOS), bands:hs31Clone(s.bands || DEFAULT_BANDS), classes:hs31Clone(s.classes || DEFAULT_CLASSES).map(c=>({name:c.name,comboIds:c.comboIds||[]}))};

function hs31Validate(rule) {
  if (!rule || !['high','junior'].includes(rule.stage) || !Array.isArray(rule.subjects) || !rule.subjects.length) throw new Error('考试规则缺失或不受支持');
  const seen = new Set();
  for (const s of rule.subjects) {
    if (!SUBJECT_MAP[s.key] || seen.has(s.key) || !Number.isFinite(s.max) || s.max <= 0 || s.max > 1000) throw new Error('科目或满分无效：' + s.key);
    seen.add(s.key);
  }
  if (rule.stage === 'high' && (!Array.isArray(rule.combos) || !rule.combos.length || !Array.isArray(rule.bands))) throw new Error('高中规则快照不完整');
  return rule;
}

function hs31WithRule(rule, fn) { const before = hs31RuleContext; hs31RuleContext = rule; try { return fn(); } finally { hs31RuleContext = before; } }
function hs31Max(rule = hs31RuleContext) { return rule && rule.stage === 'junior' ? rule.subjects.reduce((n,s) => n+s.max,0) : 750; }

    if (prop === 'max') return sub ? sub.max : base.max;
    if (prop === 'name') return hs31IsJunior() && base.key === 'politics' ? '道法' : base.name;

}

/* 一键生成 n 班模板（班级档案齐套，数量可自定义；组合按预设轮配） */
function templateClasses(n) {
  const out = [];
  for (let i = 0; i < n; i++) {
    out.push({
      id: 'cls-' + (i + 1) + '-' + Date.now().toString(36),
      name: '高三(' + (i + 1) + ')班',
      slogan: CLASS_SLOGANS[i % CLASS_SLOGANS.length],
      color: TEAM_COLORS[i % TEAM_COLORS.length],
      mascot: MASCOT_PRESETS[i % MASCOT_PRESETS.length].id,
      comboIds: DEFAULT_COMBOS.length ? [DEFAULT_COMBOS[i % DEFAULT_COMBOS.length].id] : [],
    });
  }
  return out;
}

/* 根据组合定义生成 6 科列表 */
function comboSubjects(combo) {
  if(hs31IsJunior()) return hs31RuleContext.subjects.map(s=>SUBJECT_MAP[s.key]);
  if (!combo) return [...CORE3, 'physics'].map(k => SUBJECT_MAP[k]).filter(Boolean);
  const t1 = combo.track1 || 'physics';
  // 再选科目必须恰好 2 门（3+1+2 口径）；设置不合规时取前两个，
  // 保证总分口径恒为 750，不会算出 829 这类超满分
  let t2 = (combo.track2 || []).filter(k => TRACK2_KEYS.includes(k));
  if (t2.length > 2) t2 = t2.slice(0, 2);
  return [...CORE3, t1, ...t2]
    .map(k => SUBJECT_MAP[k]).filter(Boolean);
}
function comboSubjectKeys(combo) { return comboSubjects(combo).map(s => s.key); }
function comboName(combo) {
  if (!combo) return '—';
  const t1 = SUBJECT_MAP[combo.track1] ? SUBJECT_MAP[combo.track1].name : combo.track1;
  const t2 = (combo.track2 || []).map(k => SUBJECT_MAP[k] ? SUBJECT_MAP[k].name : k).join('');
  return t1 + t2;
}
/* 组合的显示名：用户自定义名优先，否则用科目推导名 */
function comboLabel(combo) {
  if(hs31IsJunior()) return hs31Label(hs31RuleContext);
  if (!combo) return '—';
  const custom = combo.name != null ? String(combo.name).trim() : '';
  return custom || comboName(combo);
}
/* 组合的实际满分：语数外各150 + 首选100 + 每门再选100 */
function comboMaxScore(combo) {
  if(hs31IsJunior()) return hs31Max();
  if (!combo) return 750;
  return 450 + 100 + (combo.track2 || []).length * 100;
}
function comboTrackName(combo) {
  if(hs31IsJunior()) return "";
  if (!combo) return '—';
  return combo.track1 === 'history' ? '历史类' : '物理类';
}
/* --- 选科简码解析：「物化政」「物化地」「物理化学政治」→ {track1, track2} --- */
const COMBO_TOKENS = [
  ['物理', 'physics'], ['化学', 'chem'], ['生物', 'bio'], ['政治', 'politics'], ['地理', 'geo'], ['历史', 'history'],
  ['物', 'physics'], ['化', 'chem'], ['生', 'bio'], ['政', 'politics'], ['地', 'geo'], ['历', 'history'],
];
const SHORT1 = { physics: '物', history: '历' };
const SHORT2 = { chem: '化', bio: '生', politics: '政', geo: '地' };
function parseComboText(s) {
  let t = String(s == null ? '' : s).trim().replace(/[\s+＋/、,，·．.。:：\-—（）()【】]/g, '');
  if (!t) return null;
  const found = [];
  let i = 0;
  while (i < t.length) {
    let hit = null;
    for (const [pat, key] of COMBO_TOKENS) {
      if (t.startsWith(pat, i)) { hit = { pat, key }; break; }
    }
    if (!hit) return null;
    found.push(hit.key);
    i += hit.pat.length;
  }
  const t1 = found.filter(k => k === 'physics' || k === 'history');
  const t2 = found.filter(k => TRACK2_KEYS.includes(k));
  if (found.length !== 3 || t1.length !== 1 || t2.length !== 2 || new Set(t2).size !== 2) return null;
  return { track1: t1[0], track2: TRACK2_KEYS.filter(k => t2.includes(k)) };
}
function comboShortName(p) {
  return (SHORT1[p.track1] || '') + (p.track2 || []).map(k => SHORT2[k] || '').join('');
}
function comboMatchSubjects(c, p) {
  if (!c || !p) return false;
  const t2c = TRACK2_KEYS.filter(x => (c.track2 || []).includes(x));
  return c.track1 === p.track1 && t2c.length === 2 && p.track2.every(x => t2c.includes(x));
}
/* 班级选科快捷输入：「物化政」→ 找到或新建对应组合，设为该班组合 */
function applyComboQuick(cl, text, combos) {
  const p = parseComboText(text);
  if (!p) return { ok: false, message: '没认出这个简码。支持物化政 / 物化地 / 历政地，或物理化学政治等全称。' };
  const list = Array.isArray(combos) ? combos : [];
  let combo = list.find(c => comboMatchSubjects(c, p));
  let added = false;
  if (!combo) {
    const used = new Set(list.map(c => String(c.name || '').trim()));
    let nm = comboShortName(p);
    if (used.has(nm)) { let n = 2; while (used.has(nm + '（' + n + '）')) n++; nm = nm + '（' + n + '）'; }
    combo = { id: 'combo-' + Date.now().toString(36), name: nm, track1: p.track1, track2: p.track2.slice() };
    list.push(combo); added = true;
  }
  cl.comboIds = [combo.id];
  return { ok: true, combo, added, message: '已在草稿中设为 ' + comboShortName(p) + '（' + comboName(p) + '），保存后才生效。' };
}
/* 学生 → 该科是否赋分 */
/* 科目列的统一排序：语数外 → 物理 → 历史 → 再选科目（化生政地） */
const SUBJECT_ORDER = ['chinese', 'math', 'english', 'physics', 'history', 'chem', 'bio', 'politics', 'geo', 'pe'];
function sortSubjectKeys(keys) {
  return (keys || []).slice().sort((a, b) => {
    const ia = SUBJECT_ORDER.indexOf(a), ib = SUBJECT_ORDER.indexOf(b);
    return (ia < 0 ? 99 : ia) - (ib < 0 ? 99 : ib);
  });
}
function isAssignedSubject(key) {
  const s = SUBJECT_MAP[key];
  return s ? !!s.assigned : false;
}
/* 学生 → 赋分科目 key 列表（与 comboSubjects 同一口径：恰好 2 门） */
function assignedKeysForCombo(combo) {
  if(hs31IsJunior()) return [];
  if (!combo) return [];
  let t2 = (combo.track2 || []).filter(k => TRACK2_KEYS.includes(k));
  if (t2.length > 2) t2 = t2.slice(0, 2);
  return t2;
}

  { name: 'E', pct: 2,  min: 30, max: 40 },
];

/* 偏科 / 不匹配默认阈值（定档：自身失衡；佐证：名单落后） */
const DEFAULT_MISMATCH = {
  selfGap: 0.15,      // 关注：某科得分率比自身各科平均低 15 个百分点（约前 25% 偏科幅度）
  severeGap: 0.22,    // 预警：自身失衡达到 22 个百分点（约前 10%）
  vsAvgGap: 0.10,     // 佐证：同时比该科名单均分低 10 个百分点
  rankTail: 0.30,     // 佐证：同时单科排名落入名单后 30%
  minRanked: 5,       // 名单不足该人数时，排名口径不参与（波动太大）
};

function defaultSettings() {
  return {
    bands: DEFAULT_BANDS.map(b => ({ ...b })),
    line1: 512, line2: 448,
    line1Name: '本一线', line2Name: '本二线',   // G1/G2 线名可自定义（初中可改「重点线/普高线」）
    mismatch: { ...DEFAULT_MISMATCH },
    combos: DEFAULT_COMBOS.map(c => ({ ...c, track2: [...(c.track2 || [])] })),
    classes: DEFAULT_CLASSES.map(c => ({ ...c, comboIds: [...(c.comboIds || [])] })),
  };
}

/* --- 确定性随机（示例数据用） --- */
function mulberry32(seed) {
  let a = seed >>> 0;
  return function () {
    a |= 0; a = (a + 0x6D2B79F5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
function gauss(rnd) {
  let u = 0, v = 0;
  while (u === 0) u = rnd();
  while (v === 0) v = rnd();
  return Math.sqrt(-2 * Math.log(u)) * Math.cos(2 * Math.PI * v);
}

/* --- 示例数据：9 班 × 72 人 × 3 次考试（含拼班 + 多选科组合 + 班级强弱画像） --- */
function generateSample() {
  const rnd = mulberry32(20261029);
  const surn = ['王', '李', '张', '刘', '陈', '杨', '赵', '黄', '周', '吴', '徐', '孙', '朱', '马', '胡', '郭', '林', '何', '高', '罗', '郑', '梁'];
  const giv = ['嘉怡', '思远', '雨桐', '宇轩', '诗涵', '子墨', '欣然', '俊杰', '佳琪', '浩然', '婉清', '梓涵',
    '一鸣', '若曦', '天佑', '静娴', '沐辰', '知夏', '语彤', '奕辰', '可欣', '致远', '芷若', '晨曦'];
  const names = [];
  const used = new Set();
  for (let i = 0; i < 72; i++) {
    let nm, attempt = 0;
    do {
      nm = surn[i % surn.length] + giv[(i * 7 + names.length * 3 + attempt) % giv.length];
      attempt++;
    } while (used.has(nm));
    used.add(nm);
    names.push(nm);
  }
  // 全科目均分/标准差
  const mus = {
    chinese: 102, math: 97, english: 104,
    physics: 67, history: 70,
    chem: 70, bio: 68, politics: 72, geo: 72,
  };
  const sds = {
    chinese: 11, math: 19, english: 14,
    physics: 13, history: 12,
    chem: 12, bio: 11, politics: 10, geo: 11,
  };
  const maxs = {
    chinese: 150, math: 150, english: 150,
    physics: 100, history: 100,
    chem: 100, bio: 100, politics: 100, geo: 100,
  };
  // 拼班示范：1/2/8/9 班多组合混排，其余单组合；每班有强弱画像让 PK 有看头
  const classCombos = {
    '高三(1)班': ['wu-hua-di', 'wu-hua-sheng'],
    '高三(2)班': ['wu-sheng-di', 'li-zheng-di'],
    '高三(3)班': ['wu-hua-di'],
    '高三(4)班': ['wu-hua-sheng'],
    '高三(5)班': ['wu-sheng-di'],
    '高三(6)班': ['li-zheng-di'],
    '高三(7)班': ['li-zheng-sheng'],
    '高三(8)班': ['wu-hua-di', 'li-zheng-sheng'],
    '高三(9)班': ['wu-hua-sheng', 'wu-sheng-di'],
  };
  const settings = defaultSettings();
  const comboMap = {};
  for (const c of settings.combos) comboMap[c.id] = c;

  // 班级整体水平（温和分差）+ 每班一强一弱科目（PK 有故事）；
  // 学生个体差异仍走随机，但降低跨科联动，避免整班被一个随机数带偏
  const classBias = {}, classTilt = {};
  const CLASS_LEVEL = [0, -6, 8, 2, 4, -3, 6, -5, 1];
  let ci = 0;
  for (const cl of Object.keys(classCombos)) {
    classBias[cl] = CLASS_LEVEL[ci % CLASS_LEVEL.length];
    classTilt[cl] = {};
    const keys = comboSubjectKeys(comboMap[classCombos[cl][0]]);
    classTilt[cl][keys[ci % keys.length]] = 5;          // 优势科目
    classTilt[cl][keys[(ci + 2) % keys.length]] = -4;   // 待提升科目
    ci++;
  }

  const students = names.map((nm, i) => {
    const cls = '高三(' + (Math.floor(i / 8) + 1) + ')班';
    const combos = classCombos[cls];
    const comboId = combos[i % combos.length];
    const combo = comboMap[comboId];
    const h = gauss(rnd);
    const abi = {};
    for (const k of comboSubjectKeys(combo)) {
      abi[k] = mus[k] + classBias[cls] + (classTilt[cls][k] || 0) + h * sds[k] * 0.35 + gauss(rnd) * sds[k] * 0.8;
    }
    return { studentId: 'S' + String(i + 1).padStart(3, '0'), name: nm, cls, comboId, abi };
  });
  const examNames = ['月考一', '期中考', '月考二'];
  const exams = examNames.map((en, ei) => ({
    name: en,
    line1: 512, line2: 448,
    students: students.map(st => {
      const combo = comboMap[st.comboId];
      const drift = gauss(rnd) * 2.5;
      const row = { studentId: st.studentId, name: st.name, cls: st.cls, comboId: st.comboId };
      for (const k of comboSubjectKeys(combo)) {
        let v = st.abi[k] + drift + gauss(rnd) * sds[k] * 0.45;
        v = Math.max(8, Math.min(maxs[k] - 2, v));
        row[k] = Math.round(v);
      }
      return row;
    }),
  }));
  // 示例数据也带上「学校官方年排」，让演示与新导入口径一致
  for (const ex of exams) {
    const comp = computeExamData(ex, settings, null);
    const byId = new Map(comp.rows.map(r => [r.id, r]));
    for (const s of ex.students) {
      const r = byId.get(s.studentId);
      if (r && r.totalRank != null) s.yearRank = r.totalRank;
    }
  }
  return exams;
}

/* --- 档位、分数线、学生身份的安全兜底：只影响计算，不改写用户数据 --- */
function safeBands(bands) {
  const fallback = defaultSettings().bands;
  if (!Array.isArray(bands) || !bands.length) return fallback;
  const out = bands.map((b, i) => ({
    name: b && b.name != null ? String(b.name) : (fallback[i] ? fallback[i].name : '档' + (i + 1)),
    pct: Number(b && b.pct), min: Number(b && b.min), max: Number(b && b.max),
  }));
  const ok = out.every(b => Number.isFinite(b.pct) && b.pct >= 0 && b.pct <= 100 &&
    Number.isFinite(b.min) && Number.isFinite(b.max) && b.min <= b.max && b.min >= 0 && b.max <= 100);
  return ok ? out : fallback;
}
function lineNumberOrNull(v) {
  if (v === '' || v == null) return null;
  const n = Number(v);
  return Number.isFinite(n) ? n : null;
}
function resolveLines(exam, settings) {
  const fallback = defaultSettings();
  let l1 = lineNumberOrNull(exam && exam.line1);
  let l2 = lineNumberOrNull(exam && exam.line2);
  if (l1 == null) l1 = lineNumberOrNull(settings && settings.line1);
  if (l2 == null) l2 = lineNumberOrNull(settings && settings.line2);
  if (l1 == null || l1 < 0 || l1 > 750) l1 = fallback.line1;
  if (l2 == null || l2 < 0 || l2 > 750) l2 = fallback.line2;
  if (l2 >= l1) l2 = Math.max(0, l1 - (fallback.line1 - fallback.line2));
  return { line1: l1, line2: l2 };
}
function examLine1(exam, settings) { return resolveLines(exam, settings).line1; }
function examLine2(exam, settings) { return resolveLines(exam, settings).line2; }
/* --- G 线命名：G1/G2 是固定编号（第一/第二参考线），线名可在设置里自定义（如 重点线/普高线） ---
   展示约定：短处（KPI、表头、PK 指标名）用 G1/G2；长处（说明、家长版）给自定义线名全称。 */
function lineName1(s) { return (s && s.line1Name) || '本一线'; }
function lineName2(s) { return (s && s.line2Name) || '本二线'; }
function gLineTag(n, s) { return 'G' + n + ' · ' + (n === 1 ? lineName1(s) : lineName2(s)); }
function lineBandLabel(band, s) { return band === 1 ? lineName1(s) + '以上' : band === 2 ? lineName2(s) + '以上' : '未上线'; }
function lineBandWord(band, s) { return band === 1 ? '达到' + lineName1(s) : band === 2 ? '达到' + lineName2(s) : '暂未达到' + lineName1(s); }
function scoreOrNull(v, max) {
  const n = numOrNull(v);
  return n == null || n < 0 || n > max ? null : n;
}
/* 学号优先；旧备份无学号时按「班级 + 姓名」对齐，避免不同班同名串人。
   key 只用可安全放进 DOM 属性/URL 的字符，避免控制字符被浏览器改写。 */
function studentIdentity(s) {
  s = s || {};
  const studentId = normalizeStudentId(typeof s.studentId !== 'undefined' ? s.studentId : (typeof s.id !== 'undefined' ? s.id : s.sid));
  const name = normalizeCell(s.name);
  const cls = normalizeCell(s.cls);
  return {
    studentId, name, cls,
    key: studentId ? 'id:' + encodeURIComponent(studentId)
      : (cls ? 'class:' + encodeURIComponent(cls) + ':' + encodeURIComponent(name)
        : 'name:' + encodeURIComponent(name)),
  };
}
function studentKey(s) { return studentIdentity(s).key; }

/* --- 等级赋分（江苏：A15/B35/C35/D13/E2，档内线性插值） --- */
function assignGrades(entries, bands) {
  // entries: [{id, raw}] → Map id → {level, score}；diagnostics 记录实际档位占比
  const res = new Map();
  const useBands = safeBands(bands);
  const list = entries.filter(e => e && e.id != null && e.raw != null && Number.isFinite(Number(e.raw)))
    .map(e => ({ id: e.id, raw: Number(e.raw) }))
    .sort((a, b) => b.raw - a.raw);
  const n = list.length;
  const counts = useBands.map(() => 0);
  let tiedBoundary = 0;
  if (n > 0) {
    let prev = 0, cum = 0;
    for (let bi = 0; bi < useBands.length; bi++) {
      const band = useBands[bi];
      cum += band.pct / 100;
      const i0 = prev;
      // 档位人数按比例取整；但某档比例>0 时至少留 1 人，
      // 否则选考人数少（如 1~6 人）会把第一名挤到下一档，总分被低估
      let i1 = bi === useBands.length - 1
        ? n
        : Math.min(n, band.pct > 0 ? Math.max(i0 + 1, Math.round(n * cum)) : Math.round(n * cum));
      // 同分同档：档位边界若切开同分考生，把边界下移让同分进同一档
      if (i1 > i0 && i1 < n) {
        const v = list[i1 - 1].raw;
        const before = i1;
        while (i1 < n && list[i1].raw === v) i1++;
        if (i1 > before) tiedBoundary++;
      }
      prev = i1;
      if (i1 <= i0) continue;
      counts[bi] = i1 - i0;
      const hiRaw = list[i0].raw, loRaw = list[i1 - 1].raw;
      const span = hiRaw - loRaw;
      const bSpan = band.max - band.min;
      for (let i = i0; i < i1; i++) {
        const e = list[i];
        let sc;
        if (span > 0) sc = Math.round(band.min + (e.raw - loRaw) * bSpan / span);
        else sc = Math.round((band.min + band.max) / 2);
        sc = Math.max(band.min, Math.min(band.max, sc));
        res.set(e.id, { level: band.name, score: sc });
      }
    }
  }
  const target = useBands.map(b => b.pct);
  const actual = counts.map(c => n ? c / n * 100 : 0);
  const maxDeviation = Math.max.apply(null, actual.map((v, i) => Math.abs(v - target[i])).concat([0]));
  Object.defineProperty(res, 'diagnostics', {
    value: { count: n, target, actual, counts, maxDeviation, tiedBoundary },
    enumerable: false,
  });
  return res;
}

/* --- 并列名次（1,2,2,4 式）：dir=-1 降序 --- */
function competitionRanks(items, valueOf, dir) {
  dir = dir === undefined ? -1 : dir;
  const ranks = new Map();
  const list = items.filter(x => valueOf(x) != null && !isNaN(valueOf(x)))
    .slice().sort((a, b) => dir * (valueOf(a) - valueOf(b)));
  let i = 0;
  while (i < list.length) {
    const v = valueOf(list[i]);
    let j = i;
    while (j < list.length && valueOf(list[j]) === v) j++;
    for (let k = i; k < j; k++) ranks.set(list[k], i + 1);
    i = j;
  }
  return ranks;
}

/* --- 单场考试全量计算（按稳定学生 ID 对齐，越界分数按缺考处理） --- */
function computeExamData(exam, settings, prevExam) {
  const array = Array.isArray(exam && exam.students) ? exam.students : [];
  const combos = (settings && settings.combos) || DEFAULT_COMBOS;
  const classes = (settings && settings.classes) || DEFAULT_CLASSES;
  // 建立 comboId → combo 映射
  const comboMap = {};
  for (const c of combos) comboMap[c.id] = c;
  // 建立 className → combos 映射（同名班级的组合合并，避免后者覆盖前者）
  const classComboMap = {};
  for (const c of classes) {
    const cs = (c.comboIds || []).map(id => comboMap[id]).filter(Boolean);
    const key = c.name;
    if (!classComboMap[key]) classComboMap[key] = [];
    for (const x of cs) if (!classComboMap[key].includes(x)) classComboMap[key].push(x);
  }

  const rows = array.map(s => {
    const ident = studentIdentity(s);
    // 解析该生的选科组合
    let combo = null;
    if (s.comboId) combo = comboMap[s.comboId] || null;
    if (!combo && s.cls) {
      const clsCombos = classComboMap[s.cls] || [];
      if (clsCombos.length) combo = clsCombos[0];
    }
    if (!combo) combo = combos[0] || DEFAULT_COMBOS[0];
    const keys = comboSubjectKeys(combo);
    const raw = {};
    for (const k of keys) {
      const def = SUBJECT_MAP[k];
      raw[k] = scoreOrNull(s[k], def ? def.max : 100);
    }
    // 未选考的科目统一置 null，避免下游读到 undefined
    for (const def of SUBJECT_DEFS) {
      if (!(def.key in raw)) raw[def.key] = null;
    }
    // 赋分覆盖列（旧格式：chemScore/geoScore；新格式：用科目 key 命名）
    const assigned = assignedKeysForCombo(combo);
    const ov = {};
    for (const k of assigned) {
      ov[k] = scoreOrNull(s[k + 'Score'] ?? s[k + 'Assigned'], 100);
    }
    return {
      id: ident.key, studentId: ident.studentId,
      name: ident.name || String(s && s.name || ''), cls: ident.cls,
      comboId: combo.id, comboName: comboLabel(combo), trackName: comboTrackName(combo),
      track1: combo.track1 || 'physics',
      yearRank: scoreOrNull(s.yearRank, 100000),
      raw, ov, assignedKeys: assigned,
    };
  });

  const bands = settings && settings.bands;
  // 按赋分科目分组赋分（每个赋分科目独立排位）
  const gradeResults = {};
  for (const r of rows) {
    for (const k of r.assignedKeys) {
      if (!gradeResults[k]) gradeResults[k] = [];
      gradeResults[k].push({ id: r.id, raw: r.raw[k] });
    }
  }
  const assignedMaps = {};
  for (const k of Object.keys(gradeResults)) {
    assignedMaps[k] = assignGrades(gradeResults[k].filter(e => e.raw != null), bands);
  }

  const seen = new Set(), duplicateKeys = [];
  for (const r of rows) {
    if (seen.has(r.id)) duplicateKeys.push(r.id);
    seen.add(r.id);
    // 赋分
    const assigned = {};
    const levels = {};
    for (const k of r.assignedKeys) {
      const g = assignedMaps[k] ? assignedMaps[k].get(r.id) : null;
      assigned[k] = r.ov[k] != null ? r.ov[k] : (g ? g.score : null);
      levels[k] = r.ov[k] != null ? '—' : (g ? g.level : '—');
    }
    // 总分：语数外 + 物理/历史 + 赋分2科
    const core = hs31IsJunior() ? hs31RuleContext.subjects.map(s=>s.key) : [...CORE3, r.track1];
    const coreVals = core.map(k => r.raw[k]);
    const assignedVals = r.assignedKeys.map(k => assigned[k]);
    r.total = (coreVals.every(v => v != null) && assignedVals.every(v => v != null))
      ? coreVals.reduce((a, b) => a + b, 0) + assignedVals.reduce((a, b) => a + b, 0)
      : null;
    r.assigned = assigned;
    r.levels = levels;
    // subj 统一映射：只含该生实际选考的科目（raw 里未选考的科目是 null 占位，不算入）
    r.subj = {};
    r.subjectKeys = [];
    for (const k of comboSubjectKeys(comboMap[r.comboId])) {
      if (!(k in r.raw)) continue;
      r.subj[k] = r.raw[k];
      r.subjectKeys.push(k);
    }
    for (const k of r.assignedKeys) {
      r.subj[k] = assigned[k];
      if (!r.subjectKeys.includes(k)) r.subjectKeys.push(k);
    }
  }
  // 名次：只统计有该科成绩的学生；单科名次不写成「校/年级名次」
  const allKeys = new Set();
  for (const r of rows) for (const k of Object.keys(r.subj)) allKeys.add(k);
  for (const k of allKeys) {
    const rk = competitionRanks(rows, r => r.subj[k]);
    for (const r of rows) r[k + 'Rank'] = rk.get(r) || null;
  }
  // 总榜、物理类榜、历史类榜
  const totalRk = competitionRanks(rows, r => r.total);
  const physRows = rows.filter(r => r.track1 === 'physics');
  const histRows = rows.filter(r => r.track1 === 'history');
  const physRk = competitionRanks(physRows, r => r.total);
  const histRk = competitionRanks(histRows, r => r.total);
  for (const r of rows) {
    r.computedTotalRank = totalRk.get(r) || null;
    const official = numOrNull(r.yearRank);
    r.hasOfficialRank = official != null && Number.isInteger(official) && official > 0;
    r.totalRank = r.hasOfficialRank ? official : r.computedTotalRank;
    r.physRank = r.track1 === 'physics' ? (physRk.get(r) || null) : null;
    r.histRank = r.track1 === 'history' ? (histRk.get(r) || null) : null;
    // 类别排名：物理类/历史类
    r.trackRank = r.track1 === 'history' ? r.histRank : r.physRank;
  }
  // 班内排名（行政班口径：整个班混排）
  for (const r of rows) r.classRank = null;
  const byCls = new Map();
  for (const r of rows) {
    if (!r.cls) continue;
    if (!byCls.has(r.cls)) byCls.set(r.cls, []);
    byCls.get(r.cls).push(r);
  }
  for (const grp of byCls.values()) {
    const rk = competitionRanks(grp, r => r.total);
    for (const r of grp) r.classRank = rk.get(r) || null;
  }
  // 组合内排名（选科组合口径：同一组合的学生排）
  const byCombo = new Map();
  for (const r of rows) {
    if (!byCombo.has(r.comboId)) byCombo.set(r.comboId, []);
    byCombo.get(r.comboId).push(r);
  }
  for (const grp of byCombo.values()) {
    const rk = competitionRanks(grp, r => r.total);
    for (const r of grp) r.comboRank = rk.get(r) || null;
  }
  // 只有紧邻上一场、且同一学生都有有效总分时才算变化
  const prevMap = new Map();
  if (prevExam) {
    const prevRows = computeExamData(prevExam, settings, null).rows;
    for (const pr of prevRows) if (!prevMap.has(pr.id)) prevMap.set(pr.id, pr);
  }
  for (const r of rows) {
    const pr = prevMap.get(r.id);
    r.prevTotal = pr ? pr.total : null;
    r.prevRank = pr ? pr.totalRank : null;
    r.totalDelta = (pr && r.total != null && pr.total != null) ? r.total - pr.total : null;
    const rankComparable = pr && r.totalRank != null && pr.totalRank != null && r.hasOfficialRank === pr.hasOfficialRank;
    r.rankDelta = rankComparable ? pr.totalRank - r.totalRank : null;
    r.trend = r.totalDelta == null ? null : (r.totalDelta > 0 ? 'up' : (r.totalDelta < 0 ? 'down' : 'flat'));
  }
  // 上线
  const lines = resolveLines(exam, settings);
  const L1 = lines.line1, L2 = lines.line2;
  for (const r of rows) {
    if (r.total == null || L1 == null || L2 == null) { r.lineStatus = null; r.lineBand = null; r.toLine1 = null; r.toLine2 = null; continue; }
    r.lineBand = r.total >= L1 ? 1 : (r.total >= L2 ? 2 : 0);   // 数值档位：1=G1 线上 / 2=两线之间 / 0=线下；文案一律经 lineBandLabel
    r.lineStatus = lineBandLabel(r.lineBand, settings);
    r.toLine1 = r.total - L1; r.toLine2 = r.total - L2;
  }
  // 统计（分母统一为有有效总分的人数）
  const withTotal = rows.filter(r => r.total != null);
  const avg = arr => arr.length ? arr.reduce((a, b) => a + b, 0) / arr.length : null;
  const subjAvg = {}, subjSd = {}, subjN = {};
  for (const k of allKeys) {
    const vs = rows.map(r => r.subj[k]).filter(v => v != null);
    subjAvg[k] = avg(vs);
    subjN[k] = vs.length;
    subjSd[k] = vs.length > 1 ? Math.sqrt(vs.reduce((a, v) => a + (v - subjAvg[k]) * (v - subjAvg[k]), 0) / (vs.length - 1)) : null;
  }
  const matched = rows.filter(r => r.totalDelta != null);
  const l1c = L1 == null ? 0 : withTotal.filter(r => r.total >= L1).length;
  const l2c = L2 == null ? 0 : withTotal.filter(r => r.total >= L2).length;
  // 赋分诊断（人数太少时档位占比天然偏差大，不作警告）
  const useBandsPct = (safeBands(bands) || []).map(x => Number(x.pct) || 0);
  const gradeDiagnostics = { warning: false, bySubject: {} };
  for (const k of Object.keys(assignedMaps)) {
    const g = assignedMaps[k];
    gradeDiagnostics.bySubject[k] = g.diagnostics;
    // 样本量太小时档位占比天然偏差大（最小档 2% 取不到整人），不作为警告
    // 阈值：至少要有 2 倍最小档位的人数才可靠（5 档制 → 2% → 100 人）
    const minReliable = Math.max(30, Math.round(100 / Math.max(1, useBandsPct[4] || 2)));
    if (g.diagnostics.count >= minReliable && g.diagnostics.maxDeviation >= 8) gradeDiagnostics.warning = true;
  }
  const totVals = withTotal.map(r => r.total);
  const totMean = avg(totVals);
  const sdTotal = totVals.length > 1 ? Math.sqrt(totVals.reduce((a, v) => a + (v - totMean) * (v - totMean), 0) / (totVals.length - 1)) : null;
  for (const r of rows) r.totalZ = (r.total != null && sdTotal) ? (r.total - totMean) / sdTotal : null;
  const stats = {
    count: rows.length, validCount: withTotal.length,
    avgTotal: avg(withTotal.map(r => r.total)),
    line1Count: l1c, line2Count: l2c,
    line1Rate: withTotal.length && L1 != null ? l1c / withTotal.length : null,
    line2Rate: withTotal.length && L2 != null ? l2c / withTotal.length : null,
    upCount: matched.filter(r => r.totalDelta > 0).length,
    downCount: matched.filter(r => r.totalDelta < 0).length,
    flatCount: matched.filter(r => r.totalDelta === 0).length,
    subjAvg, subjSd, subjN, sdTotal, line1: L1, line2: L2, duplicateKeys, gradeDiagnostics,
  };
  return { rows, stats };
}

function computeAll(data) {
  const out = [];
  for (let i = 0; i < data.exams.length; i++) {
    out.push(computeExamData(data.exams[i], data.settings, i > 0 ? data.exams[i - 1] : null));
  }
  return out;
}

function numOrNull(v) {
  if (v === '' || v == null) return null;
  const n = Number(v);
  return isNaN(n) ? null : n;
}

/* --- 多次考试后学生历史（按稳定 ID 对齐） --- */
function studentHistory(computed, key) {
  return computed.map(c => c.rows.find(x => x.id === key) || null);
}

/* --- 连续退步判定：只看最近的连续 k+1 场，缺考即不判定 --- */
function continuousDecline(history, k, upToIdx) {
  const end = upToIdx == null ? history.length : Math.min(history.length, upToIdx + 1);
  const tail = history.slice(Math.max(0, end - (k + 1)), end);
  if (tail.length < k + 1 || tail.some(r => !r || r.total == null)) return false;
  // v3.3: grade-normed Z scores resist exam-difficulty drift; RCI gate rejects pure measurement noise
  const zs = tail.map(r => (r.totalZ != null ? r.totalZ : null));
  if (zs.every(z => z != null)) {
    for (let i = 1; i < zs.length; i++) if (zs[i] >= zs[i - 1]) return false;
    const rci = 1.645 * Math.sqrt(2 * (1 - 0.80));
    return (zs[0] - zs[zs.length - 1]) >= rci;
  }
  for (let i = 1; i < tail.length; i++) if (tail[i].total >= tail[i - 1].total) return false;
  return true;
}

/* --- 班级 PK：班级聚合（均分 / 上线 / 进步 / 稳定 / 学科画像） --- */
function classAggList(computed, prevComputed) {
  const rows = (computed && computed.rows || []).filter(r => r.cls);
  const byCls = new Map();
  for (const r of rows) {
    if (!byCls.has(r.cls)) byCls.set(r.cls, []);
    byCls.get(r.cls).push(r);
  }
  // 上一场的班均分（用于进步幅度）
  const prevAvg = new Map();
  if (prevComputed) {
    const pm = new Map();
    for (const r of (prevComputed.rows || [])) {
      if (!r.cls || r.total == null) continue;
      if (!pm.has(r.cls)) pm.set(r.cls, []);
      pm.get(r.cls).push(r.total);
    }
    for (const [k, arr] of pm) prevAvg.set(k, arr.reduce((a, b) => a + b, 0) / arr.length);
  }
  const L1 = computed && computed.stats ? computed.stats.line1 : null;
  const L2 = computed && computed.stats ? computed.stats.line2 : null;
  const list = [];
  for (const [cls, arr] of byCls) {
    const totals = arr.map(r => r.total).filter(v => v != null);
    const avg = totals.length ? totals.reduce((a, b) => a + b, 0) / totals.length : null;
    const sorted = [...totals].sort((a, b) => a - b);
    const median = !sorted.length ? null
      : sorted.length % 2 ? sorted[(sorted.length - 1) / 2]
        : (sorted[sorted.length / 2 - 1] + sorted[sorted.length / 2]) / 2;
    const sd = totals.length > 1
      ? Math.sqrt(totals.reduce((a, v) => a + (v - avg) * (v - avg), 0) / totals.length) : null;
    const subj = {}, subjRate = {};
    const keySet = new Set();
    for (const r of arr) for (const k of (r.subjectKeys || [])) keySet.add(k);
    for (const k of keySet) {
      const vs = arr.map(r => r.subj[k]).filter(v => v != null);
      const a = vs.length ? vs.reduce((x, y) => x + y, 0) / vs.length : null;
      subj[k] = a;
      const def = SUBJECT_MAP[k];
      subjRate[k] = (a != null && def) ? a / def.max : null;
    }
    list.push({
      cls, count: totals.length, avgTotal: avg, median, sd,
      line1Rate: (totals.length && L1 != null) ? totals.filter(v => v >= L1).length / totals.length : null,
      line2Rate: (totals.length && L2 != null) ? totals.filter(v => v >= L2).length / totals.length : null,
      avgDelta: (prevAvg.get(cls) != null && avg != null) ? avg - prevAvg.get(cls) : null,
      subj, subjRate,
    });
  }
  // 学科优势 / 待提升：与联盟（各班平均得分率）比
  const leagueRate = {};
  for (const k of Object.keys(SUBJECT_MAP)) {
    const rs = list.map(x => x.subjRate[k]).filter(v => v != null);
    if (rs.length >= 2) leagueRate[k] = rs.reduce((a, b) => a + b, 0) / rs.length;
  }
  for (const x of list) {
    x.leagueRate = leagueRate;
    let best = null, worst = null, strong = null;
    for (const k of Object.keys(x.subjRate)) {
      const rate = x.subjRate[k];
      if (rate == null) continue;
      if (strong == null || rate > x.subjRate[strong]) strong = k;
      if (leagueRate[k] == null) continue;
      const gap = rate - leagueRate[k];
      if (best == null || gap > x.subjRate[best] - leagueRate[best]) best = k;
      if (worst == null || gap < x.subjRate[worst] - leagueRate[worst]) worst = k;
    }
    x.bestSubj = best; x.worstSubj = worst; x.strongSubj = strong;
  }
  return list;
}

/* PK 排序：avg 总均分 / line1 G1 率 / delta 进步 / stability 稳定（波动小在前） */
function pkSort(list, metric) {
  const l = [...list];
  if (metric === 'line1') l.sort((a, b) => (b.line1Rate == null ? -1 : b.line1Rate) - (a.line1Rate == null ? -1 : a.line1Rate));
  else if (metric === 'delta') l.sort((a, b) => (b.avgDelta == null ? -Infinity : b.avgDelta) - (a.avgDelta == null ? -Infinity : a.avgDelta));
  else if (metric === 'stability') l.sort((a, b) => (a.sd == null ? Infinity : a.sd) - (b.sd == null ? Infinity : b.sd));
  else l.sort((a, b) => (b.avgTotal == null ? -1 : b.avgTotal) - (a.avgTotal == null ? -1 : a.avgTotal));
  return l;
}

function validateSettings(settings) {
  const errors = [];
  // ===== 选科组合 / 班级校验 =====
  const combos = (settings && settings.combos) || [];
  const classes = (settings && settings.classes) || [];
  if (combos.length) {
    const names = new Map();
    combos.forEach((c, i) => {
      const label = (c && c.name != null && String(c.name).trim()) ? String(c.name).trim() : ('第 ' + (i + 1) + ' 个组合');
      const t2 = (c && c.track2) || [];
      if (!TRACK1_KEYS.includes(c && c.track1)) errors.push(`组合「${label}」：首选科目须是物理或历史。`);
      if (t2.length !== 2) {
        errors.push(`组合「${label}」：再选科目须恰好 2 门（当前 ${t2.length} 门）——3+1+2 的两门再选科目按赋分计入总分，少于或多于 2 门都会让总分口径失真。`);
      } else if (t2[0] === t2[1]) {
        errors.push(`组合「${label}」：再选科目重复。`);
      }
      const key = String(c && c.name != null ? c.name : '').trim();
      if (!key) errors.push(`第 ${i + 1} 个组合名称为空，导入表按名称匹配时会认错，请补上名称。`);
      if (key) {
        if (names.has(key)) errors.push(`组合名称重复：「${key}」，导入表按名称匹配时会认错，请改成唯一名称。`);
        else names.set(key, true);
      }
    });
  }
  const clsNames = new Map();
  classes.forEach((cl, i) => {
    const nm = cl && cl.name != null ? String(cl.name).trim() : '';
    if (!nm) { errors.push(`第 ${i + 1} 个班级名称为空。`); return; }
    if (clsNames.has(nm)) errors.push(`班级名称重复：「${nm}」，同一个班级名只能对应一组选科组合。`);
    else clsNames.set(nm, true);
    if (!((cl && cl.comboIds) || []).length) errors.push(`班级「${nm}」未勾选任何选科组合，该班学生将回退到第一个组合。`);
  });
  const bands = settings && settings.bands;
  if (!Array.isArray(bands) || !bands.length) {
    errors.push('赋分档位为空，已临时使用默认 5 档。');
  } else {
    const sum = bands.reduce((a, b) => a + (Number(b.pct) || 0), 0);
    if (Math.abs(sum - 100) > 0.01) errors.push(`各档比例合计为 ${sum}%，应为 100%。`);
    let prevMin = null;
    bands.forEach((b, i) => {
      const label = b.name || '第 ' + (i + 1) + ' 档';
      if (!(Number(b.pct) >= 0 && Number(b.pct) <= 100)) errors.push(`${label}：比例须在 0–100% 之间。`);
      if (!(Number(b.min) >= 0 && Number(b.max) <= 100 && Number(b.min) <= Number(b.max))) {
        errors.push(`${label}：赋分区间须在 0–100 分之间，且下限不大于上限。`);
      }
      // 档位按分值从高到低排列：下一档的下限应低于上一档的下限，且区间不重叠
      if (prevMin != null && Number(b.min) >= prevMin) errors.push(`${label}：赋分下限须低于上一档的下限（档位从高到低排列）。`);
      prevMin = Number(b.min);
    });
  }
  const l1 = Number(settings && settings.line1), l2 = Number(settings && settings.line2);
  if (!Number.isFinite(l1) || l1 < 0 || l1 > 750) errors.push('G1 线须在 0–750 分之间。');
  if (!Number.isFinite(l2) || l2 < 0 || l2 > 750) errors.push('G2 线须在 0–750 分之间。');
  if (Number.isFinite(l1) && Number.isFinite(l2) && l2 >= l1) errors.push('G2 线须低于 G1 线。');
  return errors;
}

function dataWarnings(exams, settings) {
  const out = validateSettings(settings);
  for (let i = 0; i < exams.length; i++) {
    const ex = exams[i];
    const l1 = Number(ex.line1), l2 = Number(ex.line2);
    if (Number.isFinite(l1) && (l1 < 0 || l1 > 750)) out.push(`「${ex.name}」G1 线 ${l1} 超出 0–750，计算时已用默认值。`);
    if (Number.isFinite(l2) && (l2 < 0 || l2 > 750)) out.push(`「${ex.name}」G2 线 ${l2} 超出 0–750，计算时已用默认值。`);
    if (Number.isFinite(l1) && Number.isFinite(l2) && l2 >= l1) out.push(`「${ex.name}」G2 线不低于 G1 线，计算时已自动调整。`);
    const students = Array.isArray(ex.students) ? ex.students : [];
    const seen = new Set(), dup = [];
    for (const s of students) {
      const key = studentKey(s);
      if (seen.has(key)) dup.push(s.name || key);
      seen.add(key);
    }
    if (dup.length) out.push(`「${ex.name}」有 ${dup.length} 条重复身份（${dup.slice(0, 3).join('、')}${dup.length > 3 ? '…' : ''}），跨场对比会取第一条；请补学号并重导。`);
    const withId = students.filter(s => studentIdentity(s).studentId).length;
    if (students.length && !withId) out.push(`「${ex.name}」没有学号，按「班级 + 姓名」临时对齐；同名/改名/转班时建议补学号。`);
  }
  return out;
}

/* --- 成绩模板 / 规范导出（动态科目） --- */
function csvEscape(v) {
  const s = String(v == null ? '' : v);
  const guarded = /^[=+\-@\t\r]/.test(s) ? "'" + s : s;
  return /[",\r\n]/.test(guarded) ? '"' + guarded.replace(/"/g, '""') + '"' : guarded;
}
function csvCellNum(v) {
  return v == null || v === '' || isNaN(Number(v)) ? '' : v;
}
/* 根据 settings 里的组合定义生成表头 */
function buildTemplateHeaders(settings) {
  const combos = (settings && settings.combos) || DEFAULT_COMBOS;
  const subjKeys = new Set();
  for (const c of combos) for (const k of comboSubjectKeys(c)) subjKeys.add(k);
  // 语数外 + 物理/历史 + 赋分科目
  const ordered = ['chinese', 'math', 'english'];
  if (subjKeys.has('physics')) ordered.push('physics');
  if (subjKeys.has('history')) ordered.push('history');
  for (const k of TRACK2_KEYS) if (subjKeys.has(k)) ordered.push(k);
  const headers = ['学号', '姓名', '班级', '选科组合', '年级排名'];
  for (const k of ordered) {
    const def = SUBJECT_MAP[k];
    headers.push(def ? def.name : k);
  }
  // 赋分列
  for (const k of TRACK2_KEYS) {
    if (subjKeys.has(k) && SUBJECT_MAP[k] && SUBJECT_MAP[k].assigned) {
      headers.push((SUBJECT_MAP[k].name || k) + '赋分');
    }
  }
  return { headers, subjectKeys: ordered };
}
/* 名单模板带学号，保证跨场追踪与重名区分 */
function buildTemplateCsv(students, settings) {
  const { headers, subjectKeys } = buildTemplateHeaders(settings);
  const rows = [headers.slice()];
  for (const s of (students || [])) {
    const row = [s.studentId || '', s.name || '', s.cls || '', s.comboName || s.comboId || '', csvCellNum(s.yearRank)];
    for (const k of subjectKeys) row.push(csvCellNum(s[k]));
    // 赋分列
    const subjSet = new Set(subjectKeys);
    for (const k of TRACK2_KEYS) {
      if (subjSet.has(k) && SUBJECT_MAP[k] && SUBJECT_MAP[k].assigned) {
        row.push(csvCellNum(s[k + 'Score'] ?? s[k + 'Assigned']));
      }
    }
    rows.push(row);
  }
  return String.fromCharCode(0xFEFF) + rows.map(r => r.map(csvEscape).join(',')).join('\r\n') + '\r\n';
}
/* 本场规范化成绩表（含原始分、赋分、总分、名次、上线） */
function buildGradesExportCsv(rows) {
  const out = [];
  if (!rows.length) return String.fromCharCode(0xFEFF);
  // 动态表头：收集所有科目
  const subjKeys = [];
  const seen = new Set();
  for (const r of rows) {
    for (const k of Object.keys(r.subj || {})) {
      if (!seen.has(k)) { seen.add(k); subjKeys.push(k); }
    }
  }
  // 排序：语数外 + 物理/历史 + 赋分
  subjKeys.sort((a, b) => SUBJECT_ORDER.indexOf(a) - SUBJECT_ORDER.indexOf(b));
  const head = ['学号', '姓名', '班级', '选科组合', '物理/历史', '年级排名', ...subjKeys.map(k => {
    const def = SUBJECT_MAP[k];
    const name = def ? def.name : k;
    return isAssignedSubject(k) ? name + '(赋分)' : name;
  }), '总分', '总榜排名', '物理类排名', '历史类排名', '班内排名', '组合内排名', '上线'];
  out.push(head.map(csvEscape).join(','));
  for (const r of rows) {
    const trackVal = r.raw.physics != null ? '物理' : r.raw.history != null ? '历史' : '';
    const row = [
      r.studentId || '', r.name, r.cls || '', r.comboName || '', trackVal, csvCellNum(r.totalRank),
      ...subjKeys.map(k => csvCellNum(r.subj[k])),
      csvCellNum(r.total), csvCellNum(r.totalRank), csvCellNum(r.physRank), csvCellNum(r.histRank),
      csvCellNum(r.classRank), csvCellNum(r.comboRank), r.lineStatus || '',
    ];
    out.push(row.map(csvEscape).join(','));
  }
  return String.fromCharCode(0xFEFF) + out.join('\r\n') + '\r\n';
}

/* --- 导入解析：CSV / TSV，自动识别表头、汇总行、空班级、无关列 --- */
function splitImportLines(text) {
  const lines = String(text == null ? '' : text).replace(/^\uFEFF/, '').split(/\r\n|\n|\r/).map(l => l.replace(/\u00A0/g, ' ').trimEnd());
  while (lines.length && lines[lines.length - 1].trim() === '') lines.pop();
  return lines;
}
function normalizeCell(raw) {
  let s = String(raw == null ? '' : raw);
  s = s.replace(/\u00A0/g, ' ').replace(/\u3000/g, ' ');
  // 全角 ASCII（数字、字母、括号、逗号等）转半角
  s = s.replace(/[！-～]/g, ch => String.fromCharCode(ch.charCodeAt(0) - 0xFEE0));
  return s.replace(/\s+/g, ' ').trim();
}
function normalizeHeader(raw) {
  return normalizeCell(raw).replace(/[\s（）()【】\[\]：:·.、]/g, '');
}
function detectDelimiter(lines) {
  let tab = 0, comma = 0, semi = 0;
  for (const ln of lines.slice(0, 30)) {
    tab += (ln.match(/\t/g) || []).length;
    comma += (ln.match(/,/g) || []).length;
    semi += (ln.match(/;/g) || []).length;
  }
  if (tab > 0) return '\t';
  if (semi > comma) return ';';
  return ',';
}
function splitImportLine(line, delim) {
  const out = [];
  let cur = '', quoted = false;
  for (let i = 0; i < line.length; i++) {
    const ch = line[i];
    if (quoted) {
      if (ch === '"') {
        if (line[i + 1] === '"') { cur += '"'; i++; }
        else quoted = false;
      } else cur += ch;
    } else if (ch === '"') {
      quoted = true;
    } else if (ch === delim) {
      out.push(cur); cur = '';
    } else cur += ch;
  }
  out.push(cur);
  return out.map(normalizeCell);
}

const HEADER_IGNORE_RE = /(序号|编号|总分|合计|小计|统计|人数|平均|均分|最高|最低|及格率|优秀率|标准差|中位数|排名|名次|位次|等第|备注|联系|电话|地址|特长|评语)/;
function subjectHeaderScore(s, label) {
  if (s === label) return 100;
  if (s === label + '成绩' || s === label + '分数' || s === label + '原始分' || s === label + '得分') return 95;
  if (s.startsWith(label)) return 85;
  if (s.includes(label)) return 70;
  return 0;
}
/* 全科目识别（含历史/生物/政治） */
const SUBJ_HEADER_DEFS = [
  { key: 'chinese',  re: /语文/, name: '语文' },
  { key: 'math',     re: /数学/, name: '数学' },
  { key: 'english',  re: /英语|外语/, name: '英语' },
  { key: 'physics',  re: /物理/, name: '物理' },
  { key: 'history',  re: /历史/, name: '历史' },
  { key: 'chem',     re: /化学/, name: '化学', skip: /化学与生活/ },
  { key: 'bio',      re: /生物/, name: '生物' },
  { key: 'politics', re: /政治|道德与法治|道法|思想品德/, name: '政治' },
  { key: 'pe', re: /体育/, name: '体育' },
  { key: 'geo',      re: /地理/, name: '地理' },
];
function headerMatch(raw) {
