  for (const raw of vals) {
    const s = normalizeCell(raw);
    if (!s) continue;
    nonEmpty++;
    set.add(s);
    if (looksLikeName(s)) like++;
  }
  if (!nonEmpty) return -Infinity;
  const uniqRatio = set.size / nonEmpty;
  let score = like;
  if (uniqRatio > 0.8) score += nonEmpty * 0.5;
  if (uniqRatio < 0.35) score -= nonEmpty * 0.8;
  return score;
}
function subjectColumnScore(vals, max) {
  let nonEmpty = 0, num = 0, inRange = 0, meaningful = 0;
  for (const raw of vals) {
    const s = normalizeCell(raw);
    if (!s) continue;
    nonEmpty++;
    const p = parseImportScore(raw);
    if (p.error || p.value == null) continue;
    num++;
    if (p.value >= 0 && p.value <= max) inRange++;
    if (p.value > max * 0.12) meaningful++;
  }
  if (!nonEmpty) return 0;
  if (num / nonEmpty < 0.5) return -2;
  if (inRange / num < 0.8) return -1;
  if (meaningful / num < 0.5) return 0.8;
  return 2;
}
function classColumnScore(vals) {
  const ne = [];
  for (const raw of vals) { const s = normalizeCell(raw); if (s) ne.push(s); }
  if (!ne.length) return 0;
  const textVals = ne.filter(v => isNaN(Number(v)));
  const nums = ne.filter(v => !isNaN(Number(v))).map(Number);
  const uniq = new Set(ne).size;
  if (textVals.length / ne.length >= 0.6) {
    if (ne.some(v => /班|级|部|系/.test(v)) || uniq <= 20) return 3;
    return -4;
  }
  if (nums.length && uniq <= Math.max(3, Math.ceil(ne.length * 0.4)) && nums.every(v => v >= 0 && v <= 100)) return 2;
  return -4;
}
function studentIdColumnScore(vals) {
  const ne = vals.map(normalizeCell).filter(Boolean);
  if (ne.length < 2) return 0;
  const uniq = new Set(ne).size / ne.length;
  const sequential = ne.every(v => /^\d{1,3}$/.test(v)) &&
    ne.map(Number).sort((a, b) => a - b).every((v, i) => v === i + 1);
  const idLike = ne.filter(v => /^[A-Za-z0-9_-]{4,32}$/.test(v) && /\d/.test(v) && !/^\d{1,3}$/.test(v)).length;
  return uniq > 0.8 && !sequential && idLike / ne.length >= 0.8 ? 2 : 0;
}
function extraColumnKind(vals) {
  let nums = [], nonEmpty = 0;
  for (const raw of vals) {
    const s = normalizeCell(raw);
    if (!s) continue;
    nonEmpty++;
    const p = parseImportScore(raw);
    if (p.error || p.value == null) continue;
    nums.push(p.value);
  }
  if (!nonEmpty) return 'empty';
  if (nums.length / nonEmpty < 0.6) return 'other';
  if (nums.some(v => v > 150)) return 'total';
  if (nums.some(v => v < 20)) return 'rank';
  if (nums.every(v => v >= 0 && v <= 150)) return 'assigned';
  return 'other';
}

function parseNoHeaderTable(lines, delim, opts) {
  opts = opts || {};
  const rawRows = [];
  for (let i = 0; i < lines.length; i++) {
    const cells = splitImportLine(lines[i], delim);
    if (cells.some(c => c !== '')) rawRows.push({ line: i + 1, cells });
  }
  if (!rawRows.length) return { students: [], errors: ['没有内容'], notes: [], meta: null };

  const maxLen = Math.max.apply(null, rawRows.map(r => r.cells.length));
  // 1. 找姓名列（唯一性高的中文姓名列）
  let nameIdx = 0, bestNameScore = -Infinity;
  for (let j = 0; j < Math.min(6, maxLen); j++) {
    const sc = nameColumnScore(rawRows.map(r => r.cells[j] == null ? '' : r.cells[j]));
    if (sc > bestNameScore) { bestNameScore = sc; nameIdx = j; }
  }
  if (!isFinite(bestNameScore) || bestNameScore <= 0) nameIdx = 0;

  // 2. 找成绩列起点（允许姓名与成绩之间夹班级/序号列）
  //    科目数不固定：从 6 到 9 逐个尝试，取评分最高的起点
  const start = nameIdx + 1;
  let bestStart = -1, bestScore = -Infinity, bestCount = 0;
  for (let s = start; s <= Math.min(start + 3, maxLen - 1); s++) {
    for (let cnt = 6; cnt <= 9; cnt++) {
      if (s + cnt > maxLen) continue;
      let sc = 0, valid = 0;
      for (let k = 0; k < cnt; k++) {
        const def = SUBJECT_DEFS[k];
        const one = subjectColumnScore(rawRows.map(r => r.cells[s + k] == null ? '' : r.cells[s + k]), def.max);
        if (one > 0) valid++;
        sc += one;
      }
      if (valid < 3) continue;
      if (s === start) sc += 0.5;
      if (sc > bestScore) { bestScore = sc; bestStart = s; bestCount = cnt; }
    }
  }
  if (bestStart < 0) {
    return {
      students: [], errors: ['没识别到表头，也无法按列位置识别成绩。建议先点「下载空白模板」按模板填写，或确认每行包含姓名和各科成绩。'],
      notes: [], meta: null,
    };
  }
  const subjCount = bestCount;

  // 3. 学号 / 班级列：姓名与成绩之间，或姓名之前
  let clsIdx = -1, studentIdIdx = -1;
  const colVals = j => rawRows.map(r => r.cells[j] == null ? '' : r.cells[j]);
  for (let j = start; j < bestStart; j++) {
    if (studentIdIdx < 0 && studentIdColumnScore(colVals(j)) > 0) { studentIdIdx = j; continue; }
    if (clsIdx < 0 && classColumnScore(colVals(j)) > 0) clsIdx = j;
  }
  if (nameIdx > 0) {
    if (studentIdIdx < 0 && studentIdColumnScore(colVals(nameIdx - 1)) > 0) studentIdIdx = nameIdx - 1;
    if (clsIdx < 0 && classColumnScore(colVals(nameIdx - 1)) > 0) clsIdx = nameIdx - 1;
  }
  if (studentIdIdx === clsIdx) studentIdIdx = -1;
  // 常见老格式：姓名 + 班级 + 六科（正好 8 列）直接认定，
  // 避免把某一科里的错字（如 "abc"）当成"额外列"跳过去。
  if (bestStart > start && clsIdx === start && maxLen === nameIdx + 8) { bestStart = start + 1; }

  // 4. 多出来的列：赋分 / 总分 / 名次 / 备注
  const extraStart = bestStart + subjCount;
  let yearRankIdx = null, ignoredExtras = 0;
  const assignedIdx = [];
  for (let j = extraStart; j < maxLen; j++) {
    const kind = extraColumnKind(rawRows.map(r => r.cells[j] == null ? '' : r.cells[j]));
    if (kind === 'assigned') {
      assignedIdx.push(j);
    } else if (kind === 'rank') {
      if (yearRankIdx == null) yearRankIdx = j;
      else ignoredExtras++;
    } else if (kind !== 'empty') {
      ignoredExtras++;
    }
  }
  // 有些表把年排放在姓名和成绩之间
  if (yearRankIdx == null) {
    for (let j = start; j < bestStart; j++) {
      if (j === clsIdx) continue;
      if (extraColumnKind(rawRows.map(r => r.cells[j] == null ? '' : r.cells[j])) === 'rank') { yearRankIdx = j; break; }
    }
  }
  const ignoredBefore = Math.max(0, bestStart - start
    - (clsIdx >= start && clsIdx < bestStart ? 1 : 0)
    - (studentIdIdx >= start && studentIdIdx < bestStart ? 1 : 0)
    - (yearRankIdx != null && yearRankIdx >= start && yearRankIdx < bestStart && yearRankIdx !== clsIdx && yearRankIdx !== studentIdIdx ? 1 : 0));

  // 5. 解析
  const students = [], errors = [], notes = [];
  const seen = new Set(), seenNames = new Map();
  let duplicateKeys = 0;
  let lastCls = '', filled = 0, skipped = 0, blankRows = 0;
  // 无表头时按位置猜科目：语数外固定在前三列，其余按「已配置组合里最常见的排列」推断。
  // 排列候选：把每个组合的科目顺序按出现频次排序，频次相同则用标准顺序（语数外→物理→历史→化生政地）。
  const combos = (opts.combos) || DEFAULT_COMBOS;
  const comboKeyOrder = [];
  for (const c of combos) {
    for (const k of comboSubjectKeys(c)) if (!comboKeyOrder.includes(k)) comboKeyOrder.push(k);
  }
  // 统计每个科目出现在第几位（按组合）的频次，取最常见的位置
  const posCount = {};
  for (const c of combos) {
    comboSubjectKeys(c).forEach((k, idx) => {
      if (!posCount[k]) posCount[k] = {};
      posCount[k][idx] = (posCount[k][idx] || 0) + 1;
    });
  }
  const guessKeys = comboKeyOrder.slice().sort((a, b) => {
    // 该科目在所有组合里出现在第 0/1/2 位的累计次数（越靠前越优先）
    const score = k => {
      const m = posCount[k] || {};
      return (m[0] || 0) * 100 + (m[1] || 0) * 10 + (m[2] || 0);
    };
    const d = score(b) - score(a);
    if (d !== 0) return d;
    return SUBJECT_ORDER.indexOf(a) - SUBJECT_ORDER.indexOf(b);
  });
  // 用户指定的科目列映射（列序号 → 科目 key）；没指定时按位置猜
  const userMap = opts.subjectMap || null;
  const guessed = [];
  for (let k = 0; k < subjCount; k++) {
    guessed.push(userMap && userMap[k] ? userMap[k] : (guessKeys[k] || ''));
  }
  for (const r of rawRows) {
    const cells = r.cells;
    if (isAggregateRow(cells)) { skipped++; continue; }
    if (studentIdIdx >= 0 && /^(学号|考号|考生号|学籍号)/.test(normalizeHeader(cells[studentIdIdx] || ''))) { skipped++; continue; }
    const name = normalizeCell(cells[nameIdx] || '');
    if (!name) {
      if (cells.some(c => normalizeCell(c) !== '')) errors.push(`第 ${r.line} 行：姓名为空，已跳过`);
      continue;
    }
    if (/^(姓名|学生姓名|名字|备注|说明|注)[:：]?/.test(name)) { skipped++; continue; }
    if (!looksLikeName(name) && cells.filter(c => normalizeCell(c) !== '').length <= 2) { skipped++; continue; }
    let cls = clsIdx >= 0 ? normalizeCell(cells[clsIdx] || '') : '';
    if (!cls && lastCls) { cls = lastCls; filled++; }
    if (cls) lastCls = cls;
    const studentId = studentIdIdx >= 0 ? normalizeStudentId(cells[studentIdIdx]) : '';
    // 组合：无表头时按班级配置推断
    let comboId = '';
    if (cls) {
      const byCls = comboForClass(cls, opts.classes, combos);
      if (byCls) comboId = byCls.id;
    }
    const row = { studentId, name, cls, comboId };
    let blanks = 0;
    for (let k = 0; k < subjCount; k++) {
      const key = guessed[k];
      if (!key) { blanks++; continue; }
      const def = SUBJECT_MAP[key];
      const v = parseImportScoreField(row, cells, bestStart + k, key, def ? def.name : key, def ? def.max : 100, r.line, errors);
      if (v == null) blanks++;
    }
    // 额外列里的赋分：按已配置的组合顺序，把前 N 个赋分列对应到该生的赋分科目
    const assignKeyPool = TRACK2_KEYS.filter(k => comboKeyOrder.includes(k));
    for (let i = 0; i < assignedIdx.length; i++) {
      const key = (opts.assignedMap && opts.assignedMap[i]) || assignKeyPool[i];
      if (!key) break;
      parseImportScoreField(row, cells, assignedIdx[i], key + 'Score', (SUBJECT_MAP[key] ? SUBJECT_MAP[key].name : key) + '赋分', 100, r.line, errors);
    }
    const allSubjectBlank = guessed.every(k => row[k] == null);
    if (allSubjectBlank && assignedIdx.length === 0) { skipped++; continue; }
    applyYearRank(row, yearRankIdx != null ? cells[yearRankIdx] : '', r.line, errors);
    if (blanks) blankRows++;
    const key = studentKey(row);
    if (seen.has(key)) {
      duplicateKeys++;
      errors.push(`第 ${r.line} 行：学生「${name}」与前面重复（${studentId || '班级 + 姓名'}），已拦截导入；请补唯一学号或改名后缀`);
    }
    seen.add(key);
    if (!studentId && seenNames.has(name) && seenNames.get(name) !== cls) {
      errors.push(`第 ${r.line} 行：不同班级出现同名「${name}」，且没有学号，已拦截导入`);
    }
    if (!studentId) seenNames.set(name, cls);
    students.push(row);
  }

  notes.push('未识别到表头，已按列位置自动整理（建议下次用「下载空白模板」）');
  notes.push(`识别为：${studentIdIdx >= 0 ? '学号 + ' : ''}姓名${clsIdx >= 0 ? ' + 班级' : ''} + ${subjCount} 科（${guessed.map(k => SUBJECT_MAP[k] ? SUBJECT_MAP[k].name : (k || '未识别')).join('、')}）`);
  if (!userMap) notes.push('科目列是按位置推测的，请在下方「科目列对照」里核对；有表头的表不会走到这里。');
  if (studentIdIdx < 0 && students.length) notes.push(`${students.length} 人未带学号：按「班级 + 姓名」临时对齐，建议改用新模板`);
  if (studentIdIdx >= 0 && students.some(s => !s.studentId)) errors.push('有学生学号为空，已拦截导入；请补齐唯一学号');
  if (yearRankIdx != null) notes.push('识别到年级排名列（无表头时按名次列处理）');
  else if (opts.requireYearRank) notes.push('未识别到年级排名列（必填）');
  if (assignedIdx.length) notes.push(`识别到 ${assignedIdx.length} 个赋分列（无表头时按已配置组合的赋分科目顺序对应）`);
  if (ignoredExtras) notes.push(`忽略 ${ignoredExtras} 列（疑似总分/名次/备注）`);
  if (ignoredBefore) notes.push(`忽略姓名与成绩之间的 ${ignoredBefore} 列（疑似序号/学号）`);
  if (filled) notes.push(`补全 ${filled} 行空班级（按上一行向下填充）`);
  if (skipped) notes.push(`跳过 ${skipped} 行标题/汇总/说明行`);
  if (blankRows) notes.push(`有 ${blankRows} 行存在空分（按缺考处理）`);
  const missingYearRank = students.filter(s => s.yearRank == null).length;
  if (opts.requireYearRank && missingYearRank) {
    errors.push(yearRankIdx == null
      ? `年级排名为必填：没有识别到名次列（缺 ${missingYearRank} 人）`
      : `年级排名为必填：有 ${missingYearRank} 人未填写或填写无效`);
  }
  if (!students.length && !errors.length) errors.push('没有解析出学生，请检查内容和列顺序');
  return { students, errors, notes, meta: {
    mode: 'position', nameIdx, subjStart: bestStart, subjCount, clsIdx, skipped, filledClass: filled,
    yearRankColumn: yearRankIdx != null, missingYearRank, requireYearRank: !!opts.requireYearRank,
    guessedSubjects: guessed, assignedIdx, assignedMap: opts.assignedMap || null,
    subjectStart: bestStart,
  } };
}

function parseImport(text, opts) {
  opts = opts || {};
  const lines = splitImportLines(text);
  if (!lines.length) return { students: [], errors: ['没有内容'], notes: [], meta: null };
  let delim = detectDelimiter(lines);
  let header = findHeader(lines, delim);
  if (!header) {
    for (const d of ['\t', ',', ';']) {
      if (d === delim) continue;
      const h = findHeader(lines, d);
      if (h && (!header || h.score > header.score)) { header = h; delim = d; }
    }
  }  if (header) {
    // 两行表头：科目行 + 原始分/赋分行
    const mainCells = header.cells || splitImportLine(lines[header.index], delim);
    const nextIdx = header.index + 1;
    if (nextIdx < lines.length) {
      const subCells = splitImportLine(lines[nextIdx], delim);
      if (isSubHeaderCells(subCells)) {
        const mergedCells = mergeHeaderCells(mainCells, subCells);
        const merged = buildHeaderCandidate(mergedCells, header.index);
        if (merged.hasName && merged.subjCount >= header.subjCount) {
          merged.subRows = 1;
          header = merged;
        }
      }
    }
    return parseHeaderTable(lines, delim, header, opts);
  }
  return parseNoHeaderTable(lines, delim, opts);
}

/* --- 各科评估 --- */
function subjectEval(row, subj, schoolAvg, classAvg, classCount, history, examIdx) {
  const score = row.subj[subj.key];
  if (score == null) return null;
  const rate = score / subj.max;
  let level, levelCls;
  if (rate >= 0.85) { level = '优秀'; levelCls = 'good'; }
  else if (rate >= 0.70) { level = '良好'; levelCls = 'ok'; }
  else if (rate >= 0.60) { level = '中等'; levelCls = 'warn'; }
  else { level = '待提高'; levelCls = 'crit'; }
  // 近三场趋势：保留缺考场次为空，只有最近两场连续有成绩才判断升降
  const window = history.slice(Math.max(0, examIdx - 2), examIdx + 1);
  while (window.length < 3) window.unshift(null);
  const vals = window.map(r => r && r.subj ? r.subj[subj.key] : null);
  let trend = null, trendDelta = null;
  if (vals[1] != null && vals[2] != null) {
    trendDelta = vals[2] - vals[1];
    trend = trendDelta > 0 ? 'up' : (trendDelta < 0 ? 'down' : 'flat');
  }
  return {
    score, rate, level, levelCls,
    rank: row[subj.key + 'Rank'],
    vsSchool: schoolAvg != null ? score - schoolAvg : null,
    vsClass: classAvg != null ? score - classAvg : null,
    trend, trendDelta, spark: vals,
  };
}

/* --- 偏科 / 不匹配判定（双口径，两档：关注 / 预警） ---
   口径说明（「不匹配」= 该科相对应有水平明显落后）：
   1. 自身失衡【定档】：某科得分率 比 该生各科平均得分率 低多少。
   2. 名单落后【佐证 / 排序】：该科 比名单均分低 / 排名落入后段。
   为什么定档只看自身失衡：各科里「总有一科排在后段」是数学必然，
   单独用排名会几乎人人误报；名单口径用来说明「落后是否也被榜单印证」，
   并据此排优先级，不改变档位。
   两档：
   - 关注（watch）：D ≥ 1.60 且 t ≥ 2.39。
   - 预警（severe）：D ≥ 2.10 且 t ≥ 2.94。
   v3.4：档位由科内 Z + 留一法 SEM（ρ=0.80，FWER≤5%）固定校准，不再由 selfGap/severeGap 滑杆决定；
   设置页仅保留名单佐证口径（vsAvgGap / rankTail / minRanked）。 */
function mismatchSettings() {
  const s = (data && data.settings && data.settings.mismatch) || {};
  const d = DEFAULT_MISMATCH;
  return {
    selfGap: Number.isFinite(s.selfGap) ? s.selfGap : d.selfGap,
    vsAvgGap: Number.isFinite(s.vsAvgGap) ? s.vsAvgGap : d.vsAvgGap,
    rankTail: Number.isFinite(s.rankTail) ? s.rankTail : d.rankTail,
    severeGap: Number.isFinite(s.severeGap) ? s.severeGap : d.severeGap,
    minRanked: Number.isFinite(s.minRanked) ? s.minRanked : d.minRanked,
  };
}
/* examIdx 取最近一场有成绩的考试；从 row.subj 取该生自己选考科目的得分率。
   subjAvgs: {chinese: 均分, ...}（本场名单该科均分），缺省时名单口径只按排名。
   subjectKeys: 该生本场的科目列表（由 row.subjectKeys 提供） */
function mismatchEval(row, examIdx, subjStats) {
  if (!row || !row.subj) return null;
  const cfg = mismatchSettings();
  const full = subjStats && subjStats.subjAvg ? subjStats : null;
  const avgs = full ? full.subjAvg : (subjStats || {});
  const sds = full && full.subjSd ? full.subjSd : {};
  const ns = full && full.subjN ? full.subjN : {};
  const keys = row.subjectKeys && row.subjectKeys.length
    ? row.subjectKeys
    : SUBJECT_DEFS.map(s => s.key).filter(k => row.subj[k] != null);
  const rates = [];
  for (const k of keys) {
    const def = SUBJECT_MAP[k];
    if (!def) continue;
    const v = row.subj[k];
    if (v == null) continue;
    const rank = row[k + 'Rank'];
    const ranked = rank != null && Number.isFinite(rank);
    const avg = Number.isFinite(avgs[k]) ? avgs[k] : null;
    const sd = Number.isFinite(sds[k]) && sds[k] > 0 ? sds[k] : null;
    const n = Number.isFinite(ns[k]) && ns[k] > 0 ? ns[k] : null;
    rates.push({ key: k, name: def.name, score: v, max: def.max, rate: v / def.max, rank, ranked, n,
      z: (sd != null && avg != null) ? (v - avg) / sd : null,
      avgRate: avg != null ? avg / def.max : null });
  }
  if (rates.length < 2) return null;
  const selfAvg = rates.reduce((a, x) => a + x.rate, 0) / rates.length;
  const withZ = rates.filter(x => x.z != null);
  const m = withZ.length;
  const rho = 0.80;
  const subjects = rates.map(x => {
    const selfGapRate = selfAvg - x.rate;
    const vsAvgGap = x.avgRate != null ? x.avgRate - x.rate : null;
    // v3.3: real per-subject cohort size N_k (fixes legacy Math.max(ranks) misestimate)
    const tail = (x.n != null && x.n >= cfg.minRanked && x.ranked && x.rank <= x.n) ? x.rank / x.n : null;
    let D = null, t = null;
    if (x.z != null && m >= 2) {
      const others = withZ.filter(y => y.key !== x.key);
      const mo = others.reduce((a, y) => a + y.z, 0) / others.length;
      D = mo - x.z;
      const se = Math.sqrt((1 - rho) + (others.length ? (1 - rho) / others.length : 0));
      t = se > 0 ? D / se : null;
    }
    const zWatch = D != null && D >= 1.60 && t != null && t >= 2.39;
    const zSevere = D != null && D >= 2.10 && t != null && t >= 2.94;
    const tailWatch = tail == null ? true : tail > 0.70;
    const tailSevere = tail == null ? true : tail > 0.80;
    const selfHit = zWatch && tailWatch;
    const severeHit = zSevere && tailSevere;
    const avgHit = vsAvgGap != null && vsAvgGap >= cfg.vsAvgGap;
    const rankHit = tail != null && tail > (1 - cfg.rankTail);
    const listHit = avgHit || rankHit;
    let level = 'ok';
    if (selfHit) level = severeHit ? 'severe' : 'watch';
    return { ...x, selfGap: D != null ? D : selfGapRate, selfGapRate, vsAvgGap, tail, D, t, selfHit, avgHit, rankHit, listHit, level };
  });
  const flagged = subjects.filter(x => x.level !== 'ok').sort((a, b) => (b.D || 0) - (a.D || 0));
  const listTotal = rates.reduce((a, x) => Math.max(a, x.n || 0), 0) || null;
  if (!flagged.length) return { level: 'ok', subjects, weakest: null, strongest: null, listTotal, selfAvg };
  const worst = flagged[0];
  const level = flagged.some(x => x.level === 'severe') ? 'severe' : 'watch';
  const strongest = subjects.slice().sort((a, b) => b.rate - a.rate)[0];
  return { level, subjects, weakest: worst, strongest, flagged, listTotal, selfAvg };
}

      L.push(`- **${x.name}**：${parts.join('；')}`);
    }
    L.push('');
  }
  return L.join('\n');

function fmt(v, d) { return v == null || isNaN(v) ? '—' : (d ? Number(v).toFixed(d) : String(Math.round(v * 10) / 10)); }

function declineInfo(computed, id, upToIdx) {
  const hist = studentHistory(computed, id);
  const end = upToIdx == null ? hist.length : Math.min(hist.length, upToIdx + 1);
  const vals = [];
  for (let i = Math.max(0, end - 3); i < end; i++) {
    const r = hist[i];
    if (r && r.total != null) vals.push({ i, v: r.total });
  }
  if (vals.length < 3) return { count: vals.length, diff: null, text: '↓ 连降' };
  const diff = Math.round(vals[0].v - vals[vals.length - 1].v);
  const diffTxt = (diff >= 0 ? '-' : '+') + Math.abs(diff);
  const nm = x => { const e = data.exams[x.i] || {}; return e.date ? String(e.date).slice(5) : (e.name || ''); };
  return { count: vals.length, diff, text: '↓ 连降 ' + (vals.length - 1) + ' 次（' + vals.length + ' 场）' + diffTxt + ' 分（' + nm(vals[0]) + '→' + nm(vals[vals.length - 1]) + '）' };
}

function collectAttentionItems(ctx) {
  const byStudent = new Map();
  ctx.rows.forEach(r => {
    // reasons：行内统一格式 {cls, pre, num, extra}；details：悬浮提示里的完整说明
    const item = { r, types: new Set(), tags: [], details: [], severity: 0, reasons: [] };
    const add = (type, tag, detail, severity, reason) => {
      item.types.add(type); item.tags.push({ text: tag, cls: type });
      item.details.push(detail);
      if (reason) item.reasons.push({ cls: type, ...reason });
      item.severity = Math.max(item.severity, severity);
    };
    const mm = mismatchEval(r, ui.examIdx, ctx.cur.stats);
    if (mm && mm.level !== 'ok') {
      const worst = mm.flagged[0];
      add('bias', mm.level === 'severe' ? '失衡 · 优先' : '失衡 · 观察',
        '学科失衡（科内 Z 分 · 留一法 · FWER≤5%）：' + mm.flagged.map(x => x.name + ' 低于自身其余科 ' + fmt(x.D, 1) + ' SD' + (x.tail != null ? '，单科位次后 ' + Math.round((1 - x.tail) * 100) + '%' : '')).join('；'),
        mm.level === 'severe' ? 3 : 2,
        { pre: worst.name, num: '-' + fmt(worst.D, 1) + ' SD',
          extra: mm.flagged.length > 1 ? '等 ' + mm.flagged.length + ' 科' : '' });
    }
    if (continuousDecline(studentHistory(ctx.computed, r.id), 2, ui.examIdx)) {
      const di = declineInfo(ctx.computed, r.id, ui.examIdx);
      add('decline', '连退', di.text, 3,
        di.diff == null ? { pre: '连降', num: '' } : { pre: '连降 ' + Math.max(0, di.count - 1) + ' 次', num: (di.diff >= 0 ? '-' : '+') + Math.abs(di.diff) + ' 分' });
    }
    if (r.total != null && r.toLine1 != null && r.toLine1 < 0 && r.toLine1 >= -25) {
      add('line', '线下临界', '总分 ' + fmt(r.total) + ' · G1 ' + ctx.cur.stats.line1 + ' · 线下 -' + fmt(Math.abs(r.toLine1)),
        2,
        { pre: '线下', num: '-' + fmt(Math.abs(r.toLine1)) + ' 分', cls: 'line down' });
    }
    if (item.types.size && !hsMutedHas(r.id)) byStudent.set(r.id, item);
  });
  return Array.from(byStudent.values());
}

function radarSVG(vals, refA, refB, labels) {
  const cx = 210, cy = 190, R = 140, n = vals.length;

  const poly = fr => fr.map((f, i) => pt(i, f).map(v => v.toFixed(1)).join(",")).join(" ");

  s += '<polygon points="' + poly(refB) + '" fill="none" stroke="var(--ref-line)" stroke-width="1.4" stroke-dasharray="5 4" opacity="0.95"/>';
  s += '<polygon points="' + poly(refA) + '" fill="none" stroke="var(--ref-line)" stroke-width="1.4" stroke-dasharray="2 3" opacity="0.8"/>';
  s += '<polygon points="' + poly(vals) + '" fill="var(--accent)" fill-opacity="0.18" stroke="var(--accent)" stroke-width="2"/>';
  vals.forEach((f, i) => { const [x, y] = pt(i, f); s += '<circle cx="' + x.toFixed(1) + '" cy="' + y.toFixed(1) + '" r="3.4" fill="var(--accent)"/>'; });
  labels.forEach((lb, i) => { const [x, y] = pt(i, 1.16); s += '<text x="' + x.toFixed(1) + '" y="' + y.toFixed(1) + '" text-anchor="middle" font-size="12" fill="var(--ink)">' + lb[0] + '</text><text x="' + x.toFixed(1) + '" y="' + (y + 13).toFixed(1) + '" text-anchor="middle" font-size="10" fill="var(--muted)">' + lb[1] + '</text>'; });
  [0.4, 0.7, 1].forEach(f => { s += '<text x="' + (cx - 26) + '" y="' + (cy - R * f - 3).toFixed(1) + '" text-anchor="end" font-size="9" fill="var(--muted)">' + Math.round(f * 100) + '%</text>'; });
  return s + "</svg>";
}
const vals = keys.map(k => srate(sr, k) || 0);
const refA = keys.map(k => clsAvg(k) || 0);
const refB = keys.map(k => grdAvg(k) || 0);
const labels = keys.map(k => [sen(k), pct(srate(sr, k) || 0)]);
const radarBox = el("div", { class: "radar-box" });
radarBox.innerHTML = radarSVG(vals, refA, refB, labels);
app.append(el("section", { class: "panel" },
  el("div", { class: "panel-head" }, el("h2", { text: "Subject radar · Student " + cleanId(sr.id) }),
    el("span", { class: "panel-note", text: enCls(sr.cls) + " · solid = student, dashed = class / grade mean" })),
  el("div", { class: "case-two" }, radarBox,
    el("div", { class: "case-side" },
      el("p", { class: "case-method", text: "Axes show score-rate (score ÷ subject max), so subjects with different maxima stay comparable. Reference lines use the real class and grade means of this exam only." }),
      el("ul", { class: "case-list" }, keys.map(k => el("li", {},
        el("b", { text: sen(k) }), " ", pct(srate(sr, k) || 0),
        el("span", { class: "case-dim", text: " · class " + pct(clsAvg(k) || 0) + " · grade " + pct(grdAvg(k) || 0) }))))))));

/* PK battle */
const byClass = {};
cur.rows.forEach(r => { (byClass[r.cls] = byClass[r.cls] || []).push(r); });
const classAvg = Object.entries(byClass).map(([id, rs]) => ({ id, avg: rs.reduce((a, r) => a + (r.total || 0), 0) / rs.length, rs, combo: rs[0].comboId })).sort((a, b) => b.avg - a.avg);
const byCombo = {};
classAvg.forEach(c => { (byCombo[c.combo] = byCombo[c.combo] || []).push(c); });
const duelPair = Object.values(byCombo).filter(g => g.length >= 2).sort((a, b) => b.length - a.length)[0] || classAvg.slice(0, 2);
const [A, B] = duelPair;
const rate = (rs, k) => { const v = rs.map(r => srate(r, k)).filter(x => x != null); return v.length ? v.reduce((a, x) => a + x, 0) / v.length : 0; };
const pkKeys = ["chinese", "math", "english", "physics", "chem", "bio"].filter(k => rate(A.rs, k) > 0 && rate(B.rs, k) > 0);
const battle = el("div", { class: "battle" });
pkKeys.forEach(k => {
  const a = rate(A.rs, k), b = rate(B.rs, k);
  const lane = (frac, side, win) => el("div", { class: "round-lane " + side },
    el("span", { class: "round-fill", style: "width:" + (frac * 100).toFixed(1) + "%" }),
    win ? el("span", { class: "round-star", text: "★" }) : null,
    el("span", { class: "round-rate", text: Math.round(frac * 100) + "%" }));
  battle.append(el("div", { class: "round" },
    lane(a, "l", a >= b), el("div", { class: "round-name" }, el("b", { text: sen(k) }),
      el("span", { text: (a * 100).toFixed(1) + " / " + (b * 100).toFixed(1) + " · " + ((a - b) * 100 >= 0 ? "+" : "") + ((a - b) * 100).toFixed(1) + "pp" })),
    lane(b, "r", b > a)));
});
app.append(el("section", { class: "panel" },
  el("div", { class: "panel-head" }, el("h2", { text: "Class duel · absolute score-rate" }),
    el("span", { class: "panel-note", text: enCls(A.id) + " (avg " + A.avg.toFixed(1) + ") vs " + enCls(B.id) + " (avg " + B.avg.toFixed(1) + ") · same subject combo" })),
  el("p", { class: "case-method", text: "Lanes show absolute score-rate, not share-of-two, so a 71% vs 63% gap reads directly. ★ marks the stronger class per subject; pp = percentage-point difference." }),
  battle));

/* letter-grade GPA */
const transcript = [
  { code: "AIDM7350", name: "Digital Media Studio", credits: 3, letter: "A-" },
  { code: "AIDM7400", name: "Interaction Design", credits: 3, letter: "B+" },
  { code: "AIDM7450", name: "Data Visualisation", credits: 3, letter: "A+" },
  { code: "AIDM7860", name: "Research Methods", credits: 3, letter: "B" },
  { code: "AIDM7880", name: "AI Society & Ethics", credits: 3, letter: "A-" },
  { code: "AIDM7900", name: "Capstone Project", credits: 6, letter: "B+" },
  { code: "AIDM7910", name: "Internship", credits: 3, letter: null, absent: true },
  { code: "AIDM7400", name: "Interaction Design (retake)", credits: 3, letter: "A-" }
];
function letterGpa(scaleKey) {
  const sc = LETTER_SCALES[scaleKey];
  const best = new Map();
  transcript.forEach(c => {
    const g = c.absent ? 0 : (sc.letters[c.letter] != null ? sc.letters[c.letter] : null);
    if (g == null) return;
    const prev = best.get(c.code);
    if (!prev || g > prev.g) best.set(c.code, { g, credits: c.credits });
  });
  let pts = 0, cr = 0;
  best.forEach(v => { pts += v.g * v.credits; cr += v.credits; });
  return cr ? pts / cr : null;
}
const gpaTable = el("table", { class: "case-table" },
  el("thead", {}, el("tr", {}, ["Course", "Credits", "Letter", "HKBU pts", "EdUHK pts"].map(h => el("th", { text: h })))),
  el("tbody", {}, transcript.map(c => el("tr", {},
    el("td", { text: c.code + " · " + c.name }),
    el("td", { text: String(c.credits) }),
    el("td", { text: c.absent ? "Absent" : c.letter }),
    el("td", { text: c.absent ? "0.00" : (LETTER_SCALES.hkbu4.letters[c.letter] || 0).toFixed(2) }),
    el("td", { text: c.absent ? "0.00" : (LETTER_SCALES.eduhk433.letters[c.letter] || 0).toFixed(2) })))));
app.append(el("section", { class: "panel" },
  el("div", { class: "panel-head" }, el("h2", { text: "Letter-grade GPA · per-course then credit-weighted" })),
  el("div", { class: "metric-strip" },
    card("GPA · HKBU 4.00 scale", letterGpa("hkbu4").toFixed(2), "letter → points map, credit-weighted"),
    card("GPA · EdUHK 4.33 scale", letterGpa("eduhk433").toFixed(2), "same transcript, A+ = 4.33 convention")),
  gpaTable,
  el("p", { class: "case-method", text: "Rules: retakes keep only the highest attempt (credits counted once); an absent course counts as attempted with 0 points; letter → GPA uses common institutional conventions (HKBU 4.00 / EdUHK 4.33) and must be checked against each registry's published table. The midpoint percent is a display proxy only, never the GPA source." })));

/* methods & ethics */
app.append(el("section", { class: "panel" },
  el("div", { class: "panel-head" }, el("h2", { text: "Methods, privacy & provenance" })),
  el("ul", { class: "case-list" },
    el("li", {}, "All data on this page is generated locally from a fixed seed (20261029); no network request is made and no real student record exists."),
    el("li", {}, "Identities are anonymised IDs; exports of the full workbench pseudonymise student IDs irreversibly at the data layer."),
    el("li", {}, "AI features default to anonymous outbound payloads and require explicit confirmation; without an API key the agent runs a deterministic offline replay."),
    el("li", {}, "Attention flags are statistical suggestions for teacher judgement, not diagnoses; a per-row defer control respects classroom context."),
    el("li", {}, "Design system: warm-paper pixel tokens, four-step radii, hard shadows inside the workbench and soft shadows for overlays only, single reduced-motion authority block."))));
app.append(el("footer", { class: "case-foot", text: "Hiscore v3.4 · English case-study demo · synthetic data only · built from the same computation core as the Chinese workbench" }));

</script>
